blowing on the fur to part it (cats despise it; use alcohol's parting effect). 12–13. Visuals &amp; assessment VID-VEN-SAPH-001 (production storyboard: overhead of the full towel setup, macro of inguinal occlusion hand-shape, correct vs pinch-occlusion, entry at correct angle vs \"dog-depth\" error on model). Knowledge: QB-CORE-VEN feline items. Practical: PA-VEN-CEPH-001 with saphenous anchors. Case log: ≥5 coached incl. ≥2 feline medial saphenous. Reviews: R1: added inguinal hand-shape cue, hock-first site strategy, arterial-stick honesty rule. R2: holder vs operator geometry explicit; 60–90 s patience window named; kick warning signs given. R3: hospital gains cat draws that don't require the two strongest staff and a recovery period for everyone involved."}, {"id": "csc-ven03", "title": "Jugular venipuncture", "group": "Skill courses", "meta": "TS-VEN-JUG-001", "html": "<p>Companion to <span class=\"id\">TS-VEN-JUG-001</span> · Benchmark course · ~25 min + supervised lab · S1 skill: your first live jugulars happen with a CVT/DVM at the table, always. Steps shared with <span class=\"id\">CSC-VEN-01</span> not repeated.</p>\n<h3>1. Purpose</h3>\n<p>The jugular is the volume-and-quality vessel: big samples fast, minimal hemolysis, one stick for a full panel plus banked serum — and for kittens/tiny patients, often the only vessel with enough blood to matter. It's also the draw with the least room for sloppiness: the vessel lives next to the airway and the carotid, the patient's head is being held up and away, and a missed hematoma here can compress structures that matter. Respect, not fear.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>The jugular groove runs from the angle of the jaw down to the thoracic inlet (the notch where neck meets chest), on either side of the trachea. The vein lies IN the groove, superficial; the carotid artery is DEEPER and closer to the midline — a correctly superficial needle in the groove does not reach it. Occlusion is LOW: a thumb pressed into the groove just above the thoracic inlet dams the vein; it fills upward (toward the head) — so you stick ABOVE the thumb, needle pointing either direction per house convention <code>[CVAH-SPECIFIC INPUT REQUIRED: standardize head-ward vs chest-ward entry]</code>. Absolute assistant no-gos (escalate instead): suspected coagulopathy (rodenticide, low platelets — a neck hematoma can press the airway), respiratory distress (the position itself is dangerous), neck masses/wounds, and raised-intracranial/intraocular-pressure cautions per DVM.</p>\n<h3>3. Equipment</h3>\n<p>20–22 g needle; syringe sized to the FULL requested volume (6–12 mL — one continuous draw beats reloading); butterfly acceptable for cats/small dogs per trainer. Everything staged as ever; extra gauze — this site gets a real pressure hold after.</p>\n<h3>4. Patient preparation</h3>\n<p>Screening is part of the skill: before any jugular you personally confirm — no bleeding-risk flags in the record? breathing comfortable at rest? no cough-gag-stridor history that neck extension might provoke? If any doubt: ask FIRST. Position dog: sitting, rear tucked into the holder or a corner so reversing is impossible. Position cat: sternal at the table edge, forelimbs held down over the edge (drops the shoulders, straightens the groove), in or half-in a towel.</p>\n<h3>5. Operator preparation</h3>\n<ul>\n<li><strong>Holder:</strong> one hand cups the muzzle/chin from below and raises the nose toward the ceiling — smoothly, to maybe 45°, never cranked to maximum; the neck should look extended, not hyperextended. Other arm hugs shoulders/forelimbs down. The holder is ALSO the airway monitor: their eyes stay on nostrils and chest, and they own the stop-call.</li>\n<li><strong>You</strong> stand/kneel at the patient's front, slightly to the draw side. Non-dominant thumb = the dam: pressed into the groove at the thoracic inlet, flat and firm. The same hand's fingers rest on the far side of the neck, steadying. Dominant hand: needle at 25–30°, in line with the groove.</li>\n<li><strong>Line of sight:</strong> you're looking at a shaved-feeling gutter between two muscle bellies. In short-coated dogs with the head up, the filled jugular is often frankly visible — a soft ridge rising in the groove.</li>\n</ul>\n<h3>6. The procedure (unique steps)</h3>\n<p><strong>Raise.</strong> DO: thumb dams the groove low; WATCH the groove fill from the inlet upward, 3–5 s. In doubt, strum test: lightly tap the ridge up high — a fluid wave transmits down a filled vein to your damming thumb. WHY: positive identification beats hope; the strum confirms vein (arteries don't wave, they pulse). EXPECT: a clear soft ridge in most patients; in fat necks, palpation only. COMMON ERROR: damming too high (mid-neck) — you're sticking into the unfilled segment. STOP: any breathing change with the nose raised — release the head NOW; that finding goes to the DVM before any retry.</p>\n<p><strong>Confirm it's not the carotid.</strong> DO: rest a fingertip on your target — a vein is soft, non-pulsatile, disappears when your dam lifts; a pulse = carotid = re-find your landmark shallower and more lateral. WHY: this 3-second check is the entire safety margin. COMMON ERROR: skipping it in visible-vein patients (\"obviously the jugular\") — the check is FOR the obvious days. STOP: can't convince yourself which structure you're on → don't stick; ask.</p>\n<p><strong>Enter and draw.</strong> DO: 25–30°, one smooth motion into the ridge above your thumb; flatten slightly on flash; aspirate steadily — this vessel TOLERATES a fuller pull than peripheral veins, that's its gift. EXPECT: brisk fill; 6 mL in seconds. COMMON ERROR: creeping needle advance while drawing (through the far wall mid-draw — flow stops and a deep bruise starts). RECOVERY: freeze your needle hand's position consciously; the syringe hand pulls, the needle hand is a statue. STOP: patient swallows/gags hard — pause the pull, let the swallow finish (the larynx moves — your needle shouldn't), resume only if geometry is undisturbed.</p>\n<p><strong>Exit + the jugular-specific close.</strong> DO: dam released → needle out → IMMEDIATE firm gauze pressure with the head returned to NEUTRAL (not still skyward) → hold a true 60–120 s → then look: lift gauze, watch the site through two breaths, palpate gently for a soft rising fullness. Recheck AGAIN before kennel return. WHY: this is the site where a lazy 10-second press buys a compressive hematoma. COMMON ERROR: pressure applied with the nose still up (the position that opened the vein keeps it open). STOP: any fullness growing under your fingers → continuous pressure, call the CVT/DVM now, do not leave the patient.</p>\n<h3>7. Tactile medicine</h3>\n<p>The filled jugular: broad, soft, slightly bouncy ridge — bigger than any vessel you've felt so far; the strum wave is unmistakable once felt (train it on every willing patient during rounds, no needle involved). The carotid: a deep, cord-like THUMP under real fingertip pressure — feel one once, with your trainer, on purpose, and you'll never confuse them. Entry: skin give then an easy vessel give — this wall is substantial; the \"float\" is obvious. Swallowing telegraphs through your damming thumb a half-second early — the groove shivers.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>Groove won't fill:</strong> dam too high, too light, or off the groove (common in fat necks — walk your thumb laterally in small steps, re-test); patient's head insufficiently raised (re-cue holder gently); genuinely flat = sick patient information → escalate. <strong>No flash in a visible vein:</strong> you're skating on top (angle up a touch) or beside (re-sight the line of the groove). One redirect from just-under-skin; then out. <strong>Flash then stop:</strong> the far-wall creep (see above) or a swallow moved the target: flatten, statue-hand, re-aspirate gently; one cycle only at this site. <strong>Hit a pulse / bright pulsing blood:</strong> exit immediately, FIVE full minutes of direct pressure by the clock, report immediately — arterial sticks are survivable events when pressured and reported, and neither when hidden. <strong>Two attempts spent:</strong> this site's rule is stricter in spirit: jugular attempts are expensive; your default after ONE confident failure is to offer the draw to the senior at the table (they're there — this is S1).</p>\n<h3>9. Real patients</h3>\n<p><strong>Cats:</strong> the edge-of-table sternal setup is everything — shoulders dropped, groove straightened; expect a shorter patience window; the whole draw should be under 60 s. <strong>Puppies/kittens:</strong> the jugular is often the ONLY adequate vessel; tiny dam pressure suffices; volumes are precious and pre-calculated. <strong>Brachycephelics:</strong> neck extension narrows already-crowded airways — partial extension only, holder on high alert, lowest threshold anywhere for aborting the position. <strong>Deep/fat necks (bulldogs, chow coats):</strong> all palpation, strum test mandatory, and honest recognition that some necks are a senior-staff draw. <strong>Coagulopathy-SUSPECTED (not just confirmed):</strong> the answer is no. Peripheral veins compress; necks are where bleeding hides.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Cranking the nose to the ceiling</strong> — hyperextension closes airways and stresses patients; 45° and smooth. 2. <strong>Damming mid-neck</strong> and sticking below their own thumb. 3. <strong>Skipping the pulse-check</strong> on easy-looking veins. 4. <strong>Creeping the needle</strong> during the pull. 5. <strong>Ten-second pressure</strong> and a kennel return — the hematoma forms unobserved; the double-recheck exists for exactly this. 6. <strong>Treating jugular attempts like cephalic attempts</strong> — spending both attempts before offering it up, at the one site where the senior is already standing next to you.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: strum-test practice on calm patients during TPRs costs nothing and builds the finger-memory that makes first jugulars boring. · In cats, drawing the forelimbs over the table edge does more for your view than any amount of neck extension. · Talk the holder through nose angle in degrees (\"halfway to the ceiling\") — \"up a bit\" produces cranking. · Bank the habit: big syringe, one continuous pull, tubes ready — the jugular's whole advantage is one-stick completeness. BANNED: jugular draws on unscreened patients \"because the peripherals are blown\" (screening IS the skill); two-person neck-stretch on a struggling patient (stop, regroup); pressure \"while carrying the patient back\" (pressure happens at the table, timed, then rechecked).</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-VEN-JUG-001</span> storyboard: groove anatomy overlay on a short-coated dog, dam placement macro, the strum test in slow motion, correct vs hyperextended head position side-by-side, the neutral-head pressure hold, feline edge-of-table setup. Knowledge: <span class=\"id\">QB-CORE-VEN</span> jugular items (SC). Practical: <span class=\"id\">PA-VEN-CEPH-001</span> jugular anchor set (+ coagulopathy screening verbalized ★, neutral-neck recheck ★). Case log: 3 observed + 5 coached (≥2 feline) under S1; state 9→10 needs 10 logged.</p>\n<hr>\n<p><em>Reviews:</em> R1: added strum test, carotid touch-training, statue-hand cue, five-minute arterial-stick protocol. R2: dam location, stick-above-thumb geometry, and both-recheck cadence now impossible to miss. R3: hospital gains volume draws and kitten/tiny-patient sampling without pulling the DVM, at S1→S2 with screening literacy built in.</p>", "text": "Companion to TS-VEN-JUG-001 · Benchmark course · ~25 min + supervised lab · S1 skill: your first live jugulars happen with a CVT/DVM at the table, always. Steps shared with CSC-VEN-01 not repeated. 1. Purpose The jugular is the volume-and-quality vessel: big samples fast, minimal hemolysis, one stick for a full panel plus banked serum — and for kittens/tiny patients, often the only vessel with enough blood to matter. It's also the draw with the least room for sloppiness: the vessel lives next to the airway and the carotid, the patient's head is being held up and away, and a missed hematoma here can compress structures that matter. Respect, not fear. 2. Prerequisite knowledge The jugular groove runs from the angle of the jaw down to the thoracic inlet (the notch where neck meets chest), on either side of the trachea. The vein lies IN the groove, superficial; the carotid artery is DEEPER and closer to the midline — a correctly superficial needle in the groove does not reach it. Occlusion is LOW: a thumb pressed into the groove just above the thoracic inlet dams the vein; it fills upward (toward the head) — so you stick ABOVE the thumb, needle pointing either direction per house convention [CVAH-SPECIFIC INPUT REQUIRED: standardize head-ward vs chest-ward entry] . Absolute assistant no-gos (escalate instead): suspected coagulopathy (rodenticide, low platelets — a neck hematoma can press the airway), respiratory distress (the position itself is dangerous), neck masses/wounds, and raised-intracranial/intraocular-pressure cautions per DVM. 3. Equipment 20–22 g needle; syringe sized to the FULL requested volume (6–12 mL — one continuous draw beats reloading); butterfly acceptable for cats/small dogs per trainer. Everything staged as ever; extra gauze — this site gets a real pressure hold after. 4. Patient preparation Screening is part of the skill: before any jugular you personally confirm — no bleeding-risk flags in the record? breathing comfortable at rest? no cough-gag-stridor history that neck extension might provoke? If any doubt: ask FIRST. Position dog: sitting, rear tucked into the holder or a corner so reversing is impossible. Position cat: sternal at the table edge, forelimbs held down over the edge (drops the shoulders, straightens the groove), in or half-in a towel. 5. Operator preparation Holder: one hand cups the muzzle/chin from below and raises the nose toward the ceiling — smoothly, to maybe 45°, never cranked to maximum; the neck should look extended, not hyperextended. Other arm hugs shoulders/forelimbs down. The holder is ALSO the airway monitor: their eyes stay on nostrils and chest, and they own the stop-call. You stand/kneel at the patient's front, slightly to the draw side. Non-dominant thumb = the dam: pressed into the groove at the thoracic inlet, flat and firm. The same hand's fingers rest on the far side of the neck, steadying. Dominant hand: needle at 25–30°, in line with the groove. Line of sight: you're looking at a shaved-feeling gutter between two muscle bellies. In short-coated dogs with the head up, the filled jugular is often frankly visible — a soft ridge rising in the groove. 6. The procedure (unique steps) Raise. DO: thumb dams the groove low; WATCH the groove fill from the inlet upward, 3–5 s. In doubt, strum test: lightly tap the ridge up high — a fluid wave transmits down a filled vein to your damming thumb. WHY: positive identification beats hope; the strum confirms vein (arteries don't wave, they pulse). EXPECT: a clear soft ridge in most patients; in fat necks, palpation only. COMMON ERROR: damming too high (mid-neck) — you're sticking into the unfilled segment. STOP: any breathing change with the nose raised — release the head NOW; that finding goes to the DVM before any retry. Confirm it's not the carotid. DO: rest a fingertip on your target — a vein is soft, non-pulsatile, disappears when your dam lifts; a pulse = carotid = re-find your landmark shallower and more lateral. WHY: this 3-second check is the entire safety margin. COMMON ERROR: skipping it in visible-vein patients (\"obviously the jugular\") — the check is FOR the obvious days. STOP: can't convince yourself which structure you're on → don't stick; ask. Enter and draw. DO: 25–30°, one smooth motion into the ridge above your thumb; flatten slightly on flash; aspirate steadily — this vessel TOLERATES a fuller pull than peripheral veins, that's its gift. EXPECT: brisk fill; 6 mL in seconds. COMMON ERROR: creeping needle advance while drawing (through the far wall mid-draw — flow stops and a deep bruise starts). RECOVERY: freeze your needle hand's position consciously; the syringe hand pulls, the needle hand is a statue. STOP: patient swallows/gags hard — pause the pull, let the swallow finish (the larynx moves — your needle shouldn't), resume only if geometry is undisturbed. Exit + the jugular-specific close. DO: dam released → needle out → IMMEDIATE firm gauze pressure with the head returned to NEUTRAL (not still skyward) → hold a true 60–120 s → then look: lift gauze, watch the site through two breaths, palpate gently for a soft rising fullness. Recheck AGAIN before kennel return. WHY: this is the site where a lazy 10-second press buys a compressive hematoma. COMMON ERROR: pressure applied with the nose still up (the position that opened the vein keeps it open). STOP: any fullness growing under your fingers → continuous pressure, call the CVT/DVM now, do not leave the patient. 7. Tactile medicine The filled jugular: broad, soft, slightly bouncy ridge — bigger than any vessel you've felt so far; the strum wave is unmistakable once felt (train it on every willing patient during rounds, no needle involved). The carotid: a deep, cord-like THUMP under real fingertip pressure — feel one once, with your trainer, on purpose, and you'll never confuse them. Entry: skin give then an easy vessel give — this wall is substantial; the \"float\" is obvious. Swallowing telegraphs through your damming thumb a half-second early — the groove shivers. 8. It didn't work — now what? Groove won't fill: dam too high, too light, or off the groove (common in fat necks — walk your thumb laterally in small steps, re-test); patient's head insufficiently raised (re-cue holder gently); genuinely flat = sick patient information → escalate. No flash in a visible vein: you're skating on top (angle up a touch) or beside (re-sight the line of the groove). One redirect from just-under-skin; then out. Flash then stop: the far-wall creep (see above) or a swallow moved the target: flatten, statue-hand, re-aspirate gently; one cycle only at this site. Hit a pulse / bright pulsing blood: exit immediately, FIVE full minutes of direct pressure by the clock, report immediately — arterial sticks are survivable events when pressured and reported, and neither when hidden. Two attempts spent: this site's rule is stricter in spirit: jugular attempts are expensive; your default after ONE confident failure is to offer the draw to the senior at the table (they're there — this is S1). 9. Real patients Cats: the edge-of-table sternal setup is everything — shoulders dropped, groove straightened; expect a shorter patience window; the whole draw should be under 60 s. Puppies/kittens: the jugular is often the ONLY adequate vessel; tiny dam pressure suffices; volumes are precious and pre-calculated. Brachycephelics: neck extension narrows already-crowded airways — partial extension only, holder on high alert, lowest threshold anywhere for aborting the position. Deep/fat necks (bulldogs, chow coats): all palpation, strum test mandatory, and honest recognition that some necks are a senior-staff draw. Coagulopathy-SUSPECTED (not just confirmed): the answer is no. Peripheral veins compress; necks are where bleeding hides. 10. Common rookie mistakes Cranking the nose to the ceiling — hyperextension closes airways and stresses patients; 45° and smooth. 2. Damming mid-neck and sticking below their own thumb. 3. Skipping the pulse-check on easy-looking veins. 4. Creeping the needle during the pull. 5. Ten-second pressure and a kennel return — the hematoma forms unobserved; the double-recheck exists for exactly this. 6. Treating jugular attempts like cephalic attempts — spending both attempts before offering it up, at the one site where the senior is already standing next to you. 11. Pearls &amp; banned folklore PEARLS: strum-test practice on calm patients during TPRs costs nothing and builds the finger-memory that makes first jugulars boring. · In cats, drawing the forelimbs over the table edge does more for your view than any amount of neck extension. · Talk the holder through nose angle in degrees (\"halfway to the ceiling\") — \"up a bit\" produces cranking. · Bank the habit: big syringe, one continuous pull, tubes ready — the jugular's whole advantage is one-stick completeness. BANNED: jugular draws on unscreened patients \"because the peripherals are blown\" (screening IS the skill); two-person neck-stretch on a struggling patient (stop, regroup); pressure \"while carrying the patient back\" (pressure happens at the table, timed, then rechecked). 12–13. Visuals &amp; assessment VID-VEN-JUG-001 storyboard: groove anatomy overlay on a short-coated dog, dam placement macro, the strum test in slow motion, correct vs hyperextended head position side-by-side, the neutral-head pressure hold, feline edge-of-table setup. Knowledge: QB-CORE-VEN jugular items (SC). Practical: PA-VEN-CEPH-001 jugular anchor set (+ coagulopathy screening verbalized ★, neutral-neck recheck ★). Case log: 3 observed + 5 coached (≥2 feline) under S1; state 9→10 needs 10 logged. Reviews: R1: added strum test, carotid touch-training, statue-hand cue, five-minute arterial-stick protocol. R2: dam location, stick-above-thumb geometry, and both-recheck cadence now impossible to miss. R3: hospital gains volume draws and kitten/tiny-patient sampling without pulling the DVM, at S1→S2 with screening literacy built in."}, {"id": "csc-ivc01", "title": "Cephalic IV catheter", "group": "Skill courses", "meta": "TS-IVC-CEPH-001", "html": "<p>Companion to <span class=\"id\">TS-IVC-CEPH-001</span> · Benchmark exemplar course · ~40 min + lab · Policy gate: scope row <span class=\"id\">SCOPE-004</span> decides whether your track is PLACER or ASSIST-AND-MAINTAIN; both tracks complete this course.</p>\n<h3>1. Purpose</h3>\n<p>You are installing a soft plastic tube inside a vein and making it survive hours-to-days of patient life. This is venipuncture's harder sibling: the stick is only the entry exam — threading, securing, and the first flush decide everything. A working catheter is the front door for fluids, IV meds, anesthesia, and emergencies; a \"placed\" catheter that's actually subcutaneous is worse than none, because everyone downstream trusts it.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>Everything from <span class=\"id\">CSC-VEN-01</span> (same vessel), plus the geometry that rules this skill: an over-the-needle catheter is a plastic sleeve riding on a steel stylet, and the plastic tip sits 1–2 mm BEHIND the steel point. Consequence one: flash proves the STEEL is in the vein — the plastic may still be outside the wall. That's why the whole unit advances 1–2 mm after flash before anything threads. Consequence two: a catheter pulled backward over its stylet can catch the stylet's edge and shear — leaving plastic in the vein to embolize. The unit comes out together, always, forever. Third law: start DISTAL. A blown attempt low on the leg leaves everything above it usable; a blown attempt high orphans the whole vein.</p>\n<h3>3. Equipment</h3>\n<p>Catheter gauges (memorize the house colors against stock): 24 g cats/small; 22 g most cats and small dogs; 20 g medium-large dogs; 18 g large dogs/surgical orders. Selection logic: big enough for the job (radius⁴ — flow lives and dies on gauge), small enough for the vessel. Plus: T-port or injection cap PRIMED with saline (an unprimed T-port injects its dead-space air), 3× saline flushes, clippers with a clean cool blade, chlorhex scrub + alcohol per protocol, tape: three strips pre-torn and hanging off the table edge IN ORDER (½\" under-hub strip, 1\" wing strip, 1\" loop strip), vetwrap, label tape written or ready (date/time/gauge/initials), sharps at elbow distance. Inspect the catheter: slide the plastic off and back on the stylet ONCE in the wrapper (breaks the seal so threading is smooth); reject any unit with a burred or fish-lipped tip; never touch the shaft.</p>\n<h3>4. Patient preparation</h3>\n<p>Which limb: the order may specify (surgeon preference); otherwise — no bruises, no old sites, not the leg with anything else planned. Clip GENEROUSLY: carpus to mid-forearm, around the sides — fur at the margin is a wick and a contamination mop, and a stingy clip is the classic false economy. Prep: scrub-alcohol cycles per protocol; after the final pass the entry zone is untouchable — if you must re-palpate, do it above your entry point or through a fresh alcohol swab, or re-prep. Difficulty flags that change your plan BEFORE the stick: dehydrated (pre-warm limb, expect slow flash), chondrodystrophic legs (short runway — start extra distal), cats (kink-point at the carpus — plan the tape job before the stick).</p>\n<h3>5. Operator preparation</h3>\n<p>Same table geometry as <span class=\"id\">CSC-VEN-01</span>: holder occludes and rolls at the elbow; you face the limb head-on, non-dominant hand applying distal traction with thumb BESIDE the vein line. Differences that matter: your dominant hand holds the catheter unit like a pencil at the hub-wings, index finger free to slide the catheter forward later WITHOUT the hand moving; the tape strips hang where your eyes can find them blind; your monologue is planned (\"flash… flatten… advance… thread\") — narration paces hands under stress, and your assessor will expect it.</p>\n<h3>6. The procedure</h3>\n<p><strong>Step 1 — Verify + sanity-check the order.</strong> DO: two-identifier check PLUS gauge-vs-patient plausibility (\"18 g for this 3 kg kitten?\" = query, don't improvise). WHY: silently placing a \"better\" gauge is order deviation; placing an absurd one is harm. STOP: unresolved mismatch.</p>\n<p><strong>Step 2 — Stage.</strong> DO: everything in §3 laid out; T-port primed and capped; tape order rehearsed by touch. EXPECT: from flash to secured should never wait on a supply run. COMMON ERROR: priming the T-port \"after it's in\" — the classic air-push.</p>\n<p><strong>Step 3 — Raise, fix, enter.</strong> As <span class=\"id\">CSC-VEN-01</span> steps 3–5 with two deltas: entry site is DISTAL (dorsal carpus region upward), and angle a touch shallower on entry (15–25°) because your next move is flattening further. EXPECT: flash into the catheter's hub chamber — it fills slower than a needle-hub flash; watch for it deliberately.</p>\n<p><strong>Step 4 — The beat that makes or breaks it: flatten + advance the UNIT.</strong> DO: on flash, drop the angle nearly parallel to the limb and advance the WHOLE unit 1–2 mm. Count it in your monologue. WHY: the plastic tip must enter the lumen before it can thread (see §2). EXPECT: flash continues or brightens slightly. COMMON ERROR: threading on first flash — the single most common failure in all of catheter-placement, everywhere, forever. RECOVERY: if you threaded early and it resisted — do NOT pull the catheter back over the stylet; remove the unit together, pressure, next site. STOP: n/a.</p>\n<p><strong>Step 5 — Thread.</strong> DO: stylet hand becomes a statue; index finger (or other hand) slides the catheter forward off the stylet in one smooth push to the hub. It should glide like a straw into a thick shake — light, continuous resistance, no force. WHY: the plastic follows the vessel; force means it's not in the vessel. EXPECT: hub reaches skin; slight blood ooze at hub is normal. COMMON ERROR: pushing catheter AND stylet together deeper \"for security\" (back-wall exit), or wiggling/rotating aggressively against resistance. RECOVERY: slight quarter-turn while threading is legal for a sticky start; ANY real resistance = out as a unit, new site. STOP: two failed placements by you = hand off, per the attempt rule.</p>\n<p><strong>Step 6 — Stylet out, dam on.</strong> DO: holder releases occlusion; your free thumb presses the skin OVER the catheter's tip (not the hub) to dam flow; stylet pulls straight out and goes DIRECTLY to sharps — it never touches the table. EXPECT: minimal blood with a good dam. COMMON ERROR: stylet parked on the table \"for a second\" during taping — the injury statistic in this procedure. STOP: n/a.</p>\n<p><strong>Step 7 — Connect + the first flush (the truth serum).</strong> DO: primed T-port on, firm twist; flush 1–3 mL slowly, watching and feeling THREE channels: thumb-feel (smooth, near-zero resistance?), site-look (any soft bleb rising beside the vessel?), patient-face (wince?). Optionally aspirate first — a lazy flash back confirms lumen. WHY: the flush is your only proof the PLASTIC is intravascular. A beautiful placement that blebs is a failed placement. EXPECT: effortless push; maybe a shiver of cold-saline reaction. COMMON ERROR: flushing fast (\"it's fine it's fine\") and missing the small bleb under fur. RECOVERY: any resistance/bleb/pain = it's not in; remove, pressure, report, restart at a new site (per your track). STOP: never flush against firm resistance — anywhere, ever.</p>\n<p><strong>Step 8 — Tape architecture.</strong> DO in order: STRIP 1 (½\", sticky-up) slides UNDER the hub, wraps up and over crossing on top — this is the anchor that owns the catheter. STRIP 2 (1\") flat over the wings/hub, around the limb — snug, not tight. STRIP 3 (1\") captures the T-port in a gentle loop with its slack curving toward the elbow — the stress loop; a tug on the line must pull tape, not catheter. Tension test on EVERY strip: one finger slides under. Then light vetwrap; label ON the wrap. WHY each: anchor / stabilize / strain-relief. EXPECT: hub immobile when you wiggle the T-port. COMMON ERROR: circumferential tension (\"secure = tight\") — the tourniquet that makes tomorrow's fat paw; or all three strips doing the same job badly. RECOVERY: any doubt about tightness — cut it off and re-tape now; tape is cheaper than a swollen limb. STOP: n/a.</p>\n<p><strong>Step 9 — Post-wrap recheck + chart.</strong> DO: flush AGAIN through the finished wrap (taping kinks catheters, especially at the feline carpus); chart date/time, limb, gauge, attempts, flush quality, tolerance, initials; case-log it. WHY: the wrap changed the geometry; prove it still works before you walk away. COMMON ERROR: skipping because \"it flushed two minutes ago.\"</p>\n<h3>7. Tactile medicine</h3>\n<p>Threading DONE RIGHT: a smooth, faintly gritty glide — like sliding a coffee stirrer through a drinking straw. Threading WRONG: a springy, building push-back — the catheter tip crumpling against wall or valve; your fingers feel it buckle microscopically. LEARN BOTH ON THE MODEL until your finger refuses to push through the second one. The flush: a good line pushes like water through a straw; infiltration pushes like water into bread dough — a soft, absorbing wrongness; occlusion pushes like a capped syringe — hard wall. The three sensations are the whole diagnostic kit your thumb owns for the catheter's entire dwell life.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>No flash:</strong> identical ladder to <span class=\"id\">CSC-VEN-01</span> (§8) — with the addendum that catheter units flash slower; give it one full second at depth before declaring dry. <strong>Flash, won't thread:</strong> run the sequence — advance the unit 1 mm more, flatten more, quarter-turn WHILE threading; if resistance persists: valve, bifurcation, or extraluminal tip → unit out together, pressure, move proximal or other limb. NEVER the pull-back-re-thread (§2). <strong>Threads but flush blebs:</strong> the catheter entered and exited (through-and-through placement) or tip migrated on securing — remove, pressure, honest log entry, new site. <strong>Threads, flushed fine, dies during taping:</strong> kink at carpus (cats) or hub lever against a tape ridge — re-tape with the carpus in neutral; per-policy splint for serial offenders. <strong>Vein blows on entry (immediate bloom):</strong> back wall; done at this site; the distal-first strategy just paid for itself — go up. <strong>Everything's failing and the patient needs access:</strong> say the useful sentence early — \"two attempts, both distal right, vein blows on entry; left untouched; she's getting harder to hold.\" Escalation with data is a skill deliverable, not defeat.</p>\n<p><strong>Maintain-phase troubleshooting (both tracks own this):</strong> pump occlusion alarm → trace-then-site, positional test (flex/extend the carpus gently — flow returns = positional; report for re-tape/splint decision); wet wrap → stop pump, unwrap per direction, inspect — leak at hub (loose T-port) vs displacement (out); cool doughy swelling = infiltration (stop, report, expect removal); warm red cord + flush-pain = phlebitis pattern (report, expect removal order); catheter fell out in the kennel → pressure the site, save the catheter FOR INSPECTION (is the tip complete?), report — a missing tip fragment is an escalation, not an oh-well.</p>\n<h3>9. Real patients</h3>\n<p><strong>Cats:</strong> shorter catheters, carpus-kink planning, tape with the leg in a natural stance-angle; many cats tolerate placement better with the head towel-covered. <strong>Puppies:</strong> vein diameter fine, but zero impulse control — a second holder on the rear half changes everything; consider placing during a distraction feed. <strong>Dehydrated/shocky:</strong> flat veins + urgent need = the worst combination; pre-warm, use your best single attempt, and escalate fast — these are exactly the patients where senior hands should place early, and where a staged-and-ready table (your job) saves minutes that matter. <strong>Geriatric fragile veins:</strong> blow on contact; drop a gauge, flatten early, thread gently. <strong>Chondrodystrophics (dachshunds, corgis):</strong> two-centimeter runways — start at the carpal dorsum, expect the hub to sit near your entry point. <strong>Obese:</strong> the vein lives deeper than it palpates; commit to the flatten-advance beat on faith in your landmarks. <strong>Previously catheterized (the rehospitalized chronic):</strong> scarred, valve-y veins that flash and refuse threads — expect it, say it in your plan, budget attempts accordingly.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>The first-flash thread.</strong> Consequence: sub-q catheter that \"placed fine.\" Prevention: the flatten-advance beat said OUT LOUD. Every senior will drill this; internalize it before they have to. 2. <strong>Pull-back-re-thread.</strong> Consequence: possible shear = embolized plastic. Prevention: unit-out reflex; the model lab makes you practice failing correctly. 3. <strong>Proximal-first siting.</strong> Consequence: one blown attempt orphans the vein. 4. <strong>Unprimed T-port.</strong> Consequence: air push into a patient. Prevention: prime at staging, cap, done. 5. <strong>Tape tourniquets.</strong> Consequence: fat paw by morning. Prevention: one-finger test on every strip, every time. 6. <strong>Stylet on the table.</strong> Consequence: someone's hand finds it. 7. <strong>Skipping the post-wrap flush.</strong> Consequence: the night shift discovers your kink at 2 AM with a pressure alarm. 8. <strong>Force-flushing \"to open it up.\"</strong> Consequence: clot shower or sub-q bolus. Prevention: the three-sensation thumb (§7) plus the never-force rule.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: tear tape BEFORE you glove/stick — one-handed tape-tearing over a fresh catheter is a circus act with a casualty. · Rest your catheter-hand's heel on the patient's leg; the unit rides movement instead of fighting it. · On slow flashes, watch the hub chamber against something white. · Write the label DURING staging; post-placement you'll have one hand busy forever. · For cats: tape job rehearsed mentally BEFORE the stick — the difference between a 90-second and a 5-minute secure is planning, and minute three is when cats leave. · The best \"difficult catheter\" tool in the building is a second pair of experienced hands EARLY — pride is not a gauge size. BANNED: re-threading over the stylet in any form, including \"just a millimeter\"; \"testing patency\" by cranking the flush; cutting tape off with the same scissors' tip pointed at the catheter (slide a finger under and cut over your own finger); leaving a questionable catheter in service \"for the day shift to sort.\"</p>\n<h3>12. Visual assets</h3>\n<p><span class=\"id\">VID-IVC-CEPH-001</span> (storyboard exists — includes the money-shot slow-mo of flatten-advance-thread and the shear-mechanism cutaway diagram). Stills to produce: tape strips 1-2-3 in sequence on a model limb; correct vs tourniquet-tight wrap (with the one-finger test shown); bleb-on-flush macro (model with sub-q dye); the three thumb-sensations poster (straw / bread dough / wall). <span class=\"id\">INT-06</span> branching scenarios.</p>\n<h3>13. Assessment &amp; competency links</h3>\n<p>Knowledge: <span class=\"id\">QB-CORE-IVC</span> (rewritten; SC items 100%). Practical: <span class=\"id\">PA-IVC-CEPH-001</span> (includes damaged-packaging reject, kitten-gauge query probe, and the won't-thread options probe). Case log: <span class=\"id\">TS-IVC-CEPH-001</span> §24 — model ×10 with BOTH sensations drilled, observed ×3, coached ×5 (≥1 cat, ≥1 dog); 12 logged for state 10, ≥3 patient categories.</p>\n<hr>\n<p><em>Reviews:</em> R1: added the three-sensation thumb kit, tape-before-stick staging, statue-hand threading, fall-out tip-inspection rule. R2: every hand's job named at every step; both failure sensations trained on model before live. R3: PLACER track returns a CVT's 10–15 min per placement; ASSIST track still yields the hospital a staging-and-maintenance specialist who catches infiltrations before pumps do.</p>", "text": "Companion to TS-IVC-CEPH-001 · Benchmark exemplar course · ~40 min + lab · Policy gate: scope row SCOPE-004 decides whether your track is PLACER or ASSIST-AND-MAINTAIN; both tracks complete this course. 1. Purpose You are installing a soft plastic tube inside a vein and making it survive hours-to-days of patient life. This is venipuncture's harder sibling: the stick is only the entry exam — threading, securing, and the first flush decide everything. A working catheter is the front door for fluids, IV meds, anesthesia, and emergencies; a \"placed\" catheter that's actually subcutaneous is worse than none, because everyone downstream trusts it. 2. Prerequisite knowledge Everything from CSC-VEN-01 (same vessel), plus the geometry that rules this skill: an over-the-needle catheter is a plastic sleeve riding on a steel stylet, and the plastic tip sits 1–2 mm BEHIND the steel point. Consequence one: flash proves the STEEL is in the vein — the plastic may still be outside the wall. That's why the whole unit advances 1–2 mm after flash before anything threads. Consequence two: a catheter pulled backward over its stylet can catch the stylet's edge and shear — leaving plastic in the vein to embolize. The unit comes out together, always, forever. Third law: start DISTAL. A blown attempt low on the leg leaves everything above it usable; a blown attempt high orphans the whole vein. 3. Equipment Catheter gauges (memorize the house colors against stock): 24 g cats/small; 22 g most cats and small dogs; 20 g medium-large dogs; 18 g large dogs/surgical orders. Selection logic: big enough for the job (radius⁴ — flow lives and dies on gauge), small enough for the vessel. Plus: T-port or injection cap PRIMED with saline (an unprimed T-port injects its dead-space air), 3× saline flushes, clippers with a clean cool blade, chlorhex scrub + alcohol per protocol, tape: three strips pre-torn and hanging off the table edge IN ORDER (½\" under-hub strip, 1\" wing strip, 1\" loop strip), vetwrap, label tape written or ready (date/time/gauge/initials), sharps at elbow distance. Inspect the catheter: slide the plastic off and back on the stylet ONCE in the wrapper (breaks the seal so threading is smooth); reject any unit with a burred or fish-lipped tip; never touch the shaft. 4. Patient preparation Which limb: the order may specify (surgeon preference); otherwise — no bruises, no old sites, not the leg with anything else planned. Clip GENEROUSLY: carpus to mid-forearm, around the sides — fur at the margin is a wick and a contamination mop, and a stingy clip is the classic false economy. Prep: scrub-alcohol cycles per protocol; after the final pass the entry zone is untouchable — if you must re-palpate, do it above your entry point or through a fresh alcohol swab, or re-prep. Difficulty flags that change your plan BEFORE the stick: dehydrated (pre-warm limb, expect slow flash), chondrodystrophic legs (short runway — start extra distal), cats (kink-point at the carpus — plan the tape job before the stick). 5. Operator preparation Same table geometry as CSC-VEN-01 : holder occludes and rolls at the elbow; you face the limb head-on, non-dominant hand applying distal traction with thumb BESIDE the vein line. Differences that matter: your dominant hand holds the catheter unit like a pencil at the hub-wings, index finger free to slide the catheter forward later WITHOUT the hand moving; the tape strips hang where your eyes can find them blind; your monologue is planned (\"flash… flatten… advance… thread\") — narration paces hands under stress, and your assessor will expect it. 6. The procedure Step 1 — Verify + sanity-check the order. DO: two-identifier check PLUS gauge-vs-patient plausibility (\"18 g for this 3 kg kitten?\" = query, don't improvise). WHY: silently placing a \"better\" gauge is order deviation; placing an absurd one is harm. STOP: unresolved mismatch. Step 2 — Stage. DO: everything in §3 laid out; T-port primed and capped; tape order rehearsed by touch. EXPECT: from flash to secured should never wait on a supply run. COMMON ERROR: priming the T-port \"after it's in\" — the classic air-push. Step 3 — Raise, fix, enter. As CSC-VEN-01 steps 3–5 with two deltas: entry site is DISTAL (dorsal carpus region upward), and angle a touch shallower on entry (15–25°) because your next move is flattening further. EXPECT: flash into the catheter's hub chamber — it fills slower than a needle-hub flash; watch for it deliberately. Step 4 — The beat that makes or breaks it: flatten + advance the UNIT. DO: on flash, drop the angle nearly parallel to the limb and advance the WHOLE unit 1–2 mm. Count it in your monologue. WHY: the plastic tip must enter the lumen before it can thread (see §2). EXPECT: flash continues or brightens slightly. COMMON ERROR: threading on first flash — the single most common failure in all of catheter-placement, everywhere, forever. RECOVERY: if you threaded early and it resisted — do NOT pull the catheter back over the stylet; remove the unit together, pressure, next site. STOP: n/a. Step 5 — Thread. DO: stylet hand becomes a statue; index finger (or other hand) slides the catheter forward off the stylet in one smooth push to the hub. It should glide like a straw into a thick shake — light, continuous resistance, no force. WHY: the plastic follows the vessel; force means it's not in the vessel. EXPECT: hub reaches skin; slight blood ooze at hub is normal. COMMON ERROR: pushing catheter AND stylet together deeper \"for security\" (back-wall exit), or wiggling/rotating aggressively against resistance. RECOVERY: slight quarter-turn while threading is legal for a sticky start; ANY real resistance = out as a unit, new site. STOP: two failed placements by you = hand off, per the attempt rule. Step 6 — Stylet out, dam on. DO: holder releases occlusion; your free thumb presses the skin OVER the catheter's tip (not the hub) to dam flow; stylet pulls straight out and goes DIRECTLY to sharps — it never touches the table. EXPECT: minimal blood with a good dam. COMMON ERROR: stylet parked on the table \"for a second\" during taping — the injury statistic in this procedure. STOP: n/a. Step 7 — Connect + the first flush (the truth serum). DO: primed T-port on, firm twist; flush 1–3 mL slowly, watching and feeling THREE channels: thumb-feel (smooth, near-zero resistance?), site-look (any soft bleb rising beside the vessel?), patient-face (wince?). Optionally aspirate first — a lazy flash back confirms lumen. WHY: the flush is your only proof the PLASTIC is intravascular. A beautiful placement that blebs is a failed placement. EXPECT: effortless push; maybe a shiver of cold-saline reaction. COMMON ERROR: flushing fast (\"it's fine it's fine\") and missing the small bleb under fur. RECOVERY: any resistance/bleb/pain = it's not in; remove, pressure, report, restart at a new site (per your track). STOP: never flush against firm resistance — anywhere, ever. Step 8 — Tape architecture. DO in order: STRIP 1 (½\", sticky-up) slides UNDER the hub, wraps up and over crossing on top — this is the anchor that owns the catheter. STRIP 2 (1\") flat over the wings/hub, around the limb — snug, not tight. STRIP 3 (1\") captures the T-port in a gentle loop with its slack curving toward the elbow — the stress loop; a tug on the line must pull tape, not catheter. Tension test on EVERY strip: one finger slides under. Then light vetwrap; label ON the wrap. WHY each: anchor / stabilize / strain-relief. EXPECT: hub immobile when you wiggle the T-port. COMMON ERROR: circumferential tension (\"secure = tight\") — the tourniquet that makes tomorrow's fat paw; or all three strips doing the same job badly. RECOVERY: any doubt about tightness — cut it off and re-tape now; tape is cheaper than a swollen limb. STOP: n/a. Step 9 — Post-wrap recheck + chart. DO: flush AGAIN through the finished wrap (taping kinks catheters, especially at the feline carpus); chart date/time, limb, gauge, attempts, flush quality, tolerance, initials; case-log it. WHY: the wrap changed the geometry; prove it still works before you walk away. COMMON ERROR: skipping because \"it flushed two minutes ago.\" 7. Tactile medicine Threading DONE RIGHT: a smooth, faintly gritty glide — like sliding a coffee stirrer through a drinking straw. Threading WRONG: a springy, building push-back — the catheter tip crumpling against wall or valve; your fingers feel it buckle microscopically. LEARN BOTH ON THE MODEL until your finger refuses to push through the second one. The flush: a good line pushes like water through a straw; infiltration pushes like water into bread dough — a soft, absorbing wrongness; occlusion pushes like a capped syringe — hard wall. The three sensations are the whole diagnostic kit your thumb owns for the catheter's entire dwell life. 8. It didn't work — now what? No flash: identical ladder to CSC-VEN-01 (§8) — with the addendum that catheter units flash slower; give it one full second at depth before declaring dry. Flash, won't thread: run the sequence — advance the unit 1 mm more, flatten more, quarter-turn WHILE threading; if resistance persists: valve, bifurcation, or extraluminal tip → unit out together, pressure, move proximal or other limb. NEVER the pull-back-re-thread (§2). Threads but flush blebs: the catheter entered and exited (through-and-through placement) or tip migrated on securing — remove, pressure, honest log entry, new site. Threads, flushed fine, dies during taping: kink at carpus (cats) or hub lever against a tape ridge — re-tape with the carpus in neutral; per-policy splint for serial offenders. Vein blows on entry (immediate bloom): back wall; done at this site; the distal-first strategy just paid for itself — go up. Everything's failing and the patient needs access: say the useful sentence early — \"two attempts, both distal right, vein blows on entry; left untouched; she's getting harder to hold.\" Escalation with data is a skill deliverable, not defeat. Maintain-phase troubleshooting (both tracks own this): pump occlusion alarm → trace-then-site, positional test (flex/extend the carpus gently — flow returns = positional; report for re-tape/splint decision); wet wrap → stop pump, unwrap per direction, inspect — leak at hub (loose T-port) vs displacement (out); cool doughy swelling = infiltration (stop, report, expect removal); warm red cord + flush-pain = phlebitis pattern (report, expect removal order); catheter fell out in the kennel → pressure the site, save the catheter FOR INSPECTION (is the tip complete?), report — a missing tip fragment is an escalation, not an oh-well. 9. Real patients Cats: shorter catheters, carpus-kink planning, tape with the leg in a natural stance-angle; many cats tolerate placement better with the head towel-covered. Puppies: vein diameter fine, but zero impulse control — a second holder on the rear half changes everything; consider placing during a distraction feed. Dehydrated/shocky: flat veins + urgent need = the worst combination; pre-warm, use your best single attempt, and escalate fast — these are exactly the patients where senior hands should place early, and where a staged-and-ready table (your job) saves minutes that matter. Geriatric fragile veins: blow on contact; drop a gauge, flatten early, thread gently. Chondrodystrophics (dachshunds, corgis): two-centimeter runways — start at the carpal dorsum, expect the hub to sit near your entry point. Obese: the vein lives deeper than it palpates; commit to the flatten-advance beat on faith in your landmarks. Previously catheterized (the rehospitalized chronic): scarred, valve-y veins that flash and refuse threads — expect it, say it in your plan, budget attempts accordingly. 10. Common rookie mistakes The first-flash thread. Consequence: sub-q catheter that \"placed fine.\" Prevention: the flatten-advance beat said OUT LOUD. Every senior will drill this; internalize it before they have to. 2. Pull-back-re-thread. Consequence: possible shear = embolized plastic. Prevention: unit-out reflex; the model lab makes you practice failing correctly. 3. Proximal-first siting. Consequence: one blown attempt orphans the vein. 4. Unprimed T-port. Consequence: air push into a patient. Prevention: prime at staging, cap, done. 5. Tape tourniquets. Consequence: fat paw by morning. Prevention: one-finger test on every strip, every time. 6. Stylet on the table. Consequence: someone's hand finds it. 7. Skipping the post-wrap flush. Consequence: the night shift discovers your kink at 2 AM with a pressure alarm. 8. Force-flushing \"to open it up.\" Consequence: clot shower or sub-q bolus. Prevention: the three-sensation thumb (§7) plus the never-force rule. 11. Pearls &amp; banned folklore PEARLS: tear tape BEFORE you glove/stick — one-handed tape-tearing over a fresh catheter is a circus act with a casualty. · Rest your catheter-hand's heel on the patient's leg; the unit rides movement instead of fighting it. · On slow flashes, watch the hub chamber against something white. · Write the label DURING staging; post-placement you'll have one hand busy forever. · For cats: tape job rehearsed mentally BEFORE the stick — the difference between a 90-second and a 5-minute secure is planning, and minute three is when cats leave. · The best \"difficult catheter\" tool in the building is a second pair of experienced hands EARLY — pride is not a gauge size. BANNED: re-threading over the stylet in any form, including \"just a millimeter\"; \"testing patency\" by cranking the flush; cutting tape off with the same scissors' tip pointed at the catheter (slide a finger under and cut over your own finger); leaving a questionable catheter in service \"for the day shift to sort.\" 12. Visual assets VID-IVC-CEPH-001 (storyboard exists — includes the money-shot slow-mo of flatten-advance-thread and the shear-mechanism cutaway diagram). Stills to produce: tape strips 1-2-3 in sequence on a model limb; correct vs tourniquet-tight wrap (with the one-finger test shown); bleb-on-flush macro (model with sub-q dye); the three thumb-sensations poster (straw / bread dough / wall). INT-06 branching scenarios. 13. Assessment &amp; competency links Knowledge: QB-CORE-IVC (rewritten; SC items 100%). Practical: PA-IVC-CEPH-001 (includes damaged-packaging reject, kitten-gauge query probe, and the won't-thread options probe). Case log: TS-IVC-CEPH-001 §24 — model ×10 with BOTH sensations drilled, observed ×3, coached ×5 (≥1 cat, ≥1 dog); 12 logged for state 10, ≥3 patient categories. Reviews: R1: added the three-sensation thumb kit, tape-before-stick staging, statue-hand threading, fall-out tip-inspection rule. R2: every hand's job named at every step; both failure sensations trained on model before live. R3: PLACER track returns a CVT's 10–15 min per placement; ASSIST track still yields the hospital a staging-and-maintenance specialist who catches infiltrations before pumps do."}, {"id": "csc-res01", "title": "Canine restraint", "group": "Skill courses", "meta": "TS-RES-001/2/3", "html": "<p>Companion to <span class=\"id\">TS-RES-001</span>/002/003 · Benchmark course · ~30 min + daily floor practice</p>\n<h3>1. Purpose</h3>\n<p>Restraint is the platform under every procedure in the building. A good restrainer makes a blood draw a one-minute non-event; a bad one turns a nail trim into a bite report and a dog who fights every visit for life. The skill is not strength — it's geometry, timing, and reading. The strongest person in the building is usually not the best restrainer; the calmest usually is.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>The escalation ladder (from CSC-level handling): lip-lick/yawn/look-away → whale eye/freeze/tucked tail → growl/air-snap → bite. Every rung you notice early is force you don't need later. Force physics: dogs push INTO steady pressure and explode AGAINST sudden pressure — a firm, boring, continuous hold beats a reactive clutching one. Anatomy that matters: the trachea is midline under the neck (your forearm never presses there); limbs lever at joints (hold ABOVE joints — grabbing a carpus gives the dog a lever and you a sprain); the head owns the bite arc — control the head, and everything else is management.</p>\n<h3>3. Equipment</h3>\n<p>Non-slip mat (the single most underrated restraint tool — a dog scrabbling on steel is a dog panicking); leash/slip lead; basket and sleeve muzzles in a size run; towels; treats within the holder's reach. Table at working height for small/medium dogs; floor for giants — never fight gravity plus a 60 kg dog.</p>\n<h3>4. Patient preparation</h3>\n<p>Read before touching: loose-wiggly (standard holds), frozen-staring (decompress first — this dog is closest to the bite), panting-pacing (short holds, breaks between tasks). Check the record for flags; honor them completely (CSC rule: a \"will bite\" flag is a plan requirement, not a challenge). Batch the visit's procedures so one good hold covers three tasks.</p>\n<h3>5–6. The holds — geometry, hands, and steps</h3>\n<h4>Standing restraint (temps, SQ injections, exams)</h4>\n<p>DO: stand at the dog's side; one arm UNDER the neck, hand cupping around so the head is snugged against your shoulder/chest, muzzle pointed AWAY from the proceduralist; other arm under the belly just in front of the stifles, forearm lifting slightly so sitting is pre-empted; your body leans gently along the dog's side. WHY: the under-neck arm owns the bite arc; the belly arm owns the sit; your torso owns the sideways bail. EXPECT: the dog settles into the lean within a few seconds; you feel breathing rhythm through your side — that contact IS your monitor. COMMON ERROR: elbow winging out so the neck arm presses the throat; or holding the head so loosely it can whip 180°. RECOVERY: reset grip during a calm beat, not mid-struggle. STOP: escalating panic; any airway sound; anyone's stop-call.</p>\n<h4>Sternal restraint (cephalic draws, exams, most everything)</h4>\n<p>DO: dog sitting or sternal; same under-neck hug; second arm over the shoulders, hand tucking the far forelimb or presenting the near one to the phlebotomist; lean in. For draws, YOUR hand behind the elbow pushes the limb forward — push the elbow, never pull the paw. EXPECT: a stable tripod of dog + your two arms + your chest. COMMON ERROR: face directly over the dog's skull in the bite arc; drifting attention (chatting) while your hands loosen in sync with your focus. STOP: as above.</p>\n<h4>Lateral restraint (rads, saphenous, wounds)</h4>\n<p>DO (the takedown): from standing at the side, reach OVER the back and grasp the far-side forelimb above the carpus and far-side hindlimb above the hock; lift the far limbs toward you as your body guides the dog's slide DOWN YOUR LEGS to the mat — controlled the whole way, never a drop. Then: forearm across the neck (weight on the shoulder end, nothing on the trachea) with that hand holding the DOWN-side forelimb above the carpus; other forearm across the hindquarters, hand on down-side hindlimb. WHY: holding down-side limbs prevents the push-off that rights a dog; your forearms do the holding so your hands stay free-ish and soft. EXPECT: brief paddle then stillness; narrate calmly throughout. COMMON ERROR: grabbing at joints; releasing the hindquarters to help the front (the rear is where escapes start); pressing the neck harder when the front paddles (press the SHOULDER, reassure, wait). RECOVERY: if the dog is winning, don't crank — call it, let the dog stand, replan. STOP: cyanosis/gasp (release position immediately), escalating panic, stop-call. Release protocol: announce \"releasing,\" ease pressure rear-first, prevent the leap off the table.</p>\n<h4>Venipuncture holder role (cephalic/jugular/saphenous)</h4>\n<p>Covered in <span class=\"id\">CSC-VEN-01</span>/02/03 from the sticker's side; your deltas as holder: your occluding thumb takes cues (\"occlude\" / \"release\") instantly; you are ALSO the patient monitor — face, gums, breathing — because the sticker's eyes are on the vein. The holder owns the stop-call more than anyone.</p>\n<h3>7. Tactile medicine</h3>\n<p>Correct restraint pressure feels like a firm hug — the dog can breathe, shift weight, and lean, but not reposition its skeleton. You'll feel escalation before you see it: muscles board-up, breathing shortens, the lean disappears (the dog taking its weight back is the wind-up). A dog going still-and-loose is settling; a dog going still-and-hard is loading. The difference lives in your forearms — train yourself to narrate it (\"he's gone tight\").</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>The dog beats the takedown:</strong> don't wrestle mid-air; let it stand, reset the mat and your grip, try once more with a second person on the rear half. Two failed takedowns = different plan (standing rads? sedation conversation?). <strong>Struggling inside a hold:</strong> first check for a pain source (are YOU on a sore hip?), soften 10% for two seconds (paradox: many dogs settle when the squeeze relents), reposition ONE limb at a time. Continuous struggle &gt;15–20 s = stop; nobody wins extended wrestling. <strong>The muzzle moment:</strong> indications = flags, growl history, painful procedure on a worried dog. Application: calm, from the side, treat before and after; basket for anything longer than a minute (they can pant); NEVER on vomiting/dyspneic patients. A dog that fights the muzzle itself = plan change, not a second wrestler. <strong>Escapes:</strong> prevention is door-audits; if loose in the room — do not grab at the body (bite risk); block, lower your posture, leash-lasso calmly. Loose in a corridor = call it loudly (\"LOOSE DOG, closing doors\") — pride costs seconds. <strong>Giant breeds:</strong> floor work, two handlers as default, your body weight leaning along the spine does what arms can't. <strong>When to hand off:</strong> any bite attempt; any hold requiring more force than a firm hug; your own fear (dogs read it — a scared holder is an unsafe holder; saying so is professionalism).</p>\n<h3>9. Real patients</h3>\n<p><strong>Puppies:</strong> wiggle without malice — contain, don't clamp; make every visit-end sweet (you are building or wrecking a lifetime of vet visits). <strong>Geriatric/arthritic:</strong> ask the record which joints hurt; pad the mat; lateral via a supported ease-down, not the standard slide. <strong>Brachycephalics:</strong> NO neck-hug compression, sternal default, watch for the purple-tongue moment, breaks between tasks. <strong>Deep-chested giants:</strong> lateral on these is a two-person minimum; consider standing alternatives for rads per DVM. <strong>Painful patients:</strong> analgesia conversation BEFORE restraint (advocate: \"can she have her pain meds before we position?\"); expect bite risk regardless of temperament. <strong>The frozen-fearful:</strong> slowest hands, lowest voice, treats raining; consider whether today's list can shrink (ask the DVM — \"he's at his limit; which items are essential?\" is high-value advocacy). <strong>Sedated patients:</strong> never trust sedation to substitute for support — a sedated dog can still bite and can definitely fall; positioning duties shift toward airway/comfort guarding.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Strength-first mindset</strong> — clamping harder as the answer to everything; consequence: escalation cycles; prevention: geometry-and-timing coaching, watching the calm seniors. 2. <strong>Trachea-forearm</strong> — pressing the airway during lateral; drilled out with the shoulder-press cue. 3. <strong>Joint-grabbing</strong> — carpi and hocks as handles; injury to dog and holder. 4. <strong>Face in the bite arc</strong> while leaning over the skull. 5. <strong>Attention drift</strong> — hands loosen exactly when the room chats; the incident always happens \"suddenly.\" 6. <strong>Springing releases</strong> — letting go all at once; dogs launch; announce and ease. 7. <strong>Taking struggle personally</strong> — cranking down on a dog \"being bad\"; fear isn't disobedience; the fix is the plan, not the pressure.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: The mat first, always — traction is tranquility. · Narrate transitions (\"lifting now\") — teams and dogs both startle less. · Feed the floor: a lick-mat smeared with something during standing holds converts half of wiggly dogs to statues. · Your exhale is contagious — audible slow breathing settles the dog under your arm (and you). · Handler height beats handler strength: get your center of gravity over the dog's. BANNED: alpha-roll/dominance framing (fear escalates fear; it also gets people bitten); suspending by scruff or limbs; \"hugging tighter until it stops\" as a doctrine; muzzling to skip the reading (\"muzzle it and go\" produces the next bite at muzzle-off).</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-RES-001</span>/002 storyboards (takedown slow-mo with limb-grip macro ABOVE joints; trachea-vs-shoulder pressure diagram; correct vs face-in-arc sternal hold). <span class=\"id\">INT-07</span> body-language set precedes floor work. Practical: <span class=\"id\">PA-RES-001</span> §A–D (includes the scripted distress probe and stop-call). Case log: coached counts per specs; assessed live Weeks 1–2.</p>\n<hr>\n<p><em>Reviews:</em> R1: added still-loose vs still-hard distinction, the soften-10% paradox, rear-first release. R2: every hold now names both arms' jobs and where your face goes. R3: a signed-off restrainer frees a CVT at every procedure — the first and largest workload transfer in the Core.</p>", "text": "Companion to TS-RES-001 /002/003 · Benchmark course · ~30 min + daily floor practice 1. Purpose Restraint is the platform under every procedure in the building. A good restrainer makes a blood draw a one-minute non-event; a bad one turns a nail trim into a bite report and a dog who fights every visit for life. The skill is not strength — it's geometry, timing, and reading. The strongest person in the building is usually not the best restrainer; the calmest usually is. 2. Prerequisite knowledge The escalation ladder (from CSC-level handling): lip-lick/yawn/look-away → whale eye/freeze/tucked tail → growl/air-snap → bite. Every rung you notice early is force you don't need later. Force physics: dogs push INTO steady pressure and explode AGAINST sudden pressure — a firm, boring, continuous hold beats a reactive clutching one. Anatomy that matters: the trachea is midline under the neck (your forearm never presses there); limbs lever at joints (hold ABOVE joints — grabbing a carpus gives the dog a lever and you a sprain); the head owns the bite arc — control the head, and everything else is management. 3. Equipment Non-slip mat (the single most underrated restraint tool — a dog scrabbling on steel is a dog panicking); leash/slip lead; basket and sleeve muzzles in a size run; towels; treats within the holder's reach. Table at working height for small/medium dogs; floor for giants — never fight gravity plus a 60 kg dog. 4. Patient preparation Read before touching: loose-wiggly (standard holds), frozen-staring (decompress first — this dog is closest to the bite), panting-pacing (short holds, breaks between tasks). Check the record for flags; honor them completely (CSC rule: a \"will bite\" flag is a plan requirement, not a challenge). Batch the visit's procedures so one good hold covers three tasks. 5–6. The holds — geometry, hands, and steps Standing restraint (temps, SQ injections, exams) DO: stand at the dog's side; one arm UNDER the neck, hand cupping around so the head is snugged against your shoulder/chest, muzzle pointed AWAY from the proceduralist; other arm under the belly just in front of the stifles, forearm lifting slightly so sitting is pre-empted; your body leans gently along the dog's side. WHY: the under-neck arm owns the bite arc; the belly arm owns the sit; your torso owns the ion immediately), escalating panic, stop-call. Release protocol: announce \"releasing,\" ease pressure rear-first, prevent the leap off the table. Venipuncture holder role (cephalic/jugular/saphenous) Covered in CSC-VEN-01 /02/03 from the sticker's side; your deltas as holder: your occluding thumb takes cues (\"occlude\" / \"release\") instantly; you are ALSO the patient monitor — face, gums, breathing — because the sticker's eyes are on the vein. The holder owns the stop-call more than anyone. 7. Tactile medicine Correct restraint pressure feels like a firm hug — the dog can breathe, shift weight, and lean, but not reposition its skeleton. You'll feel escalation before you see it: muscles board-up, breathing shortens, the lean disappears (the dog taking its weight back is the wind-up). A dog going still-and-loose is settling; a dog going still-and-hard is loading. The difference lives in your forearms — train yourself to narrate it (\"he's gone tight\"). 8. It didn't work — now what? The dog beats the takedown: don't wrestle mid-air; let it stand, reset the mat and your grip, try once more with a second person on the rear half. Two failed takedowns = different plan (standing rads? sedation conversation?). Struggling inside a hold: first check for a pain source (are YOU on a sore hip?), soften 10% for two seconds (paradox: many dogs settle when the squeeze relents), reposition ONE limb at a time. Continuous struggle &gt;15–20 s = stop; nobody wins extended wrestling. The muzzle moment: indications = flags, growl history, painful procedure on a worried dog. Application: calm, from the side, treat before and after; basket for anything longer than a minute (they can pant); NEVER on vomiting/dyspneic patients. A dog that fights the muzzle itself = plan change, not a second wrestler. Escapes: prevention is door-audits; if loose in the room — do not grab at the body (bite risk); block, lower your posture, leash-lasso calmly. Loose in a corridor = call it loudly (\"LOOSE DOG, closing doors\") — pride costs seconds. Giant breeds: floor work, two handlers as default, your body weight leaning along the spine does what arms can't. When to hand off: any bite attempt; any hold requiring more force than a firm hug; your own fear (dogs read it — a scared holder is an unsafe holder; saying so is professionalism). 9. Real patients Puppies: wiggle without malice — contain, don't clamp; make every visit-end sweet (you are building or wrecking a lifetime of vet visits). Geriatric/arthritic: ask the record which joints hurt; pad the mat; lateral via a supported ease-down, not the standard slide. Brachycephalics: NO neck-hug compression, sternal default, watch for the purple-tongue moment, breaks between tasks. Deep-chested giants: lateral on these is a two-person minimum; consider standing alternatives for rads per DVM. Painful patients: analgesia conversation BEFORE restraint (advocate: \"can she have her pain meds before we position?\"); expect bite risk regardless of temperament. The frozen-fearful: slowest hands, lowest voice, treats raining; consider whether today's list can shrink (ask the DVM — \"he's at his limit; which items are essential?\" is high-value advocacy). Sedated patients: never trust sedation to substitute for support — a sedated dog can still bite and can definitely fall; positioning duties shift toward airway/comfort guarding. 10. Common rookie mistakes Strength-first mindset — clamping harder as the answer to everything; consequence: escalation cycles; prevention: geometry-and-timing coaching, watching the calm seniors. 2. Trachea-forearm — pressing the airway during lateral; drilled out with the shoulder-press cue. 3. Joint-grabbing — carpi and hocks as handles; injury to dog and holder. 4. Face in the bite arc while leaning over the skull. 5. Attention drift — hands loosen exactly when the room chats; the incident always happens \"suddenly.\" 6. Springing releases — letting go all at once; dogs launch; announce and ease. 7. Taking struggle personally — cranking down on a dog \"being bad\"; fear isn't disobedience; the fix is the plan, not the pressure. 11. Pearls &amp; banned folklore PEARLS: The mat first, always — traction is tranquility. · Narrate transitions (\"lifting now\") — teams and dogs both startle less. · Feed the floor: a lick-mat smeared with something during standing holds converts half of wiggly dogs to statues. · Your exhale is contagious — audible slow breathing settles the dog under your arm (and you). · Handler height beats handler strength: get your center of gravity over the dog's. BANNED: alpha-roll/dominance framing (fear escalates fear; it also gets people bitten); suspending by scruff or limbs; \"hugging tighter until it stops\" as a doctrine; muzzling to skip the reading (\"muzzle it and go\" produces the next bite at muzzle-off). 12–13. Visuals &amp; assessment VID-RES-001 /002 storyboards (takedown slow-mo with limb-grip macro ABOVE joints; trachea-vs-shoulder pressure diagram; correct vs face-in-arc sternal hold). INT-07 body-language set precedes floor work. Practical: PA-RES-001 §A–D (includes the scripted distress probe and stop-call). Case log: coached counts per specs; assessed live Weeks 1–2. Reviews: R1: added still-loose vs still-hard distinction, the soften-10% paradox, rear-first release. R2: every hold now names both arms' jobs and where your face goes. R3: a signed-off restrainer frees a CVT at every procedure — the first and largest workload transfer in the Core."}, {"id": "csc-res02", "title": "Feline restraint", "group": "Skill courses", "meta": "TS-RES-002/3", "html": "<p>Companion to <span class=\"id\">TS-RES-002</span>/003, <span class=\"id\">TS-HND-002</span>/004 · Benchmark course · ~25 min + floor practice</p>\n<h3>1. Purpose</h3>\n<p>Cats are not small dogs; they are a different physics problem. A cat gives you a short window of tolerance, spends it fast, and remembers how you used it. The CVAH standard is minimal-restraint, towel-first handling: the least contact that achieves stillness, with an exit ramp planned before you start. Teams that master this stop \"losing\" cats — into cabinets, into fear-aggression, into unexaminable-forever.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>Feline escalation ladder: ears rotating/flattening, pupil dilation, tail-tip flick → lash, weight shrinking backward, the crouch-freeze → hiss/swat → explosion. The cardinal rule: the silent, dilated, frozen cat is CLOSER to the explosion than the hissing one — hissing is negotiation; silence is a countdown. Physiology: stressed cats decompensate fast (they're often sick underneath); open-mouth breathing in any restrained cat is an emergency stop, full stop. Anatomy: twenty claws move in six directions; the towel exists because hands cannot cover that geometry.</p>\n<h3>3. Equipment</h3>\n<p>Two towels minimum (one working, one spare); non-slip mat; cat muzzle (doubles as eye cover — many cats settle blind) per policy; treats/lick paste; the CARRIER ITSELF (its bottom half is an exam surface a scared cat trusts).</p>\n<h3>4. Patient preparation</h3>\n<p>Read through the carrier door before opening anything: forward-and-curious vs pressed-to-the-back vs silent-and-huge-pupiled. Room prep BEFORE the carrier opens: door closed, window/screen audit, counters clear of avalanche objects, quiet voices, towel unfolded within reach. The carrier protocol: never dump, never drag. Unclip/unscrew the top half; lift it off slowly with the towel draped over your forearm ready to lay across the cat. Half of feline medicine can happen with the cat sitting in its own carrier bottom under a towel.</p>\n<h3>5–6. The holds</h3>\n<h4>The minimal hold (default for exams, most treatments)</h4>\n<p>DO: cat sternal (\"meatloaf\") on mat or in carrier bottom; your two forearms bracket its body like a valley, hands resting lightly over shoulders; no gripping unless movement starts. WHY: cats push against fixation and relax under mere boundaries. EXPECT: the cat compresses into a loaf and stays. COMMON ERROR: pre-emptive scruffing of a calm cat — you just spent tolerance you didn't need to. STOP: escalation ladder climbing past tail-lash.</p>\n<h4>The towel burrito (draws, injections, anything a paw could reach)</h4>\n<p>DO: towel flat on table; cat placed sternal on its center-back edge; wrap side A snugly over the back and under the far side of the body; wrap side B over and tuck under the near side — snug through the shoulders, looser at the ribs (breathing room); leave out ONLY the part being worked on (a hindlimb for medial saphenous; the head for oral meds). Head covered or uncovered by the cat's vote — try covered first; most settle. WHY: containment without compression; a hide-option built in. EXPECT: a cat-shaped log that breathes easily and struggles briefly then settles. COMMON ERROR: wrapping a panicking cat TIGHTER as it fights — compression on a stressed cat is a respiratory event brewing; snug ≠ compressed. RECOVERY: struggle inside the wrap → open it, let the cat re-loaf, re-wrap once calmer or change plan. STOP: open-mouth breathing = wrap open NOW, all restraint off, CVT alert.</p>\n<h4>Scruff — the exception, not the default</h4>\n<p>House policy: towel techniques first; scruff only as a brief last-resort control during an active safety event, never as the opening move, never suspended, never on seniors (skin tears) or obese cats (it doesn't even work). If a plan REQUIRES a scruff to complete, the plan is wrong — regroup (chemical restraint is the DVM's kinder answer).</p>\n<h4>Holder role for feline draws</h4>\n<p>Medial saphenous and jugular holds per <span class=\"id\">CSC-VEN-02</span>/03; your feline deltas: contact points minimal, your murmuring voice constant, your eyes on the face (YOU are the respiratory monitor), and the stop-call is yours to make early.</p>\n<h3>7. Tactile medicine</h3>\n<p>Under your forearms, a settling cat softens and widens (the loaf spreads); a loading cat narrows and coils — you'll feel the spine arch beginning and the rear feet gathering under. Tail-lash transmits through the table. The wrapped cat's breathing is your hands' business: you should feel the ribs cycling easily through the towel; effort you can feel = wrap too tight or patient in trouble — open it.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>Cat won't leave the carrier:</strong> top-off protocol; work in the bottom half; if it must come out, towel-over-and-scoop as one bundle. <strong>Explosion mid-procedure:</strong> let go of the PROCEDURE, not the room — drop the towel over the cat where it lands, dim, everyone silent for 60 s; then reassess: is the remaining task essential today (DVM call)? <strong>The cabinet cat:</strong> do not reach into the hole after it (that's how hands get shredded); close the room, open the cabinet fully, towel ready, patience or a DVM sedation plan. <strong>Repeated visits, worsening behavior:</strong> flag the record with SPECIFIC triggers observed (\"panics at clipper sound; fine with towel-covered head\") — you are writing the next visit's plan. <strong>The genuinely dangerous cat:</strong> stop protecting your pride — gloves-and-net folklore era is over; the answer is chemical restraint prescribed by the DVM, requested EARLY, framed as welfare (it is). <strong>Open-mouth breathing at ANY point:</strong> everything stops; O2 nearby; CVT/DVM now; the procedure no longer exists.</p>\n<h3>9. Real patients</h3>\n<p><strong>Kittens:</strong> all containment, no force; socialization stakes are sky-high — pair every handling with food. <strong>Seniors/CKD (your most common inpatients):</strong> fragile skin, sore joints, often dehydrated — pad everything, no scruff ever, warm the towel. <strong>Hyperthyroid:</strong> wired, fragile hearts — shortest possible events, calmest room. <strong>Brachycephalic cats (Persians):</strong> airway margin is thin; sternal only, face never buried in towel, watch nostrils. <strong>Diabetic/sick cats in for serial draws:</strong> they learn fast — invest in making draw one pleasant (medial saphenous under towel + food) and draws two through ten stay easy. <strong>The \"fine at home\" cat:</strong> believe the owner AND the ladder in front of you; carrier-trained calm evaporates in clinic — read the current cat, not the story.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Scruff-first defaults</strong> — trained out with towel drills. 2. <strong>Dumping the carrier</strong> — the relationship-ender; top-off, always. 3. <strong>Tightening a panicking wrap.</strong> 4. <strong>Working slowly</strong> on a calm cat — feline tolerance is a countdown; be READY (supplies staged) then be brief. 5. <strong>Reading silence as consent</strong> — the frozen cat's explosion \"from nowhere.\" 6. <strong>Chasing an escaped cat</strong> around the room — herd and towel instead. 7. <strong>Skipping the room audit</strong> — discovering the open window mid-explosion.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: warm towel from the dryer = instant 20% calmer cat. · Feliway/pheromone spray on towels per stock — cheap margin. · The carrier-bottom exam saves more scratches than any glove. · Do the worst thing LAST (temp after draw, not before). · Chin-scratch test: a cat that accepts one is telling you your window is open; one that jerks away is telling you it's closing. BANNED: scruff-suspension, full-body compression \"hugging,\" spray bottles, gloves-as-substitute-for-plan (bulky gloves crush cats and miss holds), \"cat whisperer\" bare-hand bravado on flagged cats.</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-RES-002</span> feline segment + burrito build in 4 stills (flat → side A → side B → limb-out variant); <span class=\"id\">INT-07</span> feline signal photos. Practical: <span class=\"id\">PA-RES-001</span> §C–D with feline probes (open-mouth = scripted stop ★). Case log: ≥3 coached felin
