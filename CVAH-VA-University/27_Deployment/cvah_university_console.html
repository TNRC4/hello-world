t_Guide.md : provision → import Core W0–W2 first (rolling import beats big-bang) → convert QB files to GIFT → wire conditional release → pilot with two current staff members through Week 0–1 → fix friction → import remaining weeks + Reference Library (approved CRCs only). Phase C — Train the trainers (Week 4) Half-day session: Assessors practice the rubrics on each other (calibration: two assessors score the same performance, discuss gaps &gt;2 points); trainers learn the daily integration rhythm; everyone drills the assessor mobile flow to the 60-second standard. Phase D — First cohort (Weeks 5–13) Enroll 1–2 new hires (or challenge-testing current assistants — often the best pilot: they validate challenge-out AND get credentialed). Daily rhythm (workplace integration): before-shift/protected block 30–45 min = assigned lesson · during shift = training board flags learner-appropriate cases; trainer creates designated practice opportunities · competency moments = assessor observes when flagged ready · end of shift 10 min = log attempts + feedback · system assigns next. Weekly: trainer+learner 15-min passport review; manager glances at the exposure-diagnosis panel (is scheduling starving the learner of cases?). Existing-staff track: challenge-testing sweep converts current assistants' real skills into passport states in ~2–4 weeks of opportunistic assessment — do this early; it populates the capability matrix and normalizes the assessment culture. Phase E — Operate (ongoing) Monthly: analytics review (15 min in the manager meeting: transfer metrics + program health) · KB failed-search review → new cards. Quarterly: mock code ( SIM-CORE-004 ) · LASA shelf audit (Pharmacy credential holder) · content release + license audit. Annually: scope re-verification · repetition-requirement calibration against attempts-to-competency data · full QA cycle (27_/QA_Report.md as the template). Budget summary (verify current prices) LMS US$10–50/mo · model arms/limbs one-time ~US$200–600 (or clinic-built) · CPR manikin if not owned ~US$150–500 · print/laminate trivial · video production in-house (phone + $50 gimbal) · staff time is the real cost: ~0.5–1.0 FTE-hours/day of trainer attention per active learner in Weeks 0–4, tapering after — priced into the 6–8-week payoff by the transfer metrics. The Monday-morning test, answered A new hire can start Week 0 the Monday after Phase C completes: pretest exists, lessons exist, floor targets exist, rubrics exist, logs print on one sheet. The only true blockers are the DVM approvals in Phase A — protect those 4–6 reviewer hours above all else."}, {"id": "roles", "title": "Governance roles", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08-17</p>\n<p>The University requires six operational roles. These are role definitions with tooling — <strong>not</strong> a leadership curriculum.</p>\n<h3>1. Program Administrator</h3>\n<p>Owns: enrollment, LMS administration, manifest maintenance, analytics reporting, revalidation calendar, asset register. Typically the practice manager or delegate. Tools: manager dashboard, manifest, LMS admin.</p>\n<h3>2. Medical Reviewer (DVM)</h3>\n<p>Owns: clinical accuracy of all content; approval of every Controlled Reference Card; sign-off on any MAJOR content revision; final authority on competency disputes. Must be an Arizona-licensed veterinarian. Tools: medical review workflow (<code>Medical_Review_Workflow.md</code>), controlled-reference register.</p>\n<h3>3. Supervising Veterinarian</h3>\n<p>The licensed veterinarian responsible under A.R.S. § 32-2281 for care rendered by assistants on shift. Confirms supervision-level requirements in the scope matrix are honored in daily assignment. Signs VA-level advancements and specialty credentials jointly with an assessor.</p>\n<h3>4. Supervising Technician (CVT preferred)</h3>\n<p>Day-to-day clinical mentor. Identifies practice opportunities during shifts, provides coached repetitions, records case-log entries, flags learners for practical assessment readiness.</p>\n<h3>5. Assessor</h3>\n<p>Conducts standardized practical assessments using the rubrics in <code>15_Practical_Competencies/</code>. May be a CVT or DVM; for safety-critical skills (venipuncture, IV catheterization, medication preparation, surgical prep, anesthesia-adjacent skills) the assessor must be a CVT or DVM. An assessor may not perform the final assessment of a learner they primarily trained on that skill when another qualified assessor is available (bias control; waive with Medical Reviewer approval in small-staff situations).</p>\n<h3>6. Manager</h3>\n<p>Owns workforce readiness: reviews the readiness dashboard, approves workload assignment consistent with passport states, initiates remediation conversations, co-signs Core graduation.</p>\n<h3>Separation of powers</h3>\n<ul>\n<li>Theory completion: recorded automatically by LMS.</li>\n<li>Practical competency: only an Assessor can grant.</li>\n<li>Progression to \"Independently Assignable Within Hospital Policy\": requires Assessor + Supervising Veterinarian or Medical Reviewer.</li>\n<li>Restriction/revocation: any DVM immediately; Assessor may impose \"Temporarily Restricted\" pending DVM review within 48 h.</li>\n<li>Remediation assignment: Assessor or Manager; remediation content per <code>23_Remediation/</code>.</li>\n</ul>\n<h3>Assessment integrity rules</h3>\n<ol>\n<li>No self-assessment for any practical competency.</li>\n<li>Rubrics must be scored during or immediately after observation, never from memory the next day.</li>\n<li>\"Seems pretty good at it\" is not an assessment; only observable rubric behaviors count.</li>\n<li>Critical-fail behaviors end the attempt regardless of other scores.</li>\n<li>All records are retained per HR policy <code>[CVAH-SPECIFIC INPUT REQUIRED: retention period]</code>.</li>\n</ol>", "text": "Version 1.0 · 2026-08-17 The University requires six operational roles. These are role definitions with tooling — not a leadership curriculum. 1. Program Administrator Owns: enrollment, LMS administration, manifest maintenance, analytics reporting, revalidation calendar, asset register. Typically the practice manager or delegate. Tools: manager dashboard, manifest, LMS admin. 2. Medical Reviewer (DVM) Owns: clinical accuracy of all content; approval of every Controlled Reference Card; sign-off on any MAJOR content revision; final authority on competency disputes. Must be an Arizona-licensed veterinarian. Tools: medical review workflow ( Medical_Review_Workflow.md ), controlled-reference register. 3. Supervising Veterinarian The licensed veterinarian responsible under A.R.S. § 32-2281 for care rendered by assistants on shift. Confirms supervision-level requirements in the scope matrix are honored in daily assignment. Signs VA-level advancements and specialty credentials jointly with an assessor. 4. Supervising Technician (CVT preferred) Day-to-day clinical mentor. Identifies practice opportunities during shifts, provides coached repetitions, records case-log entries, flags learners for practical assessment readiness. 5. Assessor Conducts standardized practical assessments using the rubrics in 15_Practical_Competencies/ . May be a CVT or DVM; for safety-critical skills (venipuncture, IV catheterization, medication preparation, surgical prep, anesthesia-adjacent skills) the assessor must be a CVT or DVM. An assessor may not perform the final assessment of a learner they primarily trained on that skill when another qualified assessor is available (bias control; waive with Medical Reviewer approval in small-staff situations). 6. Manager Owns workforce readiness: reviews the readiness dashboard, approves workload assignment consistent with passport states, initiates remediation conversations, co-signs Core graduation. Separation of powers Theory completion: recorded automatically by LMS. Practical competency: only an Assessor can grant. Progression to \"Independently Assignable Within Hospital Policy\": requires Assessor + Supervising Veterinarian or Medical Reviewer. Restriction/revocation: any DVM immediately; Assessor may impose \"Temporarily Restricted\" pending DVM review within 48 h. Remediation assignment: Assessor or Manager; remediation content per 23_Remediation/ . Assessment integrity rules No self-assessment for any practical competency. Rubrics must be scored during or immediately after observation, never from memory the next day. \"Seems pretty good at it\" is not an assessment; only observable rubric behaviors count. Critical-fail behaviors end the attempt regardless of other scores. All records are retained per HR policy [CVAH-SPECIFIC INPUT REQUIRED: retention period] ."}, {"id": "scope", "title": "Arizona scope matrix", "group": "Run it", "meta": "verify before use", "html": "<p>Version 1.0 · 2026-08-17 · <strong>Status: DRAFT — requires Medical Reviewer + regulatory verification before first use, and annual re-verification.</strong></p>\n<h3>Legal foundation (verify at deployment against current law)</h3>\n<ul>\n<li><strong>A.R.S. Title 32, Chapter 21</strong> — Arizona veterinary practice act. § 32-2281: a veterinary assistant employed by a licensed veterinarian may perform duties <strong>other than diagnosis, prognosis, prescription, or surgery</strong> under the <strong>direct or indirect supervision</strong> of the veterinarian, who is responsible for the assistant's performance.</li>\n<li><strong>A.A.C. Title 3, Chapter 11</strong> — Veterinary Medical Examining Board rules; <strong>R3-11-605</strong> governs Certified Veterinary Technician services (tasks delegated by, and under the direction/supervision/control of, a licensed veterinarian).</li>\n<li>Authoritative access: Arizona State Veterinary Medical Examining Board — vetboard.az.gov (Statutes &amp; Rules page); Arizona Secretary of State Administrative Code Title 3 Ch. 11.</li>\n<li>Federal overlays: DEA (controlled substances — assistants may handle only within hospital's DEA-registrant procedures; logging tasks per policy), OSHA (hazard communication, sharps, anesthetic gas exposure), state radiation control for X-ray operation <code>[CVAH-SPECIFIC INPUT REQUIRED: confirm Arizona Bureau of Radiation Control registration requirements for operators at CVAH]</code>.</li>\n</ul>\n<h3>Reading the matrix</h3>\n<p>Scope class and supervision codes per <code>Scope_Classification_System.md</code>. The <strong>CVAH policy</strong> column is the hospital's tightening of the legal ceiling — policy may restrict, never expand, legal scope. Machine-readable version: <code>Arizona_Scope_Matrix.csv</code>.</p>\n<h3>Matrix (core tasks)</h3>\n<div class=\"tw\"><table><thead><tr><th>Task</th><th>AZ legal ceiling for assistant</th><th>Class</th><th>Supervision</th><th>CVAH policy</th></tr></thead><tbody><tr><td>Patient restraint &amp; handling</td><td>Permitted</td><td>P</td><td>S2</td><td>Per restraint policy</td></tr><tr><td>TPR / vitals acquisition</td><td>Permitted</td><td>P</td><td>S2</td><td>—</td></tr><tr><td>Venipuncture (sample collection)</td><td>Permitted (not surgery)</td><td>P</td><td>S2</td><td>First 10 sticks S1</td></tr><tr><td>IV catheter placement (peripheral)</td><td>Permitted under supervision</td><td>P</td><td>S1→S2</td><td><code>[CVAH-SPECIFIC INPUT REQUIRED: confirm CVAH permits assistants; many AZ practices reserve to CVT]</code></td></tr><tr><td>SQ injection (non-controlled, DVM-ordered)</td><td>Permitted</td><td>P</td><td>S2</td><td>Dose verified by CVT/DVM</td></tr><tr><td>IM injection (DVM-ordered)</td><td>Permitted</td><td>P</td><td>S1→S2</td><td>Dose verified by CVT/DVM</td></tr><tr><td>IV push medication</td><td>Legal ceiling debated; treat as restricted</td><td>HP/CT</td><td>S1</td><td>Reserved to CVT/DVM unless Medical Director authorizes specific drugs</td></tr><tr><td>Anesthesia induction (drug administration)</td><td>Delegation-sensitive</td><td>CT</td><td>S1</td><td>Reserved to CVT/DVM</td></tr><tr><td>Anesthetic monitoring &amp; recording</td><td>Permitted as assigned support</td><td>P</td><td>S1</td><td>Under CVT/DVM running anesthesia; assistant never solely responsible</td></tr><tr><td>Adjusting vaporizer/anesthetic depth</td><td>Treatment alteration</td><td>DVM/CT</td><td>—</td><td>Assistant reports; never adjusts unless directly instructed in the moment by DVM/CVT present</td></tr><tr><td>Intubation</td><td>Delegation-sensitive</td><td>CT/HP</td><td>S1</td><td>Reserved to CVT/DVM at CVAH</td></tr><tr><td>Surgical prep (clip/scrub)</td><td>Permitted</td><td>P</td><td>S2</td><td>—</td></tr><tr><td>Sterile assistance (instrument passing)</td><td>Permitted</td><td>A/P</td><td>S1</td><td>—</td></tr><tr><td>Suturing / surgery of any kind</td><td>Prohibited (surgery)</td><td>DVM</td><td>—</td><td>Never</td></tr><tr><td>Dental cleaning/polishing (supra-gingival, anesthetized, delegated)</td><td>Delegation-sensitive; AZ rules place dental procedures under DVM/CVT control</td><td>HP/CT</td><td>S1</td><td><code>[CVAH-SPECIFIC INPUT REQUIRED: Medical Director determination]</code></td></tr><tr><td>Dental radiographs</td><td>Permitted</td><td>P</td><td>S2</td><td>Radiation safety training first</td></tr><tr><td>Diagnostic radiographs (positioning/exposure)</td><td>Permitted</td><td>P</td><td>S2</td><td>Dosimetry + safety module first</td></tr><tr><td>Interpreting radiographs</td><td>Diagnosis</td><td>DVM</td><td>—</td><td>Assistants flag technical quality only</td></tr><tr><td>In-house lab test performance</td><td>Permitted</td><td>P</td><td>S2</td><td>QC per Lab Academy</td></tr><tr><td>Reporting/interpreting results to clients</td><td>Diagnosis/prognosis territory</td><td>DVM/CT</td><td>—</td><td>Assistants relay only DVM-approved statements</td></tr><tr><td>Filling prescriptions per DVM order (counting/labeling)</td><td>Permitted with verification</td><td>P</td><td>S2</td><td>CVT/DVM verifies before dispensing</td></tr><tr><td>Prescribing, dose selection, plan changes</td><td>Prohibited</td><td>DVM</td><td>—</td><td>Never</td></tr><tr><td>Controlled-substance log entries</td><td>Permitted per DEA registrant procedure</td><td>HP</td><td>S2</td><td>Witness signature per policy</td></tr><tr><td>Euthanasia solution administration</td><td>Prohibited for assistants</td><td>DVM (CVT only under specific conditions, per rule)</td><td>—</td><td>Never</td></tr><tr><td>CPR compressions/BLS support</td><td>Permitted</td><td>P</td><td>S1</td><td>Per RECOVER roles</td></tr><tr><td>Cystocentesis</td><td>Needle into body cavity — treat as CVT/DVM</td><td>CT</td><td>—</td><td>Assist only</td></tr><tr><td>Client education (approved scripts)</td><td>Permitted, non-diagnostic</td><td>P</td><td>S3</td><td>Approved topics list only</td></tr></tbody></table></div>\n<h3>Maintenance</h3>\n<p>Annual verification against vetboard.az.gov Statutes &amp; Rules; immediate row review on any Board rule change; every row change is a MAJOR revision requiring medical review. Research log: <code>Regulatory_Research_Log.md</code>.</p>", "text": "Version 1.0 · 2026-08-17 · Status: DRAFT — requires Medical Reviewer + regulatory verification before first use, and annual re-verification. Legal foundation (verify at deployment against current law) A.R.S. Title 32, Chapter 21 — Arizona veterinary practice act. § 32-2281: a veterinary assistant employed by a licensed veterinarian may perform duties other than diagnosis, prognosis, prescription, or surgery under the direct or indirect supervision of the veterinarian, who is responsible for the assistant's performance. A.A.C. Title 3, Chapter 11 — Veterinary Medical Examining Board rules; R3-11-605 governs Certified Veterinary Technician services (tasks delegated by, and under the direction/supervision/control of, a licensed veterinarian). Authoritative access: Arizona State Veterinary Medical Examining Board — vetboard.az.gov (Statutes &amp; Rules page); Arizona Secretary of State Administrative Code Title 3 Ch. 11. Federal overlays: DEA (controlled substances — assistants may handle only within hospital's DEA-registrant procedures; logging tasks per policy), OSHA (hazard communication, sharps, anesthetic gas exposure), state radiation control for X-ray operation [CVAH-SPECIFIC INPUT REQUIRED: confirm Arizona Bureau of Radiation Control registration requirements for operators at CVAH] . Reading the matrix Scope class and supervision codes per Scope_Classification_System.md . The CVAH policy column is the hospital's tightening of the legal ceiling — policy may restrict, never expand, legal scope. Machine-readable version: Arizona_Scope_Matrix.csv . Matrix (core tasks) Task AZ legal ceiling for assistant Class Supervision CVAH policy Patient restraint &amp; handling Permitted P S2 Per restraint policy TPR / vitals acquisition Permitted P S2 — Venipuncture (sample collection) Permitted (not surgery) P S2 First 10 sticks S1 IV catheter placement (peripheral) Permitted under supervision P S1→S2 [CVAH-SPECIFIC INPUT REQUIRED: confirm CVAH permits assistants; many AZ practices reserve to CVT] SQ injection (non-controlled, DVM-ordered) Permitted P S2 Dose verified by CVT/DVM IM injection (DVM-ordered) Permitted P S1→S2 Dose verified by CVT/DVM IV push medication Legal ceiling debated; treat as restricted HP/CT S1 Reserved to CVT/DVM unless Medical Director authorizes specific drugs Anesthesia induction (drug administration) Delegation-sensitive CT S1 Reserved to CVT/DVM Anesthetic monitoring &amp; recording Permitted as assigned support P S1 Under CVT/DVM running anesthesia; assistant never solely responsible Adjusting vaporizer/anesthetic depth Treatment alteration DVM/CT — Assistant reports; never adjusts unless directly instructed in the moment by DVM/CVT present Intubation Delegation-sensitive CT/HP S1 Reserved to CVT/DVM at CVAH Surgical prep (clip/scrub) Permitted P S2 — Sterile assistance (instrument passing) Permitted A/P S1 — Suturing / surgery of any kind Prohibited (surgery) DVM — Never Dental cleaning/polishing (supra-gingival, anesthetized, delegated) Delegation-sensitive; AZ rules place dental procedures under DVM/CVT control HP/CT S1 [CVAH-SPECIFIC INPUT REQUIRED: Medical Director determination] Dental radiographs Permitted P S2 Radiation safety training first Diagnostic radiographs (positioning/exposure) Permitted P S2 Dosimetry + safety module first Interpreting radiographs Diagnosis DVM — Assistants flag technical quality only In-house lab test performance Permitted P S2 QC per Lab Academy Reporting/interpreting results to clients Diagnosis/prognosis territory DVM/CT — Assistants relay only DVM-approved statements Filling prescriptions per DVM order (counting/labeling) Permitted with verification P S2 CVT/DVM verifies before dispensing Prescribing, dose selection, plan changes Prohibited DVM — Never Controlled-substance log entries Permitted per DEA registrant procedure HP S2 Witness signature per policy Euthanasia solution administration Prohibited for assistants DVM (CVT only under specific conditions, per rule) — Never CPR compressions/BLS support Permitted P S1 Per RECOVER roles Cystocentesis Needle into body cavity — treat as CVT/DVM CT — Assist only Client education (approved scripts) Permitted, non-diagnostic P S3 Approved topics list only Maintenance Annual verification against vetboard.az.gov Statutes &amp; Rules; immediate row review on any Board rule change; every row change is a MAJOR revision requiring medical review. Research log: Regulatory_Research_Log.md ."}, {"id": "periop", "title": "Perioperative pathways & tiers", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08 directive · Doctrine: <strong>teach the medicine deeply, then separately define what each role may DO with it.</strong> Role scope limits action, never understanding. The Academy serves advanced VAs AND credentialed technicians from one shared curriculum with layered application levels — a technician uncomfortable with anesthesia should leave this academy transformed; a competent technician should find meaningful advanced development, not beginner review (prerequisite testing routes them past mastered material).</p>\n<h3>The three layers (applied per module)</h3>\n<p><strong>ADVANCED VA LAYER</strong> — application focus: preparation, equipment mastery, patient observation, the five-beat monitoring loop, trend recognition, artifact discrimination, documentation, equipment troubleshooting, communication/escalation, recovery vigilance, anticipation. May physically check probes/leads/cuffs/circuit connections while reporting. May never: adjust vaporizer/APL/flows, administer/push drugs, intubate (CVAH policy), extubate, or make depth calls.</p>\n<p><strong>TECHNICIAN DEVELOPMENT LAYER</strong> — everything above plus deeper application within CVT scope and hospital protocol: integrated physiologic reasoning (why this hypotension, in this patient, on these drugs), anesthetic-depth assessment and adjustment under DVM direction, ventilation support, pharmacology at working depth (expected effects, interactions, reversal logic), advanced troubleshooting ownership (machine faults, difficult airway equipment prep), perioperative planning participation, crisis response roles per RECOVER ALS support. Delivered via the same modules' \"technician extension\" blocks + separate case discussions with the DVM.</p>\n<p><strong>DVM-CONTROLLED LAYER</strong> — explicitly named in every module: protocol selection, drug/dose decisions, depth prescriptions, intervention orders, crisis treatment decisions. The curriculum TEACHES why these decisions work (so monitoring anticipates them); it never delegates them.</p>\n<h3>Perioperative competency tiers (promotion by demonstrated competency, never hours)</h3>\n<div class=\"tw\"><table><thead><tr><th>Tier</th><th>Standard (all required)</th><th>Typical role</th></tr></thead><tbody><tr><td><strong>T1 Perioperative Foundation</strong></td><td>Core graduate; <span class=\"id\">CSC-SUR-01</span> signed; <span class=\"id\">TS-SUR-STER-001</span> ≥9; sterile-conscience drill 100% catch; room setup/turnover practical</td><td>Prep-bay + circulator</td></tr><tr><td><strong>T2 Anesthesia Assistant</strong></td><td>T1 + <span class=\"id\">TS-ANE-101</span> (machine check) signed incl. staged faults; airway kit staging drill; monitor placement (<span class=\"id\">TS-ANE-102</span>); induction/recovery support cases ×5 countersigned; <span class=\"id\">QB-ANES</span> equipment items ≥85%</td><td>Setup, induction support, recovery sitter under direction</td></tr><tr><td><strong>T3 Anesthesia Monitor</strong></td><td>T2 + <span class=\"id\">CSC-ANE-01</span> mastery: <span class=\"id\">PA-ANES-MON-001</span> passed; <span class=\"id\">SIM-ANES</span> library ≥85% incl. all \"what doesn't fit\" items; waveform set ≥85%; 15-case log with variety per Case_Log_Anesthesia schema; artifact-vs-real live drill</td><td>The trained second-eyes on every anesthetized patient</td></tr><tr><td><strong>T4 Advanced Perioperative (VA) / Technician Development (CVT)</strong></td><td>T3 + advanced sim set (crisis recognition) ≥85%; full perioperative practical (<span class=\"id\">PA-PERIOP-EXAM</span>); VA track: credential granted here. CVT track: adds technician-extension assessments (depth/ventilation/pharm application cases reviewed by DVM) per scope</td><td>VA: credentialed perioperative assistant. CVT: documented advanced development</td></tr></tbody></table></div>\n<p>Prerequisite testing: any entrant may challenge T1–T2 content by exam + practical demonstration; experienced CVTs typically enter at T3 coursework directly. Nobody sits through mastered material; nobody skips unproven material.</p>", "text": "Version 1.0 · 2026-08 directive · Doctrine: teach the medicine deeply, then separately define what each role may DO with it. Role scope limits action, never understanding. The Academy serves advanced VAs AND credentialed technicians from one shared curriculum with layered application levels — a technician uncomfortable with anesthesia should leave this academy transformed; a competent technician should find meaningful advanced development, not beginner review (prerequisite testing routes them past mastered material). The three layers (applied per module) ADVANCED VA LAYER — application focus: preparation, equipment mastery, patient observation, the five-beat monitoring loop, trend recognition, artifact discrimination, documentation, equipment troubleshooting, communication/escalation, recovery vigilance, anticipation. May physically check probes/leads/cuffs/circuit connections while reporting. May never: adjust vaporizer/APL/flows, administer/push drugs, intubate (CVAH policy), extubate, or make depth calls. TECHNICIAN DEVELOPMENT LAYER — everything above plus deeper application within CVT scope and hospital protocol: integrated physiologic reasoning (why this hypotension, in this patient, on these drugs), anesthetic-depth assessment and adjustment under DVM direction, ventilation support, pharmacology at working depth (expected effects, interactions, reversal logic), advanced troubleshooting ownership (machine faults, difficult airway equipment prep), perioperative planning participation, crisis response roles per RECOVER ALS support. Delivered via the same modules' \"technician extension\" blocks + separate case discussions with the DVM. DVM-CONTROLLED LAYER — explicitly named in every module: protocol selection, drug/dose decisions, depth prescriptions, intervention orders, crisis treatment decisions. The curriculum TEACHES why these decisions work (so monitoring anticipates them); it never delegates them. Perioperative competency tiers (promotion by demonstrated competency, never hours) Tier Standard (all required) Typical role T1 Perioperative Foundation Core graduate; CSC-SUR-01 signed; TS-SUR-STER-001 ≥9; sterile-conscience drill 100% catch; room setup/turnover practical Prep-bay + circulator T2 Anesthesia Assistant T1 + TS-ANE-101 (machine check) signed incl. staged faults; airway kit staging drill; monitor placement ( TS-ANE-102 ); induction/recovery support cases ×5 countersigned; QB-ANES equipment items ≥85% Setup, induction support, recovery sitter under direction T3 Anesthesia Monitor T2 + CSC-ANE-01 mastery: PA-ANES-MON-001 passed; SIM-ANES library ≥85% incl. all \"what doesn't fit\" items; waveform set ≥85%; 15-case log with variety per Case_Log_Anesthesia schema; artifact-vs-real live drill The trained second-eyes on every anesthetized patient T4 Advanced Perioperative (VA) / Technician Development (CVT) T3 + advanced sim set (crisis recognition) ≥85%; full perioperative practical ( PA-PERIOP-EXAM ); VA track: credential granted here. CVT track: adds technician-extension assessments (depth/ventilation/pharm application cases reviewed by DVM) per scope VA: credentialed perioperative assistant. CVT: documented advanced development Prerequisite testing: any entrant may challenge T1–T2 content by exam + practical demonstration; experienced CVTs typically enter at T3 coursework directly. Nobody sits through mastered material; nobody skips unproven material."}, {"id": "qa", "title": "QA report", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08-17 · Auditor stance: independent-style review against charter §59 criteria. Verdict: <strong>build is deployment-ready pending the localization gates listed in Findings-Open</strong> (all are Phase-A items, by design).</p>\n<h3>Clinical accuracy</h3>\n<p>Checked: physiology claims in W3-01/<span class=\"id\">ANE-M1</span>/<span class=\"id\">ANE-L1</span>/L2 against standard texts; RECOVER 2024 numbers (100–120, 1/3–1/2 lateral, 30:2 non-intubated, ~10 breaths/min intubated) against the 2024 guideline publications; scope statements against A.R.S. § 32-2281 language. <strong>Fixed during build:</strong> <span class=\"id\">QB-CORE-ASM-002</span> malformed answer key (format error) corrected; jugular draw direction left as a house-standardization input rather than asserting a universal convention. <strong>Open (by design):</strong> every numeric band on <span class=\"id\">CRC-001</span>/003 is a DRAFT requiring DVM approval — the system refuses to treat them as clinical truth until signed; final citation pinning (edition/page) happens at medical review per Source Library discipline.</p>\n<h3>Legal scope</h3>\n<p>All task classifications trace to scope-matrix rows; no lesson instructs diagnosis/prognosis/prescription/surgery; supervision levels explicit on every granted state; \"independent\" appears only inside the defined passport phrase. <strong>Open:</strong> rows flagged HP/CT (IV push, intubation, dental polishing, cysto) need CVAH policy decisions + Board-rule verification at deployment — deliberately not pre-decided here.</p>\n<h3>Technical education</h3>\n<p>28 full skill specs cover every safety-critical core skill; each carries stop criteria, escalation, critical fails, troubleshooting, repetition rationale. <strong>Gap accepted + tracked:</strong> 47 inventoried skills await full specs (template + metadata exist; manifest schedules them across rollout months 1–2, prioritized by VA1→VA2 order); Lab Academy analyzer modules blocked on equipment survey by design.</p>\n<h3>Instructional quality</h3>\n<p>Every lesson carries objectives→instruction→check alignment; knowledge checks answer-keyed; passive-learning bounded (10–25 min lessons, floor-first weeks 3–4); duplication used only deliberately (spaced retrieval in weekly quizzes). <strong>Fixed:</strong> none needed beyond format. <strong>Open:</strong> recognition battery media (28 of 40 items) and video/interactive assets exist as complete production specs, not finished media — production queue ordered in 20_LMS.</p>\n<h3>LMS</h3>\n<p>Deployment guide, structure map, conversion pipeline, conditional-release wiring, and portability guardrails specified; no broken internal references found on final link-sweep (file-name check run across repo ng DVM approval — the system refuses to treat them as clinical truth until signed; final citation pinning (edition/page) happens at medical review per Source Library discipline. Legal scope All task classifications trace to scope-matrix rows; no lesson instructs diagnosis/prognosis/prescription/surgery; supervision levels explicit on every granted state; \"independent\" appears only inside the defined passport phrase. Open: rows flagged HP/CT (IV push, intubation, dental polishing, cysto) need CVAH policy decisions + Board-rule verification at deployment — deliberately not pre-decided here. Technical education 28 full skill specs cover every safety-critical core skill; each carries stop criteria, escalation, critical fails, troubleshooting, repetition rationale. Gap accepted + tracked: 47 inventoried skills await full specs (template + metadata exist; manifest schedules them across rollout months 1–2, prioritized by VA1→VA2 order); Lab Academy analyzer modules blocked on equipment survey by design. Instructional quality Every lesson carries objectives→instruction→check alignment; knowledge checks answer-keyed; passive-learning bounded (10–25 min lessons, floor-first weeks 3–4); duplication used only deliberately (spaced retrieval in weekly quizzes). Fixed: none needed beyond format. Open: recognition battery media (28 of 40 items) and video/interactive assets exist as complete production specs, not finished media — production queue ordered in 20_LMS. LMS Deployment guide, structure map, conversion pipeline, conditional-release wiring, and portability guardrails specified; no broken internal references found on final link-sweep (file-name check run across repo). Open: actual Moodle instance is a Phase-B activity; GIFT conversion script to be run at import (format designed regex-convertible). Operations Daily rhythm sized to ≥45 protected minutes; assessor flow designed to 60-second standard with sanctioned fallback; 16-week outer window and remediation culture documented; workload metrics defined measurably. Open: protected-time commitment and assessor assignment are management decisions (Questionnaire B7–B8). Monday-morning test Pass, conditional on Phase A approvals: Week 0–1 is runnable with printed materials alone if the LMS lags. Corrections log Date Item Class Action 2026-08-17 QB-CORE-ASM-002 key format instructional fixed in-build 2026-08-17 CRC numeric values clinical-governance forced to DRAFT/pending-approval state 2026-08-17 Jugular direction convention clinical converted to house-standardization input"}], "crc": [{"title": "CRC-001 · Vital-sign bands", "html": "<p>Version 0.9-draft · Drafted 2026-08-17 · Reviewing veterinarian: ________ · Next review: 12 months post-approval · Sources: McCurnin's (current ed.) reference ranges; hospital population adjustments by reviewing DVM.</p>\n<p>Draft starting values for DVM review (adult, resting, in-hospital context; DVM to adjust/confirm every cell and add pediatric/geriatric rows):</p>\n<div class=\"tw\"><table><thead><tr><th>Parameter</th><th>Canine (draft)</th><th>Feline (draft)</th><th>Report-now bands (draft)</th></tr></thead><tbody><tr><td>Temperature °F</td><td>100.0–102.5</td><td>100.0–102.5</td><td>&lt;99.0 or &gt;103.5 (any); &gt;104.5 = urgent</td></tr><tr><td>Heart rate bpm</td><td>70–120 (size-dependent; DVM to band by weight)</td><td>160–220</td><td>Canine &lt;60 or &gt;160; feline &lt;140 or &gt;240; any pulse deficit</td></tr><tr><td>Respiratory rate rpm</td><td>15–30</td><td>20–30</td><td>&gt;40 at rest, any labored effort, open-mouth (cat)</td></tr><tr><td>CRT</td><td>&lt;2 s</td><td>&lt;2 s</td><td>&gt;2 s</td></tr><tr><td>MM</td><td>pink, moist</td><td>pink, moist</td><td>pale/white/blue/brick-red/icteric</td></tr></tbody></table></div>\n<p>Instruction: values apply to resting patients; note stress artifacts; TREND rules from lessons apply regardless of bands.</p>"}, {"title": "CRC-002 · CPR quick reference", "html": "<p>Version 0.9-draft · Drafted 2026-08-17 · Reviewing veterinarian: ________ · Next review: on RECOVER guideline update or 24 months · Sources: RECOVER 2024 Guidelines (recoverinitiative.org; JVECC 2024 BLS/ALS papers).</p>\n<p><strong>Recognition→start:</strong> unresponsive + not breathing normally → announce arrest, start compressions immediately.</p>\n<p><strong>Compressions:</strong> 100–120/min · lateral recumbency default · depth 1/3–1/2 chest width (lateral) · full recoil · 2-min uninterrupted cycles · swap compressor each cycle · conformation techniques: round-chest = highest point; keel-chest = over heart; barrel/bulldog = consider dorsal per lead; cats/small = one-hand circumferential or two-finger.</p>\n<p><strong>Ventilation:</strong> not intubated = 30:2 with tight mask · intubated (CVT/DVM secures airway) = continuous compressions + ~10 breaths/min, avoid hyperventilation.</p>\n<p><strong>Team:</strong> closed-loop repeats · recorder logs all events timestamped · EtCO2 trend = compression-quality feedback; sharp rise = possible ROSC → announce.</p>\n<p><strong>Drugs/defibrillation:</strong> DVM/CVT domain — dosing chart posted on cart (DVM-approved separately).</p>"}, {"title": "CRC-003 · Anesthesia alert thresholds", "html": "<p>Version 0.9-draft · Drafted 2026-08-17 · Reviewing veterinarian: ________ · Next review: 12 months post-approval · Sources: ACVAA small-animal monitoring guidelines; veterinary anesthesia texts; reviewing DVM's case-default preferences.</p>\n<p>Default REPORT-NOW bands for monitoring support staff (the anesthetist may set case-specific bands that override; assistants report at whichever is tighter). DVM to confirm every value:</p>\n<div class=\"tw\"><table><thead><tr><th>Parameter</th><th>Draft default band</th></tr></thead><tbody><tr><td>HR canine</td><td>&lt;60 or &gt;140 (size-adjusted by DVM)</td></tr><tr><td>HR feline</td><td>&lt;120 or &gt;200</td></tr><tr><td>MAP</td><td>&lt;60 mmHg (or Doppler systolic &lt;90) — and any steady downtrend</td></tr><tr><td>SpO2</td><td>&lt;95% (any waveform quality — report includes waveform description)</td></tr><tr><td>EtCO2</td><td>&lt;25 or &gt;55 mmHg; inspired CO2 &gt;0 persistent; any waveform loss/shape change</td></tr><tr><td>Temp</td><td>&lt;97.5°F or falling &gt;1°F/30 min; &gt;103°F</td></tr><tr><td>Also always</td><td>apnea &gt;30 s; bag/chest discrepancy; MM/CRT change; depth-sign changes; any equipment fault</td></tr></tbody></table></div>"}, {"title": "CRC-005 · Crash cart checklist", "html": "<p>Version 0.9-draft · 2026-08-17 · Reviewing veterinarian: ________ · Audit cadence: weekly + after every use · Sources: RECOVER equipment recommendations; hospital stock decisions.</p>\n<p>Airway: laryngoscope (light TESTED) · ET tubes sized run (2.5–11 house range <code>[CONFIRM]</code>) · stylets · ties · cuff syringe · lube. Breathing: ambu bag · masks ×3 sizes · O2 key/wrench. Circulation: catheters 18–24 g ×2 each · T-ports primed-ready · flushes · tape · fluids + sets staged. Drugs: sealed drug box (CVT/DVM stocked; assistant verifies SEAL + expiry sweep only) · dosing chart (DVM-approved, versioned) present. Other: suction functional · ECG electrodes/gel · sharps · recorder clipboard + code sheets · gloves. Audit line: date · initials · seal intact Y/N · expiry sweep clear Y/N · deficiencies→reported to ________ before signing.</p>"}], "trouble": [["No flash on venipuncture", "Withdraw to just under the skin, re-palpate, redirect once — that is still the same attempt. Never sweep the needle side-to-side underground.", "csc-ven01"], ["Flash, then flow stops", "Drop the angle flat, advance 1–2 mm, rotate a quarter-turn, ease the plunger. Two cycles with nothing = attempt over.", "csc-ven01"], ["Catheter won't thread", "Advance the unit 1 mm more and flatten; slight rotation while threading. If it still resists, remove catheter AND stylet together — never re-advance over the stylet.", "csc-ivc01"], ["Flush meets resistance", "Stop. Never force. Check limb position, aspirate gently, report. Forcing can fire a clot or push fluid subcutaneously.", "csc-ivc01"], ["Is it infiltration or phlebitis?", "Cool, doughy, swelling, sluggish flush = infiltration. Warm, red, cord-like, painful on flush = phlebitis. Both get reported; phlebitis usually gets a removal order.", "csc-ivc01"], ["Pump keeps alarming occlusion", "Trace the line first: kink, closed clamp, positional limb — then the site. Never silence and walk, never raise the pressure limit.", "csc-flu01"], ["Air-in-line alarm", "Clamp, disconnect at the port per protocol, re-prime or replace the set. Never open the door and flick bubbles toward the patient.", "csc-flu01"], ["Pump says delivered, bag says otherwise", "Stop and trace — a free path or mis-loaded set. Pumps count volume pushed, not where it went.", "csc-flu01"], ["Smear has no feathered edge", "Angle too steep or drop too big. Lower the spreader angle, smaller drop, remake.", "csc-ven01"], ["Sample came back hemolyzed", "Usually operator-side: aspirating too hard, needle-through-stopper transfer, or shaking. Gentle and prompt beats fast.", "csc-ven01"], ["Cat starts open-mouth breathing", "Stop immediately, release the position, alert the CVT. This is decompensation, not stress that settles.", "csc-res02"], ["Cat won't come out of the carrier", "Take the top off; work in the bottom half with a towel. Never dump, never drag.", "csc-res02"], ["Dog is frozen and staring", "That is closer to a bite than a growling dog. Decompress, slow down, replan — do not push through.", "csc-res01"], ["EtCO2 just went flat", "Hands on patient and circuit NOW while you announce it. SpO2 stays falsely reassuring for minutes on oxygen.", "csc-ane01"], ["Capnogram baseline won't return to zero", "Rebreathing — exhausted absorbent, stuck valve, or inadequate fresh gas. Report; the anesthetist acts.", "csc-ane01"], ["SpO2 low but waveform is ragged", "Report AND reposition the probe — simultaneously, never silently. If a new site agrees, it was never artifact.", "csc-ane01"], ["ECG looks chaotic but the pulse is fine", "Check electrode contact, fix it, and still report what you found. Artifact is explained, never assumed.", "csc-ane01"], ["Blood pressure reading looks wrong", "Patient check, then technique check (cuff width ≈ 40% of limb circumference), then repeat one cycle. Report the number with your verification attached.", "csc-ane01"], ["Post-extubation noisy breathing", "Stridor = airway narrowing. Emergency-tier report, oxygen, re-intubation kit at hand. Brachycephalics obstruct late.", "csc-ane01"], ["How do I open a sterile pack?", "Check integrity and indicators, first flap away from you, touch only outer surfaces, never reach over the field. Doubt = contaminated, declare it.", "rub-compact"], ["Whiteboard and record disagree on the surgical site", "Full stop. Nothing gets clipped until the DVM resolves it.", "csc-sur01"], ["Clipper blade feels hot", "Swap or cool it, check the skin, report any lesion you find or cause. Concealment is the offense, not the burn.", "csc-sur01"], ["How many attempts do I get?", "Two, then hand off — counted per person, not per site or per patient. Anyone may call a stop at any time.", "csc-ven01"], ["What can an assistant legally do in Arizona?", "Anything delegated except diagnosis, prognosis, prescription, and surgery — under DVM supervision. CVAH policy may restrict further.", "scope"]], "gate": [["Assign the four roles", "Program administrator, medical reviewer (DVM), assessors (CVT/DVM), supervising techs.", "roles", "30 min"], ["Approve the reference cards", "Medical director reviews and signs CRC-001, 002, 003, 005. Until signed they stay watermarked and unusable.", null, "2 h"], ["Decide the scope policy column", "Especially: may assistants place IV catheters here? Plus IV push, intubation, dental polishing.", "scope", "1 h"], ["Verify the statute rows", "Check the scope matrix against current text at vetboard.az.gov and log it.", "scope", "1 h"], ["Fill the local-input items", "44 flagged facts and decisions across the curriculum — equipment models, products, protocols.", null, "1 h"], ["Run the equipment survey", "Walk the hospital with a phone camera; record analyzer, pump, machine, and imaging models.", null, "1 h"], ["Calibrate your assessors", "Two assessors score the same performance and compare. Gaps over 2 points get discussed.", "rub-std", "half day"]]};

/* ---------- navigation ---------- */
function buildNav(){
  const n = $('#nav'); n.innerHTML = '';
  GROUPS.forEach(g => {
    const items = g === 'Start'
      ? [{id:'start',title:'Start here',meta:'first 5 hours'},{id:'find',title:'Find it fast',meta:'symptom index'},{id:'passport',title:'Passport states',meta:'1 → 14'}]
      : g === 'Reference' ? [{id:'cards',title:'Clinical reference cards',meta:'gated'}]
      : DATA.docs.filter(d => d.group === g);
    if(!items.length) return;
    const h = document.createElement('h3'); h.textContent = g; n.appendChild(h);
    items.forEach(d => {
      const b = document.createElement('button');
      b.dataset.id = d.id;
      b.innerHTML = esc(d.title) + (d.meta ? '<span class="meta">'+esc(d.meta)+'</span>' : '');
      b.onclick = () => show(d.id);
      n.appendChild(b);
    });
  });
}

  else if(id === 'passport') v.innerHTML = passportPage();

  else {

      <p class="sub">${esc(d.group)}${d.meta?' · '+esc(d.meta):''}</p>${d.html}</div>`;
  }
  document.querySelectorAll('nav button').forEach(b =>

  $('#nav').classList.remove('open');

    for(const el of v.querySelectorAll('p,li,td,h2,h3,blockquote')){

    }
  }
}

/* ---------- search ---------- */
function snippet(text, q){
  const needle = q.toLowerCase();
  const i = text.toLowerCase().indexOf(needle);
  const s = i < 0 ? 0 : Math.max(0, i - 60);
  const end = i < 0 ? 150 : i + q.length + 110;
  let rest = (s ? '…' : '') + text.slice(s, end) + '…', out = '';
  while(needle){
    const k = rest.toLowerCase().indexOf(needle);
    if(k < 0) break;
    out += esc(rest.slice(0,k)) + '<mark>' + esc(rest.slice(k, k + q.length)) + '</mark>';
    rest = rest.slice(k + q.length);
  }
  return out + esc(rest);
}
function search(q){
  const box = $('#results');
  if(q.trim().length < 2){ box.hidden = true; box.innerHTML = ''; return; }
  const needle = q.trim().toLowerCase();
  const hits = [];
  DATA.trouble.forEach(t => {
    if((t[0]+' '+t[1]).toLowerCase().includes(needle))
      hits.push({id:t[2], title:t[0], group:'Find it fast', snip:snippet(t[1], q.trim()), q:t[0]});
  });
  DATA.docs.forEach(d => {
    const inTitle = d.title.toLowerCase().includes(needle);
    const at = d.text.toLowerCase().indexOf(needle);
    if(inTitle || at >= 0)
      hits.push({id:d.id, title:d.title, group:d.group, snip:snippet(d.text, q.trim()), q:q.trim(), rank:inTitle?0:1});
  });
  hits.sort((a,b)=>(a.rank??0)-(b.rank??0));
  box.hidden = false;
  box.innerHTML = hits.length
    ? `<p class="sub">${hits.length} match${hits.length>1?'es':''} for “${esc(q.trim())}”</p>` +
      hits.slice(0,40).map(h=>`<button class="res" data-go="${h.id}" data-q="${esc(h.q)}">
        <b>${esc(h.title)}</b><span class="g">${esc(h.group)}</span><p>${h.snip}</p></button>`).join('')
    : `<p class="empty">Nothing matches “${esc(q.trim())}”. Try a symptom in plain words — “swollen leg”, “no flash”, “alarm”.</p>`;
}

  if(e.target.closest('[data-print]')){ window.print(); return; }
  if(e.target.closest('[data-back]')){ show('start'); return; }
  const rev = e.target.closest('[data-rev]');
  if(rev){ rev.closest('.crc').classList.add('open'); rev.remove(); return; }
  const gate = e.target.closest('ol.gate input');
  if(gate){
    const li = gate.closest('li'), i = +li.dataset.i;
    let done = JSON.parse(localStorage.getItem('cvah_gate') || '[]');
    done = gate.checked ? [...new Set([...done, i])] : done.filter(x => x !== i);
    localStorage.setItem('cvah_gate', JSON.stringify(done));
    li.classList.toggle('done', gate.checked);
    const pct = Math.round(done.length / DATA.gate.length * 100);
    const bar = document.querySelector('.prog i'); if(bar) bar.style.width = pct + '%';
  }
});
$('#q').addEventListener('input', e => search(e.target.value));
$('#q').addEventListener('focus', e => { if(e.target.value.trim().length>1 && $('#results').hidden) search(e.target.value); });
$('#navtoggle').addEventListener('click', e => {
  const n = $('#nav'), open = n.classList.toggle('open');
  e.target.setAttribute('aria-expanded', String(open));
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key === 'Escape'){ $('#q').value = ''; search(''); }
});

buildNav();
show('start');
</script>
