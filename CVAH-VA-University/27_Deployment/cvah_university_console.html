kes Screen-first monitoring — the hypnotized clipboard. Prevention: Beat 1 is muscle memory before your first live case (drilled in sim). 2. Recording without reading — perfect penmanship, no idea the MAP has fallen 20 points over four entries. Prevention: Beat 3's compare-against-three rule. 3. Silent troubleshooting — the four quiet minutes that become the incident report's centerpiece. 4. Artifact-calling by preference — \"probably the probe\" because that's the comfortable world. Prevention: the test-the-theory-out-loud rule. 5. Backfilled records — fiction with a time stamp. 6. Threshold worship — waiting at 61 for a band set at 60 while the slope screams. 7. Speaking too softly to interrupt — the report that wasn't heard didn't happen; closed-loop it (\"did you catch that MAP?\"). 11. Pearls &amp; banned folklore PEARLS: Narrate your first cases aloud quietly — anesthetists correct narration in real time and you learn triple-speed. · Put your watch/timer where the record sheet is; cycles drift late during surgeon-interesting moments, which are exactly the moments monitoring matters. · Calibrate your finger against the monitor every case (the pulse-vs-number game) — in a year your finger will be the best sensor in the room. · During quiet stretches, pre-read the NEXT likely event (closing = lightening; moving to rads = disconnection risk) and stage your attention. · Learn each anesthetist's briefing style and ask for bands up front; being briefed well is a skill you can cause. BANNED: touching the vaporizer/APL/flowmeter uninstructed, ever, including \"just turning it down while she's clearly light\" (report instead — depth is a prescription); silencing any alarm without a stated reason; \"she's fine, she's just deep\" as a self-issued diagnosis; leaving your station without a named replacement watching (\"thirty seconds\" is how recovery deaths start). 12. Visual assets VID-ANE-103 storyboard (the five-beat loop performed in real time on a real case; the artifact-vs-real split screens: clean vs ragged pleth at the same SpO2 value; flat capnograph with the hands-on check sequence). INT-A3 capnogram library (12 waveforms). SIM-ANES-001 ..006 trend cases are this course's examination hall — plus the expanded library ( SIM-ANES-007 +) in the Academy. 13. Assessment &amp; competency links Knowledge: QB-ANES (rewritten; SC 100%) + waveform set ≥85%. Practical: PA-ANES-MON-001 (live case + staged drill; silent-troubleshooting and dial-touching are critical fails). Case log: 10 monitored cases (≥3 procedure types, ≥1 long dental) with anesthetist sign-per-case before assessment. Reviews: R1: added the five-beat loop as one memorizable cycle, report-while-checking doctrine, finger-calibration game. R2: every beat has a where-do-I-look answer; report sentences are given as templates. R3: hospital gains a second set of trained eyes on every anesthetized patient — the specific gap CEPSAF-type mortality data says kills: unwatched patients in \"quiet\" phases."}, {"id": "lsn-w0-01", "title": "W0-01 · Orientation Baseline", "group": "Lessons", "meta": "Week 0", "html": "<p><strong>Why this matters:</strong> We train to competency, not to calendar. Today we find out where you're starting from, so we never waste your time re-teaching what you can already prove — and never assume anything you can't yet prove.</p>\n<p><strong>Objectives:</strong> explain how the University works (levels, passport states, three questions of competence); complete the diagnostic pretest honestly; complete the prior-experience inventory; know your Week-1 schedule.</p>\n<p><strong>Core instruction:</strong> How you graduate: nine gates, none of them \"time served\" (walk through <code>Graduation_Requirements</code> in learner language). The Competency Passport: your skills move through named states — you can always see exactly where you stand and what evidence moves you forward. The Three Questions: <em>Can you explain it? Can you do it? Can you recognize when it's going wrong?</em> All three, for every skill, always. Remediation here is normal and unstigmatized — extra practice is how motor skills work, not a verdict on you. The 2-attempt rule and stop-calling: anyone can call \"stop\" on any procedure, including you, including on your first day, including on the medical director.</p>\n<p><strong>Activities today:</strong> 1) Diagnostic pretest (<code>13_Assessments/Diagnostic_Pretest.md</code>) — scores route your personalized plan; guessing well helps nobody, least of all you. 2) Prior-experience inventory: list clinical skills you've performed before, where, roughly how many times. Anything listed can be <strong>challenge-tested</strong> — demonstrate it, skip the training. Claimed experience is verified, never grandfathered. 3) Passport walkthrough with the Program Administrator. 4) Facility tour with map handout: crash cart location (memorize today), exits, eyewash, sharps containers, isolation, O2 shutoffs.</p>\n<p><strong>Knowledge check:</strong> 1) What graduates you — time or gates? (<em>Gates: all nine, whenever you meet them.</em>) 2) You listed 200 blood draws at a previous job. What happens? (<em>You can challenge-test: pass the knowledge check ≥90% and the practical assessment directly.</em>) 3) Who may call \"stop\" during a procedure? (<em>Anyone. No rank in stop-calls.</em>)</p>\n<p><strong>Competency connection:</strong> passport initialized; all skills → state 1–2. <strong>Key takeaways:</strong> competency-based; passport is yours; honesty at baseline buys you speed. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: We train to competency, not to calendar. Today we find out where you're starting from, so we never waste your time re-teaching what you can already prove — and never assume anything you can't yet prove. Objectives: explain how the University works (levels, passport states, three questions of competence); complete the diagnostic pretest honestly; complete the prior-experience inventory; know your Week-1 schedule. Core instruction: How you graduate: nine gates, none of them \"time served\" (walk through Graduation_Requirements in learner language). The Competency Passport: your skills move through named states — you can always see exactly where you stand and what evidence moves you forward. The Three Questions: Can you explain it? Can you do it? Can you recognize when it's going wrong? All three, for every skill, always. Remediation here is normal and unstigmatized — extra practice is how motor skills work, not a verdict on you. The 2-attempt rule and stop-calling: anyone can call \"stop\" on any procedure, including you, including on your first day, including on the medical director. Activities today: 1) Diagnostic pretest ( 13_Assessments/Diagnostic_Pretest.md ) — scores route your personalized plan; guessing well helps nobody, least of all you. 2) Prior-experience inventory: list clinical skills you've performed before, where, roughly how many times. Anything listed can be challenge-tested — demonstrate it, skip the training. Claimed experience is verified, never grandfathered. 3) Passport walkthrough with the Program Administrator. 4) Facility tour with map handout: crash cart location (memorize today), exits, eyewash, sharps containers, isolation, O2 shutoffs. Knowledge check: 1) What graduates you — time or gates? ( Gates: all nine, whenever you meet them. ) 2) You listed 200 blood draws at a previous job. What happens? ( You can challenge-test: pass the knowledge check ≥90% and the practical assessment directly. ) 3) Who may call \"stop\" during a procedure? ( Anyone. No rank in stop-calls. ) Competency connection: passport initialized; all skills → state 1–2. Key takeaways: competency-based; passport is yours; honesty at baseline buys you speed. Version: 1.0 2026-08-17."}, {"id": "lsn-w0-02", "title": "W0-02 · Hospital Safety", "group": "Lessons", "meta": "Week 0", "html": "<p><strong>Why this matters:</strong> Your safety gates everything else — an injured assistant helps no patients. This module's assessment requires 100%.</p>\n<p><strong>Objectives:</strong> locate and use safety equipment; state sharps rules; state bite/scratch protocol; identify zoonotic risks; read an SDS; state anesthetic-gas and radiation basics (awareness level).</p>\n<p><strong>Core instruction:</strong> <strong>Sharps:</strong> never recap by hand; sharps container within arm's reach BEFORE any needle is uncapped; container swapped at fill line, never pressed down. <strong>Bite/scratch protocol:</strong> stop, wash immediately (soap, running water, minutes not seconds), report to supervisor SAME shift, document per OSHA log, medical evaluation per policy — cat bites especially are medical events, not badges of toughness. <strong>Zoonoses awareness:</strong> ringworm, leptospirosis, toxoplasmosis (pregnant-staff counseling point), scabies, roundworm/hookworm, rabies (vaccination status policy <code>[CVAH-SPECIFIC INPUT REQUIRED]</code>); the defense is boring: gloves, hand hygiene, PPE per task, no eating in treatment. <strong>Chemicals:</strong> SDS binder/portal location; formalin handling (fume awareness, spill kit); disinfectant dilution discipline. <strong>Anesthetic gases:</strong> scavenging exists to protect YOU; report smell of agent; pregnant-staff policy pointer. <strong>Radiation:</strong> awareness now, full module Week 5 — never in the room during exposure until trained and badged. <strong>Ergonomics/animal handling injuries:</strong> lift with help ≥ house weight limit <code>[CVAH-SPECIFIC INPUT REQUIRED]</code>; floor work posture; never catch a falling patient with your back.</p>\n<p><strong>What doesn't look right?</strong> Overfilled sharps container; recapped needle in trash; colleague rinsing a bite for two seconds and moving on; propped-open isolation door. <strong>Escalation:</strong> every injury reported same shift, no exceptions; near-misses reported too (they're free lessons).</p>\n<p><strong>Clinical case:</strong> A coworker gets a minor cat scratch, says \"it's nothing,\" keeps working. Two days later: swollen hand, urgent care, out for a week. What should have happened in the first five minutes? (<em>Wash thoroughly, report, document, evaluate — cellulitis from cat scratches escalates fast.</em>)</p>\n<p><strong>Knowledge check (100% required):</strong> 1) When may you recap a needle by hand? (<em>Never.</em>) 2) First two actions after any bite? (<em>Immediate thorough wash; report same shift.</em>) 3) Where is the SDS collection? (<em>[location — tour answer].</em>) 4) When may you be in the X-ray room during exposure? (<em>Only after radiation-safety training and badging, and only when your presence is required with full PPE.</em>)</p>\n<p><strong>Competency connection:</strong> prerequisite to everything; feeds <span class=\"id\">TS-SAN-001</span>/002. <strong>References:</strong> OSHA bloodborne/sharps standards; NIOSH veterinary safety guidance; AAHA safety resources. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Your safety gates everything else — an injured assistant helps no patients. This module's assessment requires 100%. Objectives: locate and use safety equipment; state sharps rules; state bite/scratch protocol; identify zoonotic risks; read an SDS; state anesthetic-gas and radiation basics (awareness level). Core instruction: Sharps: never recap by hand; sharps container within arm's reach BEFORE any needle is uncapped; container swapped at fill line, never pressed down. Bite/scratch protocol: stop, wash immediately (soap, running water, minutes not seconds), report to supervisor SAME shift, document per OSHA log, medical evaluation per policy — cat bites especially are medical events, not badges of toughness. Zoonoses awareness: ringworm, leptospirosis, toxoplasmosis (pregnant-staff counseling point), scabies, roundworm/hookworm, rabies (vaccination status policy [CVAH-SPECIFIC INPUT REQUIRED] ); the defense is boring: gloves, hand hygiene, PPE per task, no eating in treatment. Chemicals: SDS binder/portal location; formalin handling (fume awareness, spill kit); disinfectant dilution discipline. Anesthetic gases: scavenging exists to protect YOU; report smell of agent; pregnant-staff policy pointer. Radiation: awareness now, full module Week 5 — never in the room during exposure until trained and badged. Ergonomics/animal handling injuries: lift with help ≥ house weight limit [CVAH-SPECIFIC INPUT REQUIRED] ; floor work posture; never catch a falling patient with your back. What doesn't look right? Overfilled sharps container; recapped needle in trash; colleague rinsing a bite for two seconds and moving on; propped-open isolation door. Escalation: every injury reported same shift, no exceptions; near-misses reported too (they're free lessons). Clinical case: A coworker gets a minor cat scratch, says \"it's nothing,\" keeps working. Two days later: swollen hand, urgent care, out for a week. What should have happened in the first five minutes? ( Wash thoroughly, report, document, evaluate — cellulitis from cat scratches escalates fast. ) Knowledge check (100% required): 1) When may you recap a needle by hand? ( Never. ) 2) First two actions after any bite? ( Immediate thorough wash; report same shift. ) 3) Where is the SDS collection? ( [location — tour answer]. ) 4) When may you be in the X-ray room during exposure? ( Only after radiation-safety training and badging, and only when your presence is required with full PPE. ) Competency connection: prerequisite to everything; feeds TS-SAN-001 /002. References: OSHA bloodborne/sharps standards; NIOSH veterinary safety guidance; AAHA safety resources. Version: 1.0 2026-08-17."}, {"id": "lsn-w0-03", "title": "W0-03 · Scope Conduct PatientID", "group": "Lessons", "meta": "Week 0", "html": "<p><strong>Why this matters:</strong> Knowing what you may NOT do is as load-bearing as any skill. And the single most catastrophic error class in hospitals is treating the wrong patient.</p>\n<p><strong>Objectives:</strong> state the four things Arizona law reserves absolutely; explain supervision levels S1–S3; use two-identifier patient checks every time; state confidentiality basics.</p>\n<p><strong>Core instruction:</strong> <strong>Arizona scope:</strong> as a veterinary assistant you may perform delegated duties <strong>other than diagnosis, prognosis, prescription, or surgery</strong>, under the direct or indirect supervision of a veterinarian who is responsible for your performance (A.R.S. § 32-2281). Practical translation: you never tell a client what a condition is, what will happen, or what drug fixes it; you never alter a treatment; nothing you do here is surgery. CVAH policy further restricts some legal-ceiling tasks — your passport + scope matrix are the truth, and \"may perform\" always names a supervision level: S1 (supervisor physically present, directly overseeing), S2 (on premises, quickly available), S3 (instructions given, reachable). When in doubt: ask. Asking is a competency, not a weakness — it's literally on your rubrics. <strong>Patient ID:</strong> two identifiers, every interaction: patient name + client last name (or hospital ID band/cage card ID). Verbalize at procedure start (\"This is Bella Chen for a nail trim?\"). Litter-mates, same-breed boarders, and \"the other black lab\" are how wrong-patient events happen. Cage card + patient + record must agree before anything touches the patient; any mismatch = full stop until resolved. <strong>Conduct:</strong> confidentiality (cases discussed only for care, never socially/socially-media); clients hear observations only in approved language; professional appearance/phone policy per handbook.</p>\n<p><strong>Knowledge check (100% on items 1–2):</strong> 1) The four absolute exclusions? (<em>Diagnosis, prognosis, prescription, surgery.</em>) 2) Cage card says \"Max Jones,\" record open on screen says \"Max Johnson.\" You were told to give Max his pill. Do you? (<em>No — full stop, resolve the mismatch first.</em>) 3) A client asks \"is it cancer?\" You suspect the mass looked bad. Response? (<em>\"That's a question for Dr. X — I'll make sure they talk with you.\"</em>)</p>\n<p><strong>Competency connection:</strong> <span class=\"id\">TS-DOC-001</span>; scope matrix literacy; feeds every PA (ID check is universally scored). <strong>References:</strong> A.R.S. § 32-2281; A.A.C. R3-11; scope matrix. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Knowing what you may NOT do is as load-bearing as any skill. And the single most catastrophic error class in hospitals is treating the wrong patient. Objectives: state the four things Arizona law reserves absolutely; explain supervision levels S1–S3; use two-identifier patient checks every time; state confidentiality basics. Core instruction: Arizona scope: as a veterinary assistant you may perform delegated duties other than diagnosis, prognosis, prescription, or surgery , under the direct or indirect supervision of a veterinarian who is responsible for your performance (A.R.S. § 32-2281). Practical translation: you never tell a client what a condition is, what will happen, or what drug fixes it; you never alter a treatment; nothing you do here is surgery. CVAH policy further restricts some legal-ceiling tasks — your passport + scope matrix are the truth, and \"may perform\" always names a supervision level: S1 (supervisor physically present, directly overseeing), S2 (on premises, quickly available), S3 (instructions given, reachable). When in doubt: ask. Asking is a competency, not a weakness — it's literally on your rubrics. Patient ID: two identifiers, every interaction: patient name + client last name (or hospital ID band/cage card ID). Verbalize at procedure start (\"This is Bella Chen for a nail trim?\"). Litter-mates, same-breed boarders, and \"the other black lab\" are how wrong-patient events happen. Cage card + patient + record must agree before anything touches the patient; any mismatch = full stop until resolved. Conduct: confidentiality (cases discussed only for care, never socially/socially-media); clients hear observations only in approved language; professional appearance/phone policy per handbook. Knowledge check (100% on items 1–2): 1) The four absolute exclusions? ( Diagnosis, prognosis, prescription, surgery. ) 2) Cage card says \"Max Jones,\" record open on screen says \"Max Johnson.\" You were told to give Max his pill. Do you? ( No — full stop, resolve the mismatch first. ) 3) A client asks \"is it cancer?\" You suspect the mass looked bad. Response? ( \"That's a question for Dr. X — I'll make sure they talk with you.\" ) Competency connection: TS-DOC-001 ; scope matrix literacy; feeds every PA (ID check is universally scored). References: A.R.S. § 32-2281; A.A.C. R3-11; scope matrix. Version: 1.0 2026-08-17."}, {"id": "lsn-w1-01", "title": "W1-01 · Hospital Flow Terminology", "group": "Lessons", "meta": "Week 1", "html": "<p><strong>Why this matters:</strong> You become useful the day you can follow a normal conversation in treatment without stopping it.</p>\n<p><strong>Objectives:</strong> trace a patient's path (check-in → room → treatment → diagnostics → discharge/hospitalization); define the ~60 highest-frequency terms/abbreviations; read the whiteboard/schedule; know who does what (DVM/CVT/VA/CSR lanes).</p>\n<p><strong>Core instruction:</strong> Walk the patient journey with a floor map: what the CSR hands off, what happens in the room (history, exam, plan), how orders become treatment-area tasks, where diagnostics flow (lab bench, imaging), how hospitalization vs discharge branches. <strong>Terminology core set (full glossary appendix + flashcard deck <span class=\"id\">INT-01</span>):</strong> TPR, NPO, BAR/QAR, ADR, SQ/IM/IV/PO/OU-OS-OD/AU-AS-AD, SID/BID/TID/QID (and why \"SID\" confuses human pharmacists), CBC/chem/UA, PCV/TS, cysto, rads, sx, dental prophy, pre-med, induction, recovery, recheck, e-collar, DOA/CPR/DNR code status, hx/dx/tx/rx (and which of those are never yours). <strong>Roles:</strong> the delegation chain — DVM owns diagnosis/plan; CVT executes advanced delegated care; you execute your passport-granted skills; CSR owns client flow. You take clinical direction from DVM/CVT, schedule direction from your manager.</p>\n<p><strong>Common mistakes:</strong> guessing at an abbreviation instead of asking (a guessed \"SID vs BID\" is a med error waiting); answering client medical questions in the hallway. <strong>What doesn't look right?</strong> An order that seems wrong for the patient in front of you (giant-dog dose on a kitten chart) — asking beats assuming, every time.</p>\n<p><strong>Knowledge check:</strong> 1) NPO means? (<em>Nothing by mouth.</em>) 2) TID dosing is how many hours apart? (<em>~8.</em>) 3) A treatment says \"0.5 mL SQ\" but you can't read the drug. Action? (<em>Ask the writer; never guess or administer unverified.</em>)</p>\n<p><strong>Practical assignment:</strong> shadow a full appointment cycle; produce your own flow sketch; terminology deck to 90%. <strong>Competency connection:</strong> foundation for <span class=\"id\">TS-DOC-001</span>, <span class=\"id\">TS-COM-001</span>. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: You become useful the day you can follow a normal conversation in treatment without stopping it. Objectives: trace a patient's path (check-in → room → treatment → diagnostics → discharge/hospitalization); define the ~60 highest-frequency terms/abbreviations; read the whiteboard/schedule; know who does what (DVM/CVT/VA/CSR lanes). Core instruction: Walk the patient journey with a floor map: what the CSR hands off, what happens in the room (history, exam, plan), how orders become treatment-area tasks, where diagnostics flow (lab bench, imaging), how hospitalization vs discharge branches. Terminology core set (full glossary appendix + flashcard deck INT-01 ): TPR, NPO, BAR/QAR, ADR, SQ/IM/IV/PO/OU-OS-OD/AU-AS-AD, SID/BID/TID/QID (and why \"SID\" confuses human pharmacists), CBC/chem/UA, PCV/TS, cysto, rads, sx, dental prophy, pre-med, induction, recovery, recheck, e-collar, DOA/CPR/DNR code status, hx/dx/tx/rx (and which of those are never yours). Roles: the delegation chain — DVM owns diagnosis/plan; CVT executes advanced delegated care; you execute your passport-granted skills; CSR owns client flow. You take clinical direction from DVM/CVT, schedule direction from your manager. Common mistakes: guessing at an abbreviation instead of asking (a guessed \"SID vs BID\" is a med error waiting); answering client medical questions in the hallway. What doesn't look right? An order that seems wrong for the patient in front of you (giant-dog dose on a kitten chart) — asking beats assuming, every time. Knowledge check: 1) NPO means? ( Nothing by mouth. ) 2) TID dosing is how many hours apart? ( ~8. ) 3) A treatment says \"0.5 mL SQ\" but you can't read the drug. Action? ( Ask the writer; never guess or administer unverified. ) Practical assignment: shadow a full appointment cycle; produce your own flow sketch; terminology deck to 90%. Competency connection: foundation for TS-DOC-001 , TS-COM-001 . Version: 1.0 2026-08-17."}, {"id": "lsn-w1-02", "title": "W1-02 · Canine Feline Handling", "group": "Lessons", "meta": "Week 1", "html": "<p><strong>Why this matters:</strong> Handling is the platform under every other skill you will ever learn here — and the main way staff get hurt and patients get sensitized.</p>\n<p><strong>Objectives:</strong> read canine/feline stress signals and name the escalation ladder; perform safe approach; apply low-stress fundamentals; know muzzle/towel indications; state when restraint is becoming unsafe.</p>\n<p><strong>Core instruction:</strong> Delivered with <strong><span class=\"id\">CSC-RES-01</span>/<span class=\"id\">CSC-RES-02</span></strong> (the teaching courses) plus skill spec <strong><span class=\"id\">TS-HND-001</span></strong>; demonstration schedule for <span class=\"id\">TS-RES-001</span>/002 this week. Signal ladders: <em>canine</em> — lip lick/yawn/look-away → whale eye/freeze/tuck → growl/snap → bite (each rung skipped by us pushes the patient down the ladder faster next visit); <em>feline</em> — ears rotate/flatten, pupils blow, tail lash, crouch-freeze → hiss/swat → explode. The handling triangle: environment (quiet, non-slip, escape-audited), technique (least restraint that achieves stillness), and timing (procedures batched — one good hold, three tasks). Muzzles: indication is risk, application is calm and brief, basket vs sleeve, never on vomiting/dyspneic patients. Towels: burrito variants demonstrated live. Carrier disassembly beats extraction.</p>\n<p><strong>Visual teaching:</strong> <span class=\"id\">INT-07</span> body-language image set (20 photos, drag label→signal); <span class=\"id\">VID-HND-001</span>, <span class=\"id\">VID-RES-001</span>/002.</p>\n<p><strong>What doesn't look right?</strong> \"He's fine\" while the dog is frozen with whale eye (he is not fine); a cat pupil-blown and silent (the explosion is pre-paid); three people leaning on one small dog (plan failed — stop, rethink: sedation is a kindness conversation for the DVM, not a defeat).</p>\n<p><strong>Escalation:</strong> red-line signals → CVT before contact; any bite/scratch → W0-02 protocol; any patient needing &gt;2 handlers → DVM sedation conversation.</p>\n<p><strong>Clinical case:</strong> Fractious-cat room: carrier dumped, cat explodes, escapes into cabinets, 40 minutes lost, everyone scratched, cat now unexaminable — replay it correctly. (<em>Towel ready, top-off carrier disassembly, exam largely in carrier bottom, minimal fixation, batched procedures.</em>)</p>\n<p><strong>Knowledge check:</strong> 1) First three canine appeasement signals to name on sight? (<em>Lip lick, yawn, look-away — any of the early set.</em>) 2) When is scruffing a cat the CVAH default? (<em>It isn't — towel techniques first.</em>) 3) Restraint is becoming unsafe when…? (<em>Escalating panic, open-mouth breathing/cyanosis, anyone calls stop, plan requires force to continue.</em>)</p>\n<p><strong>Practical assignment:</strong> 5 coached approaches (mixed temperaments), 2 towel wraps, observe 1 muzzle application. <strong>Competency connection:</strong> <span class=\"id\">TS-HND-001</span> → state 5; <span class=\"id\">TS-RES-001</span>/002 → state 4. <strong>References:</strong> low-stress handling literature (Yin); Fear Free modules (licensed separately if hospital subscribes); AAHA behavior guidelines. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Handling is the platform under every other skill you will ever learn here — and the main way staff get hurt and patients get sensitized. Objectives: read canine/feline stress signals and name the escalation ladder; perform safe approach; apply low-stress fundamentals; know muzzle/towel indications; state when restraint is becoming unsafe. Core instruction: Delivered with CSC-RES-01 / CSC-RES-02 (the teaching courses) plus skill spec TS-HND-001 ; demonstration schedule for TS-RES-001 /002 this week. Signal ladders: canine — lip lick/yawn/look-away → whale eye/freeze/tuck → growl/snap → bite (each rung skipped by us pushes the patient down the ladder faster next visit); feline — ears rotate/flatten, pupils blow, tail lash, crouch-freeze → hiss/swat → explode. The handling triangle: environment (quiet, non-slip, escape-audited), technique (least restraint that achieves stillness), and timing (procedures batched — one good hold, three tasks). Muzzles: indication is risk, application is calm and brief, basket vs sleeve, never on vomiting/dyspneic patients. Towels: burrito variants demonstrated live. Carrier disassembly beats extraction. Visual teaching: INT-07 body-language image set (20 photos, drag label→signal); VID-HND-001 , VID-RES-001 /002. What doesn't look right? \"He's fine\" while the dog is frozen with whale eye (he is not fine); a cat pupil-blown and silent (the explosion is pre-paid); three people leaning on one small dog (plan failed — stop, rethink: sedation is a kindness conversation for the DVM, not a defeat). Escalation: red-line signals → CVT before contact; any bite/scratch → W0-02 protocol; any patient needing &gt;2 handlers → DVM sedation conversation. Clinical case: Fractious-cat room: carrier dumped, cat explodes, escapes into cabinets, 40 minutes lost, everyone scratched, cat now unexaminable — replay it correctly. ( Towel ready, top-off carrier disassembly, exam largely in carrier bottom, minimal fixation, batched procedures. ) Knowledge check: 1) First three canine appeasement signals to name on sight? ( Lip lick, yawn, look-away — any of the early set. ) 2) When is scruffing a cat the CVAH default? ( It isn't — towel techniques first. ) 3) Restraint is becoming unsafe when…? ( Escalating panic, open-mouth breathing/cyanosis, anyone calls stop, plan requires force to continue. ) Practical assignment: 5 coached approaches (mixed temperaments), 2 towel wraps, observe 1 muzzle application. Competency connection: TS-HND-001 → state 5; TS-RES-001 /002 → state 4. References: low-stress handling literature (Yin); Fear Free modules (licensed separately if hospital subscribes); AAHA behavior guidelines. Version: 1.0 2026-08-17."}, {"id": "lsn-w1-03", "title": "W1-03 · Restraint Skills Floor Week", "group": "Lessons", "meta": "Week 1", "html": "<p><strong>Why this matters:</strong> This is your first \"workload transfer\" week: a signed-off restrainer frees a technician at every single procedure.</p>\n<p><strong>Objectives:</strong> perform lateral, sternal, and standing restraint to spec; begin venipuncture-positioning holds; integrate stop-calling.</p>\n<p><strong>Core instruction:</strong> This is a floor-first lesson: the content IS the skill specs — read <strong><span class=\"id\">TS-RES-001</span>, <span class=\"id\">TS-RES-002</span>, <span class=\"id\">TS-RES-003</span></strong> before the floor block. Online portion covers only the decision layer: <em>which position for which task</em> (lateral: rads, saphenous draws, some wound care; sternal: cephalic draws, jugular in cats, exams, most feline anything; standing: temp, SQ, abdominal palpation) and <em>position risk profiles</em> (lateral = worst for dyspnea; jugular positioning = airway watch; sternal = default-safe). Load-sharing with the phlebotomist: the holder owns the patient's comfort, airway watch, and the occlusion; the phlebotomist owns the stick; either can call stop.</p>\n<p><strong>Troubleshooting live (coached):</strong> the sit-collapse in standing restraint; the head-whip in sternal; the paddle-escape in lateral — each drilled with an instructor-played \"patient\" before real patients.</p>\n<p><strong>Knowledge check:</strong> 1) Dyspneic cat needs a blood sample — which positions are OFF the table without DVM input? (<em>Lateral and any jugular extension; minimal-restraint sternal/medial saphenous conversation with CVT/DVM first.</em>) 2) During a hold the phlebotomist says \"release\" — what exactly do you release? (<em>Occlusion only; restraint continues until the needle is out and site pressure established.</em>)</p>\n<p><strong>Practical assignment (this week's floor targets):</strong> RES-001 ≥5 canine + ≥3 feline coached; RES-002 ≥5 each posture; RES-003 ≥4 coached holds. Log everything. <strong>Competency connection:</strong> targets state 5–7 by Friday; <span class=\"id\">PA-RES-001</span> scheduled Week 2. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: This is your first \"workload transfer\" week: a signed-off restrainer frees a technician at every single procedure. Objectives: perform lateral, sternal, and standing restraint to spec; begin venipuncture-positioning holds; integrate stop-calling. Core instruction: This is a floor-first lesson: the content IS the skill specs — read TS-RES-001 , TS-RES-002 , TS-RES-003 before the floor block. Online portion covers only the decision layer: which position for which task (lateral: rads, saphenous draws, some wound care; sternal: cephalic draws, jugular in cats, exams, most feline anything; standing: temp, SQ, abdominal palpation) and position risk profiles (lateral = worst for dyspnea; jugular positioning = airway watch; sternal = default-safe). Load-sharing with the phlebotomist: the holder owns the patient's comfort, airway watch, and the occlusion; the phlebotomist owns the stick; either can call stop. Troubleshooting live (coached): the sit-collapse in standing restraint; the head-whip in sternal; the paddle-escape in lateral — each drilled with an instructor-played \"patient\" before real patients. Knowledge check: 1) Dyspneic cat needs a blood sample — which positions are OFF the table without DVM input? ( Lateral and any jugular extension; minimal-restraint sternal/medial saphenous conversation with CVT/DVM first. ) 2) During a hold the phlebotomist says \"release\" — what exactly do you release? ( Occlusion only; restraint continues until the needle is out and site pressure established. ) Practical assignment (this week's floor targets): RES-001 ≥5 canine + ≥3 feline coached; RES-002 ≥5 each posture; RES-003 ≥4 coached holds. Log everything. Competency connection: targets state 5–7 by Friday; PA-RES-001 scheduled Week 2. Version: 1.0 2026-08-17."}, {"id": "lsn-w1-04", "title": "W1-04 · Sanitation Infection Control", "group": "Lessons", "meta": "Week 1", "html": "<p><strong>Why this matters:</strong> Hospital-acquired infection travels on hands, mops, and shortcuts. Turnover speed with NO cross-contamination is a real skill the hospital feels immediately.</p>\n<p><strong>Objectives:</strong> perform exam-room turnover to spec; explain clean-before-disinfect and contact time; don/doff isolation PPE in order; manage laundry/waste streams.</p>\n<p><strong>Core instruction:</strong> Delivered with <strong><span class=\"id\">TS-SAN-001</span></strong> (read first). Additions: <strong>hand hygiene doctrine</strong> — between every patient, after gloves, before clean tasks; gloves replace nothing. <strong>PPE order:</strong> don gown → mask/eye pro (per case) → gloves; doff gloves → hygiene → gown → hygiene (doffing is where self-contamination happens — slow is clean). <strong>Waste streams:</strong> sharps / biohazard / regular / laundry (heavily soiled bagged at source); cytotoxic-drug handling awareness (Pharmacy Academy deepens). <strong>The pathogen tier concept:</strong> everyday organisms vs protocol-changers (parvo, panleuk, ringworm, kennel-cough cluster, lepto urine) — you don't diagnose them, you RECOGNIZE the flag on the record/board and switch workflows.</p>\n<p><strong>What doesn't look right?</strong> Isolation door propped; mop bucket touring the whole building; spray-wipe-done in 4 seconds; parvo-suspect walked through the lobby (<em>should have been carried/side-door per protocol</em>).</p>\n<p><strong>Clinical case:</strong> Puppy with vomiting/diarrhea was roomed in exam 2 before parvo suspicion was raised. You cleaned it \"normal.\" It's now 2 hours later and the board says parvo-positive. What now? (<em>Report immediately; room out of service; full protocol-level clean with designated agent + contact time; trace what else you touched: door handles, scale, leash hooks; hygiene audit of yourself; no shame — but the earlier the report the smaller the trace.</em>)</p>\n<p><strong>Knowledge check (100%):</strong> 1) Disinfectant works only when? (<em>Applied to a pre-cleaned surface for full labeled contact time.</em>) 2) Doffing order? (<em>Gloves → hand hygiene → gown → hygiene [mask/eye per protocol].</em>) 3) Which common pathogen laughs at quats? (<em>Parvovirus [and ringworm spores] — designated agent required.</em>)</p>\n<p><strong>Practical assignment:</strong> 3 timed-but-scored room turnovers; 1 supervised isolation don/doff; find every sharps container on the map from memory. <strong>Competency connection:</strong> <span class=\"id\">TS-SAN-001</span> → state 7; <span class=\"id\">TS-SAN-002</span> → state 5. <strong>References:</strong> disinfectant labels; AAHA infection control; hospital SOP. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Hospital-acquired infection travels on hands, mops, and shortcuts. Turnover speed with NO cross-contamination is a real skill the hospital feels immediately. Objectives: perform exam-room turnover to spec; explain clean-before-disinfect and contact time; don/doff isolation PPE in order; manage laundry/waste streams. Core instruction: Delivered with TS-SAN-001 (read first). Additions: hand hygiene doctrine — between every patient, after gloves, before clean tasks; gloves replace nothing. PPE order: don gown → mask/eye pro (per case) → gloves; doff gloves → hygiene → gown → hygiene (doffing is where self-contamination happens — slow is clean). Waste streams: sharps / biohazard / regular / laundry (heavily soiled bagged at source); cytotoxic-drug handling awareness (Pharmacy Academy deepens). The pathogen tier concept: everyday organisms vs protocol-changers (parvo, panleuk, ringworm, kennel-cough cluster, lepto urine) — you don't diagnose them, you RECOGNIZE the flag on the record/board and switch workflows. What doesn't look right? Isolation door propped; mop bucket touring the whole building; spray-wipe-done in 4 seconds; parvo-suspect walked through the lobby ( should have been carried/side-door per protocol ). Clinical case: Puppy with vomiting/diarrhea was roomed in exam 2 before parvo suspicion was raised. You cleaned it \"normal.\" It's now 2 hours later and the board says parvo-positive. What now? ( Report immediately; room out of service; full protocol-level clean with designated agent + contact time; trace what else you touched: door handles, scale, leash hooks; hygiene audit of yourself; no shame — but the earlier the report the smaller the trace. ) Knowledge check (100%): 1) Disinfectant works only when? ( Applied to a pre-cleaned surface for full labeled contact time. ) 2) Doffing order? ( Gloves → hand hygiene → gown → hygiene [mask/eye per protocol]. ) 3) Which common pathogen laughs at quats? ( Parvovirus [and ringworm spores] — designated agent required. ) Practical assignment: 3 timed-but-scored room turnovers; 1 supervised isolation don/doff; find every sharps container on the map from memory. Competency connection: TS-SAN-001 → state 7; TS-SAN-002 → state 5. References: disinfectant labels; AAHA infection control; hospital SOP. Version: 1.0 2026-08-17."}, {"id": "lsn-w1-05", "title": "W1-05 · TPR", "group": "Lessons", "meta": "Week 1", "html": "<p><strong>Why this matters:</strong> TPR is the vital-sign backbone of every exam, every hospitalization, every anesthesia recovery. When your numbers are trusted, DVMs act on them — that's real transferred workload.</p>\n<p><strong>Objectives:</strong> acquire T, P (with quality/rhythm), R (with character) to spec; assess MM/CRT; recognize and report out-of-band values; document properly.</p>\n<p><strong>Core instruction:</strong> Read <strong><span class=\"id\">CSC-ASM-01</span></strong> (the teaching course; <span class=\"id\">TS-ASM-001</span> governs) first; floor blocks daily this week. Online adds the <em>why</em>: what temperature does across conditions (fever vs hyperthermia vs the stress-bump); why pulse quality and synchrony matter (a pulse deficit means beats aren't perfusing); respiratory character as the earliest free warning (effort/abdominal push/noise beat the number); the stress-artifact problem (count R first, from distance; note purring/panting). Normal bands come from card <strong><span class=\"id\">CRC-001</span></strong> (posted; DVM-approved) — the lesson teaches you to USE the card, not memorize folklore.</p>\n<p><strong>Visual/interactive:</strong> heart &amp; lung sound audio set <span class=\"id\">INT-09</span> (count-along drills with answer reveal); CRT technique video clip in <span class=\"id\">VID-ASM-001</span>.</p>\n<p><strong>What doesn't look right?</strong> HR 60 in a stressed cat in hospital (<em>that's not calm, that's concerning — report</em>); \"panting\" recorded as R=200; temp 105.2°F charted at 9am and nobody told anyone until rounds (<em>out-of-band = report NOW</em>).</p>\n<p><strong>Clinical case:</strong> Post-op dachshund, recovery check: T 96.8°F, shivering, QAR. Junior assistant charts it and moves on. What was missed? (<em>Hypothermia is an active recovery problem — warming + report; recovery TPRs are action items, not paperwork.</em>)</p>\n<p><strong>Knowledge check:</strong> 1) Why count R before handling? (<em>Handling/stress elevates rate — you'd record an artifact.</em>) 2) Pulse deficit means? (<em>Heartbeats without corresponding femoral pulses — report.</em>) 3) Where do CVAH's normal bands live? (<em><span class=\"id\">CRC-001</span> card — versioned, DVM-approved.</em>)</p>\n<p><strong>Practical assignment:</strong> ≥10 coached TPRs this week (≥3 feline), values cross-checked against trainer's within tolerance. <strong>Competency connection:</strong> <span class=\"id\">TS-ASM-001</span> → state 6–7; <span class=\"id\">PA-ASM-TPR-001</span> target early Week 2. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: TPR is the vital-sign backbone of every exam, every hospitalization, every anesthesia recovery. When your numbers are trusted, DVMs act on them — that's real transferred workload. Objectives: acquire T, P (with quality/rhythm), R (with character) to spec; assess MM/CRT; recognize and report out-of-band values; document properly. Core instruction: Read CSC-ASM-01 (the teaching course; TS-ASM-001 governs) first; floor blocks daily this week. Online adds the why : what temperature does across conditions (fever vs hyperthermia vs the stress-bump); why pulse quality and synchrony matter (a pulse deficit means beats aren't perfusing); respiratory character as the earliest free warning (effort/abdominal push/noise beat the number); the stress-artifact problem (count R first, from distance; note purring/panting). Normal bands come from card CRC-001 (posted; DVM-approved) — the lesson teaches you to USE the card, not memorize folklore. Visual/interactive: heart &amp; lung sound audio set INT-09 (count-along drills with answer reveal); CRT technique video clip in VID-ASM-001 . What doesn't look right? HR 60 in a stressed cat in hospital ( that's not calm, that's concerning — report ); \"panting\" recorded as R=200; temp 105.2°F charted at 9am and nobody told anyone until rounds ( out-of-band = report NOW ). Clinical case: Post-op dachshund, recovery check: T 96.8°F, shivering, QAR. Junior assistant charts it and moves on. What was missed? ( Hypothermia is an active recovery problem — warming + report; recovery TPRs are action items, not paperwork. ) Knowledge check: 1) Why count R before handling? ( Handling/stress elevates rate — you'd record an artifact. ) 2) Pulse deficit means? ( Heartbeats without corresponding femoral pulses — report. ) 3) Where do CVAH's normal bands live? ( CRC-001 card — versioned, DVM-approved. ) Practical assignment: ≥10 coached TPRs this week (≥3 feline), values cross-checked against trainer's within tolerance. Competency connection: TS-ASM-001 → state 6–7; PA-ASM-TPR-001 target early Week 2. Version: 1.0 2026-08-17."}, {"id": "lsn-w1-06", "title": "W1-06 · Documentation Communication", "group": "Lessons", "meta": "Week 1", "html": "<p><strong>Why this matters:</strong> Your observations only become medicine when they land in the record and in the right ear, in time.</p>\n<p><strong>Objectives:</strong> write compliant treatment entries in the PIMS; use approved abbreviations only; deliver an SBAR-V verbal report; know what never goes in a record.</p>\n<p><strong>Core instruction:</strong> Read <strong><span class=\"id\">TS-DOC-001</span></strong> and <strong><span class=\"id\">TS-COM-001</span></strong> (they are the content); PIMS click-path appendix <code>[CVAH-SPECIFIC INPUT REQUIRED: screenshots per house PIMS]</code>. Practice layer online: five entry makeovers (vague → compliant), e.g. \"did meds\" → \"08:05 cephalexin 500 mg PO given in food, ate fully, no emesis by 08:30. —JG\"; abbreviation quiz deck; SBAR-V builder interactive (<span class=\"id\">INT-02</span>: drag observation fragments into S/B/A/R/V slots, three scenarios).</p>\n<p><strong>What doesn't look right (record edition)?</strong> Entries timestamped in a neat block at 17:58; a treatment charted that you watched not happen (<em>that's the integrity cliff — report it, never mirror it</em>); diagnosis words in assistant entries (\"pyometra suspect\" vs the correct \"purulent vaginal discharge noted, Dr. K notified 10:14\").</p>\n<p><strong>Knowledge check:</strong> 1) When do you chart a treatment? (<em>At administration time — never before, never batch-later.</em>) 2) Correct fix for a wrong entry? (<em>Addendum per PIMS convention — never delete.</em>) 3) Build an SBAR-V from: post-op cat, gums pale, HR 200, was fine an hour ago. (<em>Model answer keyed in LMS: leads with patient/location, numbers, trend, \"come now,\" closes loop.</em>)</p>\n<p><strong>Practical assignment:</strong> 5 real entries co-signed by trainer; 1 live SBAR-V on a real (even boring) finding. <strong>Competency connection:</strong> <span class=\"id\">TS-DOC-001</span>, <span class=\"id\">TS-COM-001</span> → state 6–7; graduation gates 6–7 begin accumulating here. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Your observations only become medicine when they land in the record and in the right ear, in time. Objectives: write compliant treatment entries in the PIMS; use approved abbreviations only; deliver an SBAR-V verbal report; know what never goes in a record. Core instruction: Read TS-DOC-001 and TS-COM-001 (they are the content); PIMS click-path appendix [CVAH-SPECIFIC INPUT REQUIRED: screenshots per house PIMS] . Practice layer online: five entry makeovers (vague → compliant), e.g. \"did meds\" → \"08:05 cephalexin 500 mg PO given in food, ate fully, no emesis by 08:30. —JG\"; abbreviation quiz deck; SBAR-V builder interactive ( INT-02 : drag observation fragments into S/B/A/R/V slots, three scenarios). What doesn't look right (record edition)? Entries timestamped in a neat block at 17:58; a treatment charted that you watched not happen ( that's the integrity cliff — report it, never mirror it ); diagnosis words in assistant entries (\"pyometra suspect\" vs the correct \"purulent vaginal discharge noted, Dr. K notified 10:14\"). Knowledge check: 1) When do you chart a treatment? ( At administration time — never before, never batch-later. ) 2) Correct fix for a wrong entry? ( Addendum per PIMS convention — never delete. ) 3) Build an SBAR-V from: post-op cat, gums pale, HR 200, was fine an hour ago. ( Model answer keyed in LMS: leads with patient/location, numbers, trend, \"come now,\" closes loop. ) Practical assignment: 5 real entries co-signed by trainer; 1 live SBAR-V on a real (even boring) finding. Competency connection: TS-DOC-001 , TS-COM-001 → state 6–7; graduation gates 6–7 begin accumulating here. Version: 1.0 2026-08-17."}, {"id": "lsn-w2-01", "title": "W2-01 · Appointment Room Assisting", "group": "Lessons", "meta": "Week 2", "html": "<p><strong>Why this matters:</strong> A good room assistant makes every appointment 5 minutes shorter and every DVM's day measurably better. This is Week 2's core workload transfer.</p>\n<p><strong>Objectives:</strong> set up rooms per appointment type; run efficient patient intake (weight, TPR pre-exam per house flow); anticipate during exams; run productive room turnover in the gaps.</p>\n<p><strong>Core instruction:</strong> Room setup by appointment type (wellness: vaccines-anticipated tray, scale path clear; sick visit: sample supplies staged; recheck: prior notes cued for DVM). Intake choreography: weigh (record units the house uses — kg/lb discipline; a units mix-up is a real dosing hazard, always write the unit), TPR per your signed state, presenting-complaint capture in client's words (quoted, not interpreted: chart \"coughing all night per owner\" — you're a recorder here, not a filter). During exam: position/restrain per DVM ask; anticipate (otoscope handed before asked when the complaint is ears — watch the exam pattern, learn the sequence); capture verbal findings the DVM calls out if asked to scribe. After: room reset per <span class=\"id\">TS-SAN-001</span>, restock sweep.</p>\n<p><strong>Anticipation is learnable:</strong> the lesson includes the \"next-three-things\" drill — at any exam moment, name silently the three most likely next requests. Trainers quiz this live all week.</p>\n<p><strong>What doesn't look right?</strong> Vaccine drawn up before the DVM confirmed the plan (<em>never pre-draw before the order is real</em>); client left alone with an unrestrained fractious dog on a table; weight recorded with no unit.</p>\n<p><strong>Knowledge check:</strong> 1) Owner says \"he's been shaking his head.\" Chart it how? (<em>As a quote/attributed observation, verbatim-ish, no interpretation.</em>) 2) When may you pre-draw a vaccine? (<em>After the DVM's plan/order for THIS visit exists — not on habit.</em>) 3) The kg/lb rule? (<em>Always record the unit; know which the PIMS expects; mismatch = flag.</em>)</p>\n<p><strong>Practical assignment:</strong> run intake on ≥6 appointments; be scored once on the next-three-things drill. <strong>Competency connection:</strong> integrates HND/RES/ASM/DOC states; feeds VA1 grant. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: A good room assistant makes every appointment 5 minutes shorter and every DVM's day measurably better. This is Week 2's core workload transfer. Objectives: set up rooms per appointment type; run efficient patient intake (weight, TPR pre-exam per house flow); anticipate during exams; run productive room turnover in the gaps. Core instruction: Room setup by appointment type (wellness: vaccines-anticipated tray, scale path clear; sick visit: sample supplies staged; recheck: prior notes cued for DVM). Intake choreography: weigh (record units the house uses — kg/lb discipline; a units mix-up is a real dosing hazard, always write the unit), TPR per your signed state, presenting-complaint capture in client's words (quoted, not interpreted: chart \"coughing all night per owner\" — you're a recorder here, not a filter). During exam: position/restrain per DVM ask; anticipate (otoscope handed before asked when the complaint is ears — watch the exam pattern, learn the sequence); capture verbal findings the DVM calls out if asked to scribe. After: room reset per TS-SAN-001 , restock sweep. Anticipation is learnable: the lesson includes the \"next-three-things\" drill — at any exam moment, name silently the three most likely next requests. Trainers quiz this live all week. What doesn't look right? Vaccine drawn up before the DVM confirmed the plan ( never pre-draw before the order is real ); client left alone with an unrestrained fractious dog on a table; weight recorded with no unit. Knowledge check: 1) Owner says \"he's been shaking his head.\" Chart it how? ( As a quote/attributed observation, verbatim-ish, no interpretation. ) 2) When may you pre-draw a vaccine? ( After the DVM's plan/order for THIS visit exists — not on habit. ) 3) The kg/lb rule? ( Always record the unit; know which the PIMS expects; mismatch = flag. ) Practical assignment: run intake on ≥6 appointments; be scored once on the next-three-things drill. Competency connection: integrates HND/RES/ASM/DOC states; feeds VA1 grant. Version: 1.0 2026-08-17."}, {"id": "lsn-w2-02", "title": "W2-02 · Histories Observations", "group": "Lessons", "meta": "Week 2", "html": "<p><strong>Why this matters:</strong> DVMs decide with data; half the data is history and observation. Assistants who capture clean histories and notice real changes multiply the doctor.</p>\n<p><strong>Objectives:</strong> collect a structured preliminary history without leading; quantify observations; distinguish observation from interpretation; recognize red-flag answers that shortcut to escalation.</p>\n<p><strong>Core instruction:</strong> The house history frame (mirrors PIMS template): presenting complaint (client's words) → duration/course (better/worse/same) → appetite/water (quantified: \"half normal amount ×3 days\") → V/D/coughing/sneezing (character, frequency, last event) → urination changes → meds on board incl. OTC/human meds (\"anything from your medicine cabinet?\" catches the ibuprofen) → diet incl. treats/table → environment (indoor/out, other pets, travel, toxin access) → vaccines/preventives current? Ask open then closed (\"Tell me about his eating\" then \"how many meals did he finish yesterday?\"); never lead (\"He's not vomiting, right?\" teaches clients to say no). <strong>Red-flag answers that you escalate immediately, mid-history:</strong> male cat straining in litterbox (<em>urinary obstruction until proven otherwise — this is a now-emergency</em>); unproductive retching in a big dog (<em>GDV concern</em>); \"got into\" antifreeze/xylitol/rodenticide/grapes/human meds; labored breathing at rest; collapse; pale gums noticed by you at any point.</p>\n<p><strong>Observation vs interpretation drill:</strong> \"ataxic\" is DVM language when you mean \"wobbly in hind end, crossed legs twice walking to scale\" — write what you saw; the pattern-name belongs to the doctor.</p>\n<p><strong>Knowledge check:</strong> 1) Client mentions their male cat \"keeps going to the box, nothing comes out.\" Your move? (<em>Interrupt politely, alert DVM/CVT immediately — possible obstruction, time-critical.</em>) 2) Why are leading questions banned? (<em>They contaminate the data — clients agree with authority.</em>) 3) Rewrite as observation: \"dog is painful in abdomen.\" (<em>\"Tensed and vocalized when belly touched during positioning.\"</em>)</p>\n<p><strong>Practical assignment:</strong> 4 supervised histories; trainer scores the red-flag drill with 6 scripted client statements. <strong>Competency connection:</strong> <span class=\"id\">TS-COM-001</span>; recognition battery items seeded here. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: DVMs decide with data; half the data is history and observation. Assistants who capture clean histories and notice real changes multiply the doctor. Objectives: collect a structured preliminary history without leading; quantify observations; distinguish observation from interpretation; recognize red-flag answers that shortcut to escalation. Core instruction: The house history frame (mirrors PIMS template): presenting complaint (client's words) → duration/course (better/worse/same) → appetite/water (quantified: \"half normal amount ×3 days\") → V/D/coughing/sneezing (character, frequency, last event) → urination changes → meds on board incl. OTC/human meds (\"anything from your medicine cabinet?\" catches the ibuprofen) → diet incl. treats/table → environment (indoor/out, other pets, travel, toxin access) → vaccines/preventives current? Ask open then closed (\"Tell me about his eating\" then \"how many meals did he finish yesterday?\"); never lead (\"He's not vomiting, right?\" teaches clients to say no). Red-flag answers that you escalate immediately, mid-history: male cat straining in litterbox ( urinary obstruction until proven otherwise — this is a now-emergency ); unproductive retching in a big dog ( GDV concern ); \"got into\" antifreeze/xylitol/rodenticide/grapes/human meds; labored breathing at rest; collapse; pale gums noticed by you at any point. Observation vs interpretation drill: \"ataxic\" is DVM language when you mean \"wobbly in hind end, crossed legs twice walking to scale\" — write what you saw; the pattern-name belongs to the doctor. Knowledge check: 1) Client mentions their male cat \"keeps going to the box, nothing comes out.\" Your move? ( Interrupt politely, alert DVM/CVT immediately — possible obstruction, time-critical. ) 2) Why are leading questions banned? ( They contaminate the data — clients agree with authority. ) 3) Rewrite as observation: \"dog is painful in abdomen.\" ( \"Tensed and vocalized when belly touched during positioning.\" ) Practical assignment: 4 supervised histories; trainer scores the red-flag drill with 6 scripted client statements. Competency connection: TS-COM-001 ; recognition battery items seeded here. Version: 1.0 2026-08-17."}, {"id": "lsn-w2-03", "title": "W2-03 · Medication Foundations", "group": "Lessons", "meta": "Week 2", "html": "<p><strong>Why this matters:</strong> Medication error is the most preventable serious-harm class in the building — and prevention is mostly performed at YOUR step.</p>\n<p><strong>Objectives:</strong> recite and apply the five rights + documentation/response; read every field of a drug label; name routes and their abbreviations; perform the three core calculations; state your absolute limits (never select, never alter, never unverified).</p>\n<p><strong>Core instruction:</strong> Read <strong><span class=\"id\">TS-MED-001</span></strong> (the workflow spec). This lesson builds the knowledge layer: <strong>label anatomy</strong> (drug/generic vs brand; CONCENTRATION as the danger line — 5 mg/mL vs 50 mg/mL kills; expiry; storage; controlled-schedule marks). <strong>Routes:</strong> PO/SQ/IM/IV/topical/ophthalmic/otic/transdermal/rectal + why route changes effect and speed (educational only). <strong>Math block (mastery ≥90% required for VA2):</strong> (1) dose→volume: volume mL = dose mg ÷ concentration mg/mL; (2) tablets: tablets = dose ÷ strength (halves/quarters only when scored + order permits); (3) percent solutions awareness: X% = X g/100 mL (so 2% = 20 mg/mL) — you don't compound, you sanity-check. Estimation habit: before calculating, ballpark (\"about 2-and-a-bit mL\") — if calculator answer says 23 mL, your ballpark catches the slipped decimal. Worked set of 20 problems + <span class=\"id\">INT-03</span> randomized drill bank (unlimited practice, instant explanations).</p>\n<p><strong>What doesn't look right?</strong> A syringe on the counter with no label; an order for \"insulin 5 mL\" (<em>insulin doses in UNITS with matched U-40/U-100 syringes — mismatch is a classic disaster; flag any unit-odd order</em>); two drugs with near-identical names shelved adjacent.</p>\n<p><strong>Knowledge check (sample of the 20-problem set):</strong> 1) Order 75 mg, stock 50 mg/mL → mL? (<em>1.5 mL.</em>) 2) Order 12.5 mg, tablets 25 mg scored → ? (<em>Half tablet.</em>) 3) 2% lidocaine = ? mg/mL (<em>20 — awareness only, assistants don't draw anesthetics.</em>) 4) Your calculated volume is 10× your ballpark. Next move? (<em>Stop; recheck concentration line; re-verify with CVT — never administer through doubt.</em>)</p>\n<p><strong>Competency connection:</strong> <span class=\"id\">TS-MED-001</span> → state 3; math gate toward VA2. <strong>References:</strong> ISMP-adapted safety principles; Plumb's (educational paraphrase); house formulary. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Medication error is the most preventable serious-harm class in the building — and prevention is mostly performed at YOUR step. Objectives: recite and apply the five rights + documentation/response; read every field of a drug label; name routes and their abbreviations; perform the three core calculations; state your absolute limits (never select, never alter, never unverified). Core instruction: Read TS-MED-001 (the workflow spec). This lesson builds the knowledge layer: label anatomy (drug/generic vs brand; CONCENTRATION as the danger line — 5 mg/mL vs 50 mg/mL kills; expiry; storage; controlled-schedule marks). Routes: PO/SQ/IM/IV/topical/ophthalmic/otic/transdermal/rectal + why route changes effect and speed (educational only). Math block (mastery ≥90% required for VA2): (1) dose→volume: volume mL = dose mg ÷ concentration mg/mL; (2) tablets: tablets = dose ÷ strength (halves/quarters only when scored + order permits); (3) percent solutions awareness: X% = X g/100 mL (so 2% = 20 mg/mL) — you don't compound, you sanity-check. Estimation habit: before calculating, ballpark (\"about 2-and-a-bit mL\") — if calculator answer says 23 mL, your ballpark catches the slipped decimal. Worked set of 20 problems + INT-03 randomized drill bank (unlimited practice, instant explanations). What doesn't look right? A syringe on the counter with no label; an order for \"insulin 5 mL\" ( insulin doses in UNITS with matched U-40/U-100 syringes — mismatch is a classic disaster; flag any unit-odd order ); two drugs with near-identical names shelved adjacent. Knowledge check (sample of the 20-problem set): 1) Order 75 mg, stock 50 mg/mL → mL? ( 1.5 mL. ) 2) Order 12.5 mg, tablets 25 mg scored → ? ( Half tablet. ) 3) 2% lidocaine = ? mg/mL ( 20 — awareness only, assistants don't draw anesthetics. ) 4) Your calculated volume is 10× your ballpark. Next move? ( Stop; recheck concentration line; re-verify with CVT — never administer through doubt. ) Competency connection: TS-MED-001 → state 3; math gate toward VA2. References: ISMP-adapted safety principles; Plumb's (educational paraphrase); house formulary. Version: 1.0 2026-08-17."}, {"id": "lsn-w2-04", "title": "W2-04 · Sample Basics", "group": "Lessons", "meta": "Week 2", "html": "<p><strong>Why this matters:</strong> Diagnostics start with specimen quality. Ruined samples cost the client money, the patient time, and the team credibility.</p>\n<p><strong>Objectives:</strong> collect/receive free-catch urine properly; assist cysto positioning; handle fecal samples; prepare ear/skin cytology materials; label and store everything to spec.</p>\n<p><strong>Core instruction:</strong> <strong>Urine:</strong> free-catch mid-stream into clean container (client-brought \"clean jars\" get a fresh container transfer + a note); time collected matters (analysis within 30–60 min at room temp or refrigerate + note it — crystals and cells change with delay); first-morning concentrated sample preferred for some tests (per order). Cysto: DVM/CVT performs (scope class CT); YOUR role: positioning (dorsal/lateral per performer), restraint serenity, tube handoff. <strong>Fecal:</strong> fresh matters (motility/antigen), gram-size sample fine, refrigerate if delayed per lab directory, gloves + hygiene (zoonoses from W0-02 get real here). <strong>Cytology support:</strong> ear swabs — one swab per ear, LABELED per ear (AD/AS — sides differ, treatment differs); slides prepped per CVT direction (roll, don't smear-crush); skin: tape preps/impression smears staged, patient held still (the CVT's collection is only as good as your restraint). <strong>Universal law:</strong> label at patient-side; unlabeled = discard-level error (<span class=\"id\">TS-SAM-001</span> doctrine extends to every specimen).</p>\n<p><strong>What doesn't look right?</strong> Urine sitting on the counter since morning submitted at 4pm as fresh; two ear swabs in one hand, unlabeled (\"I remember which is which\" — no); fecal loop sample when the order wanted antigen-test volume.</p>\n<p><strong>Knowledge check:</strong> 1) Why does urine age matter? (<em>Cells lyse, crystals form/dissolve, bacteria multiply — results shift within the hour at room temp.</em>) 2) Ear cytology from both ears: handling rule? (<em>Separate, labeled per ear at collection.</em>) 3) Your role in cysto? (<em>Positioning + restraint + supplies — the needle belongs to CVT/DVM.</em>)</p>\n<p><strong>Practical assignment:</strong> process 3 urine, 2 fecal, assist 2 cytology collections. <strong>Competency connection:</strong> <span class=\"id\">TS-SAM-002</span>/003 → 5–6. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Diagnostics start with specimen quality. Ruined samples cost the client money, the patient time, and the team credibility. Objectives: collect/receive free-catch urine properly; assist cysto positioning; handle fecal samples; prepare ear/skin cytology materials; label and store everything to spec. Core instruction: Urine: free-catch mid-stream into clean container (client-brought \"clean jars\" get a fresh container transfer + a note); time collected matters (analysis within 30–60 min at room temp or refrigerate + note it — crystals and cells change with delay); first-morning concentrated sample preferred for some tests (per order). Cysto: DVM/CVT performs (scope class CT); YOUR role: positioning (dorsal/lateral per performer), restraint serenity, tube handoff. Fecal: fresh matters (motility/antigen), gram-size sample fine, refrigerate if delayed per lab directory, gloves + hygiene (zoonoses from W0-02 get real here). Cytology support: ear swabs — one swab per ear, LABELED per ear (AD/AS — sides differ, treatment differs); slides prepped per CVT direction (roll, don't smear-crush); skin: tape preps/impression smears staged, patient held still (the CVT's collection is only as good as your restraint). Universal law: label at patient-side; unlabeled = discard-level error ( TS-SAM-001 doctrine extends to every specimen). What doesn't look right? Urine sitting on the counter since morning submitted at 4pm as fresh; two ear swabs in one hand, unlabeled (\"I remember which is which\" — no); fecal loop sample when the order wanted antigen-test volume. Knowledge check: 1) Why does urine age matter? ( Cells lyse, crystals form/dissolve, bacteria multiply — results shift within the hour at room temp. ) 2) Ear cytology from both ears: handling rule? ( Separate, labeled per ear at collection. ) 3) Your role in cysto? ( Positioning + restraint + supplies — the needle belongs to CVT/DVM. ) Practical assignment: process 3 urine, 2 fecal, assist 2 cytology collections. Competency connection: TS-SAM-002 /003 → 5–6. Version: 1.0 2026-08-17."}, {"id": "lsn-w2-05", "title": "W2-05 · Inpatient Basics", "group": "Lessons", "meta": "Week 2", "html": "<p><strong>Why this matters:</strong> Hospitalized patients are watched by whoever is in the ward — which is often you. Week 2 makes you a safe pair of ward eyes and hands for the routine tier.</p>\n<p><strong>Objectives:</strong> read a treatment sheet fully; execute basic scheduled care (feeding per orders, walking, bedding, TPR checks) with initials discipline; give PO meds per <span class=\"id\">TS-MED-PO-001</span> as granted; recognize the \"different than an hour ago\" reflex; hand off properly.</p>\n<p><strong>Core instruction:</strong> Read <strong><span class=\"id\">TS-INP-001</span></strong> (spec) + <strong><span class=\"id\">TS-MED-PO-001</span></strong>. This lesson adds the routine-tier boundaries: which patients are yours at VA1–2 (stable, non-ICU, non-isolation until trained) and which never are yet; the feeding matrix (NPO flags, post-op timing per orders, \"ate?\" quantified); walking rules (surgical patients per orders ONLY, double-leash flight-risk policy, never off-slip in corridors); the comfort layer (dry bedding, clean patient, water per orders) as medicine, not housekeeping — recumbent-patient turning schedule awareness (deep skill in Inpatient Academy).</p>\n<p><strong>Clinical case:</strong> 14:00 sheet says walk + feed post-op GI dog. Kennel shows vomit you didn't see happen. Feeding anyway because \"the sheet says so\"? (<em>No — new abnormality → report first; the sheet was written before the vomit existed. Sheets are orders, not oracles.</em>)</p>\n<p><strong>Knowledge check:</strong> 1) Sheet-cell rule? (<em>Every cell done-and-initialed or escalated — never blank/later.</em>) 2) You find NPO on the sheet after the patient begged adorably. (<em>NPO is NPO. Log the beg for morale.</em>) 3) When does \"looks different to me\" justify a report? (<em>Always — fresh-eyes escalation is the design, not an imposition.</em>)</p>\n<p><strong>Practical assignment:</strong> 2 supervised ward blocks; 5 PO administrations coached; 1 structured handoff given. <strong>Competency connection:</strong> <span class=\"id\">TS-INP-001</span> → 5; <span class=\"id\">TS-MED-PO-001</span> → 6–7; VA1 grant checkpoint end of Week 2. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Hospitalized patients are watched by whoever is in the ward — which is often you. Week 2 makes you a safe pair of ward eyes and hands for the routine tier. Objectives: read a treatment sheet fully; execute basic scheduled care (feeding per orders, walking, bedding, TPR checks) with initials discipline; give PO meds per TS-MED-PO-001 as granted; recognize the \"different than an hour ago\" reflex; hand off properly. Core instruction: Read TS-INP-001 (spec) + TS-MED-PO-001 . This lesson adds the routine-tier boundaries: which patients are yours at VA1–2 (stable, non-ICU, non-isolation until trained) and which never are yet; the feeding matrix (NPO flags, post-op timing per orders, \"ate?\" quantified); walking rules (surgical patients per orders ONLY, double-leash flight-risk policy, never off-slip in corridors); the comfort layer (dry bedding, clean patient, water per orders) as medicine, not housekeeping — recumbent-patient turning schedule awareness (deep skill in Inpatient Academy). Clinical case: 14:00 sheet says walk + feed post-op GI dog. Kennel shows vomit you didn't see happen. Feeding anyway because \"the sheet says so\"? ( No — new abnormality → report first; the sheet was written before the vomit existed. Sheets are orders, not oracles. ) Knowledge check: 1) Sheet-cell rule? ( Every cell done-and-initialed or escalated — never blank/later. ) 2) You find NPO on the sheet after the patient begged adorably. ( NPO is NPO. Log the beg for morale. ) 3) When does \"looks different to me\" justify a report? ( Always — fresh-eyes escalation is the design, not an imposition. ) Practical assignment: 2 supervised ward blocks; 5 PO administrations coached; 1 structured handoff given. Competency connection: TS-INP-001 → 5; TS-MED-PO-001 → 6–7; VA1 grant checkpoint end of Week 2. Version: 1.0 2026-08-17."}, {"id": "lsn-w3-01", "title": "W3-01 · Vascular Anatomy", "group": "Lessons", "meta": "Week 3", "html": "<p><strong>Why this matters:</strong> People who understand the vessel hit the vessel. People who understand the blood keep the sample usable. This is the knowledge floor under Weeks 3–4's high-practice blocks.</p>\n<p><strong>Objectives:</strong> locate cephalic, lateral/medial saphenous, and jugular vessels on diagram and live patient; explain occlusion physiology; explain hemolysis/clotting causes at each step; choose site by patient/test/volume.</p>\n<p><strong>Core instruction:</strong> <strong>The map:</strong> cephalic — dorsomedial antebrachium (your everyday vessel: convenient position, modest volume); accessory cephalic Y; lateral saphenous — oblique across distal lateral tibia (dog's backup, rolls like a cable); medial saphenous — feline superstar (big, flat, fragile); jugular — the volume/quality vessel (groove low in neck; carotid deep-medial — why superficial technique + low occlusion matter). <span class=\"id\">INT-04</span> interactive: label all vessels on 6 images (dog/cat × 3 sites), then hotspot \"where do you occlude?\" <strong>The physiology:</strong> occlusion → venous return blocked → distension (takes seconds — impatience reads as \"no vein\"); &gt;90 s occlusion → hemoconcentration (skews PCV/TS/K+ — release and re-occlude on long hunts); negative pressure physics — vein walls collapse at the suction YOU choose; RBC shear (hemolysis) from small-needle+hard-pull, stopper-punch transfers, shaking; the clotting clock starts at needle entry — anticoagulant tubes are a race measured in seconds-to-a-minute.</p>\n<p><strong>Site selection logic (taught as a decision table):</strong> volume needed (jugular for &gt;3–6 mL or multiple tubes), patient factors (dyspnea → no jugular positioning; catheter-planned limb → never cephalic there; coagulopathy → no jugular at all), test factors (coags want clean single-stick), temperament (cat medial saphenous under towel beats a wrestling cephalic).</p>\n<p><strong>Knowledge check:</strong> 1) Why can a perfect stick still hemolyze? (<em>Downstream handling: hard aspiration, stopper-punch transfer, shaking.</em>) 2) K+ oddly high on a long-occlusion draw — connection? (<em>Hemoconcentration/hemolysis artifact from prolonged occlusion.</em>) 3) Dyspneic cat, needs CBC/chem: site shortlist? (<em>Medial saphenous in gentle sternal/lateral-modified with CVT guidance — never jugular extension.</em>)</p>\n<p><strong>Competency connection:</strong> unlocks <span class=\"id\">TS-VEN-CEPH-001</span> floor practice (state 4–5 this week). <strong>References:</strong> anatomy atlases (original diagrams in <code>26_Asset_Licensing</code> register); McCurnin's. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: People who understand the vessel hit the vessel. People who understand the blood keep the sample usable. This is the knowledge floor under Weeks 3–4's high-practice blocks. Objectives: locate cephalic, lateral/medial saphenous, and jugular vessels on diagram and live patient; explain occlusion physiology; explain hemolysis/clotting causes at each step; choose site by patient/test/volume. Core instruction: The map: cephalic — dorsomedial antebrachium (your everyday vessel: convenient position, modest volume); accessory cephalic Y; lateral saphenous — oblique across distal lateral tibia (dog's backup, rolls like a cable); medial saphenous — feline superstar (big, flat, fragile); jugular — the volume/quality vessel (groove low in neck; carotid deep-medial — why superficial technique + low occlusion matter). INT-04 interactive: label all vessels on 6 images (dog/cat × 3 sites), then hotspot \"where do you occlude?\" The physiology: occlusion → venous return blocked → distension (takes seconds — impatience reads as \"no vein\"); &gt;90 s occlusion → hemoconcentration (skews PCV/TS/K+ — release and re-occlude on long hunts); negative pressure physics — vein walls collapse at the suction YOU choose; RBC shear (hemolysis) from small-needle+hard-pull, stopper-punch transfers, shaking; the clotting clock starts at needle entry — anticoagulant tubes are a race measured in seconds-to-a-minute. Site selection logic (taught as a decision table): volume needed (jugular for &gt;3–6 mL or multiple tubes), patient factors (dyspnea → no jugular positioning; catheter-planned limb → never cephalic there; coagulopathy → no jugular at all), test factors (coags want clean single-stick), temperament (cat medial saphenous under towel beats a wrestling cephalic). Knowledge check: 1) Why can a perfect stick still hemolyze? ( Downstream handling: hard aspiration, stopper-punch transfer, shaking. ) 2) K+ oddly high on a long-occlusion draw — connection? ( Hemoconcentration/hemolysis artifact from prolonged occlusion. ) 3) Dyspneic cat, needs CBC/chem: site shortlist? ( Medial saphenous in gentle sternal/lateral-modified with CVT guidance — never jugular extension. ) Competency connection: unlocks TS-VEN-CEPH-001 floor practice (state 4–5 this week). References: anatomy atlases (original diagrams in 26_Asset_Licensing register); McCurnin's. Version: 1.0 2026-08-17."}, {"id": "lsn-w3-02", "title": "W3-02 · Cephalic Venipuncture Week", "group": "Lessons", "meta": "Week 3", "html": "<p><strong>Why this matters:</strong> The single highest-value technical transfer of the Core Academy starts this week.</p>\n<p><strong>Objectives:</strong> perform the full cephalic draw sequence on the model to fluency; transition to coached live draws; apply the 2-attempt limit and stop criteria as reflexes, not rules you remember later.</p>\n<p><strong>Core instruction:</strong> The teaching content is <strong><span class=\"id\">CSC-VEN-01</span></strong> (Clinical Skill Course — read it fully; it is the course) with <strong><span class=\"id\">TS-VEN-CEPH-001</span></strong> as the governance spec. Structure of the week: Day 1 — model lab (≥10 successful model sticks; trainer scores entry angle, flash response, aspiration pressure); Day 2 — observe 3 live draws with narration-by-trainer, then holder-role on real draws (you already have RES-003 — now feel the draw from the other side); Days 3–5 — coached live draws on selected easy patients (calm, good veins, non-urgent samples — the training board flags \"learner-appropriate\" cases at morning rounds). The mental checklist drilled until automatic: <em>ID → assemble → position → palpate (trust the finger) → stabilize → enter → flash → flatten → aspirate gently → release-occlusion-THEN-withdraw → pressure → transfer fast → label at side → sharps → recheck site.</em></p>\n<p><strong>The failure curriculum (deliberate):</strong> trainer stages on the model: through-and-through, flash-then-wall, collapse-on-aspiration — you learn each failure's <em>feel</em> in silicone before meeting it in a patient. Recognition beats luck.</p>\n<p><strong>Knowledge check:</strong> 1) Flash then nothing — first two moves? (<em>Drop angle flat; advance 1–2 mm/rotate slightly; ease aspiration.</em>) 2) Define one \"attempt.\" (<em>Needle fully exits skin = attempt over; a subcutaneous redirect is the same attempt.</em>) 3) After your second miss? (<em>Hand off. Full stop. No third stick — ever at this stage.</em>)</p>\n<p><strong>Practical assignment:</strong> the week's targets from the spec (§24). Every attempt logged, successful or not — unsuccessful logs are tuition, not shame. <strong>Competency connection:</strong> <span class=\"id\">TS-VEN-CEPH-001</span> states 4→6. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: The single highest-value technical transfer of the Core Academy starts this week. Objectives: perform the full cephalic draw sequence on the model to fluency; transition to coached live draws; apply the 2-attempt limit and stop criteria as reflexes, not rules you remember later. Core instruction: The teaching content is CSC-VEN-01 (Clinical Skill Course — read it fully; it is the course) with TS-VEN-CEPH-001 as the governance spec. Structure of the week: Day 1 — model lab (≥10 successful model sticks; trainer scores entry angle, flash response, aspiration pressure); Day 2 — observe 3 live draws with narration-by-trainer, then holder-role on real draws (you already have RES-003 — now feel the draw from the other side); Days 3–5 — coached live draws on selected easy patients (calm, good veins, non-urgent samples — the training board flags \"learner-appropriate\" cases at morning rounds). The mental checklist drilled until automatic: ID → assemble → position → palpate (trust the finger) → stabilize → enter → flash → flatten → aspirate gently → release-occlusion-THEN-withdraw → pressure → transfer fast → label at side → sharps → recheck site. The failure curriculum (deliberate): trainer stages on the model: through-and-through, flash-then-wall, collapse-on-aspiration — you learn each failure's feel in silicone before meeting it in a patient. Recognition beats luck. Knowledge check: 1) Flash then nothing — first two moves? ( Drop angle flat; advance 1–2 mm/rotate slightly; ease aspiration. ) 2) Define one \"attempt.\" ( Needle fully exits skin = attempt over; a subcutaneous redirect is the same attempt. ) 3) After your second miss? ( Hand off. Full stop. No third stick — ever at this stage. ) Practical assignment: the week's targets from the spec (§24). Every attempt logged, successful or not — unsuccessful logs are tuition, not shame. Competency connection: TS-VEN-CEPH-001 states 4→6. Version: 1.0 2026-08-17."}, {"id": "lsn-w3-03", "title": "W3-03 · Saphenous Jugular Int
