<script>
const DATA = {"docs": [{"id": "csc-ven01", "title": "Canine cephalic venipuncture", "group": "Skill courses", "meta": "TS-VEN-CEPH-001", "html": "<p>Companion to <span class=\"id\">TS-VEN-CEPH-001</span> (governance) · Benchmark exemplar course · ~35 min + lab</p>\n<h3>1. Purpose</h3>\n<p>You are collecting diagnostic blood from the vein on top of the dog's forearm. It's the workhorse draw: convenient position, patient facing forward, holder and sticker both comfortable. Every CBC, chemistry, and heartworm test starts here. Done well, it takes ninety seconds and the patient barely notices; done badly, it produces bruised legs, ruined samples the DVM makes decisions on anyway, patients who fight the next visit, and a technician who has to re-do your work plus their own.</p>\n<h3>2. Prerequisite knowledge (the five facts that make your hands smart)</h3>\n<ol>\n<li>The cephalic vein runs up the TOP of the forearm, slightly to the inside — from just above the paw toward the elbow crook. It is superficial: just under the skin, not buried in muscle.</li>\n<li>It is a vein, so blood flows TOWARD the heart (paw→elbow). Your holder blocks that flow at the elbow, the vein backs up and fattens. No occlusion, no vein.</li>\n<li>Vein walls are soft. Suction stronger than the vein's refill rate sucks the walls shut — and shears red cells (hemolysis). Gentle wins.</li>\n<li>Clotting starts the moment blood leaves the vessel. The trip from syringe to (correctly ordered) tubes is a race measured in seconds.</li>\n<li>Attempted sticks damage the vessel you'll need next time. The vein is a shared, exhaustible resource — treat every stick as spending it.</li>\n</ol>\n<h3>3. Equipment (and why)</h3>\n<ul>\n<li><strong>Needle:</strong> 22 g for most dogs (green in most brands — confirm house stock). 25 g for toy breeds/puppies (slower, gentler; expect a slow draw). Bigger needle ≠ better: 20 g in a small vein tears more than it collects.</li>\n<li><strong>Syringe:</strong> just big enough for the ordered volume — 3 mL for most panels. A 12 mL syringe on a 22 g needle generates collapse-grade suction with a light thumb; oversizing the syringe is oversizing your worst habit.</li>\n<li><strong>Butterfly (winged) set 23–25 g:</strong> your friend for wigglers, toys, and fragile veins — the flexible line means paw movement doesn't lever the needle out of the vessel.</li>\n<li><strong>Tubes</strong> in fill order, standing in a rack ON the table before you start. Gauze squares ×3. Alcohol. Sharps container within arm's reach — not across the room. Pen for patient-side labeling.</li>\n</ul>\n<h3>4. Patient preparation</h3>\n<p>Quick pre-read: is this dog loose and wiggly (needs firm holder), frozen and staring (needs decompression, slow approach), or panting/distressed (does this draw need to happen right now this way — ask). Check BOTH forelimbs for existing catheters, catheter-planned flags (surgery today?), bruises from previous attempts, wounds. If the right leg has yesterday's hematoma, start left. Position: sitting or sternal on a non-slip mat, at a table height where the extended forearm is at YOUR mid-torso — you should not be stooping or shrugging.</p>\n<h3>5. Operator preparation — where everybody goes</h3>\n<ul>\n<li><strong>Holder</strong> stands at the dog's side, arm around the neck in the hug hold, other hand behind the elbow of the draw leg: pushing it forward from BEHIND the joint (never pulling the paw — dogs retract from paw-pulls), thumb rolling across the elbow crook to occlude.</li>\n<li><strong>You</strong> kneel or sit directly IN FRONT of the extended limb, eyes over the forearm. Your NON-dominant hand owns the limb: fingers wrapped under the forearm, thumb alongside the vein below your entry point, pulling the skin gently down toward the paw (distal traction). Your dominant hand owns the needle, bevel up, held like a dart — pads of thumb and index on the hub, not choked up on the barrel.</li>\n<li><strong>Line of sight:</strong> you're looking down the barrel of the forearm. The syringe sits in line with the vein's long axis, not crossing it.</li>\n<li><strong>Anticipate:</strong> dogs pull the leg BACK and DOWN. Your traction hand is also your early-warning system — you'll feel the retraction start a half-second before it shows.</li>\n</ul>\n<h3>6. The procedure</h3>\n<p><strong>Step 1 — Verify, out loud.</strong> DO: \"This is Bella Chen, cephalic draw for CBC and chem?\" while checking two identifiers. WHY: wrong-patient is the unforgivable error class. EXPECT: holder confirms. COMMON ERROR: mumbling it as ritual while reading the room instead of the band. RECOVERY: n/a — this one you just do. STOP: any mismatch, full stop.</p>\n<p><strong>Step 2 — Stage everything.</strong> DO: needle seated on syringe, plunger broken loose (one pull-push in the wrapper), tubes racked in fill order, gauze open, sharps lid open. WHY: a staged table means the needle is in the vein for seconds, not minutes; an unstaged table means blood clotting in your syringe while you hunt for the lavender top. EXPECT: you can reach everything without looking. COMMON ERROR: starting the stick, THEN asking someone to grab tubes. RECOVERY: if you catch yourself mid-stick without tubes — finish the draw calmly, hand the syringe off for immediate transfer, restage before your next patient. STOP: n/a.</p>\n<p><strong>Step 3 — Raise the vein.</strong> DO: cue the holder (\"occlude, please\"), watch the crook of the elbow, then LOOK AWAY from the leg and palpate: run your index fingertip across the forearm's top surface. WHY: the vein is found by feel — a soft, springy, slightly warm cord that refills under a light press. Sight lies (fur, pigment, shadow); touch doesn't. EXPECT: 3–8 seconds for filling; the vein rises like a slow breath. In thick-coated dogs you'll feel it long before any chance of seeing it. COMMON ERROR: impatience — declaring \"no vein\" at second two; or pressing so hard while palpating that you occlude the very thing you're finding. RECOVERY: release-and-reocclude if you've hunted &gt;60–90 s (trapped blood hemoconcentrates and the vein stops refilling crisply). STOP: if nothing raises on either limb after honest attempts — flat veins on a sick patient are information; tell the CVT.</p>\n<p><strong>Step 4 — Fix the vein in place.</strong> DO: with the vein mapped, set your thumb parallel to it, one to two finger-widths BELOW your entry site, and draw the skin snug toward the paw. WHY: the cephalic's failure mode is rolling — it slides sideways off the needle point. Taut skin pins it. EXPECT: the vein feels slightly less mobile under your fingertip; skin has no wrinkle slack. COMMON ERROR: thumb ON TOP of the vein (you'll stick your own thumbnail's shadow), or traction so light it decorates rather than restrains. RECOVERY: reset your grip — never chase a rolling vein with needle angle alone. STOP: n/a.</p>\n<p><strong>Step 5 — Enter.</strong> DO: alcohol swab (parts the fur — now you may even see it), bevel up, 15–30° to the skin, aim along the vein's line, one deliberate motion through skin and into the vessel. In thick-skinned or scarred dogs, two-stage is fine: through skin beside the vein, small pause, then into the vein. WHY: slow needle passage hurts more and gives the vein time to roll; steep angles go through the back wall. EXPECT: skin gives a brief resistance then releases; vein entry in many dogs is a subtle \"pop\" — softer than the skin. Watch the hub. COMMON ERROR: the flinch-stick — jabbing fast and shallow from fear of hurting the dog, ending up on top of, beside, or through the vein. RECOVERY: if you feel you're skating on the vein's surface, drop your angle 5–10° and advance with the traction hand snugging harder. STOP: patient explodes into struggle — needle out, regroup with the holder before anything else.</p>\n<p><strong>Step 6 — Flash, flatten, seat.</strong> DO: at first blood in the hub, drop the syringe nearly parallel to the leg and advance 1–2 mm. WHY: the flash means the bevel's TIP is in; the whole bevel isn't. Aspirating now sucks wall onto the opening. EXPECT: the syringe now lies almost along the limb; the needle feels anchored, not tippy. COMMON ERROR: celebrating the flash by pulling the plunger instantly — flow for half a second, then nothing. RECOVERY: that IS the flash-then-stop below; flatten and re-seat first. STOP: n/a.</p>\n<p><strong>Step 7 — Aspirate like you're sipping.</strong> DO: pull the plunger with about the force you'd use to lift a coin — a few millimeters at a time; let the barrel fill at the vein's pace. Small dog = slow fill; that's physiologic, not failure. WHY: your thumb sets the pressure differential; the vein's refill sets the speed limit. Exceed it and the walls clap shut. EXPECT: steady dark red climb; slight pulsing with the traction hand's grip is normal. COMMON ERROR: ratcheting harder as flow slows — the death spiral (harder pull → tighter collapse → harder pull → hemolyzed half-sample). RECOVERY: ease OFF the plunger, let the vein re-expand two seconds, resume gentler. STOP: patient stress escalating (see the holder's face, not just the leg) — a two-thirds sample and a calm patient beats a full tube and a fight.</p>\n<p><strong>Step 8 — Exit in the only correct order.</strong> DO: say \"release\" (holder's thumb OFF, restraint stays ON) → withdraw the needle smoothly along its own line → holder or you clamps gauze on the site with real pressure. WHY: pulling a needle out of a still-pressurized vein squirts blood into the tissue — that's the hematoma you'll be apologized for tomorrow. EXPECT: a clean site; a single drop at most. COMMON ERROR: the order scramble under time pressure — needle out first, THEN \"release.\" RECOVERY: firm pressure 60+ s, say what happened, check before kennel return. STOP: n/a.</p>\n<p><strong>Step 9 — The second race.</strong> DO: needle OFF the syringe (or transfer device per house policy), blood run down the tube WALL: citrate to its line first if coags ordered, then lavender — filled and inverted 8–10 times immediately — then the rest. Gentle wrist rolls, never shakes. Label every tube at the table, before your hand leaves it. WHY: everything in <span class=\"id\">TS-SAM-001</span>; the summary is <em>anticoagulant tubes are on the clock and stoppers punched by needles eat cells.</em> EXPECT: 20–30 unhurried seconds. COMMON ERROR: carrying naked tubes to the bench \"to label there.\" RECOVERY: if interrupted mid-transfer, the person who drew finishes the transfer — handoffs mid-race cause both clots and swaps. STOP: n/a.</p>\n<p><strong>Step 10 — Close the loop.</strong> DO: needle to sharps as one motion; site recheck (lift the gauze — dry? no growing softness?); patient decompressed and praised; chart: site/side, gauge, attempts, complications-or-none, tolerance, initials; case-log entry. WHY: the site recheck catches the slow hematoma; the chart is where your work becomes trustworthy. COMMON ERROR: charting three draws from memory at lunch. STOP: n/a.</p>\n<h3>7. Tactile medicine — what your fingers will learn</h3>\n<p>A GOOD raised vein: a cooked-spaghetti cord with spring — press lightly, it dents and refills. A FLAT vein: a cord with no spring, like the spaghetti uncooked (dehydration, fear-vasoconstriction, or your holder's occlusion is soft). ROLLING: under your palpating finger the cord SLIDES laterally a few millimeters — that slide-distance is exactly what your distal traction must remove. SKIN ENTRY: brief firm resistance, then give; old dogs' skin is tissue paper (almost no resistance — easy to overshoot), young mastiffs' is leather (real push needed — brace your traction hand so the \"give\" doesn't become a lunge). VEIN ENTRY: a softer, subtler give — many people feel it as the needle suddenly \"floating.\" THROUGH THE BACK WALL: a second give you did NOT want; flash stops; often a fine grating as the bevel touches deeper tissue. COLLAPSE ON ASPIRATION: the plunger goes rubbery-hard mid-pull, like sucking a thick shake through a bent straw — that's your cue to ease off, not pull through.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>No flash at expected depth.</strong> See: clean entry, dry hub. Likely: beside the vein (rolled — commonest), over it, or too shallow. Check first: your traction (did the skin wrinkle when you entered?), then palpate with your free hand WITHOUT fully exiting — locate the cord relative to your needle. Correct: withdraw to just under the skin, re-fix the vein, redirect along the corrected line — that's still the SAME attempt. Don't: sweep the needle side-to-side underground hunting (\"windshield-wiping\" lacerates tissue and vessel). After one honest redirect fails: exit, pressure, breathe, re-palpate from scratch — that was attempt one.</p>\n<p><strong>Flash, then nothing.</strong> See: blood entered the hub then stopped. Feel: plunger rubbery (collapse) vs simply blank (bevel against wall / half-out). Do in order: flatten the angle → advance 1 mm → rotate the syringe a quarter-turn (walks the bevel off the wall) → ease aspiration pressure → if still dry, have holder release-and-reocclude (refills the vein). Two cycles of that with nothing = treat as a failed attempt; exit with the correct release order.</p>\n<p><strong>Blood slows mid-draw.</strong> Same ladder as above, plus: check the patient — position shifted? limb rotated in the holder's grip? A returning lean or twist kinks the vessel upstream. Fix the patient's geometry before blaming the needle.</p>\n<p><strong>Hematoma ballooning DURING the draw.</strong> You're through the back wall or the entry is leaking around the needle. Stop the draw — needle out (correct order), firm pressure 90+ s. That limb's site is spent; your next move is the other limb or a saphenous, and your attempt count is at one-spent.</p>\n<p><strong>Patient escalating.</strong> The holder calling it, open-mouth breathing, screaming disproportionate to the stick, thrashing your traction hand can't damp: STOP. Not \"after this tube.\" The decision tree after calm returns: different site with towel/second-holder plan, CVT takeover, or DVM sedation conversation. You get zero style points for finishing a draw on a panicking patient and you lose the NEXT six visits' cooperation.</p>\n<p><strong>When someone else takes over:</strong> after YOUR two attempts, or sooner whenever your confidence breaks — say the useful sentence: \"Two attempts, right cephalic, vein rolls hard and I lost flash both times; left leg untouched.\" That sentence is competence, not failure.</p>\n<h3>9. Real patients</h3>\n<ul>\n<li><strong>Puppies/toys:</strong> vein like wet thread. 25 g + tiny syringe or butterfly, expect 60+ seconds of slow fill; warm the limb in your hand first; every mL matters — confirm the ordered volume is proportionate (flag &gt;1% of body weight in mL to the CVT).</li>\n<li><strong>Geriatrics:</strong> fragile walls, tissue-paper skin, rolling veins in loose fascia — maximum traction, minimum suction, longer post-draw pressure (their bruises bloom).</li>\n<li><strong>Dehydrated/sick:</strong> flat, slow-refilling veins. Butterfly, warmth, patience, and a lowered threshold to escalate — the patient whose veins are flat is the patient whose results are urgent.</li>\n<li><strong>Obese:</strong> the vein sits deeper in a fat sleeve and doesn't show; palpation is everything, entry angle a touch steeper, then flatten as usual.</li>\n<li><strong>Thick-coated breeds:</strong> don't fight the coat — clip a small window (owner-consent awareness for show dogs; ask first through the CSR).</li>\n<li><strong>The frightened-frozen dog:</strong> stillness ≠ consent. Watch for the whale eye and bitten-off breath; use lateral-thinking (treats, floor draw for giant breeds, saphenous while \"just petting\").</li>\n<li><strong>Previously-bruised limbs:</strong> yesterday's hematoma is today's no-go zone — draw above it or elsewhere; through a bruise hurts and samples poorly.</li>\n</ul>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Visual hunting</strong> — staring for a blue line instead of palpating. Why: eyes are how humans default. Consequence: misses in every thick-coated or dark-skinned patient. Prevention: the look-away palpation drill (Step 3). Recognizable: your gaze glued to the leg while your fingertip idles. Correctable: instantly, forever, once the finger learns.</li>\n<li><strong>The instant-thread… instant-pull:</strong> aspirating on first flash. Consequence: flash-then-stop on a textbook vein. Prevention: the \"flatten-advance-THEN-pull\" chant.</li>\n<li><strong>Suction panic:</strong> pulling harder as flow slows. Consequence: collapse + hemolysis + a redraw. Prevention: the coin-lift thumb image; a smaller syringe.</li>\n<li><strong>Order scramble at exit:</strong> needle out before occlusion released. Consequence: hematoma. Prevention: say \"release\" out loud every time — the verbal cue sequences your own hands.</li>\n<li><strong>The naked-tube walk:</strong> labeling at the bench. Consequence: the swap that ends careers. Prevention: pen lives in your draw kit.</li>\n<li><strong>Windshield-wiping underground.</strong> Consequence: tissue trauma, patient sensitization, still no blood. Prevention: withdraw-to-skin before every redirect.</li>\n<li><strong>Third-stick fever:</strong> \"I almost had it.\" Consequence: spent veins, spent trust. Prevention: the two-attempt rule is not advice.</li>\n</ol>\n<h3>11. Experienced-staff pearls (and banned folklore)</h3>\n<p>PEARLS: Warm limb = fat vein — 30 s of your cupped hand beats 3 minutes of hunting on a cold morning. · Watch the accessory cephalic Y in bully breeds — the junction is often the fattest, most fixed target. · Set your tube rack to your non-dominant side so the transfer never crosses the sharps line. · On wigglers, rest the heel of your needle hand against the dog's leg — your hand rides limb movement instead of fighting it (works beautifully with a butterfly). · Tell the dog what's happening in a bored voice; bored voices lower everyone's pulse, including yours.</p>\n<p>BANNED FOLKLORE: flicking/slapping the vein to \"raise it\" (it raises bruises); alcohol-drenching to see better (stings broken skin, cools the limb, dilutes samples); \"quick recap just to carry it to sharps\" (no); drawing from a hematoma \"since it's blood anyway\" (degraded, clotted, useless).</p>\n<h3>12. Visual assets</h3>\n<p><span class=\"id\">VID-VEN-CEPH-001</span> (storyboard in 20_LMS/Video_System — correct run + the three classic errors on model). Stills to produce for this course: correct traction-hand grip (top + side view), the flash at the hub (macro), CORRECT vs TOO-STEEP entry angle side-by-side, BORDERLINE example: an entry that looks fine but with wrinkled (slack) skin — learners must spot the missing traction. <span class=\"id\">INT-04</span> vessel maps; <span class=\"id\">INT-05</span> tube drills.</p>\n<h3>13. Assessment &amp; competency links</h3>\n<p>Knowledge: <span class=\"id\">QB-CORE-VEN</span> (rewritten bank; ≥80%, SC 100%). Practical: <span class=\"id\">PA-VEN-CEPH-001</span>. Case log: per <span class=\"id\">TS-VEN-CEPH-001</span> §24 (model ×10 → observed ×3 → coached ×5 incl. cat+dog → 15 logged for state 10).</p>\n<hr>\n<p><em>Internal reviews:</em> R1 (experienced tech): added look-away palpation, release-order verbal cue, windshield-wiper ban, holder push-not-pull — the four things every trainer repeats. R2 (novice): standing/kneeling position, which hand owns what, and all \"give\" sensations now explicit; success and failure states defined at every step. R3 (utility): after this course + lab, supervised training starts at coached live draws, not at \"what's an occlusion\" — the hospital gains a phlebotomy trainee who costs one CVT shadow, not two.</p>", "text": "Companion to TS-VEN-CEPH-001 (governance) · Benchmark exemplar course · ~35 min + lab 1. Purpose You are collecting diagnostic blood from the vein on top of the dog's forearm. It's the workhorse draw: convenient position, patient facing forward, holder and sticker both comfortable. Every CBC, chemistry, and heartworm test starts here. Done well, it takes ninety seconds and the patient barely notices; done badly, it produces bruised legs, ruined samples the DVM makes decisions on anyway, patients who fight the next visit, and a technician who has to re-do your work plus their own. 2. Prerequisite knowledge (the five facts that make your hands smart) The cephalic vein runs up the TOP of the forearm, slightly to the inside — from just above the paw toward the elbow crook. It is superficial: just under the skin, not buried in muscle. It is a vein, so blood flows TOWARD the heart (paw→elbow). Your holder blocks that flow at the elbow, the vein backs up and fattens. No occlusion, no vein. Vein walls are soft. Suction stronger than the vein's refill rate sucks the walls shut — and shears red cells (hemolysis). Gentle wins. Clotting starts the moment blood leaves the vessel. The trip from syringe to (correctly ordered) tubes is a race measured in seconds. Attempted sticks damage the vessel you'll need next time. The vein is a shared, exhaustible resource — treat every stick as spending it. 3. Equipment (and why) Needle: 22 g for most dogs (green in most brands — confirm house stock). 25 g for toy breeds/puppies (slower, gentler; expect a slow draw). Bigger needle ≠ better: 20 g in a small vein tears more than it collects. Syringe: just big enough for the ordered volume — 3 mL for most panels. A 12 mL syringe on a 22 g needle generates collapse-grade suction with a light thumb; oversizing the syringe is oversizing your worst habit. Butterfly (winged) set 23–25 g: your friend for wigglers, toys, and fragile veins — the flexible line means paw movement doesn't lever the needle out of the vessel. Tubes in fill order, standing in a rack ON the table before you start. Gauze squares ×3. Alcohol. Sharps container within arm's reach — not across the room. Pen for patient-side labeling. 4. Patient preparation Quick pre-read: is this dog loose and wiggly (needs firm holder), frozen and staring (needs decompression, slow approach), or panting/distressed (does this draw need to happen right now this way — ask). Check BOTH forelimbs for existing catheters, catheter-planned flags (surgery today?), bruises from previous attempts, wounds. If the right leg has yesterday's hematoma, start left. Position: sitting or sternal on a non-slip mat, at a table height where the extended forearm is at YOUR mid-torso — you should not be stooping or shrugging. 5. Operator preparation — where everybody goes Holder stands at the dog's side, arm around the neck in the hug hold, other hand behind the elbow of the draw leg: pushing it forward from BEHIND the joint (never pulling the paw — dogs retract from paw-pulls), thumb rolling across the elbow crook to occlude. You kneel or sit directly IN FRONT of the extended limb, eyes over the forearm. Your NON-dominant hand owns the limb: fingers wrapped under the forearm, thumb alongside the vein below your entry point, pulling the skin gently down toward the paw (distal traction). Your dominant hand owns the needle, bevel up, held like a dart — pads of thumb and index on the hub, not choked up on the barrel. Line of sight: you're looking down the barrel of the forearm. The syringe sits in line with the vein's long axis, not crossing it. Anticipate: dogs pull the leg BACK and DOWN. Your traction hand is also your early-warning system — you'll feel the retraction start a half-second before it shows. 6. The procedure Step 1 — Verify, out loud. DO: \"This is Bella Chen, cephalic draw for CBC and chem?\" while checking two identifiers. WHY: wrong-patient is the unforgivable error class. EXPECT: holder confirms. COMMON ERROR: mumbling it as ritual while reading the room instead of the band. RECOVERY: n/a — this one you just do. STOP: any mismatch, full fat vein — 30 s of your cupped hand beats 3 minutes of hunting on a cold morning. · Watch the accessory cephalic Y in bully breeds — the junction is often the fattest, most fixed target. · Set your tube rack to your non-dominant side so the transfer never crosses the sharps line. · On wigglers, rest the heel of your needle hand against the dog's leg — your hand rides limb movement instead of fighting it (works beautifully with a butterfly). · Tell the dog what's happening in a bored voice; bored voices lower everyone's pulse, including yours. BANNED FOLKLORE: flicking/slapping the vein to \"raise it\" (it raises bruises); alcohol-drenching to see better (stings broken skin, cools the limb, dilutes samples); \"quick recap just to carry it to sharps\" (no); drawing from a hematoma \"since it's blood anyway\" (degraded, clotted, useless). 12. Visual assets VID-VEN-CEPH-001 (storyboard in 20_LMS/Video_System — correct run + the three classic errors on model). Stills to produce for this course: correct traction-hand grip (top + side view), the flash at the hub (macro), CORRECT vs TOO-STEEP entry angle side-by-side, BORDERLINE example: an entry that looks fine but with wrinkled (slack) skin — learners must spot the missing traction. INT-04 vessel maps; INT-05 tube drills. 13. Assessment &amp; competency links Knowledge: QB-CORE-VEN (rewritten bank; ≥80%, SC 100%). Practical: PA-VEN-CEPH-001 . Case log: per TS-VEN-CEPH-001 §24 (model ×10 → observed ×3 → coached ×5 incl. cat+dog → 15 logged for state 10). Internal reviews: R1 (experienced tech): added look-away palpation, release-order verbal cue, windshield-wiper ban, holder push-not-pull — the four things every trainer repeats. R2 (novice): standing/kneeling position, which hand owns what, and all \"give\" sensations now explicit; success and failure states defined at every step. R3 (utility): after this course + lab, supervised training starts at coached live draws, not at \"what's an occlusion\" — the hospital gains a phlebotomy trainee who costs one CVT shadow, not two."}, {"id": "csc-ven02", "title": "Feline medial saphenous", "group": "Skill courses", "meta": "TS-VEN-SAPH-001", "html": "<p>Companion to <span class=\"id\">TS-VEN-SAPH-001</span> · Benchmark course · ~25 min + lab · Steps 1–2 and 8–10 (verify, stage, exit order, transfer, close-out) are identical to <span class=\"id\">CSC-VEN-01</span> and are not repeated — master that course first.</p>\n<h3>1. Purpose</h3>\n<p>The medial saphenous is the cat vessel. It's large, flat, visible through sparse inner-thigh fur, and — the real reason — reachable while the cat stays wrapped in a towel with its head hidden and its dignity intact. A team fluent in this draw stops wrestling cats at the neck and forelimbs, which means calmer cats, better samples, and fewer shredded sleeves. It also spares forelimb veins for catheters.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>The vein runs along the INNER surface of the hindlimb — from the hock up the medial tibia toward the stifle and on toward the groin, superficial the whole way. Occlusion happens ABOVE it: pressure flat in the inguinal region (where thigh meets body wall). Unlike the cephalic it barely rolls — it's fixed against the tibia — but its wall is thin: it blows (hematomas) more easily, and it spasms smaller when the cat is stressed. Cats also decompensate under prolonged restraint faster than dogs: this whole draw is designed around a 60–90 second window of feline patience.</p>\n<h3>3. Equipment</h3>\n<p>25 g needle (23 g in big relaxed cats) on a 1–3 mL syringe — never larger; this vein punishes suction. Butterfly 25 g is superb here: the cat can twitch its leg without the needle levering. Towel (the restraint IS equipment). Tubes racked, gauze, alcohol, sharps in reach, pen.</p>\n<h3>4. Patient preparation</h3>\n<p>Read the cat BEFORE unwrapping anything: loose and blinking (proceed), frozen with dilated pupils (slow everything down, dim the room, consider whether this draw must happen now), panting or open-mouth (STOP — this cat sees the DVM before any needle). Check the record for prior \"difficult\" flags and plan accordingly (second person, cat muzzle-as-blindfold per policy, DVM sedation conversation). Position: lateral recumbency inside a loose burrito — body wrapped, BOTH hindlimbs out of the wrap's caudal end, head covered or shielded per the cat's preference. Most cats settle dramatically once the head is hidden.</p>\n<h3>5. Operator preparation</h3>\n<ul>\n<li><strong>Holder</strong> stands/sits at the cat's dorsal side: one forearm resting the wrapped body (weight of a hand, not a press), that hand's fingers curled over the upper hindlimb holding it out of your field; the OTHER hand applies inguinal occlusion on the draw leg — flat fingers pressed into the crease where the inner thigh meets the belly wall. Cue them: \"flat and firm, like pressing a sponge, not pinching.\"</li>\n<li><strong>You</strong> sit facing the cat's underside, the draw leg presented to you. Non-dominant hand cups the hock/lower limb, extending the leg gently and applying a whisper of distal traction — this vein needs stabilizing, not pinning. Dominant hand: needle bevel-up, aligned with the vein, angle LOW — 10–20°; this vessel is right under the skin.</li>\n<li><strong>Anticipate:</strong> the feline escape move here is a leg-pump (piston kick) and a body-roll. Your cupping hand rides the leg; the holder's forearm damps the roll. If the cat starts a sustained struggle, that's not a grip problem to solve with force — it's a stop.</li>\n</ul>\n<h3>6. The procedure (unique steps)</h3>\n<p><strong>Raise.</strong> DO: cue inguinal occlusion; watch the medial tibia. WHY/EXPECT: this vein appears visibly in most cats within 3–5 s — a soft blue-grey line; palpate to confirm spring. COMMON ERROR: holder pinching a fold of skin instead of pressing flat — no occlusion, just an annoyed cat. RECOVERY: re-cue \"flat hand, press toward the body.\" STOP: leg thrashing that two gentle hands can't quiet.</p>\n<p><strong>Enter.</strong> DO: alcohol lightly (cold + wet annoys cats — one pass), 10–20° angle, one smooth motion; the vein is SHALLOW — you're aiming just under the skin, not into the leg. EXPECT: skin give is small; flash often instant. COMMON ERROR: dog-depth entry — straight through the vein into the tibialis; the \"double give\" here means you're done at this site. RECOVERY: through-and-through = exit, pressure 90 s, move UP the leg or to the other leg; the wall is too thin to fish back into. STOP: per stop criteria.</p>\n<p><strong>Aspirate.</strong> DO: coin-lift pressure, even lighter than the canine cephalic; watch for the barrel filling in slow pulses. EXPECT: 1–2 mL in 20–40 s in a calm cat. COMMON ERROR: normal-dog suction → instant collapse + a pink (hemolyzed) sample from a perfect stick. RECOVERY: ease off entirely for 2 s, resume at half pressure. STOP: the cat's breathing changes — the holder should be watching the face and calling it; you watch the hub.</p>\n<p><strong>Exit.</strong> Identical order to <span class=\"id\">CSC-VEN-01</span> — occlusion off, needle out, pressure — with one feline addendum: hold pressure a full 60–90 s (thin wall, easy bruise) and re-wrap the leg INTO the towel afterward so the cat doesn't kick the clot loose.</p>\n<h3>7. Tactile medicine</h3>\n<p>The medial saphenous under your fingertip: wider and flatter than a cephalic — a ribbon, not a cord — with faint spring. Entry: almost no resistance; if you felt a real \"push,\" you're too deep. Collapse: arrives earlier and at lighter suction than any dog vein — recalibrate your thumb to feline scale. The leg in your cupped hand telegraphs everything: a stiffening gastrocnemius is the 1-second warning before the kick.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>Visible vein, no flash:</strong> you're beside it (angle drifted) or over it (too shallow even for this). Withdraw to skin, re-sight along the ribbon, redirect once — same attempt. <strong>Flash then stop:</strong> flatten to almost skin-parallel, advance 0.5–1 mm, quarter-turn, halve your suction. If dry: holder releases/reapplies occlusion. Two cycles = attempt over. <strong>Immediate hematoma:</strong> thin wall blown; pressure, other leg; log it honestly. <strong>The cat \"wakes up\" mid-draw:</strong> you have ~5 s of grace — decide NOW: 1 mL in the syringe may be enough for the priority test (ask before re-sticking for the rest); a thrashing cat ends the event. <strong>Both hindlimbs spent/inaccessible:</strong> the answer is a plan change (cephalic with a second towel plan, jugular by senior staff, or sedation per DVM) — not heroics. Hand off with the useful sentence: sites tried, what you felt, what's untouched.</p>\n<h3>9. Real patients</h3>\n<p><strong>Kittens:</strong> vessel is thread; butterfly + 0.5 mL expectations; warm the leg first; volume math is critical — flag total draws &gt;1% body weight in mL. <strong>Geriatric/CKD cats</strong> (you will draw hundreds): often dehydrated AND fragile — slow fill is normal; do not chase with suction; these cats' calm is worth more than the second tube. <strong>Obese cats:</strong> the ribbon hides in a fat pad — palpate at the tibia where fat is thinnest, extend the leg fully to stretch the pad flat. <strong>Fractious flags:</strong> towel-first ALWAYS, head hidden, room quiet, one attempt budget before regrouping — a fractious cat's second chance costs triple. <strong>Hyperthyroid seniors:</strong> ropey, mobile arteries nearby — if what you hit PULSES, exit immediately, firm pressure 2+ min, report (arterial sticks happen; hiding them is the sin).</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Dog-force restraint</strong> — full-body pin \"so it can't move.\" Consequence: the explosion you caused. Prevention: towel + hidden head + minimal points of contact. 2. <strong>Dog-depth entry</strong> — through-and-through on the first try. Prevention: rehearse the 10–20° sight-picture on the model. 3. <strong>Dog-suction aspiration</strong> — hemolysis machine. Prevention: syringe ≤3 mL, coin-lift thumb. 4. <strong>Skipping the towel because \"this cat's friendly\"</strong> — friendly cats un-friend at needle three; wrap first, always have the option live. 5. <strong>Short post-draw pressure</strong> — feline bruises are client-visible on the inner thigh; 60–90 s, then recheck.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: warm the leg through the towel while setting up — free 30% vein diameter. · Draw near the hock first; failures still leave the whole upstream ribbon. · The holder's voice matters more than their grip — a low steady murmur beats a tighter hand. · Schedule feline draws BEFORE anything else unpleasant in the visit; you get the best cat first. BANNED: scruff-and-stretch as the default hold (policy: towel first); \"burrito tighter until it stops\" (tighter wraps on a panicking cat = respiratory risk); blowing on the fur to part it (cats despise it; use alcohol's parting effect).</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-VEN-SAPH-001</span> (production storyboard: overhead of the full towel setup, macro of inguinal occlusion hand-shape, correct vs pinch-occlusion, entry at correct angle vs \"dog-depth\" error on model). Knowledge: <span class=\"id\">QB-CORE-VEN</span> feline items. Practical: <span class=\"id\">PA-VEN-CEPH-001</span> with saphenous anchors. Case log: ≥5 coached incl. ≥2 feline medial saphenous.</p>\n<hr>\n<p><em>Reviews:</em> R1: added inguinal hand-shape cue, hock-first site strategy, arterial-stick honesty rule. R2: holder vs operator geometry explicit; 60–90 s patience window named; kick warning signs given. R3: hospital gains cat draws that don't require the two strongest staff and a recovery period for everyone involved.</p>", "text": "Companion to TS-VEN-SAPH-001 · Benchmark course · ~25 min + lab · Steps 1–2 and 8–10 (verify, stag
