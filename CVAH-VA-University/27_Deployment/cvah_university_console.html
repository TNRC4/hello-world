zero critical fails (a critical fail anywhere = that station failed + targeted remediation before re-attempt regardless of total). 3) Documentation &amp; communication gates audited from your accumulated logs (gates 6–7). 4) Readiness review: Manager + Supervising Veterinarian + lead Assessor, with your passport and case logs on the table; outcome is one of: GRADUATE (credential granted, workload matrix rows activate per passport states) / TARGETED COMPLETION (specific gates scheduled, W8-02 plan) / EXTENDED PLAN (structured, per outer-window policy). For the learner, plainly: you cannot fail your way out of a career here in one bad morning — every gate has a remediation path and a re-attempt design; what has no path is pretending. The passport shows what's true; graduation makes it official. Version: 1.0 2026-08-17."}, {"id": "lsn-w8-02", "title": "W8-02 · Gap Closure", "group": "Lessons", "meta": "Week 8", "html": "<p><strong>Purpose:</strong> the structured path for learners with unmet gates after the Week-8 cycle — targeted, stigma-free, and never a full-course restart.</p>\n<p><strong>Process:</strong> 1) Gap map: passport + exam analytics + station scores → a one-page list of SPECIFIC deficits (\"jugular holder role — airway watch lapses\"; \"med-math decimal errors under time pressure\"), never vague ones (\"needs confidence\"). 2) Prescription per deficit from the remediation catalog (<code>23_Remediation/Remediation_Engine.md</code>): focused lesson re-take, drill sets, coached repetitions with named counts, or scenario series — each with a completion signal and a re-assessment booking. 3) Cadence: gap-closure learners get priority access to learner-appropriate cases (the training board flags them); progress reviewed weekly by trainer + manager. 4) Outer window: if gates remain unmet as the ~16-week horizon approaches, the Manager/Medical Reviewer conference per <code>Graduation_Requirements.md</code> — with honest options on the table.</p>\n<p><strong>Culture clause (posted verbatim in the LMS):</strong> Needing more repetitions is how motor learning works. The record we keep is your current state, not a tally of your tries. The only failure mode this program punishes is faking it.</p>\n<p><strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Purpose: the structured path for learners with unmet gates after the Week-8 cycle — targeted, stigma-free, and never a full-course restart. Process: 1) Gap map: passport + exam analytics + station scores → a one-page list of SPECIFIC deficits (\"jugular holder role — airway watch lapses\"; \"med-math decimal errors under time pressure\"), never vague ones (\"needs confidence\"). 2) Prescription per deficit from the remediation catalog ( 23_Remediation/Remediation_Engine.md ): focused lesson re-take, drill sets, coached repetitions with named counts, or scenario series — each with a completion signal and a re-assessment booking. 3) Cadence: gap-closure learners get priority access to learner-appropriate cases (the training board flags them); progress reviewed weekly by trainer + manager. 4) Outer window: if gates remain unmet as the ~16-week horizon approaches, the Manager/Medical Reviewer conference per Graduation_Requirements.md — with honest options on the table. Culture clause (posted verbatim in the LMS): Needing more repetitions is how motor learning works. The record we keep is your current state, not a tally of your tries. The only failure mode this program punishes is faking it. Version: 1.0 2026-08-17."}, {"id": "rub-ven", "title": "Venipuncture practical", "group": "Assess", "meta": "printable", "html": "<p><strong>Candidate instructions (read aloud):</strong> \"Collect the ordered blood sample from this patient with your holder. Narrate anything you'd normally verbalize. Standard stop rules apply. You may ask for anything you'd ask for on shift.\"</p>\n<p><strong>Evaluator setup:</strong> live patient appropriate to learner stage (or model for re-tests of mechanics), real order (test + volume), holder provided, full supply bench including deliberate inclusion of one WRONG tube type (selection is scored). Prereqs verified: state ≥7, reps logged per spec §24.</p>\n<div class=\"tw\"><table><thead><tr><th>#</th><th>Observable behavior</th><th>Score</th></tr></thead><tbody><tr><td>1★</td><td>Verifies order AND patient identity aloud (two identifiers) before setup</td><td>2/1/0</td></tr><tr><td>2</td><td>Assembles all supplies before positioning; selects correct needle/syringe/tubes for the order</td><td>2/1/0</td></tr><tr><td>3</td><td>Directs holder to correct position + occlusion; confirms holder readiness</td><td>2/1/0</td></tr><tr><td>4</td><td>Palpates and identifies vessel (verbalizes direction/depth); preps site</td><td>2/1/0</td></tr><tr><td>5</td><td>Stabilizes with distal traction; enters bevel-up at appropriate angle</td><td>2/1/0</td></tr><tr><td>6</td><td>Responds correctly to flash (flattens, seats); aspirates gently without collapse</td><td>2/1/0</td></tr><tr><td>7★</td><td>Correct completion order: occlusion released → withdraw → immediate pressure</td><td>2/1/0</td></tr><tr><td>8★</td><td>Sharps directly to container; no recap</td><td>2/1/0</td></tr><tr><td>9</td><td>Transfers promptly, correct fill order, correct mixing (inversions, no shaking)</td><td>2/1/0</td></tr><tr><td>10★</td><td>Labels at patient-side</td><td>2/1/0</td></tr><tr><td>11</td><td>Rechecks site before patient release; notes patient tolerance</td><td>2/1/0</td></tr><tr><td>12</td><td>Documents completely (site, gauge, attempts, complications, initials)</td><td>2/1/0</td></tr><tr><td>13★</td><td>Throughout: monitors patient stress; verbalizes status; would stop appropriately (probe with scripted question if no natural event: \"your second attempt just failed — what now?\")</td><td>2/1/0</td></tr></tbody></table></div>\n<p><strong>Pass:</strong> ≥21/26 AND no ★ step at 0 AND zero CFs.</p>\n<p><strong>Critical fails:</strong> no ID check · recap/unsafe sharp · third attempt or continuing past stop criteria · ignores overt patient distress (evaluator terminates) · leaves unlabeled sample · unsafe direction to holder (e.g., airway compromise).</p>\n<p><strong>Site-variant anchors:</strong> saphenous — add \"manages limb stabilization/rolling vessel\" at step 5; jugular — add \"neck neutral recheck before release\" to step 11 and \"verbalizes coagulopathy screening question\" to step 1 (★).</p>\n<p><strong>Remediation defaults on fail:</strong> steps 4–6 → model lab + 3 coached draws; step 7/hematoma → mechanics review + coached; step 13 → scenario series <span class=\"id\">SIM-CORE-003</span>. Re-attempt when trainer flags ready, minimum 3 practice days.</p>", "text": "Candidate instructions (read aloud): \"Collect the ordered blood sample from this patient with your holder. Narrate anything you'd normally verbalize. Standard stop rules apply. You may ask for anything you'd ask for on shift.\" Evaluator setup: live patient appropriate to learner stage (or model for re-tests of mechanics), real order (test + volume), holder provided, full supply bench including deliberate inclusion of one WRONG tube type (selection is scored). Prereqs verified: state ≥7, reps logged per spec §24. # Observable behavior Score 1★ Verifies order AND patient identity aloud (two identifiers) before setup 2/1/0 2 Assembles all supplies before positioning; selects correct needle/syringe/tubes for the order 2/1/0 3 Directs holder to correct position + occlusion; confirms holder readiness 2/1/0 4 Palpates and identifies vessel (verbalizes direction/depth); preps site 2/1/0 5 Stabilizes with distal traction; enters bevel-up at appropriate angle 2/1/0 6 Responds correctly to flash (flattens, seats); aspirates gently without collapse 2/1/0 7★ Correct completion order: occlusion released → withdraw → immediate pressure 2/1/0 8★ Sharps directly to container; no recap 2/1/0 9 Transfers promptly, correct fill order, correct mixing (inversions, no shaking) 2/1/0 10★ Labels at patient-side 2/1/0 11 Rechecks site before patient release; notes patient tolerance 2/1/0 12 Documents completely (site, gauge, attempts, complications, initials) 2/1/0 13★ Throughout: monitors patient stress; verbalizes status; would stop appropriately (probe with scripted question if no natural event: \"your second attempt just failed — what now?\") 2/1/0 Pass: ≥21/26 AND no ★ step at 0 AND zero CFs. Critical fails: no ID check · recap/unsafe sharp · third attempt or continuing past stop criteria · ignores overt patient distress (evaluator terminates) · leaves unlabeled sample · unsafe direction to holder (e.g., airway compromise). Site-variant anchors: saphenous — add \"manages limb stabilization/rolling vessel\" at step 5; jugular — add \"neck neutral recheck before release\" to step 11 and \"verbalizes coagulopathy screening question\" to step 1 (★). Remediation defaults on fail: steps 4–6 → model lab + 3 coached draws; step 7/hematoma → mechanics review + coached; step 13 → scenario series SIM-CORE-003 . Re-attempt when trainer flags ready, minimum 3 practice days."}, {"id": "rub-ivc", "title": "IV catheter practical", "group": "Assess", "meta": "printable", "html": "<p><strong>Candidate instructions:</strong> \"Place and secure a cephalic IV catheter per this order. Narrate as on shift.\"</p>\n<p><strong>Evaluator setup:</strong> patient appropriate to stage (model permitted for mechanics re-tests; live placement required for final sign-off), order includes gauge + purpose, holder provided; bench includes multiple gauges (selection scored), one catheter with deliberately damaged packaging (should be rejected).</p>\n<div class=\"tw\"><table><thead><tr><th>#</th><th>Observable behavior</th><th>Score</th></tr></thead><tbody><tr><td>1★</td><td>Order + two-identifier patient check; questions order if mismatched to patient (scripted 18g/kitten probe available)</td><td>2/1/0</td></tr><tr><td>2</td><td>Supplies complete before start: T-port primed, tape pre-torn in order, flush ready; rejects compromised packaging</td><td>2/1/0</td></tr><tr><td>3</td><td>Generous clip; aseptic prep per protocol; no post-prep touch of entry point</td><td>2/1/0</td></tr><tr><td>4</td><td>Distal-first site choice; correct insertion angle; flash recognized</td><td>2/1/0</td></tr><tr><td>5★</td><td>Advances unit 1–2 mm flat BEFORE threading; threads smoothly without force</td><td>2/1/0</td></tr><tr><td>6★</td><td>Never re-advances catheter over stylet; any withdrawal is as a unit (scripted probe if not naturally tested: \"it won't thread — show me your options\")</td><td>2/1/0</td></tr><tr><td>7★</td><td>Stylet directly to sharps at withdrawal</td><td>2/1/0</td></tr><tr><td>8</td><td>Attaches primed T-port; flush assessment verbalized (resistance? bleb? patient response?)</td><td>2/1/0</td></tr><tr><td>9</td><td>Tape architecture: order, tension (one-finger test demonstrated), stress loop</td><td>2/1/0</td></tr><tr><td>10</td><td>Label complete (date/time/gauge/initials); post-wrap flush recheck</td><td>2/1/0</td></tr><tr><td>11</td><td>Documentation complete; case log entry</td><td>2/1/0</td></tr><tr><td>12★</td><td>Attempt discipline + patient monitoring throughout</td><td>2/1/0</td></tr></tbody></table></div>\n<p><strong>Pass:</strong> ≥19/24, no ★ at 0, zero CFs.</p>\n<p><strong>Critical fails:</strong> re-advance over stylet · stylet left out · flushing against firm resistance · no ID check · exceeding attempt limit · circumferential tight tape left unchecked · fails scripted infiltration recognition (\"flush raises a soft bleb — what is that?\").</p>\n<p><strong>Remediation defaults:</strong> threading mechanics → model lab ≥5 + video review; securing → tape drills; recognition → W4-03 re-take + <span class=\"id\">INT-06</span> scenarios.</p>", "text": "Candidate instructions: \"Place and secure a cephalic IV catheter per this order. Narrate as on shift.\" Evaluator setup: patient appropriate to stage (model permitted for mechanics re-tests; live placement required for final sign-off), order includes gauge + purpose, holder provided; bench includes multiple gauges (selection scored), one catheter with deliberately damaged packaging (should be rejected). # Observable behavior Score 1★ Order + two-identifier patient check; questions order if mismatched to patient (scripted 18g/kitten probe available) 2/1/0 2 Supplies complete before start: T-port primed, tape pre-torn in order, flush ready; rejects compromised packaging 2/1/0 3 Generous clip; aseptic prep per protocol; no post-prep touch of entry point 2/1/0 4 Distal-first site choice; correct insertion angle; flash recognized 2/1/0 5★ Advances unit 1–2 mm flat BEFORE threading; threads smoothly without force 2/1/0 6★ Never re-advances catheter over stylet; any withdrawal is as a unit (scripted probe if not naturally tested: \"it won't thread — show me your options\") 2/1/0 7★ Stylet directly to sharps at withdrawal 2/1/0 8 Attaches primed T-port; flush assessment verbalized (resistance? bleb? patient response?) 2/1/0 9 Tape architecture: order, tension (one-finger test demonstrated), stress loop 2/1/0 10 Label complete (date/time/gauge/initials); post-wrap flush recheck 2/1/0 11 Documentation complete; case log entry 2/1/0 12★ Attempt discipline + patient monitoring throughout 2/1/0 Pass: ≥19/24, no ★ at 0, zero CFs. Critical fails: re-advance over stylet · stylet left out · flushing against firm resistance · no ID check · exceeding attempt limit · circumferential tight tape left unchecked · fails scripted infiltration recognition (\"flush raises a soft bleb — what is that?\"). Remediation defaults: threading mechanics → model lab ≥5 + video review; securing → tape drills; recognition → W4-03 re-take + INT-06 scenarios."}, {"id": "rub-res", "title": "Restraint practical A–D", "group": "Assess", "meta": "printable", "html": "<p><strong>Setup:</strong> two live patients (calm dog, tolerant cat) + evaluator role-plays for escalation probes. Sections may be assessed across separate sessions; all four required for <span class=\"id\">TS-RES</span> sign-offs.</p>\n<p><strong>A. Approach &amp; reading (<span class=\"id\">TS-HND-001</span>):</strong> greets/reads before touch (2/1/0) · oblique low approach, no looming (2/1/0) · ★names patient's current signals when asked (2/1/0) · escape audit before barrier removal (2/1/0).</p>\n<p><strong>B. Lateral restraint (<span class=\"id\">TS-RES-001</span>):</strong> controlled takedown, limbs above joints (2/1/0) · ★neck arm placement clear of trachea (2/1/0) · maintains hold with calm patient monitoring (2/1/0) · controlled release (2/1/0).</p>\n<p><strong>C. Sternal/standing (<span class=\"id\">TS-RES-002</span>):</strong> correct hug-hold geometry, face out of bite arc (2/1/0) · prevents sit/whip proactively (2/1/0) · feline meatloaf + towel option used appropriately (2/1/0).</p>\n<p><strong>D. Venipuncture holds (<span class=\"id\">TS-RES-003</span>):</strong> cephalic occlusion/roll/extension correct (2/1/0) · ★jugular head position without hyperextension + airway watch verbalized (2/1/0) · saphenous occlusion + limb management (2/1/0) · releases occlusion on cue while maintaining restraint (2/1/0).</p>\n<p><strong>Universal ★ probe (scripted):</strong> evaluator narrates \"the cat begins open-mouth breathing\" mid-hold — candidate must stop/release position and escalate.</p>\n<p><strong>Pass:</strong> ≥80% per section, no ★ at 0, zero CFs. <strong>Critical fails:</strong> tracheal pressure · dropping patient · face-in-bite-arc after correction · continuing through the scripted distress probe · leaving patient unsecured on table.</p>", "text": "Setup: two live patients (calm dog, tolerant cat) + evaluator role-plays for escalation probes. Sections may be assessed across separate sessions; all four required for TS-RES sign-offs. A. Approach &amp; reading ( TS-HND-001 ): greets/reads before touch (2/1/0) · oblique low approach, no looming (2/1/0) · ★names patient's current signals when asked (2/1/0) · escape audit before barrier removal (2/1/0). B. Lateral restraint ( TS-RES-001 ): controlled takedown, limbs above joints (2/1/0) · ★neck arm placement clear of trachea (2/1/0) · maintains hold with calm patient monitoring (2/1/0) · controlled release (2/1/0). C. Sternal/standing ( TS-RES-002 ): correct hug-hold geometry, face out of bite arc (2/1/0) · prevents sit/whip proactively (2/1/0) · feline meatloaf + towel option used appropriately (2/1/0). D. Venipuncture holds ( TS-RES-003 ): cephalic occlusion/roll/extension correct (2/1/0) · ★jugular head position without hyperextension + airway watch verbalized (2/1/0) · saphenous occlusion + limb management (2/1/0) · releases occlusion on cue while maintaining restraint (2/1/0). Universal ★ probe (scripted): evaluator narrates \"the cat begins open-mouth breathing\" mid-hold — candidate must stop/release position and escalate. Pass: ≥80% per section, no ★ at 0, zero CFs. Critical fails: tracheal pressure · dropping patient · face-in-bite-arc after correction · continuing through the scripted distress probe · leaving patient unsecured on table."}, {"id": "rub-tpr", "title": "TPR practical", "group": "Assess", "meta": "printable", "html": "<p><strong>Setup:</strong> live patient; evaluator takes parallel/immediately-sequential values for tolerance comparison (T ±0.2°F, HR ±8, RR ±4).</p>\n<p>Steps: RR counted before handling, from distance, character noted (2/1/0★) · auscultation placement + simultaneous femoral pulse, rhythm/quality noted (2/1/0) · temperature technique safe/hygienic, stays with patient (2/1/0) · MM/CRT + quick hydration observation (2/1/0) · ★values within tolerance of evaluator's (2/1/0) · immediate documentation, complete fields (2/1/0) · ★scripted probe: evaluator states \"your temp reads 104.9\" — candidate reports now, not at rounds (2/1/0).</p>\n<p><strong>Pass:</strong> ≥11/14, no ★ at 0. <strong>Critical fails:</strong> fabricated value (evaluator observed non-measurement) · gross value miss presented confidently (&gt;2× tolerance) without flagging difficulty · failure on the report-now probe.</p>", "text": "Setup: live patient; evaluator takes parallel/immediately-sequential values for tolerance comparison (T ±0.2°F, HR ±8, RR ±4). Steps: RR counted before handling, from distance, character noted (2/1/0★) · auscultation placement + simultaneous femoral pulse, rhythm/quality noted (2/1/0) · temperature technique safe/hygienic, stays with patient (2/1/0) · MM/CRT + quick hydration observation (2/1/0) · ★values within tolerance of evaluator's (2/1/0) · immediate documentation, complete fields (2/1/0) · ★scripted probe: evaluator states \"your temp reads 104.9\" — candidate reports now, not at rounds (2/1/0). Pass: ≥11/14, no ★ at 0. Critical fails: fabricated value (evaluator observed non-measurement) · gross value miss presented confidently (&gt;2× tolerance) without flagging difficulty · failure on the report-now probe."}, {"id": "rub-compact", "title": "Compact set: injections, meds, fluids, surgery, imaging, SBAR-V", "group": "Assess", "meta": "printable", "html": "<p>Standards per <code>Rubric_Standards.md</code> (2/1/0, ★ = no-zero steps, CF ends attempt). Each pass ≥80%, no ★ zeros, zero CFs.</p>\n<h3><span class=\"id\">PA-INJ-SQ-001</span> (SQ/IM anchor sets)</h3>\n<p>★Five-rights verification aloud with verifier · ★patient ID · site selection per house map (IM: epaxial default; ★caudal thigh = CF) · tent/muscle technique · ★aspiration before injection · steady delivery + post-watch 30 s · sharps · charting incl. site · scripted probe: \"wet fur — some went through\" → reports, no silent re-dose (★). CFs: unverified dose · skipped aspiration · banned site · silent re-dose · recap.</p>\n<h3><span class=\"id\">PA-MED-001</span> (medication preparation; graduation station 6 core)</h3>\n<p>★Order interpreted correctly (ambiguous scripted order must be queried) · three label checks performed aloud · math shown and correct (two calculations, one designed decimal-trap) · ★syringe labeled before leaving hand · verifier engagement correct · controlled-substance scripted question answered (witnessed/logged workflow) · discrepancy probe: stock strength differs from order assumption → stops and re-verifies (★). CFs: unlabeled syringe · unresolved discrepancy proceeded · math error undetected through all checks.</p>\n<h3><span class=\"id\">PA-FLU-001</span> (fluids + pump; station 7)</h3>\n<p>Order verification incl. ★additive-bag rule stated · bag inspection (scripted cloudy bag must be rejected ★) · aseptic spike · chamber fill · full prime, line inspected against light, zero visible air · ★clamp-before-door discipline (probe: \"load the pump\") · rate/VTBI entry + verification path stated · label · connection with stress loop · line-trace demo + site check narrated · alarm probe (occlusion staged) → traces before silencing (★). CFs: free-flow event · air-filled line connected · additive bag hung unverified · alarm silenced blind.</p>\n<h3><span class=\"id\">PA-SUR-PREP-001</span> (station 9)</h3>\n<p>★Site/side verbalized against record + board (mismatch probe scripted) · clip quality/margins per card · blade-temp checks · vacuum · center-out discipline, gauze never returns inward · contact cycles/endpoint met · no pooling; warmth guarded · ★prepped area untouched after (transport plan stated). CFs: unresolved site/side mismatch · contaminated-and-continued · unreported clipper lesion (staged skin mark must be reported).</p>\n<h3><span class=\"id\">PA-SUR-STER-001</span> (station 8)</h3>\n<p>Package integrity + indicator checks (★sabotaged pack must be caught) · orientation correct, first flap away · edges-only handling · peel-pouch presentation without popping/hover · flip-drop without plane violation · pour technique · ★doubt-declaration probe: evaluator creates ambiguous near-touch — candidate declares. CFs: undeclared contamination · integrity-failed pack used.</p>\n<h3><span class=\"id\">PA-IMG-001</span> (station 10; requires radiation module 100% first)</h3>\n<p>★PPE + dosimeter worn correctly · ★nobody/nothing in primary beam (probe scripted) · positioning to view spec (lateral thorax + VD abdomen minimum) · rotation self-check verbalized on result · marker before exposure · collimation appropriate · exposure timing to respiration · retake decision reasoning (one staged fault image supplied) · patient stress managed. CFs: beam violation · no PPE · unbadged participation · blind retake (no change named).</p>\n<h3><span class=\"id\">PA-COM-001</span> (SBAR-V; graduation gate 6)</h3>\n<p>Two scored reports (one real finding, one scripted urgent scenario). Anchors: leads with patient/location (2/1/0) · numbers + trend not adjectives (2/1/0) · ★no diagnosis/prescription language (2/1/0) · explicit urgency word (2/1/0) · ★closes loop with verify-back (2/1/0) · charts the report (2/1/0). CF: scripted urgent scenario reported to a non-decision-maker or delayed (\"I'd wait for rounds\").</p>", "text": "Standards per Rubric_Standards.md (2/1/0, ★ = no-zero steps, CF ends attempt). Each pass ≥80%, no ★ zeros, zero CFs. PA-INJ-SQ-001 (SQ/IM anchor sets) ★Five-rights verification aloud with verifier · ★patient ID · site selection per house map (IM: epaxial default; ★caudal thigh = CF) · tent/muscle technique · ★aspiration before injection · steady delivery + post-watch 30 s · sharps · charting incl. site · scripted probe: \"wet fur — some went through\" → reports, no silent re-dose (★). CFs: unverified dose · skipped aspiration · banned site · silent re-dose · recap. PA-MED-001 (medication preparation; graduation station 6 core) ★Order interpreted correctly (ambiguous scripted order must be queried) · three label checks performed aloud · math shown and correct (two calculations, one designed decimal-trap) · ★syringe labeled before leaving hand · verifier engagement correct · controlled-substance scripted question answered (witnessed/logged workflow) · discrepancy probe: stock strength differs from order assumption → stops and re-verifies (★). CFs: unlabeled syringe · unresolved discrepancy proceeded · math error undetected through all checks. PA-FLU-001 (fluids + pump; station 7) Order verification incl. ★additive-bag rule stated · bag inspection (scripted cloudy bag must be rejected ★) · aseptic spike · chamber fill · full prime, line inspected against light, zero visible air · ★clamp-before-door discipline (probe: \"load the pump\") · rate/VTBI entry + verification path stated · label · connection with stress loop · line-trace demo + site check narrated · alarm probe (occlusion staged) → traces before silencing (★). CFs: free-flow event · air-filled line connected · additive bag hung unverified · alarm silenced blind. PA-SUR-PREP-001 (station 9) ★Site/side verbalized against record + board (mismatch probe scripted) · clip quality/margins per card · blade-temp checks · vacuum · center-out discipline, gauze never returns inward · contact cycles/endpoint met · no pooling; warmth guarded · ★prepped area untouched after (transport plan stated). CFs: unresolved site/side mismatch · contaminated-and-continued · unreported clipper lesion (staged skin mark must be reported). PA-SUR-STER-001 (station 8) Package integrity + indicator checks (★sabotaged pack must be caught) · orientation correct, first flap away · edges-only handling · peel-pouch presentation without popping/hover · flip-drop without plane violation · pour technique · ★doubt-declaration probe: evaluator creates ambiguous near-touch — candidate declares. CFs: undeclared contamination · integrity-failed pack used. PA-IMG-001 (station 10; requires radiation module 100% first) ★PPE + dosimeter worn correctly · ★nobody/nothing in primary beam (probe scripted) · positioning to view spec (lateral thorax + VD abdomen minimum) · rotation self-check verbalized on result · marker before exposure · collimation appropriate · exposure timing to respiration · retake decision reasoning (one staged fault image supplied) · patient stress managed. CFs: beam violation · no PPE · unbadged participation · blind retake (no change named). PA-COM-001 (SBAR-V; graduation gate 6) Two scored reports (one real finding, one scripted urgent scenario). Anchors: leads with patient/location (2/1/0) · numbers + trend not adjectives (2/1/0) · ★no diagnosis/prescription language (2/1/0) · explicit urgency word (2/1/0) · ★closes loop with verify-back (2/1/0) · charts the report (2/1/0). CF: scripted urgent scenario reported to a non-decision-maker or delayed (\"I'd wait for rounds\")."}, {"id": "rub-spec", "title": "Specialty practicals", "group": "Assess", "meta": "printable", "html": "<p>Standards per <code>Rubric_Standards.md</code>. Pass ≥80%, no ★ zeros, zero CFs, assessor = CVT/DVM with the relevant competency.</p>\n<h3><span class=\"id\">PA-ANES-MACH-001</span> (machine check &amp; leak test)</h3>\n<p>Full check sequence order (O2 → flow → vaporizer → absorbent → circuit build → scavenge → leak test → airway kit) · ★leak test executed with manometer discipline · ★APL reopened and verbalized at test end · staged fault caught (planted: closed APL / exhausted absorbent / circuit leak — drawn by lot) · documentation on machine log. CFs: APL left closed · staged fault missed AND signed off.</p>\n<h3><span class=\"id\">PA-ANES-MON-001</span> (monitoring support, live case + drill)</h3>\n<p>Live case: 5-min cycle discipline sustained (hands-eyes before numbers) · record complete, trends drawn, events stamped · ★report thresholds honored per <span class=\"id\">CRC-003</span> (staged prompt if quiet case) · artifact check sequence performed with simultaneous report · ★no silent troubleshooting; no dial-touching (probe scripted: anesthetist absent, \"just turn it down a touch\" note left — must refuse/clarify live with DVM). Drill: one <span class=\"id\">SIM-ANES</span> case run live with verbal five-question reasoning. CFs: fabricated record cell · vaporizer/APL touched without direct in-the-moment instruction · deterioration observed and unreported.</p>\n<h3><span class=\"id\">PA-ECC-001</span> (emergency support)</h3>\n<p>2-min compression cycle: rate in 100–120 (metronome-verified), recoil, swap &lt;5 s gap (2/1/0 each, ★rate) · staging drill under time standard · role scenario with ★closed-loop repeats (3 planted) · recorder exercise vs script ≥90% capture · cart audit performed honestly (planted deficiency must block signature ★). CFs: role freelancing (drug handling) · cart signed with deficiency.</p>\n<h3><span class=\"id\">PA-INP-001</span> (ward practical)</h3>\n<p>Planted-abnormality round (3 plants; ≥2 caught with correct urgency, ★the report-now plant) · device circuit: line trace, urinary system, feeding-tube site, bandage checks narrated · I/O math exercise correct · pain-score calibration case within 1 point · ★handoff given to rubric (trend/due/watch/read-back). CFs: report-now plant missed · fabricated check.</p>\n<h3><span class=\"id\">PA-LID-001</span> (lab QC practical)</h3>\n<p>Daily QC cycle run + logged correctly · ★staged QC failure: response tree followed, patient sample correctly held/rerouted · analyzer maintenance task performed per job aid · smear-quality gate applied (bad smear remade unprompted) · error-code lookup exercise. CFs: patient result released over failed QC.</p>\n<h3><span class=\"id\">PA-DEN-001</span> (dental support practical)</h3>\n<p>Full-mouth series on model: diagnostic quality, ≤20% retakes, ★series counted complete before \"waking\" · station setup/breakdown to checklist · ★staged pooling/hypothermia events reported · charting scribe exercise ≥90% accuracy. CFs: staged airway event missed · gag policy violated.</p>\n<h3><span class=\"id\">PA-IMG-101</span> (imaging portfolio defense)</h3>\n<p>Portfolio of 12 studies reviewed with assessor: candidate self-identifies any faults per image (★self-audit accuracy) · live study: full <span class=\"id\">PA-IMG-001</span> anchors at specialty polish · fault-gallery spot test ≥90%. CFs: as <span class=\"id\">PA-IMG-001</span>.</p>\n<h3><span class=\"id\">PA-PHA-001</span> (dispensing line practical)</h3>\n<p>Order set of 5 processed: ★ambiguous order stopped · ★LASA trap caught · count discrepancy caught and reported · labels/logs audit-clean · verification choreography with verifier correct · controlled-substance mock draw witnessed/logged/balanced. CFs: trap dispensed · discrepancy \"fixed\" without report.</p>", "text": "Standards per Rubric_Standards.md . Pass ≥80%, no ★ zeros, zero CFs, assessor = CVT/DVM with the relevant competency. PA-ANES-MACH-001 (machine check &amp; leak test) Full check sequence order (O2 → flow → vaporizer → absorbent → circuit build → scavenge → leak test → airway kit) · ★leak test executed with manometer discipline · ★APL reopened and verbalized at test end · staged fault caught (planted: closed APL / exhausted absorbent / circuit leak — drawn by lot) · documentation on machine log. CFs: APL left closed · staged fault missed AND signed off. PA-ANES-MON-001 (monitoring support, live case + drill) Live case: 5-min cycle discipline sustained (hands-eyes before numbers) · record complete, trends drawn, events stamped · ★report thresholds honored per CRC-003 (staged prompt if quiet case) · artifact check sequence performed with simultaneous report · ★no silent troubleshooting; no dial-touching (probe scripted: anesthetist absent, \"just turn it down a touch\" note left — must refuse/clarify live with DVM). Drill: one SIM-ANES case run live with verbal five-question reasoning. CFs: fabricated record cell · vaporizer/APL touched without direct in-the-moment instruction · deterioration observed and unreported. PA-ECC-001 (emergency support) 2-min compression cycle: rate in 100–120 (metronome-verified), recoil, swap &lt;5 s gap (2/1/0 each, ★rate) · staging drill under time standard · role scenario with ★closed-loop repeats (3 planted) · recorder exercise vs script ≥90% capture · cart audit performed honestly (planted deficiency must block signature ★). CFs: role freelancing (drug handling) · cart signed with deficiency. PA-INP-001 (ward practical) Planted-abnormality round (3 plants; ≥2 caught with correct urgency, ★the report-now plant) · device circuit: line trace, urinary system, feeding-tube site, bandage checks narrated · I/O math exercise correct · pain-score calibration case within 1 point · ★handoff given to rubric (trend/due/watch/read-back). CFs: report-now plant missed · fabricated check. PA-LID-001 (lab QC practical) Daily QC cycle run + logged correctly · ★staged QC failure: response tree followed, patient sample correctly held/rerouted · analyzer maintenance task performed per job aid · smear-quality gate applied (bad smear remade unprompted) · error-code lookup exercise. CFs: patient result released over failed QC. PA-DEN-001 (dental support practical) Full-mouth series on model: diagnostic quality, ≤20% retakes, ★series counted complete before \"waking\" · station setup/breakdown to checklist · ★staged pooling/hypothermia events reported · charting scribe exercise ≥90% accuracy. CFs: staged airway event missed · gag policy violated. PA-IMG-101 (imaging portfolio defense) Portfolio of 12 studies reviewed with assessor: candidate self-identifies any faults per image (★self-audit accuracy) · live study: full PA-IMG-001 anchors at specialty polish · fault-gallery spot test ≥90%. CFs: as PA-IMG-001 . PA-PHA-001 (dispensing line practical) Order set of 5 processed: ★ambiguous order stopped · ★LASA trap caught · count discrepancy caught and reported · labels/logs audit-clean · verification choreography with verifier correct · controlled-substance mock draw witnessed/logged/balanced. CFs: trap dispensed · discrepancy \"fixed\" without report."}, {"id": "rub-grad", "title": "Core graduation — 13 stations", "group": "Assess", "meta": "printable", "html": "<p><strong>Format:</strong> circuit run in one morning (or two blocks); each station 8–12 min; standardized setups; two assessors split the circuit; scripted probes fixed per exam cycle for fairness. <strong>Pass:</strong> ≥11/13 stations passed INCLUDING all five safety-critical (★) stations; zero critical fails anywhere. A CF fails that station and triggers targeted remediation before re-attempt of that station only.</p>\n<div class=\"tw\"><table><thead><tr><th>#</th><th>Station</th><th>Instrument</th><th>★</th></tr></thead><tbody><tr><td>1</td><td>Patient restraint circuit (dog + cat, three positions + distress probe)</td><td><span class=\"id\">PA-RES-001</span> condensed</td><td></td></tr><tr><td>2</td><td>TPR + abnormal-value response</td><td><span class=\"id\">PA-ASM-TPR-001</span></td><td>★</td></tr><tr><td>3</td><td>Venipuncture (live or model per candidate's case-mix, site drawn by lot)</td><td><span class=\"id\">PA-VEN-CEPH-001</span></td><td>★</td></tr><tr><td>4</td><td>IV catheter place/assist per policy track + troubleshooting probes</td><td><span class=\"id\">PA-IVC-CEPH-001</span></td><td>★</td></tr><tr><td>5</td><td>Sample processing bench: tubes/fill-order/smear/PCV-TS + artifact identification tray</td><td>PA anchors + QB practical items</td><td></td></tr><tr><td>6</td><td>Medication preparation + calculation + verification choreography</td><td><span class=\"id\">PA-MED-001</span></td><td>★</td></tr><tr><td>7</td><td>Fluid line setup + pump load + staged alarm</td><td><span class=\"id\">PA-FLU-001</span></td><td></td></tr><tr><td>8</td><td>Sterile opening + sabotage catches</td><td><span class=\"id\">PA-SUR-STER-001</span></td><td></td></tr><tr><td>9</td><td>Surgical prep (model/volunteer patient per case-mix) + site/side probe</td><td><span class=\"id\">PA-SUR-PREP-001</span></td><td></td></tr><tr><td>10</td><td>Radiographic positioning + safety probes</td><td><span class=\"id\">PA-IMG-001</span></td><td></td></tr><tr><td>11</td><td>Ward round: 3-kennel scenario with planted abnormalities (wet wrap, NPO conflict, trend chart)</td><td><span class=\"id\">PA-INP-001</span> anchors</td><td></td></tr><tr><td>12</td><td>Emergency response: activation drill + 2-min compression quality + equipment staging</td><td><span class=\"id\">PA-EMR</span>/ECC anchors</td><td>★</td></tr><tr><td>13</td><td>Documentation &amp; communication: chart the morning's stations + one SBAR-V to an evaluator-DVM</td><td><span class=\"id\">PA-COM-001</span> + audit</td><td></td></tr></tbody></table></div>\n<p><strong>Station 11 build sheet:</strong> kennel A — treatment sheet shows NPO but food bowl present (must catch/resolve); kennel B — \"patient\" (model/volunteer dog) with vetwrap applied wet and snug (must flag); kennel C — trend chart HR rising across three checks below threshold (must report trend). Detection AND correct urgency both scored.</p>\n<p><strong>Logistics:</strong> patients: staff-owned volunteers/models per ethics note (no extra procedures on clinical patients for exam purposes — live elements ride real ordered care where timing allows, else models); paperwork pack printed per candidate; results entered into passport same day; readiness review scheduled within one week of pass.</p>", "text": "Format: circuit run in one morning (or two blocks); each station 8–12 min; standardized setups; two assessors split the circuit; scripted probes fixed per exam cycle for fairness. Pass: ≥11/13 stations passed INCLUDING all five safety-critical (★) stations; zero critical fails anywhere. A CF fails that station and triggers targeted remediation before re-attempt of that station only. # Station Instrument ★ 1 Patient restraint circuit (dog + cat, three positions + distress probe) PA-RES-001 condensed 2 TPR + abnormal-value response PA-ASM-TPR-001 ★ 3 Venipuncture (live or model per candidate's case-mix, site drawn by lot) PA-VEN-CEPH-001 ★ 4 IV catheter place/assist per policy track + troubleshooting probes PA-IVC-CEPH-001 ★ 5 Sample processing bench: tubes/fill-order/smear/PCV-TS + artifact identification tray PA anchors + QB practical items 6 Medication preparation + calculation + verification choreography PA-MED-001 ★ 7 Fluid line setup + pump load + staged alarm PA-FLU-001 8 Sterile opening + sabotage catches PA-SUR-STER-001 9 Surgical prep (model/volunteer patient per case-mix) + site/side probe PA-SUR-PREP-001 10 Radiographic positioning + safety probes PA-IMG-001 11 Ward round: 3-kennel scenario with planted abnormalities (wet wrap, NPO conflict, trend chart) PA-INP-001 anchors 12 Emergency response: activation drill + 2-min compression quality + equipment staging PA-EMR /ECC anchors ★ 13 Documentation &amp; communication: chart the morning's stations + one SBAR-V to an evaluator-DVM PA-COM-001 + audit Station 11 build sheet: kennel A — treatment sheet shows NPO but food bowl present (must catch/resolve); kennel B — \"patient\" (model/volunteer dog) with vetwrap applied wet and snug (must flag); kennel C — trend chart HR rising across three checks below threshold (must report trend). Detection AND correct urgency both scored. Logistics: patients: staff-owned volunteers/models per ethics note (no extra procedures on clinical patients for exam purposes — live elements ride real ordered care where timing allows, else models); paperwork pack printed per candidate; results entered into passport same day; readiness review scheduled within one week of pass."}, {"id": "rub-std", "title": "Scoring standards & critical fails", "group": "Assess", "meta": "printable", "html": "<p>All PA rubrics use observable behavioral anchors only. Scoring per step: <strong>2</strong> = performed correctly without prompt · <strong>1</strong> = performed with minor prompt/self-corrected hesitation · <strong>0</strong> = not performed / performed incorrectly / required full prompt. <strong>CF</strong> = critical fail (attempt ends immediately, automatic fail regardless of score; targeted remediation assigned before re-attempt).</p>\n<p>Pass standard per rubric: stated minimum % of available points AND no step scored 0 in sections marked ★ AND zero CFs. Assessor requirements per <code>01_University_Governance/Governance_Roles.md</code>. Every assessment records: date, patient/model, context, per-step scores, narrative strengths/gaps, remediation if assigned, assessor signature, learner signature (acknowledgment, not agreement requirement).</p>\n<p>Banned scoring language: \"seems comfortable,\" \"pretty good,\" \"has the idea.\" If it isn't a behavior you observed, it isn't on the form.</p>", "text": "All PA rubrics use observable behavioral anchors only. Scoring per step: 2 = performed correctly without prompt · 1 = performed with minor prompt/self-corrected hesitation · 0 = not performed / performed incorrectly / required full prompt. CF = critical fail (attempt ends immediately, automatic fail regardless of score; targeted remediation assigned before re-attempt). Pass standard per rubric: stated minimum % of available points AND no step scored 0 in sections marked ★ AND zero CFs. Assessor requirements per 01_University_Governance/Governance_Roles.md . Every assessment records: date, patient/model, context, per-step scores, narrative strengths/gaps, remediation if assigned, assessor signature, learner signature (acknowledgment, not agreement requirement). Banned scoring language: \"seems comfortable,\" \"pretty good,\" \"has the idea.\" If it isn't a behavior you observed, it isn't on the form."}, {"id": "case-reps", "title": "Repetition requirements", "group": "Assess", "meta": "", "html": "<p>Rationale principle: repetition counts are set where motor-learning and variation coverage justify them, reviewed annually against analytics (<code>22_Analytics/</code> attempts-to-competency data), and never inflated for ritual. \"Success\" = completed to spec without unresolved complication; spread requirements force variation, the real driver of reliability.</p>\n<div class=\"tw\"><table><thead><tr><th>Skill</th><th>Before practical assessment</th><th>For state 9→10</th><th>Spread requirement</th><th>Rationale</th></tr></thead><tbody><tr><td><span class=\"id\">TS-VEN-CEPH-001</span></td><td>10 model + 3 observed + 5 coached live</td><td>15 logged successes, ≥80% ≤2-attempt</td><td>≥2 species; ≥1 difficult-flag</td><td>Vessel variation is the skill</td></tr><tr><td><span class=\"id\">TS-VEN-SAPH-001</span></td><td>5 coached (≥2 feline medial)</td><td>8 logged</td><td>both variants</td><td>Site mechanics differ</td></tr><tr><td><span class=\"id\">TS-VEN-JUG-001</span></td><td>3 observed + 5 coached (S1)</td><td>10 logged</td><td>≥2 feline</td><td>Airway-adjacent risk</td></tr><tr><td><span class=\"id\">TS-IVC-CEPH-001</span></td><td>10 model + 3 observed + 5 coached</td><td>12 logged, ≥75% ≤2-attempt</td><td>≥3 patient categories</td><td>Threading + securing across conformations</td></tr><tr><td><span class=\"id\">TS-INJ-SQ-001</span></td><td>3 model + 5 coached</td><td>10 logged</td><td>vaccine + med + fluids</td><td>Verification choreography habituation</td></tr><tr><td><span class=\"id\">TS-INJ-IM-001</span></td><td>3 model + 5 coached S1</td><td>8 logged</td><td>≥2 sites</td><td>Site discipline</td></tr><tr><td><span class=\"id\">TS-ASM-001</span></td><td>10 coached w/ tolerance match</td><td>n/a (state 9 at pass)</td><td>≥3 feline</td><td>Accuracy calibration</td></tr><tr><td><span class=\"id\">TS-RES-001</span>/002/003</td><td>per spec (5–10 coached each)</td><td>n/a</td><td>sizes + species</td><td>Motor variation</td></tr><tr><td><span class=\"id\">TS-FLU-001</span>/002</td><td>5 setups + staged alarms</td><td>8 logged</td><td>incl. pediatric set + additive-verified bag</td><td>Error-path exposure</td></tr><tr><td><span class=\"id\">TS-SUR-PREP-001</span></td><td>5 coached</td><td>8 logged</td><td>≥2 procedure types</td><td>Margin/site variation</td></tr><tr><td><span class=\"id\">TS-SUR-STER-001</span></td><td>10 dry-lab incl. sabotage</td><td>n/a</td><td>pack/pouch/pour</td><td>Cheap to drill; catch-rate is the metric</td></tr><tr><td><span class=\"id\">TS-IMG-001</span></td><td>8 coached studies</td><td>10 logged</td><td>thorax+abdomen, both views</td><td>Retake-rate driven</td></tr><tr><td><span class=\"id\">TS-ANE-103</span></td><td>10 monitored cases + 1 staged drill</td><td>15 cases</td><td>≥3 procedure types incl. 1 long dental</td><td>Trend exposure requires case time</td></tr><tr><td><span class=\"id\">TS-ECC-102</span></td><td>drills to metronome standard</td><td>quarterly mocks</td><td>roles rotated</td><td>Skill decays fast; cadence per RECOVER</td></tr></tbody></table></div>\n<p>Counts may be reduced case-by-case ONLY by challenge-out (demonstrated mastery on assessment + evaluator judgment, logged with justification) — never by schedule pressure.</p>", "text": "Rationale principle: repetition counts are set where motor-learning and variation coverage justify them, reviewed annually against analytics ( 22_Analytics/ attempts-to-competency data), and never inflated for ritual. \"Success\" = completed to spec without unresolved complication; spread requirements force variation, the real driver of reliability. Skill Before practical assessment For state 9→10 Spread requirement Rationale TS-VEN-CEPH-001 10 model + 3 observed + 5 coached live 15 logged successes, ≥80% ≤2-attempt ≥2 species; ≥1 difficult-flag Vessel variation is the skill TS-VEN-SAPH-001 5 coached (≥2 feline medial) 8 logged both variants Site mechanics differ TS-VEN-JUG-001 3 observed + 5 coached (S1) 10 logged ≥2 feline Airway-adjacent risk TS-IVC-CEPH-001 10 model + 3 observed + 5 coached 12 logged, ≥75% ≤2-attempt ≥3 patient categories Threading + securing across conformations TS-INJ-SQ-001 3 model + 5 coached 10 logged vaccine + med + fluids Verification choreography habituation TS-INJ-IM-001 3 model + 5 coached S1 8 logged ≥2 sites Site discipline TS-ASM-001 10 coached w/ tolerance match n/a (state 9 at pass) ≥3 feline Accuracy calibration TS-RES-001 /002/003 per spec (5–10 coached each) n/a sizes + species Motor variation TS-FLU-001 /002 5 setups + staged alarms 8 logged incl. pediatric set + additive-verified bag Error-path exposure TS-SUR-PREP-001 5 coached 8 logged ≥2 procedure types Margin/site variation TS-SUR-STER-001 10 dry-lab incl. sabotage n/a pack/pouch/pour Cheap to drill; catch-rate is the metric TS-IMG-001 8 coached studies 10 logged thorax+abdomen, both views Retake-rate driven TS-ANE-103 10 monitored cases + 1 staged drill 15 cases ≥3 procedure types incl. 1 long dental Trend exposure requires case time TS-ECC-102 drills to metronome standard quarterly mocks roles rotated Skill decays fast; cadence per RECOVER Counts may be reduced case-by-case ONLY by challenge-out (demonstrated mastery on assessment + evaluator judgment, logged with justification) — never by schedule pressure."}, {"id": "case-log", "title": "Case log & pocket card", "group": "Assess", "meta": "", "html": "<h3>Purpose</h3>\n<p>One successful performance proves luck; logged consistency across patient variation proves competency. Logs are the evidence layer for passport states 6→10 and revalidation decay rules.</p>\n<h3>Log entry schema (per attempt) — <code>case_log_template.csv</code></h3>\n<p><code>log_id, date, employee_id, skill_id, role (observed|assisted|performed), patient_species, patient_category (routine|small&lt;5kg|geriatric|dehydrated|fractious|critical-adjacent), attempts_this_patient, outcome (success|unsuccessful|aborted-stop-criteria), complications (none|hematoma|infiltration|stress-stop|equipment|other:note), supervisor_id, supervision_level (S1|S2), feedback_note, countersigned (Y|N)</code></p>\n<h3>Rules</h3>\n<ol>\n<li>EVERY attempt is logged, unsuccessful and aborted included — an aborted-at-stop-criteria entry is evidence of competence, not failure.</li>\n<li>Supervisor countersigns entries at states ≤8 (same shift).</li>\n<li>The system computes rolling success rate, patient-category spread, and recency; passports auto-flag Revalidation Due on decay rules (per skill spec).</li>\n<li>Falsified log = integrity violation per governance doc.</li>\n</ol>\n<h3>Implementation</h3>\n<p>Launch: printed pocket cards (template <code>case_log_card_print.md</code>) transcribed same-day to the shared register CSV / Moodle Database activity; assessor mobile entry per <code>21_Dashboards/Assessor_Interface_Spec.md</code>. The CSV schema above is canonical either way.</p>", "text": "Purpose One successful performance proves luck; logged consistency across patient variation proves competency. Logs are the evidence layer for passport states 6→10 and revalidation decay rules. Log entry schema (per attempt) — case_log_template.csv log_id, date, employee_id, skill_id, role (observed|assisted|performed), patient_species, patient_category (routine|small&lt;5kg|geriatric|dehydrated|fractious|critical-adjacent), attempts_this_patient, outcome (success|unsuccessful|aborted-stop-criteria), complications (none|hematoma|infiltration|stress-stop|equipment|other:note), supervisor_id, supervision_level (S1|S2), feedback_note, countersigned (Y|N) Rules EVERY attempt is logged, unsuccessful and aborted included — an aborted-at-stop-criteria entry is evidence of competence, not failure. Supervisor countersigns entries at states ≤8 (same shift). The system computes rolling success rate, patient-category spread, and recency; passports auto-flag Revalidation Due on decay rules (per skill spec). Falsified log = integrity violation per governance doc. Implementation Launch: printed pocket cards (template case_log_card_print.md ) transcribed same-day to the shared register CSV / Moodle Database activity; assessor mobile entry per 21_Dashboards/Assessor_Interface_Spec.md . The CSV schema above is canonical either way."}, {"id": "grad", "title": "Graduation — the nine gates", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08-17</p>\n<p><strong>CVAH VA Core Graduate</strong> is granted only when ALL nine gates are met. Online completion alone never equals technical clearance. No gate is waived for calendar time served.</p>\n<div class=\"tw\"><table><thead><tr><th>#</th><th>Gate</th><th>Standard</th><th>Evidence</th></tr></thead><tbody><tr><td>1</td><td>Knowledge</td><td>All required Core modules passed ≥80%</td><td>LMS gradebook</td></tr><tr><td>2</td><td>Safety</td><td>All safety-critical assessments passed at 100% (retake permitted after remediation; the safety-critical items themselves must all be answered correctly on the passing attempt)</td><td>LMS + item flags</td></tr><tr><td>3</td><td>Technical skill</td><td>All VA2-required practical competencies at state ≥8; restraint/TPR/sanitation at ≥9</td><td>Passport</td></tr><tr><td>4</td><td>Repetition</td><td>Repetition requirements met per <code>16_Case_Logs/Repetition_Requirements.md</code>, across the required patient-type spread</td><td>Case logs</td></tr><tr><td>5</td><td>Recognition</td><td>Recognition battery ≥85%, including all critical-recognition items correct</td><td>13_Assessments/Recognition_Battery</td></tr><tr><td>6</td><td>Communication</td><td>Two logged real or simulated abnormal-finding reports rated satisfactory on the SBAR-V rubric</td><td><span class=\"id\">PA-COM-001</span></td></tr><tr><td>7</td><td>Documentation</td><td>Documentation audit of 10 consecutive real entries: zero patient-ID errors, ≤1 minor correction</td><td>Audit form</td></tr><tr><td>8</td><td>Integrated practical</td><td>Core Graduation Practical: pass ≥11 of 13 stations incl. ALL five safety-critical stations, zero critical fails</td><td><code>15_Practical_Competencies/Core_Graduation_Practical_Stations.md</code></td></tr><tr><td>9</td><td>Readiness review</td><td>Manager + Supervising Veterinarian + lead Assessor sign the readiness review form</td><td>Signed form</td></tr></tbody></table></div>\n<p><strong>Timing:</strong> target Weeks 6–8. Early graduation permitted any time all gates pass. If gates remain unmet at Week 8: structured gap-closure plan (Week 8 lesson W8-02), reassessment scheduled; outer window ~16 weeks triggers a Manager/Medical Reviewer conference — continuation, role redesign, or employment decision per HR policy. Remediation is normal and unstigmatized; the passport shows current state, not a count of tries, on the learner-facing view (full history remains in the audit log).</p>", "text": "Version 1.0 · 2026-08-17 CVAH VA Core Graduate is granted only when ALL nine gates are met. Online completion alone never equals technical clearance. No gate is waived for calendar time served. # Gate Standard Evidence 1 Knowledge All required Core modules passed ≥80% LMS gradebook 2 Safety All safety-critical assessments passed at 100% (retake permitted after remediation; the safety-critical items themselves must all be answered correctly on the passing attempt) LMS + item flags 3 Technical skill All VA2-required practical competencies at state ≥8; restraint/TPR/sanitation at ≥9 Passport 4 Repetition Repetition requirements met per 16_Case_Logs/Repetition_Requirements.md , across the required patient-type spread Case logs 5 Recognition Recognition battery ≥85%, including all critical-recognition items correct 13_Assessments/Recognition_Battery 6 Communication Two logged real or simulated abnormal-finding reports rated satisfactory on the SBAR-V rubric PA-COM-001 7 Documentation Documentation audit of 10 consecutive real entries: zero patient-ID errors, ≤1 minor correction Audit form 8 Integrated practical Core Graduation Practical: pass ≥11 of 13 stations incl. ALL five safety-critical stations, zero critical fails 15_Practical_Competencies/Core_Graduation_Practical_Stations.md 9 Readiness review Manager + Supervising Veterinarian + lead Assessor sign the readiness review form Signed form Timing: target Weeks 6–8. Early graduation permitted any time all gates pass. If gates remain unmet at Week 8: structured gap-closure plan (Week 8 lesson W8-02), reassessment scheduled; outer window ~16 weeks triggers a Manager/Medical Reviewer conference — continuation, role redesign, or employment decision per HR policy. Remediation is normal and unstigmatized; the passport shows current state, not a count of tries, on the learner-facing view (full history remains in the audit log)."}, {"id": "valev", "title": "VA1 / VA2 / VA3 standards", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08-17</p>\n<p>VA levels are <strong>competency milestones inside the University</strong>, not separate courses. A level is granted when its full standard is met — never because time passed. Typical (not required) timing: VA1 ≈ end of Week 2; VA2 ≈ Weeks 5–6; Core Graduate ≈ Weeks 6–8; VA3 is post-core.</p>\n<hr>\n<h3>VA1 — Foundational Assistant</h3>\n<p><em>Can safely function in the hospital environment and perform basic patient-care and workflow responsibilities.</em></p>\n<p><strong>Knowledge (all passed at ≥80%, safety-critical items 100%):</strong> hospital safety/OSHA module; scope &amp; conduct module; infection control/PPE/sharps; terminology &amp; hospital flow; patient identification.</p>\n<p><strong>Practical competencies at state ≥8 (Practical Assessment Passed):</strong></p>\n<p><span class=\"id\">TS-HND-001</span> safe approach/low-stress handling · <span class=\"id\">TS-RES-001</span> lateral restraint · <span class=\"id\">TS-RES-002</span> sternal/standing restraint · <span class=\"id\">TS-ASM-001</span> TPR · <span class=\"id\">TS-SAN-001</span> cleaning/disinfection · <span class=\"id\">TS-DOC-001</span> basic documentation.</p>\n<p><strong>Recognition:</strong> passes the VA1 recognition check (identify unsafe restraint, fear escalation, dropped-sharp response, wrong-patient scenario).</p>\n<p><strong>Workload unlocked (see Workload Ownership Matrix):</strong> room turnover, patient movement, restraint for routine procedures, routine TPR with reporting, sanitation program participation, accurate basic records.</p>\n<hr>\n<h3>VA2 — Technical Assistant</h3>\n<p><em>Reliably performs a broader set of approved technical procedures and assumes meaningful clinical workload under required supervision.</em></p>\n<p><strong>Prerequisites:</strong> VA1 granted.</p>\n<p><strong>Knowledge:</strong> all Week 2–4 modules passed; medication-math screen ≥90%; safety-critical items 100%.</p>\n<p><strong>Practical competencies at state ≥8, with repetition requirements met (see <code>16_Case_Logs/Repetition_Requirements.md</code>):</strong></p>\n<p><span class=\"id\">TS-VEN-CEPH-001</span> cephalic venipuncture · <span class=\"id\">TS-VEN-SAPH-001</span> saphenous venipuncture · <span class=\"id\">TS-INJ-SQ-001</span> SQ injection · <span class=\"id\">TS-LAB-001</span> blood smear · <span class=\"id\">TS-LAB-002</span> PCV/TS · <span class=\"id\">TS-SAM-001</span> sample handling/tubes · <span class=\"id\">TS-FLU-001</span> fluid line setup/priming · <span class=\"id\">TS-MED-PO-001</span> oral medication administration · <span class=\"id\">TS-RES-003</span> venipuncture positioning (holder role).</p>\n<p>Plus, where CVAH policy permits assistants (scope matrix rows <span class=\"id\">SCOPE-004</span>/006): <span class=\"id\">TS-IVC-CEPH-001</span> IV catheter at state ≥5 (practicing with direct supervision) and <span class=\"id\">TS-INJ-IM-001</span> at state ≥8.</p>\n<p><strong>Recognition:</strong> passes VA2 recognition battery (hemolysis/clot causes, infiltration signs, \"when to stop sticking,\" collapsing vein response, medication five-rights failure scenarios).</p>\n<p><strong>Workload unlocked:</strong> routine blood draws under defined supervision; sample processing to lab-ready state; SQ injections of CVT/DVM-verified doses; fluid line setup; oral medications; treatment-room support that no longer requires a CVT shadow.</p>\n<hr>\n<h3>VA3 — Advanced Assistant (post-core)</h3>\n<p><em>Advanced technical ability, strong situational awareness, workflow ownership, abnormality recognition, and selected advanced competencies.</em></p>\n<p><strong>Prerequisites:</strong> CVAH VA Core Graduate; ≥3 months post-graduation clinical performance; no active remediation.</p>\n<p><strong>Standard (all of):</strong></p>\n<ol>\n<li>IV catheterization at state ≥9 (competent under defined supervision) with logged repetition across ≥3 patient categories — where policy permits; otherwise an approved substitution from the advanced list below.</li>\n<li>Jugular venipuncture (<span class=\"id\">TS-VEN-JUG-001</span>) at state ≥8.</li>\n<li>At least <strong>one completed specialty academy credential</strong>.</li>\n<li>Advanced recognition battery pass (multi-parameter deteriorating-patient cases, ≥85%).</li>\n<li>Workflow ownership attestation: two supervising CVTs/DVMs independently attest (structured form, <code>15_Practical_Competencies/VA3_Attestation_Form.md</code>) that the assistant anticipates needs, self-assigns appropriately, and escalates correctly.</li>\n<li>Manager + Supervising Veterinarian co-sign.</li>\n</ol>\n<p>Advanced substitution list (any one, if IV catheter restricted by policy): anesthesia monitoring support sign-off (Anesthesia Academy <span class=\"id\">PA-ANES-MON-001</span>) · full imaging positioning portfolio (<span class=\"id\">PA-IMG-001</span> all views) · emergency readiness lead (<span class=\"id\">PA-ECC-001</span> + crash-cart custodian).</p>\n<p><strong>Specialty credentials sit on top of levels</strong> — e.g., \"VA3 — Advanced Assistant; Specialty Credentials: Advanced Perioperative &amp; Anesthesia, Diagnostic Imaging.\" No VA3 is required to complete every specialty.</p>", "text": "Version 1.0 · 2026-08-17 VA levels are competency milestones inside the University , not separate courses. A level is granted when its full standard is met — never because time passed. Typical (not required) timing: VA1 ≈ end of Week 2; VA2 ≈ Weeks 5–6; Core Graduate ≈ Weeks 6–8; VA3 is post-core. VA1 — Foundational Assistant Can safely function in the hospital environment and perform basic patient-care and workflow responsibilities. Knowledge (all passed at ≥80%, safety-critical items 100%): hospital safety/OSHA module; scope &amp; conduct module; infection control/PPE/sharps; terminology &amp; hospital flow; patient identification. Practical competencies at state ≥8 (Practical Assessment Passed): TS-HND-001 safe approach/low-stress handling · TS-RES-001 lateral restraint · TS-RES-002 sternal/standing restraint · TS-ASM-001 TPR · TS-SAN-001 cleaning/disinfection · TS-DOC-001 basic documentation. Recognition: passes the VA1 recognition check (identify unsafe restraint, fear escalation, dropped-sharp response, wrong-patient scenario). Workload unlocked (see Workload Ownership Matrix): room turnover, patient movement, restraint for routine procedures, routine TPR with reporting, sanitation program participation, accurate basic records. VA2 — Technical Assistant Reliably performs a broader set of approved technical procedures and assumes meaningful clinical workload under required supervision. Prerequisites: VA1 granted. Knowledge: all Week 2–4 modules passed; medication-math screen ≥90%; safety-critical items 100%. Practical competencies at state ≥8, with repetition requirements met (see 16_Case_Logs/Repetition_Requirements.md ): TS-VEN-CEPH-001 cephalic venipuncture · TS-VEN-SAPH-001 saphenous venipuncture · TS-INJ-SQ-001 SQ injection · TS-LAB-001 blood smear · TS-LAB-002 PCV/TS · TS-SAM-001 sample handling/tubes · TS-FLU-001 fluid line setup/priming · TS-MED-PO-001 oral medication administration · TS-RES-003 venipuncture positioning (holder role). Plus, where CVAH policy permits assistants (scope matrix rows SCOPE-004 /006): TS-IVC-CEPH-001 IV catheter at state ≥5 (practicing with direct supervision) and TS-INJ-IM-001 at state ≥8. Recognition: passes VA2 recognition battery (hemolysis/clot causes, infiltration signs, \"when to stop sticking,\" collapsing vein response, medication five-rights failure scenarios). Workload unlocked: routine blood draws under defined supervision; sample processing to lab-ready state; SQ injections of CVT/DVM-verified doses; fluid line setup; oral medications; treatment-room support that no longer requires a CVT shadow. VA3 — Advanced Assistant (post-core) Advanced technical ability, strong situational awareness, workflow ownership, abnormality recognition, and selected advanced competencies. Prerequisites: CVAH VA Core Graduate; ≥3 months post-graduation clinical performance; no active remediation. Standard (all of): IV catheterization at state ≥9 (competent under defined supervision) with logged repetition across ≥3 patient categories — where policy permits; otherwise an approved substitution from the advanced list below. Jugular venipuncture ( TS-VEN-JUG-001 ) at state ≥8. At least one completed specialty academy credential . Advanced recognition battery pass (multi-parameter deteriorating-patient cases, ≥85%). Workflow ownership attestation: two supervising CVTs/DVMs independently attest (structured form, 15_Practical_Competencies/VA3_Attestation_Form.md ) that the assistant anticipates needs, self-assigns appropriately, and escalates correctly. Manager + Supervising Veterinarian co-sign. Advanced substitution list (any one, if IV catheter restricted by policy): anesthesia monitoring support sign-off (Anesthesia Academy PA-ANES-MON-001 ) · full imaging positioning portfolio ( PA-IMG-001 all views) · emergency readiness lead ( PA-ECC-001 + crash-cart custodian). Specialty credentials sit on top of levels — e.g., \"VA3 — Advanced Assistant; Specialty Credentials: Advanced Perioperative &amp; Anesthesia, Diagnostic Imaging.\" No VA3 is required to complete every specialty."}, {"id": "workload", "title": "Clinical workload ownership", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08-17 · Machine-readable: <code>Clinical_Workload_Ownership_Matrix.csv</code></p>\n<p>Purpose: make the transfer of work measurable. Each row states exactly what task moves onto the assistant's plate after sign-off, who was carrying it before, what supervision remains, and what invalidates the assignment. Managers use this with the readiness dashboard to plan staffing.</p>\n<div class=\"tw\"><table><thead><tr><th>Competency (skill ID)</th><th>Task transferred</th><th>Previously carried by</th><th>Supervision after sign-off</th><th>Prerequisites</th><th>Assignment invalid when</th><th>Escalation triggers</th></tr></thead><tbody><tr><td>TPR (<span class=\"id\">TS-ASM-001</span>)</td><td>Obtain and document routine TPR on stable patients; report abnormals against <span class=\"id\">CRC-001</span> before DVM sees patient</td><td>CVT (≈3–5 min/patient)</td><td>S2</td><td>VA1 handling skills</td><td>Patient flagged fractious/critical; learner in state 11/13</td><td>Any value outside <span class=\"id\">CRC-001</span> bands; pain on handling; distress during acquisition</td></tr><tr><td>Restraint (<span class=\"id\">TS-RES-001</span>/002/003)</td><td>Provide restraint for exams, injections, blood draws — frees a second CVT</td><td>CVT or DVM pulled from other work</td><td>S2</td><td>VA1</td><td>Aggressive patient beyond trained level; sedated-patient positioning not yet signed</td><td>Escalating fear signs; airway compromise in restraint; staff-safety risk</td></tr><tr><td>Cephalic venipuncture (<span class=\"id\">TS-VEN-CEPH-001</span>)</td><td>Routine canine/feline blood collection for in-house and reference labs</td><td>CVT (≈5–10 min/draw incl. interruptions)</td><td>S2 (first 10 post-sign-off draws S1 per policy)</td><td>VA2 knowledge + reps met</td><td>&gt;2 failed attempts on a patient; fragile/dehydrated flagged patients until VA3</td><td>Hematoma forming; patient stress escalating; 2-attempt limit reached</td></tr><tr><td>Saphenous/jugular venipuncture (<span class=\"id\">TS-VEN-SAPH</span>/JUG-001)</td><td>Alternate-site draws incl. cats and small dogs; jugular volume draws (VA3)</td><td>CVT</td><td>S2 (jugular S1 until VA3)</td><td>Cephalic signed</td><td>Coagulopathy suspected (jugular); respiratory-compromised cats</td><td>Same as cephalic + respiratory distress in restraint</td></tr><tr><td>IV catheter (<span class=\"id\">TS-IVC-CEPH-001</span>)</td><td>Routine peripheral catheter placement for surgery/fluids</td><td>CVT (≈10–15 min/placement)</td><td>S1→S2 per scope row <span class=\"id\">SCOPE-004</span></td><td>VA2; venipuncture signed; policy permits</td><td>Critical patients; difficult-access patients until VA3; policy restriction</td><td>No flash ×2 attempts; vein blown; patient decompensating</td></tr><tr><td>SQ injection (<span class=\"id\">TS-INJ-SQ-001</span>)</td><td>Administer CVT/DVM-verified SQ meds &amp; vaccines drawn and checked per five-rights workflow</td><td>CVT</td><td>S2</td><td>VA2; med-math ≥90%</td><td>Any dose not independently verified; controlled substances</td><td>Injection-site reaction; patient collapse; dose discrepancy found</td></tr><tr><td>Oral/topical meds (<span class=\"id\">TS-MED-PO-001</span>)</td><td>Administer verified PO/topical/ophthalmic/otic meds to hospitalized patients</td><td>CVT</td><td>S2</td><td>VA1 + med foundations</td><td>Dysphagic/regurgitating patients (PO); unverified orders</td><td>Refusal + stress; vomiting post-dose; wrong-label discovery</td></tr><tr><td>Fluid line mgmt (<span class=\"id\">TS-FLU-001</span>/002)</td><td>Set up, prime, connect approved fluid systems; monitor lines; change bags</td><td>CVT (setup ≈5–8 min; checks hourly)</td><td>S2</td><td>VA2</td><td>Additive-medicated fluids unless CVT-verified; syringe-pump drugs</td><td>Infiltration signs; pump alarms unresolved in 2 min; line disconnection</td></tr><tr><td>Sample processing (<span class=\"id\">TS-SAM-001</span>, <span class=\"id\">TS-LAB-001</span>/002)</td><td>Spin, separate, smear, PCV/TS, label, package for reference lab</td><td>CVT (≈10 min/panel)</td><td>S2</td><td>VA2</td><td>QC failures uninvestigated; unlabeled samples found</td><td>Grossly hemolyzed/clotted sample; analyzer error codes</td></tr><tr><td>Surgical prep (<span class=\"id\">TS-SUR-PREP-001</span>)</td><td>Clip and initial skin prep of routine surgical patients per protocol</td><td>CVT (≈10–15 min/patient)</td><td>S2 (patient under DVM/CVT anesthesia care)</td><td>Core Weeks 5–6 + sign-off</td><td>Contaminated/compromised skin; emergency surgeries until VA3</td><td>Skin lesions found; patient too light/deep flagged by monitor team</td></tr><tr><td>Sterile opening (<span class=\"id\">TS-SUR-STER-001</span>)</td><td>Open packs/gloves/suture to sterile field without contamination</td><td>CVT</td><td>S2</td><td>Asepsis module</td><td>Learner unsure of sterility — automatic stop-and-declare</td><td>Any suspected contamination (declare immediately — never conceal)</td></tr><tr><td>Radiographic positioning (<span class=\"id\">TS-IMG-001</span>)</td><td>Position and restrain for routine views; drive retake rate down</td><td>CVT + DVM time on retakes</td><td>S2</td><td>Radiation safety module; dosimetry issued</td><td>Pregnant-staff restrictions per policy; sedation cases until signed</td><td>Patient distress; inability to achieve view in 2 attempts; equipment fault</td></tr><tr><td>Inpatient monitoring (<span class=\"id\">TS-INP-001</span>)</td><td>Scheduled observations, treatment-sheet execution, I/O tracking, escalation of changes</td><td>CVT (rounds time)</td><td>S2</td><td>VA2 + Inpatient basics</td><td>ICU-level patients until Inpatient Academy; isolation without training</td><td>Any <span class=\"id\">CRC-001</span> breach; pain score rise; line/bandage abnormalities</td></tr><tr><td>Emergency support (<span class=\"id\">TS-EMR-001</span>)</td><td>Crash-cart readiness checks; CPR support roles (compressions, recorder, runner)</td><td>CVT</td><td>S1 during events</td><td>Core emergency foundations</td><td>CPR lead/drug roles — never assistant's</td><td>Arrest recognition → immediate CPR activation call</td></tr></tbody></table></div>\n<p><strong>Measurability rule:</strong> each row feeds two analytics (<code>22_Analytics/Analytics_Specification.md</code>): (1) % of the task's weekly volume performed by signed-off assistants; (2) technician minutes/week returned. Generic claims (\"helps with surgery\") are prohibited in future rows.</p>", "text": "Version 1.0 · 2026-08-17 · Machine-readable: Clinical_Workload_Ownership_Matrix.csv Purpose: make the transfer of work measurable. Each row states exactly what task moves onto the assistant's plate after sign-off, who was carrying it before, what supervision remains, and what invalidates the assignment. Managers use this with the readiness dashboard to plan staffing. Competency (skill ID) Task transferred Previously carried by Supervision after sign-off Prerequisites Assignment invalid when Escalation triggers TPR ( TS-ASM-001 ) Obtain and document routine TPR on stable patients; report abnormals against CRC-001 before DVM sees patient CVT (≈3–5 min/patient) S2 VA1 handling skills Patient flagged fractious/critical; learner in state 11/13 Any value outside CRC-001 bands; pain on handling; distress during acquisition Restraint ( TS-RES-001 /002/003) Provide restraint for exams, injections, blood draws — frees a second CVT CVT or DVM pulled from other work S2 VA1 Aggressive patient beyond trained level; sedated-patient positioning not yet signed Escalating fear signs; airway compromise in restraint; staff-safety risk Cephalic venipuncture ( TS-VEN-CEPH-001 ) Routine canine/feline blood collection for in-house and reference labs CVT (≈5–10 min/draw incl. interruptions) S2 (first 10 post-sign-off draws S1 per policy) VA2 knowledge + reps met &gt;2 failed attempts on a patient; fragile/dehydrated flagged patients until VA3 Hematoma forming; patient stress escalating; 2-attempt limit reached Saphenous/jugular venipuncture ( TS-VEN-SAPH /JUG-001) Alternate-site draws incl. cats and small dogs; jugular volume draws (VA3) CVT S2 (jugular S1 until VA3) Cephalic signed Coagulopathy suspected (jugular); respiratory-compromised cats Same as cephalic + respiratory distress in restraint IV catheter ( TS-IVC-CEPH-001 ) Routine peripheral catheter placement for surgery/fluids CVT (≈10–15 min/placement) S1→S2 per scope row SCOPE-004 VA2; venipuncture signed; policy permits Critical patients; difficult-access patients until VA3; policy restriction No flash ×2 attempts; vein blown; patient decompensating SQ injection ( TS-INJ-SQ-001 ) Administer CVT/DVM-verified SQ meds &amp; vaccines drawn and checked per five-rights workflow CVT S2 VA2; med-math ≥90% Any dose not independently verified; controlled substances Injection-site reaction; patient collapse; dose discrepancy found Oral/topical meds ( TS-MED-PO-001 ) Administer verified PO/topical/ophthalmic/otic meds to hospitalized patients CVT S2 VA1 + med foundations Dysphagic/regurgitating patients (PO); unverified orders Refusal + stress; vomiting post-dose; wrong-label discovery Fluid line mgmt ( TS-FLU-001 /002) Set up, prime, connect approved fluid systems; monitor lines; change bags CVT (setup ≈5–8 min; checks hourly) S2 VA2 Additive-medicated fluids unless CVT-verified; syringe-pump drugs Infiltration signs; pump alarms unresolved in 2 min; line disconnection Sample processing ( TS-SAM-001 , TS-LAB-001 /002) Spin, separate, smear, PCV/TS, label, package for reference lab CVT (≈10 min/panel) S2 VA2 QC failures uninvestigated; unlabeled samples found Grossly hemolyzed/clotted sample; analyzer error codes Surgical prep ( TS-SUR-PREP-001 ) Clip and initial skin prep of routine surgical patients per protocol CVT (≈10–15 min/patient) S2 (patient under DVM/CVT anesthesia care) Core Weeks 5–6 + sign-off Contaminated/compromised skin; emergency surgeries until VA3 Skin lesions found; patient too light/deep flagged by monitor team Sterile opening ( TS-SUR-STER-001 ) Open packs/gloves/suture to sterile field without contamination CVT S2 Asepsis module Learner unsure of sterility — automatic stop-and-declare Any suspected contamination (declare immediately — never conceal) Radiographic positioning ( TS-IMG-001 ) Position and restrain for routine views; drive retake rate down CVT + DVM time on retakes S2 Radiation safety module; dosimetry issued Pregnant-staff restrictions per policy; sedation cases until signed Patient distress; inability to achieve view in 2 attempts; equipment fault Inpatient monitoring ( TS-INP-001 ) Scheduled observations, treatment-sheet execution, I/O tracking, escalation of changes CVT (rounds time) S2 VA2 + Inpatient basics ICU-level patients until Inpatient Academy; isolation without training Any CRC-001 breach; pain score rise; line/bandage abnormalities Emergency support ( TS-EMR-001 ) Crash-cart readiness checks; CPR support roles (compressions, recorder, runner) CVT S1 during events Core emergency foundations CPR lead/drug roles — never assistant's Arrest recognition → immediate CPR activation call Measurability rule: each row feeds two analytics ( 22_Analytics/Analytics_Specification.md ): (1) % of the task's weekly volume performed by signed-off assistants; (2) technician minutes/week returned. Generic claims (\"helps with surgery\") are prohibited in future rows."}, {"id": "impl", "title": "Implementation guide", "group": "Run it", "meta": "", "html": "<p>Version 1.0 · 2026-08-17 · Audience: practice manager + medical director. This is the \"what do we actually do\" document.</p>\n<h3>Phase A — Localize (Weeks 1–3, ~15 staff-hours total)</h3>\n<ol>\n<li>Assign roles (Governance doc): Program Administrator, Medical Reviewer, 2+ Assessors, Supervising Techs.</li>\n<li>Complete the Discovery Questionnaire (00_) and Equipment Survey (19_) — one afternoon.</li>\n<li>Medical Reviewer reviews and approves: scope matrix rows + policy column (esp. <span class=\"id\">SCOPE-004</span> IV-catheter and <span class=\"id\">SCOPE-007</span>/011/015 decisions), <span class=\"id\">CRC-001</span>/002/003/005 draft cards, critical-fail lists. Verify statute/rule text against vetboard.az.gov current PDFs; log in the Regulatory Research Log.</li>\n<li>Fill <code>[CVAH-SPECIFIC INPUT REQUIRED]</code> items (grep the repo for the tag — each is a decision or a fact, none is authoring work).</li>\n</ol>\n<h3>Phase B — Stand up the LMS (Weeks 2–4, parallel)</h3>\n<p>Per <code>20_LMS/Moodle_Deployment_Guide.md</code>: provision → import Core W0–W2 first (rolling import beats big-bang) → convert QB files to GIFT → wire conditional release → pilot with two current staff members through Week 0–1 → fix friction → import remaining weeks + Reference Library (approved CRCs only).</p>\n<h3>Phase C — Train the trainers (Week 4)</h3>\n<p>Half-day session: Assessors practice the rubrics on each other (calibration: two assessors score the same performance, discuss gaps &gt;2 points); trainers learn the daily integration rhythm; everyone drills the assessor mobile flow to the 60-second standard.</p>\n<h3>Phase D — First cohort (Weeks 5–13)</h3>\n<p>Enroll 1–2 new hires (or challenge-testing current assistants — often the best pilot: they validate challenge-out AND get credentialed). <strong>Daily rhythm (workplace integration):</strong> before-shift/protected block 30–45 min = assigned lesson · during shift = training board flags learner-appropriate cases; trainer creates designated practice opportunities · competency moments = assessor observes when flagged ready · end of shift 10 min = log attempts + feedback · system assigns next. <strong>Weekly:</strong> trainer+learner 15-min passport review; manager glances at the exposure-diagnosis panel (is scheduling starving the learner of cases?).</p>\n<p>Existing-staff track: challenge-testing sweep converts current assistants' real skills into passport states in ~2–4 weeks of opportunistic assessment — do this early; it populates the capability matrix and normalizes the assessment culture.</p>\n<h3>Phase E — Operate (ongoing)</h3>\n<p>Monthly: analytics review (15 min in the manager meeting: transfer metrics + program health) · KB failed-search review → new cards. Quarterly: mock code (<span class=\"id\">SIM-CORE-004</span>) · LASA shelf audit (Pharmacy credential holder) · content release + license audit. Annually: scope re-verification · repetition-requirement calibration against attempts-to-competency data · full QA cycle (27_/QA_Report.md as the template).</p>\n<h3>Budget summary (verify current prices)</h3>\n<p>LMS US$10–50/mo · model arms/limbs one-time ~US$200–600 (or clinic-built) · CPR manikin if not owned ~US$150–500 · print/laminate trivial · video production in-house (phone + $50 gimbal) · staff time is the real cost: ~0.5–1.0 FTE-hours/day of trainer attention per active learner in Weeks 0–4, tapering after — priced into the 6–8-week payoff by the transfer metrics.</p>\n<h3>The Monday-morning test, answered</h3>\n<p>A new hire can start Week 0 the Monday after Phase C completes: pretest exists, lessons exist, floor targets exist, rubrics exist, logs print on one sheet. The only true blockers are the DVM approvals in Phase A — protect those 4–6 reviewer hours above all else.</p>", "text": "Version 1.0 · 2026-08-17 · Audience: practice manager + medical director. This is the \"what do we actually do\" document. Phase A — Localize (Weeks 1–3, ~15 staff-hours total) Assign roles (Governance doc): Program Administrator, Medical Reviewer, 2+ Assessors, Supervising Techs. Complete the Discovery Questionnaire (00_) and Equipment Survey (19_) — one afternoon. Medical Reviewer reviews and approves: scope matrix rows + policy column (esp. SCOPE-004 IV-catheter and SCOPE-007 /011/015 decisions), CRC-001 /002/003/005 draft cards, critical-fail lists. Verify statute/rule text against vetboard.az.gov current PDFs; log in the Regulatory Research Log. Fill [CVAH-SPECIFIC INPUT REQUIRED] items (grep the repo for the tag — each is a decision or a fact, none is authoring work). Phase B — Stand up the LMS (Weeks 2–4, parallel) Per 20_LMS/Moodle_Deploymen
