never dump, never drag. Unclip/unscrew the top half; lift it off slowly with the towel draped over your forearm ready to lay across the cat. Half of feline medicine can happen with the cat sitting in its own carrier bottom under a towel. 5–6. The holds The minimal hold (default for exams, most treatments) DO: cat sternal (\"meatloaf\") on mat or in carrier bottom; your two forearms bracket its body like a valley, hands resting lightly over shoulders; no gripping unless movement starts. WHY: cats push against fixation and relax under mere boundaries. EXPECT: the cat compresses into a loaf and stays. COMMON ERROR: pre-emptive scruffing of a calm cat — you just spent tolerance you didn't need to. STOP: escalation ladder climbing past tail-lash. The towel burrito (draws, injections, anything a paw could reach) DO: towel flat on table; cat placed sternal on its center-back edge; wrap side A snugly over the back and under the far side of the body; wrap side B over and tuck under the near side — snug through the shoulders, looser at the ribs (breathing room); leave out ONLY the part being worked on (a hindlimb for medial saphenous; the head for oral meds). Head covered or uncovered by the cat's vote — try covered first; most settle. WHY: containment without compression; a hide-option built in. EXPECT: a cat-shaped log that breathes easily and struggles briefly then settles. COMMON ERROR: wrapping a panicking cat TIGHTER as it fights — compression on a stressed cat is a respiratory event brewing; snug ≠ compressed. RECOVERY: struggle inside the wrap → open it, let the cat re-loaf, re-wrap once calmer or change plan. STOP: open-mouth breathing = wrap open NOW, all restraint off, CVT alert. Scruff — the exception, not the default House policy: towel techniques first; scruff only as a brief last-resort control during an active safety event, never as the opening move, never suspended, never on seniors (skin tears) or obese cats (it doesn't even work). If a plan REQUIRES a scruff to complete, the plan is wrong — regroup (chemical restraint is the DVM's kinder answer). Holder role for feline draws Medial saphenous and jugular holds per CSC-VEN-02 /03; your feline deltas: contact points minimal, your murmuring voice constant, your eyes on the face (YOU are the respiratory monitor), and the stop-call is yours to make early. 7. Tactile medicine Under your forearms, a settling cat softens and widens (the loaf spreads); a loading cat narrows and coils — you'll feel the spine arch beginning and the rear feet gathering under. Tail-lash transmits through the table. The wrapped cat's breathing is your hands' business: you should feel the ribs cycling easily through the towel; effort you can feel = wrap too tight or patient in trouble — open it. 8. It didn't work — now what? Cat won't leave the carrier: top-off protocol; work in the bottom half; if it must come out, towel-over-and-scoop as one bundle. Explosion mid-procedure: let go of the PROCEDURE, not the room — drop the towel over the cat where it lands, dim, everyone silent for 60 s; then reassess: is the remaining task essential today (DVM call)? The cabinet cat: do not reach into the hole after it (that's how hands get shredded); close the room, open the cabinet fully, towel ready, patience or a DVM sedation plan. Repeated visits, worsening behavior: flag the record with SPECIFIC triggers observed (\"panics at clipper sound; fine with towel-covered head\") — you are writing the next visit's plan. The genuinely dangerous cat: stop protecting your pride — gloves-and-net folklore era is over; the answer is chemical restraint prescribed by the DVM, requested EARLY, framed as welfare (it is). Open-mouth breathing at ANY point: everything stops; O2 nearby; CVT/DVM now; the procedure no longer exists. 9. Real patients Kittens: all containment, no force; socialization stakes are sky-high — pair every handling with food. Seniors/CKD (your most common inpatients): fragile skin, sore joints, often dehydrated — pad everything, no scruff ever, warm the towel. Hyperthyroid: wired, fragile hearts — shortest possible events, calmest room. Brachycephalic cats (Persians): airway margin is thin; sternal only, face never buried in towel, watch nostrils. Diabetic/sick cats in for serial draws: they learn fast — invest in making draw one pleasant (medial saphenous under towel + food) and draws two through ten stay easy. The \"fine at home\" cat: believe the owner AND the ladder in front of you; carrier-trained calm evaporates in clinic — read the current cat, not the story. 10. Common rookie mistakes Scruff-first defaults — trained out with towel drills. 2. Dumping the carrier — the relationship-ender; top-off, always. 3. Tightening a panicking wrap. 4. Working slowly on a calm cat — feline tolerance is a countdown; be READY (supplies staged) then be brief. 5. Reading silence as consent — the frozen cat's explosion \"from nowhere.\" 6. Chasing an escaped cat around the room — herd and towel instead. 7. Skipping the room audit — discovering the open window mid-explosion. 11. Pearls &amp; banned folklore PEARLS: warm towel from the dryer = instant 20% calmer cat. · Feliway/pheromone spray on towels per stock — cheap margin. · The carrier-bottom exam saves more scratches than any glove. · Do the worst thing LAST (temp after draw, not before). · Chin-scratch test: a cat that accepts one is telling you your window is open; one that jerks away is telling you it's closing. BANNED: scruff-suspension, full-body compression \"hugging,\" spray bottles, gloves-as-substitute-for-plan (bulky gloves crush cats and miss holds), \"cat whisperer\" bare-hand bravado on flagged cats. 12–13. Visuals &amp; assessment VID-RES-002 feline segment + burrito build in 4 stills (flat → side A → side B → limb-out variant); INT-07 feline signal photos. Practical: PA-RES-001 §C–D with feline probes (open-mouth = scripted stop ★). Case log: ≥3 coached feline holds + ≥2 burritos before assessment. Reviews: R1: added silence-vs-hiss doctrine, chin-scratch window test, cabinet protocol. R2: burrito buildable from text alone; both forearms' jobs named. R3: hospital gains feline procedures that finish with usable samples and re-bookable patients."}, {"id": "csc-asm01", "title": "TPR & basic assessment", "group": "Skill courses", "meta": "TS-ASM-001", "html": "<p>Companion to <span class=\"id\">TS-ASM-001</span>/002 · Benchmark course · ~25 min + daily practice</p>\n<h3>1. Purpose</h3>\n<p>TPR is the hospital's most-repeated clinical measurement and the foundation of every trend that ever catches a deteriorating patient. The skill is producing numbers a DVM can ACT on — which means accurate, honestly-annotated, and delivered at the right urgency. A fabricated or sloppy TPR is worse than none: it launders a sick patient into a stable-looking chart.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>Temperature: core heat; fever (set-point up: infection/inflammation) vs hyperthermia (heat in faster than out: stress, heatstroke) feel identical on the thermometer — context distinguishes, which is why you report, not interpret. Pulse: each heartbeat should push a pressure wave to the femoral artery; a heard-beat-without-felt-pulse (deficit) means non-perfusing beats — always reportable. Respiration: one cycle = in AND out; CHARACTER (effort, abdominal push, noise) is earlier warning than rate. Stress artifact: handling raises RR and HR within seconds — sequence your exam around that fact.</p>\n<h3>3. Equipment</h3>\n<p>Digital thermometer + probe covers + lube; watch/clock with seconds (the wall clock counts); stethoscope that fits YOUR ears (angle earpieces forward); your eyes — the most-used instrument in this course.</p>\n<h3>4–5. Patient &amp; operator preparation</h3>\n<p>Order of operations is the technique: EYES FIRST (RR + character from a distance), HANDS SECOND (pulse + auscultation), THERMOMETER LAST (the most annoying part goes at the end so it can't contaminate the other numbers). You at the kennel front or table side; patient wherever it's calmest — a resting kennel RR beats a table RR every time. For the hands-on portion: standing or sternal restraint per <span class=\"id\">CSC-RES-01</span>/02, minimal version.</p>\n<h3>6. The procedure</h3>\n<p><strong>Step 1 — Respiration from a distance.</strong> DO: before opening the kennel, count chest rises 15 s × 4 (or 30 × 2 if steady); watch the SHAPE of breathing: smooth chest rise vs abdominal push; listen for noise (stertor = snore-like, stridor = high whistle); note posture (elbows-out orthopnea, neck extended). WHY: this is the only uncontaminated respiratory data you'll get. EXPECT: a resting rhythm you can tap along to. COMMON ERROR: counting each chest movement as one (doubles the rate); counting a panting dog and charting it as RR (chart \"panting,\" count later or note unobtainable). RECOVERY: lost count = start over; never round a guess upward into the chart. STOP: laboured breathing at rest = report NOW, before the rest of the TPR — the exam can wait, the finding can't.</p>\n<p><strong>Step 2 — Pulse and heart together.</strong> DO: stethoscope over the left chest at/behind the elbow while two fingers (never your thumb — it has its own pulse) find the femoral artery: inner thigh, near where leg meets body, in the muscle groove — press lightly, then lighter. Count HR 15–60 s; feel simultaneously: does every beat arrive at the leg? Note rhythm (regular? regularly-irregular with breathing — normal in dogs — vs chaotic) and pulse QUALITY (strong/weak/bounding, described not diagnosed). WHY: the simultaneous feel is what catches deficits; quality is free perfusion data. EXPECT: dog 70–120 (size-dependent), cat 160–220 in clinic; sinus arrhythmia in relaxed dogs is a normal finding worth knowing by ear. COMMON ERROR: pressing the femoral so hard you occlude it (\"no pulse!\" on a healthy dog); counting a purring cat's HR by hope (chart the limitation per the honest-note rule). RECOVERY: can't hear the heart (obese/deep-chested) → slide cranioventrally, use the femoral count as the number and say so. STOP: pulse deficit, chaotic rhythm, or bounding-then-absent quality = report-now findings.</p>\n<p><strong>Step 3 — Temperature.</strong> DO: cover + lube; lift tail gently; insert 1–2 cm with a slight tilt so the tip contacts the rectal wall; STAY WITH IT until the beep; read, cover off into trash, wipe. WHY: leaving a thermometer unattended in a standing patient is how thermometers (and dignity) break. EXPECT: 100.0–102.5°F typical adult band (<span class=\"id\">CRC-001</span> is the authority). COMMON ERROR: charting a stress-bumped 102.9 without context, or repeating a shocking value hoping it changes — one honest repeat to rule out technique is fine; serial re-takes hunting a better number is data-laundering. STOP: rectal pain/resistance, fresh blood on cover, recent rectal surgery per record → don't force; note and report.</p>\n<p><strong>Step 4 — The free extras while hands are on.</strong> DO: lift a lip: gum COLOR (pink / pale / white / blue / brick red / yellow), MOISTURE (slick vs tacky); press and release for CRT (&lt;2 s); quick skin tent over the shoulders; mentation word (BAR/QAR/lethargic/obtunded — pick one, per the ladder); note anything your hands found (heat in a joint, a mass, wet fur at a catheter). WHY: thirty extra seconds makes this a basic assessment, not a number errand. COMMON ERROR: \"MM pink\" charted through a closed mouth from memory.</p>\n<p><strong>Step 5 — Chart NOW and route by urgency.</strong> DO: values + descriptors + time + initials at the kennel/table; compare against <span class=\"id\">CRC-001</span> bands AND against the patient's last values (the trend is the point); out-of-band or trend-adverse → SBAR-V now; borderline → note-and-flag at the next huddle. COMMON ERROR: batch-charting at shift's end from memory (integrity cliff); reporting only the number without the trend (\"temp is 103.1 — up from 101.8 at 8 AM\" is twice the information).</p>\n<h3>7. Tactile medicine</h3>\n<p>A strong femoral pulse taps your fingers like a firm fingertip drum; weak feels like the drum moved a room away; bounding SLAPS then vanishes (that snap-emptiness pattern is worth reporting in those words). The normal dog's sinus arrhythmia speeds with inhale, slows with exhale — feel it once on a calm patient and arrhythmia-vs-normal gets much easier. A dehydrated patient's skin tent doesn't SNAP back; it strolls. Tacky gums drag your fingertip; slick gums let it skate.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>Squirmy patient corrupting every count:</strong> better restraint (<span class=\"id\">CSC-RES</span>), not a worse number; if unattainable calmly, chart the limitation and the pieces you trust (\"RR 32 resting pre-handling; HR unobtainable — struggling; femoral strong\"). <strong>Numbers that don't fit the patient</strong> (HR 60 in a stressed cat; T 96.8 in a bright dog): re-take ONCE for technique (thermometer contact? counting error?), then report the discrepancy itself — \"the number looks wrong for the patient\" is a legitimate, valuable report. <strong>Equipment doubt:</strong> thermometer reading absurdly (86°F) = battery/technique; verify on yourself-adjacent logic (a second thermometer), tag the bad unit out. <strong>You forgot the pre-handling RR:</strong> own it — wait five quiet minutes and count again, or chart \"post-handling\" honestly; never back-fill the resting number you wish you'd taken.</p>\n<h3>9. Real patients</h3>\n<p><strong>Cats in clinic:</strong> everything runs high on stress — the trend across visits and the character findings outweigh single numbers; count RR through the carrier door on arrival (gold data, free). <strong>Brachycephalics:</strong> baseline noise is real but NEVER dismiss new noise as \"just being a bulldog\" — compare to THEIR baseline. <strong>Puppies/kittens:</strong> higher normal everything; wiggle = count longer windows. <strong>Geriatrics:</strong> arthritis makes tail-lifts unkind — slow hands; low-normal temps common. <strong>Thick coats:</strong> auscultation through undercoat mutes sounds — part the coat, press firmer, or trust the femoral. <strong>Post-op patients:</strong> shivering wrecks auscultation and RR counts — chart context; temperature is the headline number in recovery. <strong>Dyspneic patients:</strong> the TPR is ABBREVIATED by design — RR/character from distance, gums if trivially accessible, EVERYTHING else deferred; minimal-handling doctrine outranks completeness.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>RR after wrestling</strong> — the artifact chart. 2. <strong>Half-cycle doubling.</strong> 3. <strong>Thumb on the femoral</strong> — counting your own pulse. 4. <strong>Thermometer walk-away.</strong> 5. <strong>Memory charting at shift end.</strong> 6. <strong>Serial re-takes hunting a nicer number.</strong> 7. <strong>\"WNL\" as a reflex</strong> — normal is a finding you MEASURED, not a mood. 8. <strong>Reporting numbers naked</strong> — without trend, character, or context words that make them actionable.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: Kennel-front RR counts on your ward walk cost nothing and build the trend chart that catches the 2 AM decliner. · Tap your foot to the heartbeat while counting — rhythm anomalies pop out. · Warm the stethoscope head in your palm (cold metal = flinch = artifact). · Say numbers aloud as you chart them; transposition errors die in your own ears. · The patient's LAST TPR is the first thing you read, not the last. BANNED: axillary temps charted as rectal without labeling; \"she looks fine, call it 101\" (fabrication, the terminable kind); pinching gums hard for a \"better\" CRT.</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-ASM-001</span> storyboard (distance-count technique, femoral landmark macro with two-finger placement, CRT close-up at real speed, the tent-stroll vs tent-snap comparison). <span class=\"id\">INT-09</span> audio drills (count-alongs incl. purr/pant confounders). Practical: <span class=\"id\">PA-ASM-TPR-001</span> (tolerance-matched values + report-now probe). Case log: ≥10 coached with ≥8 in tolerance; feline minimum 3.</p>\n<hr>\n<p><em>Reviews:</em> R1: added thumb-pulse trap, data-laundering re-take rule, trend-first charting. R2: order-of-operations rationale explicit; every landmark findable from text. R3: hospital gains trustworthy serial vitals — the raw material of every early catch the ward will ever make.</p>", "text": "Companion to TS-ASM-001 /002 · Benchmark course · ~25 min + daily practice 1. Purpose TPR is the hospital's most-repeated clinical measurement and the foundation of every trend that ever catches a deteriorating patient. The skill is producing numbers a DVM can ACT on — which means accurate, honestly-annotated, and delivered at the right urgency. A fabricated or sloppy TPR is worse than none: it launders a sick patient into a stable-looking chart. 2. Prerequisite knowledge Temperature: core heat; fever (set-point up: infection/inflammation) vs hyperthermia (heat in faster than out: stress, heatstroke) feel identical on the thermometer — context distinguishes, which is why you report, not interpret. Pulse: each heartbeat should push a pressure wave to the femoral artery; a heard-beat-without-felt-pulse (deficit) means non-perfusing beats — always reportable. Respiration: one cycle = in AND out; CHARACTER (effort, abdominal push, noise) is earlier warning than rate. Stress artifact: handling raises RR and HR within seconds — sequence your exam around that fact. 3. Equipment Digital thermometer + probe covers + lube; watch/clock with seconds (the wall clock counts); stethoscope that fits YOUR ears (angle earpieces forward); your eyes — the most-used instrument in this course. 4–5. Patient &amp; operator preparation Order of operations is the technique: EYES FIRST sur01", "title": "Surgical patient prep", "group": "Skill courses", "meta": "TS-SUR-PREP-001", "html": "<p>Companion to <span class=\"id\">TS-SUR-PREP-001</span> · Benchmark course · ~30 min + coached cases</p>\n<h3>1. Purpose</h3>\n<p>The prep creates the sterile field's foundation on living skin. Every surgical-site infection starts as a lapse somebody didn't notice — a stingy clip, a scrub that went center-ward, a hot blade, a wrong limb. Your prep also runs on the anesthesia clock: every prep minute is an anesthetized minute. The goal is a prep that is CORRECT first and fast second, and gets faster only by eliminating wasted motion, never by shaving corners.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>Bacteria live ON skin (transient organisms your scrub removes) and IN it (resident flora in follicles you can only suppress — why the field also gets draped and why \"sterile skin\" doesn't exist, only surgically clean). Contamination physics from W5-02: touch, droplet, hover-rain, and moisture wicking (strike-through). The scrub's two active ingredients are CHEMISTRY (agent) and TIME×FRICTION (your hands) — cutting either halves the product. Hair is contamination: it cannot be sterilized, only removed, and it travels; that's why clipping happens in prep, never in the OR.</p>\n<h3>3. Equipment</h3>\n<p>Clippers with a SHARP #40 blade (a dull blade doesn't cut hair — it drags and burns skin; blade sharpness is a patient-safety item, not a maintenance nicety); blade coolant/spare blades; vacuum; chlorhexidine scrub + solution/alcohol per CVAH protocol <code>[CVAH-SPECIFIC INPUT REQUIRED: agents, cycle counts, contact times — post on prep-bay card]</code>; gauze stacks; non-sterile gloves; positioning aids (troughs, ties, sandbags); warming already active under the patient (small patients chill during prep, not just surgery); eye lube confirmed with the anesthetist.</p>\n<h3>4. Patient preparation</h3>\n<p>The patient arrives anesthetized: from this moment its airway, depth, and welfare belong to the anesthetist — but its POSITION and SKIN belong to you. Confirm before a single hair falls: patient ID, procedure, SITE AND SIDE — read the consent/record yourself AND verbalize to the anesthetist (\"Bella Chen, left stifle — confirm?\"). A board-vs-record mismatch is a full stop for the whole room, and being the one who catches it is a badge, not an annoyance.</p>\n<h3>5. Operator preparation</h3>\n<p>You stand on the side that gives your dominant hand a natural clipper stroke along the site; vacuum within reach; scrub bowls arranged in use-order AWAY from the patient's feet (kick zone). Non-dominant hand's permanent job: skin management — stretching it taut ahead of the clipper, tensioning scrub gauze zones. Plan your margins BEFORE clipping (procedure card): visualize the incision, then the drape window, then add the retraction-and-extension margin — clip THAT.</p>\n<h3>6. The procedure</h3>\n<p><strong>Step 1 — Site/side liturgy.</strong> DO: verbalized confirmation as above; check the record, not your memory of morning rounds. STOP: any mismatch = nothing proceeds until the DVM resolves it. This is the step with the never-forgiven failure mode; treat it with liturgical seriousness every single time.</p>\n<p><strong>Step 2 — Clip.</strong> DO: taut skin ahead of the blade (your other hand walking just in front); blade FLAT to the skin — the edge digs, the flat glides; first pass WITH the coat's grain (debulks), second AGAINST (closeness); margins per your visualized window, generous always; check blade heat against your inner wrist every 60–90 s — hot = swap/cool. WHY: flat-and-taut is the entire burn-and-nick prevention system. EXPECT: smooth naked skin, no red drag lines, no \"corduroy\" stripes (dull blade sign). COMMON ERROR: tenting loose skin into the blade (nick), digging the edge at angle changes (burn stripe), skimpy margins that the draping team discovers too late. RECOVERY: ANY nick or burn: report to the surgeon before draping — they decide; concealment converts an incident into an offense. STOP: skin lesions discovered under the coat (dermatitis, wounds at the site) = pause, show the DVM before proceeding.</p>\n<p><strong>Step 3 — Vacuum + degrease.</strong> DO: vacuum the field AND the surrounding table/patient (loose hair migrates); a first degreasing wipe if house protocol uses one. EXPECT: a field where a white gauze wiped across comes away hairless.</p>\n<p><strong>Step 4 — The pattern scrub.</strong> DO: gauze with scrub agent, start ON the incision line, scrub with friction in a spiral working OUTWARD; at the margin, the gauze is DONE — trash, new gauze, start at center again. Repeat cycles per protocol, interleaving alcohol/solution passes as specified; endpoint = BOTH the minimum cycle count AND visibly clean gauze, whichever comes later. WHY: the gradient rule — center is cleanest, margins dirtiest; any inward stroke re-imports what you exported. EXPECT: methodical rhythm, ~30–60 s per cycle; the field develops the uniform \"surgical tan\" of chlorhex. COMMON ERROR: the absent-minded back-track (one inward wipe undoes the cycle — restart the cycle, and say so; honesty about your own contamination is trained here because it's the same muscle the OR runs on); drenching (pooling under the patient = chemical burn + hypothermia + strike-through highway — use damp, not dripping, gauze and towel dams on dependent edges). STOP: n/a.</p>\n<p><strong>Step 5 — Peripheral duties while scrubbing.</strong> DO: monitor position stability (a slipping trough mid-scrub = re-position AND re-scrub disturbed zones); guard warmth (blankets over non-field areas); communicate timeline to the room (\"two cycles to go\"). WHY: you are the room's only person watching the patient's non-field body right now.</p>\n<p><strong>Step 6 — Transport &amp; handover.</strong> DO: move to the OR with the field UP and untouched — nothing brushes it: no arms, no leads, no enthusiastic blankets; position on the OR table per surgeon's setup; final sterile prep happens in-room per protocol (may be CVT). Announce: \"prepped and untouched.\" COMMON ERROR: the doorway shoulder-brush; leads dragged across the field during hookup. RECOVERY: anything touches the prepped field = say it immediately — a re-prep in prep-bay minutes is cheap; a contaminated incision is not.</p>\n<h3>7. Tactile medicine</h3>\n<p>Clipper feel: a sharp blade glides with a low hum and hair falls away; a dull one CHATTERS, drags, and needs pressure — pressure is your warning sign, not your solution. Blade heat check: touch the blade flat to your inner wrist — comfortable-warm is fine; \"coffee mug fresh from the microwave\" means stop. Taut skin under your spreading fingers feels drum-like; loose folds feel like they'll fold — and folds are where nicks happen. Scrub friction: think \"cleaning a pan you like\" — real pressure, small circles, not surface petting.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>Clipper trail looks striped/ragged:</strong> dull blade — swap it; re-clip strays; log the blade for sharpening (the next prep inherits your diligence or your neglect). <strong>Nicked the skin:</strong> pressure, report, surgeon decides (site shift? still usable?); document. <strong>Scrub interrupted mid-cycle</strong> (anesthetist needs hands, patient moves): note where you were; disturbed or paused-too-long fields get the cycle restarted — cycles are integrity units, not suggestions. <strong>Patient too light — moving during prep:</strong> STOP clipping/scrubbing near anything delicate, tell the anesthetist, wait; a moving patient plus a blade is your call to pause, always. <strong>Site/side doubt creeps in mid-prep</strong> (\"did they say left?\"): stop and re-verify — mid-prep doubt outranks momentum, every time. <strong>You realize your margins are too small at draping:</strong> own it fast — extending clip+scrub NOW under the surgeon's direction beats a cramped field mid-procedure. <strong>Pooling discovered under the patient:</strong> dry it, dam it, note skin condition post-op (dependent chlorhex burns show later — the report protects the patient AND you).</p>\n<h3>9. Real patients</h3>\n<p><strong>Cats/small dogs:</strong> hypothermia is the co-procedure — warm scrub per protocol, minimal wetting, speed matters more here (organized speed, not hurried corners). <strong>Deep-coated breeds:</strong> double-length clip time — budget it in the schedule voice (\"this coat needs ten extra minutes\") rather than eating it from scrub cycles. <strong>Thin-skinned seniors/sighthounds:</strong> tissue-paper skin nicks on a glance — flattest blade angle, slowest strokes, maximum taut. <strong>Brachycephalics:</strong> prep positioning must respect the airway — never let positioning aids crowd the neck; the anesthetist confirms every position change. <strong>Emergency preps:</strong> the DVM may direct an abbreviated protocol — that's THEIR call to make out loud, never your silent shortcut; your job is executing the stated abbreviation cleanly and saying what was and wasn't done. <strong>Contaminated sites (abscess, degloving):</strong> these run their own DVM-directed sequence (often clean-surrounding-first); ask before defaulting to the routine pattern.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Margin optimism</strong> — clipping to the incision, not the drape window. 2. <strong>Blade-heat obliviousness</strong> — the burn discovered at suture removal. 3. <strong>The inward wipe</strong> — muscle memory from cleaning tables; drilled out with the trash-at-the-margin rule. 4. <strong>Drenching</strong> — more agent misread as more asepsis. 5. <strong>Silent site doubt</strong> — proceeding around a mismatch feeling. 6. <strong>Field-brush at the doorway</strong> — transport casualness. 7. <strong>Prep-bay tunnel vision</strong> — losing the patient (temp, position, anesthetist's needs) to the site.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: clip the margins FIRST, then fill in — the outline commits you to correct size before fatigue argues for less. · Count your scrub cycles out loud softly; interruptions can't steal your count. · Keep one dry towel corner under your non-dominant hand for instant pooling response. · A gauze square held at the field edge catches clipper-check hair before it lands. · Learn each surgeon's margin preferences ONCE and write them on the procedure cards — asked-and-recorded beats guessed-twice. BANNED: \"pretty clean\" as a scrub endpoint; alcohol-only speed-preps on your own initiative; blade-dip cooling in scrub solution (contaminates and doesn't cool); re-using dropped gauze because \"it landed clean-side up.\"</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-SUR-PREP-001</span> storyboard (taut-skin clipper technique macro; the spiral with trash-at-margin emphasis; pooling dam placement; blade wrist-check). Stills: correct margins vs stingy margins on a model; the corduroy dull-blade trail. Practical: <span class=\"id\">PA-SUR-PREP-001</span> (site/side mismatch probe ★, staged skin-lesion find, cycle-integrity observed). Case log: ≥5 coached across ≥2 procedure types.</p>\n<hr>\n<p><em>Reviews:</em> R1: added margin-outline-first pearl, cycle-integrity restart rule, moving-patient blade pause. R2: hand jobs and stroke mechanics explicit; endpoint defined twice (count AND clean gauze). R3: hospital gains preps that hold up under the drape — and a prep-bay assistant who guards temperature and position while the CVT is freed for anesthesia.</p>", "text": "Companion to TS-SUR-PREP-001 · Benchmark course · ~30 min + coached cases 1. Purpose The prep creates the sterile field's foundation on living skin. Every surgical-site infection starts as a lapse somebody didn't notice — a stingy clip, a scrub that went center-ward, a hot blade, a wrong limb. Your prep also runs on the anesthesia clock: every prep minute is an anesthetized ecuting the stated abbreviation cleanly and saying what was and wasn't done. Contaminated sites (abscess, degloving): these run their own DVM-directed sequence (often clean-surrounding-first); ask before defaulting to the routine pattern. 10. Common rookie mistakes Margin optimism — clipping to the incision, not the drape window. 2. Blade-heat obliviousness — the burn discovered at suture removal. 3. The inward wipe — muscle memory from cleaning tables; drilled out with the trash-at-the-margin rule. 4. Drenching — more agent misread as more asepsis. 5. Silent site doubt — proceeding around a mismatch feeling. 6. Field-brush at the doorway — transport casualness. 7. Prep-bay tunnel vision — losing the patient (temp, position, anesthetist's needs) to the site. 11. Pearls &amp; banned folklore PEARLS: clip the margins FIRST, then fill in — the outline commits you to correct size before fatigue argues for less. · Count your scrub cycles out loud softly; interruptions can't steal your count. · Keep one dry towel corner under your non-dominant hand for instant pooling response. · A gauze square held at the field edge catches clipper-check hair before it lands. · Learn each surgeon's margin preferences ONCE and write them on the procedure cards — asked-and-recorded beats guessed-twice. BANNED: \"pretty clean\" as a scrub endpoint; alcohol-only speed-preps on your own initiative; blade-dip cooling in scrub solution (contaminates and doesn't cool); re-using dropped gauze because \"it landed clean-side up.\" 12–13. Visuals &amp; assessment VID-SUR-PREP-001 storyboard (taut-skin clipper technique macro; the spiral with trash-at-margin emphasis; pooling dam placement; blade wrist-check). Stills: correct margins vs stingy margins on a model; the corduroy dull-blade trail. Practical: PA-SUR-PREP-001 (site/side mismatch probe ★, staged skin-lesion find, cycle-integrity observed). Case log: ≥5 coached across ≥2 procedure types. Reviews: R1: added margin-outline-first pearl, cycle-integrity restart rule, moving-patient blade pause. R2: hand jobs and stroke mechanics explicit; endpoint defined twice (count AND clean gauze). R3: hospital gains preps that hold up under the drape — and a prep-bay assistant who guards temperature and position while the CVT is freed for anesthesia."}, {"id": "csc-flu01", "title": "Fluid lines & pumps", "group": "Skill courses", "meta": "TS-FLU-001/2", "html": "<p>Companion to <span class=\"id\">TS-FLU-001</span>/002 · Benchmark course · ~30 min + lab</p>\n<h3>1. Purpose</h3>\n<p>Fluid therapy is continuous treatment delivered by equipment YOU set up and watch. The DVM chooses fluid and rate; the CVT verifies; but the line's actual behavior — air, kinks, infiltration, free-flow, the pump quietly pushing fluid under the skin — lives or dies on assistant discipline. This course makes you the person whose lines simply work, and whose hourly checks catch problems while they're still small.</p>\n<h3>2. Prerequisite knowledge</h3>\n<p>Gravity and resistance run everything: fluid falls from bag to patient through a tube whose flow you meter (roller clamp) or a pump meters for you. Drip sets are calibrated: macro 10 or 15 gtt/mL, micro 60 gtt/mL — the number is printed on the package and it changes all your math. Pumps push at a set rate AGAINST resistance and count VOLUME PUSHED — they do not know whether it entered a vein or a subcutaneous pocket; that knowledge is your palpating hand's job. Air: small bubbles are a bigger deal in smaller patients; the discipline is air-free priming regardless. Additives: any bag with drugs added (KCl the classic) is CVT/DVM-verified, big-labeled, and pump-only — potassium free-flowed is a lethal error class.</p>\n<h3>3. Equipment</h3>\n<p>Ordered bag (inspect: squeeze test for leaks, clarity — cloudy/particulate = discard/report, expiry); admin set matched to patient size per order/house rule; extension set/T-port; labels; pump or gravity pole; tape.</p>\n<h3>4–5. Preparation</h3>\n<p>Verify order completely: fluid TYPE, RATE, VOLUME/duration, additives (verified by whom?). Stage at the pole: bag hung, set unwrapped, clamp location found and CLOSED before spiking. Operator position: bag at eye level for spiking (spike port pointing down at your face is how fluids end up in your eyes), drip chamber at eye level for filling.</p>\n<h3>6. The procedure</h3>\n<p><strong>Step 1 — Spike.</strong> DO: close roller clamp; peel the bag's port cover; remove spike guard; one firm straight push of the spike fully into the port — no twisting wobble, hands never touching the spike shaft. WHY: the spike is a sterile pathway; wobble = leaks and contamination. EXPECT: firm seat, no drips at the junction. COMMON ERROR: spiking with clamp open (fluid races through, air-locked chamber chaos); half-seated spike weeping at the shoulder. RECOVERY: contaminated or half-seated spike = new set; sets are cheap, line infections aren't.</p>\n<p><strong>Step 2 — Chamber.</strong> DO: squeeze the drip chamber until fluid fills 1/3–1/2. WHY: you need visible falling drops AND an air gap (full chamber can't count drops; empty chamber sends air down-line). COMMON ERROR: overfill — recover by inverting the bag+chamber and squeezing air back up.</p>\n<p><strong>Step 3 — Prime.</strong> DO: open clamp SLOWLY; walk the fluid column down the line watching it; tap junctions/ports as fluid passes (bubbles cling there); fill to the very end; close clamp; cap the end sterile. EXPECT: one continuous glassy column — hold the line against the light and run your eyes down its whole length; champagne trains of micro-bubbles fail the inspection for small patients. COMMON ERROR: priming at full-blast (turbulence = bubbles), or priming \"most of the way.\" RECOVERY: bubbles present → clamp, coil-tap them upward into the chamber, or run further fluid through; never decide they're \"small enough\" for a kitten. STOP: n/a.</p>\n<p><strong>Step 4 — Pump loading (pump lines).</strong> DO: ROLLER CLAMP CLOSED FIRST — say it aloud, it's the free-flow catechism — door open, set seated per THIS model's channel (orientation arrows matter; a backwards set on some models flows uncontrolled), door closed, clamp open, THEN program: rate (mL/h) and VTBI verified against the written order by CVT/DVM per policy; make the display read back the order. WHY: the clamp-before-door habit is the only universal free-flow defense across every pump model ever made. EXPECT: pump primes/tests then holds. COMMON ERROR: mL total vs mL/h confusion at entry (a 420 in the rate field is a bolus disaster) — the read-back-against-order step exists for this. STOP: any doubt about rate math = verify before start, not after.</p>\n<p><strong>Step 5 — Connect.</strong> DO: aseptic cap-off, connect to the catheter's T-port with a firm twist; open/start; watch the FIRST minute: drips falling at the expected rhythm (gravity: your gtt/min math — e.g., 60 mL/h on a 15 gtt set = 15 gtt/min = one drop per 4 seconds), site flat, patient undisturbed. Secure a strain loop of line to the limb wrap: tension arrives at tape, not catheter. Label line and bag: date/time started, set type, initials. COMMON ERROR: connecting an unprimed \"just a little air\" line; no slack loop (first stretch pulls the catheter). STOP: swelling or wet at the site in minute one = stop, assess per <span class=\"id\">CSC-IVC-01</span> §8.</p>\n<p><strong>Step 6 — The hourly check (the actual job).</strong> DO, in the same order every time: (1) PUMP/DRIP — running? rate on display matches ordered? drops actually falling? (2) TRACE the entire line bag→patient with your fingers — kinks, closed clamps, disconnections, chew marks, tangles around limbs; (3) SITE — palpate above the wrap: soft? cool doughy swelling? wet fur? compare limbs; (4) BAG — volume remaining vs time math (a pump claiming 200 delivered from a bag missing 40 = report NOW); (5) PATIENT — comfortable? mobile without tension? e-collar intact if flagged? Chart the check. WHY: five channels because each catches what the others miss. COMMON ERROR: the display-glance \"check.\" STOP: any infiltration sign = stop flow, report; never \"watch it another hour.\"</p>\n<p><strong>Step 7 — Bag change.</strong> DO: verify new bag against order (same everything, additive verification if any); close clamp; swap spike aseptically old→new in one motion; chamber/rate re-check; document volumes (remaining in old, discarded, started new) — the I/O math depends on your arithmetic. COMMON ERROR: spike touched or laid down mid-swap; volumes guessed.</p>\n<h3>7. Tactile medicine</h3>\n<p>A patent line under a slow flush: water through a straw. Infiltrated: bread-dough absorption — soft, wrong, quiet. Occluded: a wall. (Same three sensations as <span class=\"id\">CSC-IVC-01</span> — they're one skill.) A healthy drip chamber has a metronome you can FEEL by watching; rate drift is visible before any alarm. The line-trace hand learns to read kinks like Braille — do it eyes-closed in the lab once; your fingers are faster than your eyes in a dark ward.</p>\n<h3>8. It didn't work — now what?</h3>\n<p><strong>Occlusion alarm:</strong> trace first — kink (open it), clamp (open it), limb position (flex/extend gently: positional flow = re-tape/splint decision to report); then site assessment; NEVER respond by raising the pressure limit or silencing-and-walking. <strong>Air-in-line alarm:</strong> clamp, disconnect at the port per protocol, re-prime the segment or replace the set; the forbidden move is opening the door and flicking bubbles toward the patient. <strong>Rate behind schedule:</strong> don't \"catch up\" by doubling the rate — that's a prescribing act; report the shortfall, the DVM adjusts. <strong>Pump alarming repeatedly, no cause found in 2 min:</strong> swap pump per CVT, tag the offender OUT OF SERVICE with a note — nuisance-alarm pumps never quietly return to rotation. <strong>Bag ran dry unnoticed:</strong> line has air and the catheter may clot — clamp, report, expect re-prime + flush assessment; then fix the system cause (VTBI alarm not set? check skipped?). <strong>Patient chewed the line:</strong> clamp both ends of the damage, assess what was lost (and whether the catheter survived), report; the e-collar conversation is now mandatory. <strong>Fluid running but patient's limb is a balloon:</strong> hours of sub-q delivery — stop, report NOW; log honestly which checks were signed and what they found; this event is the reason the five-channel check exists.</p>\n<h3>9. Real patients</h3>\n<p><strong>Kittens/pediatrics:</strong> micro set (60 gtt/mL) or syringe pump per order; air discipline absolute; check frequency often ordered higher — tiny patients overload on volumes adult eyes consider rounding errors, so your bag-math is a safety system. <strong>Cardiac patients:</strong> the volume-sensitive class; NEVER free-flow anything; rate verification is life-critical; report ANY unexplained rate discrepancy immediately. <strong>Cats:</strong> line-chewers and carpal-kinkers — e-collar flags, extra slack loops, positional-occlusion expectations. <strong>Mobile ward dogs:</strong> entanglement engineering — line routed over the kennel door per house style, walk protocols (clamp-and-cap vs travel-pump per order). <strong>Recumbent patients:</strong> the down-side limb hides infiltration under body weight — palpate BOTH sides of the limb at every check. <strong>Additive bags (KCl et al.):</strong> pump-only, big label facing outward, YOUR verification role is confirming the label matches the order at every bag change — additives are where double-checks earn their keep.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Clamp-open pump loading</strong> — the free-flow setup. 2. <strong>\"Mostly primed\" lines.</strong> 3. <strong>Display-glance checks</strong> — the pump lies by omission. 4. <strong>Catch-up rate boosts</strong> — prescribing by arithmetic. 5. <strong>No strain loop.</strong> 6. <strong>Chamber overfill</strong> and the lost drop-count. 7. <strong>Guessed bag volumes</strong> wrecking I/O math. 8. <strong>Silencing alarms as a reflex</strong> — alarm fatigue is trained INTO people by every un-investigated silence; break the habit before it forms.</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: prime with the line's end held ABOVE the chamber then lower it — the column chases bubbles out ahead of itself. · Loop-tape a pen-width slack coil at the kennel door; door swings stop yanking catheters. · Write bag start-volume ON the bag with time — bedside math beats memory. · At every check, back-count: \"bag says 400 left, started 1000 at 8 AM at 100/h — it's noon, should say 600… report.\" (That five-second arithmetic catches misloaded sets better than any alarm.) · Learn ONE pump deeply (your house model) rather than all pumps shallowly — the registry job aid is your friend. BANNED: flicking air toward patients; pressure-limit raises to silence occlusion alarms; potassium-added bags on gravity \"just for transport\"; blowing into a drip chamber to adjust it (yes, it happens; no, never).</p>\n<h3>12–13. Visuals &amp; assessment</h3>\n<p><span class=\"id\">VID-FLU-001</span> storyboard (spike technique straight-push macro; priming column against light; clamp-before-door drill; five-channel check walk-through). Practical: <span class=\"id\">PA-FLU-001</span> (staged cloudy bag ★, staged occlusion alarm ★, additive-rule verbalization ★). Case log: ≥5 setups incl. pediatric set + bag change + staged alarms caught.</p>\n<hr>\n<p><em>Reviews:</em> R1: added back-count arithmetic pearl, positional-occlusion test, down-side-limb palpation. R2: every alarm has a named first move; the five channels are a memorizable list. R3: hospital gains hourly line checks that actually check — the difference between infiltrations caught at 10 mL and at 400.</p>", "text": "Companion to TS-FLU-001 /002 · Benchmark course · ~30 min + lab 1. Purpose Fluid therapy is continuous treatment delivered by equipment YOU set up and watch. The DVM chooses fluid and rate; the CVT verifies; but the line's actual behavior — air, kinks, infiltration, free-flow, the pump quietly pushing fluid under the skin — lives or dies on assistant discipline. This course makes you the person whose lines simply work, and whose hourly checks catch problems while they're still small. 2. Prerequisite knowledge Gravity and resistance run everything: fluid falls from bag to patient through a tube whose flow you meter (roller clamp) or a pump meters for you. Drip sets are calibrated: macro 10 or 15 gtt/mL, micro 60 gtt/mL — the number is printed on the package and it changes all your math. Pumps push at a set rate AGAINST resistance and count VOLUME PUSHED — they do not know whether it entered a vein or a subcutaneous pocket; that knowledge is your palpating hand's job. Air: small bubbles are a bigger deal in smaller patients; the discipline is air-free priming regardless. Additives: any bag with drugs added (KCl the classic) is CVT/DVM-verified, big-labeled, and pump-only — potassium free-flowed is a lethal error class. 3. Equipment Ordered bag (inspect: squeeze test for leaks, clarity — cloudy/particulate = discard/report, expiry); admin set matched to patient size per order/house rule; extension set/T-port; labels; pump or gravity pole; tape. 4–5. Preparation Verify order completely: fluid TYPE, RATE, VOLUME/duration, additives (verified by whom?). Stage at the pole: bag hung, set unwrapped, clamp location found and CLOSED before spiking. Operator position: bag at eye level for spiking (spike port pointing down at your face is how fluids end up in your eyes), drip chamber at eye level for filling. 6. The procedure Step 1 — Spike. DO: close roller clamp; peel the bag's port cover; remove spike guard; one firm straight push of the spike fully into the port — no twisting wobble, hands never touching the spike shaft. WHY: the spike is a sterile pathway; wobble = leaks and contamination. EXPECT: firm seat, no drips at the junction. COMMON ERROR: spiking with clamp open (fluid races through, air-locked chamber chaos); half-seated spike weeping at the shoulder. RECOVERY: contaminated or half-seated spike = new set; sets are cheap, line infections aren't. Step 2 — Chamber. DO: squeeze the drip chamber until fluid fills 1/3–1/2. WHY: you need visible falling drops AND an air gap (full chamber can't count drops; empty chamber sends air down-line). COMMON ERROR: overfill — recover by inverting the bag+chamber and squeezing air back up. Step 3 — Prime. DO: open clamp SLOWLY; walk the fluid column down the line watching it; tap junctions/ports as fluid passes (bubbles cling there); fill to the very end; close clamp; cap the end sterile. EXPECT: one continuous glassy column — hold the line against the light and run your eyes down its whole length; champagne trains of micro-bubbles fail the inspection for small patients. COMMON ERROR: priming at full-blast (turbulence = bubbles), or priming \"most of the way.\" RECOVERY: bubbles present → clamp, coil-tap them upward into the chamber, or run further fluid through; never decide they're \"small enough\" for a kitten. STOP: n/a. Step 4 — Pump loading (pump lines). DO: ROLLER CLAMP CLOSED FIRST — say it aloud, it's the free-flow catechism — door open, set seated per THIS model's channel (orientation arrows matter; a backwards set on some models flows uncontrolled), door closed, clamp open, THEN program: rate (mL/h) and VTBI verified against the written order by CVT/DVM per policy; make the display read back the order. WHY: the clamp-before-door habit is the only universal free-flow defense across every pump model ever made. EXPECT: pump primes/tests then holds. COMMON ERROR: mL total vs mL/h confusion at entry (a 420 in the rate field is a bolus disaster) — the read-back-against-order step exists for this. STOP: any doubt about rate math = verify before start, not after. Step 5 — Connect. DO: aseptic cap-off, connect to the catheter's T-port with a firm twist; open/start; watch the FIRST minute: drips falling at the expected rhythm (gravity: your gtt/min math — e.g., 60 mL/h on a 15 gtt set = 15 gtt/min = one drop per 4 seconds), site flat, patient undisturbed. Secure a strain loop of line to the limb wrap: tension arrives at tape, not catheter. Label line and bag: date/time started, set type, initials. COMMON ERROR: connecting an unprimed \"just a little air\" line; no slack loop (first stretch pulls the catheter). STOP: swelling or wet at the site in minute one = stop, assess per CSC-IVC-01 §8. Step 6 — The hourly check (the actual job). DO, in the same order every time: (1) PUMP/DRIP — running? rate on display matches ordered? drops actually falling? (2) TRACE the entire line bag→patient with your fingers — kinks, closed clamps, disconnections, chew marks, tangles around limbs; (3) SITE — palpate above the wrap: soft? cool doughy swelling? wet fur? compare limbs; (4) BAG — volume remaining vs time math (a pump claiming 200 delivered from a bag missing 40 = report NOW); (5) PATIENT — comfortable? mobile without tension? e-collar intact if flagged? Chart the check. WHY: five channels because each catches what the others miss. COMMON ERROR: the display-glance \"check.\" STOP: any infiltration sign = stop flow, report; never \"watch it another hour.\" Step 7 — Bag change. DO: verify new bag against order (same everything, additive verification if any); close clamp; swap spike aseptically old→new in one motion; chamber/rate re-check; document volumes (remaining in old, discarded, started new) — the I/O math depends on your arithmetic. COMMON ERROR: spike touched or laid down mid-swap; volumes guessed. 7. Tactile medicine A patent line under a slow flush: water through a straw. Infiltrated: bread-dough absorption — soft, wrong, quiet. Occluded: a wall. (Same three sensations as CSC-IVC-01 — they're one skill.) A healthy drip chamber has a metronome you can FEEL by watching; rate drift is visible before any alarm. The line-trace hand learns to read kinks like Braille — do it eyes-closed in the lab once; your fingers are faster than your eyes in a dark ward. 8. It didn't work — now what? Occlusion alarm: trace first — kink (open it), clamp (open it), limb position (flex/extend gently: positional flow = re-tape/splint decision to report); then site assessment; NEVER respond by raising the pressure limit or silencing-and-walking. Air-in-line alarm: clamp, disconnect at the port per protocol, re-prime the segment or replace the set; the forbidden move is opening the door and flicking bubbles toward the patient. Rate behind schedule: don't \"catch up\" by doubling the rate — that's a prescribing act; report the shortfall, the DVM adjusts. Pump alarming repeatedly, no cause found in 2 min: swap pump per CVT, tag the offender OUT OF SERVICE with a note — nuisance-alarm pumps never quietly return to rotation. Bag ran dry unnoticed: line has air and the catheter may clot — clamp, report, expect re-prime + flush assessment; then fix the system cause (VTBI alarm not set? check skipped?). Patient chewed the line: clamp both ends of the damage, assess what was lost (and whether the catheter survived), report; the e-collar conversation is now mandatory. Fluid running but patient's limb is a balloon: hours of sub-q delivery — stop, report NOW; log honestly which checks were signed and what they found; this event is the reason the five-channel check exists. 9. Real patients Kittens/pediatrics: micro set (60 gtt/mL) or syringe pump per order; air discipline absolute; check frequency often ordered higher — tiny patients overload on volumes adult eyes consider rounding errors, so your bag-math is a safety system. Cardiac patients: the volume-sensitive class; NEVER free-flow anything; rate verification is life-critical; report ANY unexplained rate discrepancy immediately. Cats: line-chewers and carpal-kinkers — e-collar flags, extra slack loops, positional-occlusion expectations. Mobile ward dogs: entanglement engineering — line routed over the kennel door per house style, walk protocols (clamp-and-cap vs travel-pump per order). Recumbent patients: the down-side limb hides infiltration under body weight — palpate BOTH sides of the limb at every check. Additive bags (KCl et al.): pump-only, big label facing outward, YOUR verification role is confirming the label matches the order at every bag change — additives are where double-checks earn their keep. 10. Common rookie mistakes Clamp-open pump loading — the free-flow setup. 2. \"Mostly primed\" lines. 3. Display-glance checks — the pump lies by omission. 4. Catch-up rate boosts — prescribing by arithmetic. 5. No strain loop. 6. Chamber overfill and the lost drop-count. 7. Guessed bag volumes wrecking I/O math. 8. Silencing alarms as a reflex — alarm fatigue is trained INTO people by every un-investigated silence; break the habit before it forms. 11. Pearls &amp; banned folklore PEARLS: prime with the line's end held ABOVE the chamber then lower it — the column chases bubbles out ahead of itself. · Loop-tape a pen-width slack coil at the kennel door; door swings stop yanking catheters. · Write bag start-volume ON the bag with time — bedside math beats memory. · At every check, back-count: \"bag says 400 left, started 1000 at 8 AM at 100/h — it's noon, should say 600… report.\" (That five-second arithmetic catches misloaded sets better than any alarm.) · Learn ONE pump deeply (your house model) rather than all pumps shallowly — the registry job aid is your friend. BANNED: flicking air toward patients; pressure-limit raises to silence occlusion alarms; potassium-added bags on gravity \"just for transport\"; blowing into a drip chamber to adjust it (yes, it happens; no, never). 12–13. Visuals &amp; assessment VID-FLU-001 storyboard (spike technique straight-push macro; priming column against light; clamp-before-door drill; five-channel check walk-through). Practical: PA-FLU-001 (staged cloudy bag ★, staged occlusion alarm ★, additive-rule verbalization ★). Case log: ≥5 setups incl. pediatric set + bag change + staged alarms caught. Reviews: R1: added back-count arithmetic pearl, positional-occlusion test, down-side-limb palpation. R2: every alarm has a named first move; the five channels are a memorizable list. R3: hospital gains hourly line checks that actually check — the difference between infiltrations caught at 10 mL and at 400."}, {"id": "csc-ane01", "title": "Anesthesia monitoring", "group": "Skill courses", "meta": "TS-ANE-103", "html": "<p>Companion to <span class=\"id\">TS-ANE-103</span> · Benchmark course, gateway to the Anesthesia Academy · ~40 min + supervised cases · Role banner: you SUPPORT the anesthetist. You never adjust the vaporizer, APL, or drugs. Your outputs are observations, records, and reports. Everything below teaches you to make those outputs excellent.</p>\n<h3>1. Purpose</h3>\n<p>Anesthesia monitoring is not writing numbers every five minutes — that's anesthesia RECORDING, and a clipboard could do it. Monitoring is continuously answering one question: <em>does this patient's whole picture make sense right now?</em> The monitor supports patient monitoring; it does not replace it. This course builds the loop you'll run hundreds of times: hands and eyes on the patient → numbers → trend → \"does it fit?\" → record → report what doesn't fit, at the urgency it deserves.</p>\n<h3>2. Prerequisite knowledge — enough physiology to reason with</h3>\n<ul>\n<li><strong>Circulation:</strong> cardiac output = HR × stroke volume. Anesthetics vasodilate and depress the heart dose-dependently → deeper usually means lower pressure. Blood pressure is the easy proxy; PERFUSION (blood actually reaching tissues) is the goal — which is why gums, CRT, and pulse quality stay in your loop even with a BP monitor running.</li>\n<li><strong>Ventilation vs oxygenation — two different failures:</strong> ventilation is moving air (CO2 out); oxygenation is loading O2 into blood. A patient on 100% oxygen can hypoventilate for a long time with a PERFECT SpO2 — the CO2 climbs while the pulse ox smiles. That's why EtCO2 and SpO2 are cross-checks, not substitutes.</li>\n<li><strong>EtCO2 needs three systems working:</strong> CO2 must be produced (metabolism), delivered to the lungs (circulation!), and exhaled (ventilation + open circuit). A collapsing EtCO2 with unchanged breathing is a CIRCULATION alarm as much as a breathing one.</li>\n<li><strong>ECG shows electricity, not squeeze:</strong> an organized trace with no pulse is possible and catastrophic — which is why your finger on a pulse outranks the green line.</li>\n<li><strong>Temperature is an anesthetic:</strong> cold patients need less agent, wake slower, clot worse. A falling temp with a \"conveniently stable\" patient is deepening anesthesia in disguise.</li>\n</ul>\n<h3>3. Equipment (what each sensor actually measures)</h3>\n<p>Pulse oximeter (light absorption through tissue → % hemoglobin saturated + a plethysmograph wave whose QUALITY is the number's credibility score); capnograph (CO2 in sampled breath → waveform + EtCO2 + inspired CO2); BP (oscillometric cuff cycles, or Doppler crystal + sphygmomanometer — cuff width ~40% of limb circumference; narrow reads high, wide reads low); ECG (three electrodes, standard placement per house convention, contact gel); thermometer (continuous probe or serial rectal); YOUR SENSES (the only multi-parameter device with judgment). The anesthesia record sheet and a working pen are monitoring equipment — treat them so.</p>\n<h3>4–5. Patient &amp; operator preparation</h3>\n<p>Before induction, know YOUR patient: age, breed risks (brachycephalic airway; sighthound recovery), premeds given and their expected signatures (an alpha-2 bradycardia you expect is information; one you didn't expect is a question), baseline TPR, the case's ALERT BANDS (per <span class=\"id\">CRC-003</span> defaults or the anesthetist's stated case-specific numbers — ask: \"what are my report thresholds today?\"). Your station: where you can SEE chest, bag, monitor, and the anesthetist without moving your feet; record sheet on a board; the patient's head and the reservoir bag in your natural eye-line. Probes placed per house convention: SpO2 tongue (or lip/ear/prepuce/vulva alternates when tongue fails), ECG per convention, cuff sized against the limb — do the 40% eyeball check every time.</p>\n<h3>6. The procedure — the five-minute loop (run it identically, every cycle, entire case)</h3>\n<p><strong>Beat 1 — HANDS AND EYES FIRST (before looking at any screen).</strong> DO: chest excursion (moving? symmetric? effort?), reservoir bag (moving with the chest? how full?), MM color + CRT, palpate pulse (strong? matches the ECG beep?), eye position/palpebral/jaw tone per the anesthetist's depth-check routine (you observe and report; depth CALLS are theirs), temperature per schedule. WHY: the patient is the primary instrument; every artifact-vs-real decision you'll ever make starts with this beat already done. EXPECT: ~30 seconds once practiced. COMMON ERROR: screen-first monitoring — numbers hypnotize; the beat order is the antidote. STOP: bag not moving, no palpable pulse, blue/white gums = say it LOUD now — these are not \"note at next interval\" findings.</p>\n<p><strong>Beat 2 — NUMBERS.</strong> DO: read HR/rhythm, SpO2 + pleth quality (clean waves = credible; ragged = suspect), EtCO2 + waveform shape (square-ish? baseline at zero?), BP, temp, agent %/O2 flow as displayed. COMMON ERROR: recording SpO2 without glancing at the pleth — a number without its credibility score.</p>\n<p><strong>Beat 3 — TREND.</strong> DO: compare against the last 3–4 entries, not just the last one; ask \"what direction is each number walking?\" A MAP of 62 that was 78→71→66 is a different fact than a steady 62. WHY: trends are where anesthesia problems live; single values are where artifacts live.</p>\n<p><strong>Beat 4 — \"DOES IT FIT?\"</strong> DO: run the cross-check — do the numbers agree with each other AND with your Beat-1 hands? HR up + BP down + pale gums = a coherent (bad) story: report now. SpO2 88 + ragged pleth + pink gums + good pulse = an incoherent story: suspect the probe, fix it, AND say what you're doing. WHY: this beat is the whole difference between a monitor and a scribe.</p>\n<p><strong>Beat 5 — RECORD.</strong> DO: chart the cycle's values at the interval, draw the trend lines, stamp events as they happen (position change, surgeon milestone, drug given by anesthetist, probe repositioned, ANY report you made and when). Gaps stay gaps — a blank cell is honest; a backfilled guess is fiction in a legal record. COMMON ERROR: batch-charting three cycles from memory during a quiet stretch.</p>\n<p><strong>Beat 6 — REPORT (when triggered).</strong> DO: use the case's bands and the trend rule — crossing a band, WALKING toward a band, waveform loss/shape change, any Beat-1 physical change, any equipment doubt. Format: finding + trend + credibility note + urgency. \"MAP 58, down from 70 over fifteen minutes, cuff rechecked and placement good — this looks real, and it's still drifting.\" WHY: that sentence gives the anesthetist everything: value, slope, artifact-screen, and your read. COMMON ERROR: silent troubleshooting (fixing the probe for four minutes while a real desaturation runs) — the rule is REPORT-WHILE-CHECKING, never instead of.</p>\n<h3>7. Tactile &amp; sensory medicine</h3>\n<p>The reservoir bag is your remote hand on the lungs: its excursion size is tidal volume's shadow; its rhythm is RR; a bag that stops is apnea NOW (say it, don't verify it to death). A pulse under your finger: full and pushing vs thin and tapping — pressure's texture; practice calibrating your finger against the BP monitor every case (finger says weak + monitor says 55 = your finger just got smarter). Gum color changes are subtle under OR lights — compare against YOUR baseline check, same spot, same lighting. The capnograph's sound (where enabled) lets your ears monitor while your eyes chart; learn the pitch change of a falling EtCO2. Cold: the patient's ears and paws chill FIRST — your hand on an ear between cycles is a free leading indicator.</p>\n<h3>8. It doesn't fit — now what? (the artifact-vs-real drills)</h3>\n<p><strong>SpO2 drops:</strong> pleth check FIRST. Clean wave = believe it: report immediately with gum/pulse corroboration. Ragged wave = probe (position, cold tongue, pressure) — announce + reposition + recheck; if the new site agrees with the bad number, it was never artifact. NEVER silence a saturation alarm on the theory it's artifact — test the theory out loud.</p>\n<p><strong>EtCO2 flatlines:</strong> the big one. Hands on: chest moving? bag moving? circuit connected at every joint? sampling line kinked/water-logged? Say \"EtCO2 just went flat — checking circuit — chest IS/ISN'T moving\" AS you check. Flat + no chest movement = apnea/arrest pathway — the anesthetist owns the response; your loud early words own the timeline. (SpO2 stays falsely fine for minutes on oxygen — do not let it talk you down.)</p>\n<p><strong>EtCO2 climbing slowly:</strong> hypoventilation pattern (common, drug-related) vs rebreathing (baseline off zero — absorbent/valves). Check the BASELINE first: it sorts the two in one glance. Report the trend with the baseline fact attached.</p>\n<p><strong>BP reading absurd:</strong> cuff size/site/limb-motion recheck, one repeat cycle, palpate the pulse yourself — then report BOTH the number and your verification (\"oscillometric says 40 but femoral feels strong; cuff rechecked; repeating — wanted you to know while I verify\").</p>\n<p><strong>ECG chaos, patient fine:</strong> electrode contact (dried gel, slipped clip) — fix, report what you found; the discipline is that ECG weirdness gets EXPLAINED, never shrugged at, because the one time it's real matters more than the nine times it's a dry clip.</p>\n<p><strong>HR/rhythm changes that ARE real</strong> (bradycardia drifting down, sudden tachycardia, irregularity with pulse deficits): these are report-now, with the premed context you memorized (\"HR 48, was 70 at start — she had dexmedetomidine, but the slope is steady down\").</p>\n<p><strong>Bag/chest disagreement</strong> (bag moving, chest barely; or effort against the circuit): circuit/airway question — report immediately; do not adjust anything.</p>\n<p><strong>The meta-rule:</strong> you may PHYSICALLY CHECK (probes, leads, cuffs, line tracing, sampling line) on your own initiative WHILE reporting; you may never treat, adjust the machine, or decide-not-to-mention. When in doubt, the sentence \"I'm probably wrong, but look at this\" has saved more patients than every monitor combined.</p>\n<h3>9. Real patients</h3>\n<p><strong>Cats:</strong> small tidal volumes make bag-reading subtle — stand closer; hypothermia arrives fast and drives everything; SpO2 tongue probes fail more (small tongue, compression artifact) — know your alternate sites. <strong>Brachycephalics:</strong> the airway is the story start to finish; recovery vigilance doctrine (they obstruct AFTER extubation) begins in your case notes now. <strong>Geriatrics:</strong> less reserve — trends move faster from \"fine\" to \"not\"; report earlier on the slope. <strong>Pediatrics:</strong> glucose and temperature fragility; minimal-drape heat loss is YOUR watch. <strong>Sighthounds:</strong> lean bodies chill and recover differently; the anesthetist will brief — your job is knowing that a briefing exists to ask for. <strong>The dental (longest cases):</strong> water + time = the hypothermia case study; temp trend is the headline number by hour two. <strong>Emergency/compromised patients:</strong> bands are set case-specific and tighter; ask for them explicitly at induction — \"what are my numbers today?\" marks you as exactly the monitor the academy wants.</p>\n<h3>10. Common rookie mistakes</h3>\n<ol>\n<li><strong>Screen-first monitoring</strong> — the hypnotized clipboard. Prevention: Beat 1 is muscle memory before your first live case (drilled in sim). 2. <strong>Recording without reading</strong> — perfect penmanship, no idea the MAP has fallen 20 points over four entries. Prevention: Beat 3's compare-against-three rule. 3. <strong>Silent troubleshooting</strong> — the four quiet minutes that become the incident report's centerpiece. 4. <strong>Artifact-calling by preference</strong> — \"probably the probe\" because that's the comfortable world. Prevention: the test-the-theory-out-loud rule. 5. <strong>Backfilled records</strong> — fiction with a time stamp. 6. <strong>Threshold worship</strong> — waiting at 61 for a band set at 60 while the slope screams. 7. <strong>Speaking too softly</strong> to interrupt — the report that wasn't heard didn't happen; closed-loop it (\"did you catch that MAP?\").</li>\n</ol>\n<h3>11. Pearls &amp; banned folklore</h3>\n<p>PEARLS: Narrate your first cases aloud quietly — anesthetists correct narration in real time and you learn triple-speed. · Put your watch/timer where the record sheet is; cycles drift late during surgeon-interesting moments, which are exactly the moments monitoring matters. · Calibrate your finger against the monitor every case (the pulse-vs-number game) — in a year your finger will be the best sensor in the room. · During quiet stretches, pre-read the NEXT likely event (closing = lightening; moving to rads = disconnection risk) and stage your attention. · Learn each anesthetist's briefing style and ask for bands up front; being briefed well is a skill you can cause. BANNED: touching the vaporizer/APL/flowmeter uninstructed, ever, including \"just turning it down while she's clearly light\" (report instead — depth is a prescription); silencing any alarm without a stated reason; \"she's fine, she's just deep\" as a self-issued diagnosis; leaving your station without a named replacement watching (\"thirty seconds\" is how recovery deaths start).</p>\n<h3>12. Visual assets</h3>\n<p><span class=\"id\">VID-ANE-103</span> storyboard (the five-beat loop performed in real time on a real case; the artifact-vs-real split screens: clean vs ragged pleth at the same SpO2 value; flat capnograph with the hands-on check sequence). <span class=\"id\">INT-A3</span> capnogram library (12 waveforms). <span class=\"id\">SIM-ANES-001</span>..006 trend cases are this course's examination hall — plus the expanded library (<span class=\"id\">SIM-ANES-007</span>+) in the Academy.</p>\n<h3>13. Assessment &amp; competency links</h3>\n<p>Knowledge: <span class=\"id\">QB-ANES</span> (rewritten; SC 100%) + waveform set ≥85%. Practical: <span class=\"id\">PA-ANES-MON-001</span> (live case + staged drill; silent-troubleshooting and dial-touching are critical fails). Case log: 10 monitored cases (≥3 procedure types, ≥1 long dental) with anesthetist sign-per-case before assessment.</p>\n<hr>\n<p><em>Reviews:</em> R1: added the five-beat loop as one memorizable cycle, report-while-checking doctrine, finger-calibration game. R2: every beat has a where-do-I-look answer; report sentences are given as templates. R3: hospital gains a second set of trained eyes on every anesthetized patient — the specific gap CEPSAF-type mortality data says kills: unwatched patients in \"quiet\" phases.</p>", "text": "Companion to TS-ANE-103 · Benchmark course, gateway to the Anesthesia Academy · ~40 min + supervised cases · Role banner: you SUPPORT the anesthetist. You never adjust the vaporizer, APL, or drugs. Your outputs are observations, records, and reports. Everything below teaches you to make those outputs excellent. 1. Purpose Anesthesia monitoring is not writing numbers every five minutes — that's anesthesia RECORDING, and a clipboard could do it. Monitoring is continuously answering one question: does this patient's whole picture make sense right now? The monitor supports patient monitoring; it does not replace it. This course builds the loop you'll run hundreds of times: hands and eyes on the patient → numbers → trend → \"does it fit?\" → record → report what doesn't fit, at the urgency it deserves. 2. Prerequisite knowledge — enough physiology to reason with Circulation: cardiac output = HR × stroke volume. Anesthetics vasodilate and depress the heart dose-dependently → deeper usually means lower pressure. Blood pressure is the easy proxy; PERFUSION (blood actually reaching tissues) is the goal — which is why gums, CRT, and pulse quality stay in your loop even with a BP monitor running. Ventilation vs oxygenation — two different failures: ventilation is moving air (CO2 out); oxygenation is loading O2 into blood. A patient on 100% oxygen can hypoventilate for a long time with a PERFECT SpO2 — the CO2 climbs while the pulse ox smiles. That's why EtCO2 and SpO2 are cross-checks, not substitutes. EtCO2 needs three systems working: CO2 must be produced (metabolism), delivered to the lungs (circulation!), and exhaled (ventilation + open circuit). A collapsing EtCO2 with unchanged breathing is a CIRCULATION alarm as much as a breathing one. ECG shows electricity, not squeeze: an organized trace with no pulse is possible and catastrophic — which is why your finger on a pulse outranks the green line. Temperature is an anesthetic: cold patients need less agent, wake slower, clot worse. A falling temp with a \"conveniently stable\" patient is deepening anesthesia in disguise. 3. Equipment (what each sensor actually measures) Pulse oximeter (light absorption through tissue → % hemoglobin saturated + a plethysmograph wave whose QUALITY is the number's credibility score); capnograph (CO2 in sampled breath → waveform + EtCO2 + inspired CO2); BP (oscillometric cuff cycles, or Doppler crystal + sphygmomanometer — cuff width ~40% of limb circumference; narrow reads high, wide reads low); ECG (three electrodes, standard placement per house convention, contact gel); thermometer (continuous probe or serial rectal); YOUR SENSES (the only multi-parameter device with judgment). The anesthesia record sheet and a working pen are monitoring equipment — treat them so. 4–5. Patient &amp; operator preparation Before induction, know YOUR patient: age, breed risks (brachycephalic airway; sighthound recovery), premeds given and their expected signatures (an alpha-2 bradycardia you expect is information; one you didn't expect is a question), baseline TPR, the case's ALERT BANDS (per CRC-003 defaults or the anesthetist's stated case-specific numbers — ask: \"what are my report thresholds today?\"). Your station: where you can SEE chest, bag, monitor, and the anesthetist without moving your feet; record sheet on a board; the patient's head and the reservoir bag in your natural eye-line. Probes placed per house convention: SpO2 tongue (or lip/ear/prepuce/vulva alternates when tongue fails), ECG per convention, cuff sized against the limb — do the 40% eyeball check every time. 6. The procedure — the five-minute loop (run it identically, every cycle, entire case) Beat 1 — HANDS AND EYES FIRST (before looking at any screen). DO: chest excursion (moving? symmetric? effort?), reservoir bag (moving with the chest? how full?), MM color + CRT, palpate pulse (strong? matches the ECG beep?), eye position/palpebral/jaw tone per the anesthetist's depth-check routine (you observe and report; depth CALLS are theirs), temperature per schedule. WHY: the patient is the primary instrument; every artifact-vs-real decision you'll ever make starts with this beat already done. EXPECT: ~30 seconds once practiced. COMMON ERROR: screen-first monitoring — numbers hypnotize; the beat order is the antidote. STOP: bag not moving, no palpable pulse, blue/white gums = say it LOUD now — these are not \"note at next interval\" findings. Beat 2 — NUMBERS. DO: read HR/rhythm, SpO2 + pleth quality (clean waves = credible; ragged = suspect), EtCO2 + waveform shape (square-ish? baseline at zero?), BP, temp, agent %/O2 flow as displayed. COMMON ERROR: recording SpO2 without glancing at the pleth — a number without its credibility score. Beat 3 — TREND. DO: compare against the last 3–4 entries, not just the last one; ask \"what direction is each number walking?\" A MAP of 62 that was 78→71→66 is a different fact than a steady 62. WHY: trends are where anesthesia problems live; single values are where artifacts live. Beat 4 — \"DOES IT FIT?\" DO: run the cross-check — do the numbers agree with each other AND with your Beat-1 hands? HR up + BP down + pale gums = a coherent (bad) story: report now. SpO2 88 + ragged pleth + pink gums + good pulse = an incoherent story: suspect the probe, fix it, AND say what you're doing. WHY: this beat is the whole difference between a monitor and a scribe. Beat 5 — RECORD. DO: chart the cycle's values at the interval, draw the trend lines, stamp events as they happen (position change, surgeon milestone, drug given by anesthetist, probe repositioned, ANY report you made and when). Gaps stay gaps — a blank cell is honest; a backfilled guess is fiction in a legal record. COMMON ERROR: batch-charting three cycles from memory during a quiet stretch. Beat 6 — REPORT (when triggered). DO: use the case's bands and the trend rule — crossing a band, WALKING toward a band, waveform loss/shape change, any Beat-1 physical change, any equipment doubt. Format: finding + trend + credibility note + urgency. \"MAP 58, down from 70 over fifteen minutes, cuff rechecked and placement good — this looks real, and it's still drifting.\" WHY: that sentence gives the anesthetist everything: value, slope, artifact-screen, and your read. COMMON ERROR: silent troubleshooting (fixing the probe for four minutes while a real desaturation runs) — the rule is REPORT-WHILE-CHECKING, never instead of. 7. Tactile &amp; sensory medicine The reservoir bag is your remote hand on the lungs: its excursion size is tidal volume's shadow; its rhythm is RR; a bag that stops is apnea NOW (say it, don't verify it to death). A pulse under your finger: full and pushing vs thin and tapping — pressure's texture; practice calibrating your finger against the BP monitor every case (finger says weak + monitor says 55 = your finger just got smarter). Gum color changes are subtle under OR lights — compare against YOUR baseline check, same spot, same lighting. The capnograph's sound (where enabled) lets your ears monitor while your eyes chart; learn the pitch change of a falling EtCO2. Cold: the patient's ears and paws chill FIRST — your hand on an ear between cycles is a free leading indicator. 8. It doesn't fit — now what? (the artifact-vs-real drills) SpO2 drops: pleth check FIRST. Clean wave = believe it: report immediately with gum/pulse corroboration. Ragged wave = probe (position, cold tongue, pressure) — announce + reposition + recheck; if the new site agrees with the bad number, it was never artifact. NEVER silence a saturation alarm on the theory it's artifact — test the theory out loud. EtCO2 flatlines: the big one. Hands on: chest moving? bag moving? circuit connected at every joint? sampling line kinked/water-logged? Say \"EtCO2 just went flat — checking circuit — chest IS/ISN'T moving\" AS you check. Flat + no chest movement = apnea/arrest pathway — the anesthetist owns the response; your loud early words own the timeline. (SpO2 stays falsely fine for minutes on oxygen — do not let it talk you down.) EtCO2 climbing slowly: hypoventilation pattern (common, drug-related) vs rebreathing (baseline off zero — absorbent/valves). Check the BASELINE first: it sorts the two in one glance. Report the trend with the baseline fact attached. BP reading absurd: cuff size/site/limb-motion recheck, one repeat cycle, palpate the pulse yourself — then report BOTH the number and your verification (\"oscillometric says 40 but femoral feels strong; cuff rechecked; repeating — wanted you to know while I verify\"). ECG chaos, patient fine: electrode contact (dried gel, slipped clip) — fix, report what you found; the discipline is that ECG weirdness gets EXPLAINED, never shrugged at, because the one time it's real matters more than the nine times it's a dry clip. HR/rhythm changes that ARE real (bradycardia drifting down, sudden tachycardia, irregularity with pulse deficits): these are report-now, with the premed context you memorized (\"HR 48, was 70 at start — she had dexmedetomidine, but the slope is steady down\"). Bag/chest disagreement (bag moving, chest barely; or effort against the circuit): circuit/airway question — report immediately; do not adjust anything. The meta-rule: you may PHYSICALLY CHECK (probes, leads, cuffs, line tracing, sampling line) on your own initiative WHILE reporting; you may never treat, adjust the machine, or decide-not-to-mention. When in doubt, the sentence \"I'm probably wrong, but look at this\" has saved more patients than every monitor combined. 9. Real patients Cats: small tidal volumes make bag-reading subtle — stand closer; hypothermia arrives fast and drives everything; SpO2 tongue probes fail more (small tongue, compression artifact) — know your alternate sites. Brachycephalics: the airway is the story start to finish; recovery vigilance doctrine (they obstruct AFTER extubation) begins in your case notes now. Geriatrics: less reserve — trends move faster from \"fine\" to \"not\"; report earlier on the slope. Pediatrics: glucose and temperature fragility; minimal-drape heat loss is YOUR watch. Sighthounds: lean bodies chill and recover differently; the anesthetist will brief — your job is knowing that a briefing exists to ask for. The dental (longest cases): water + time = the hypothermia case study; temp trend is the headline number by hour two. Emergency/compromised patients: bands are set case-specific and tighter; ask for them explicitly at induction — \"what are my numbers today?\" marks you as exactly the monitor the academy wants. 10. Common rookie mista
