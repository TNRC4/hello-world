ro", "group": "Lessons", "meta": "Week 3", "html": "<p><strong>Why this matters:</strong> Cephalic-only phlebotomists stall the moment a forelimb is catheter-reserved or a cat says no. Site flexibility is what makes you dependable.</p>\n<p><strong>Objectives:</strong> perform lateral saphenous (canine) and medial saphenous (feline) draws coached; explain jugular indications/contraindications and demonstrate the holder role; know why jugular sticks wait for your S1 sign-off later.</p>\n<p><strong>Core instruction:</strong> Read <strong><span class=\"id\">CSC-VEN-02</span></strong> and <strong><span class=\"id\">CSC-VEN-03</span></strong> (the teaching courses; specs <span class=\"id\">TS-VEN-SAPH</span>/JUG-001 govern) (jugular is theory + holder-role only this week; live jugular sticks are a supervised later milestone — VA3-track). Floor blocks: saphenous model work half-day, then coached feline medial saphenous with towel-wrapped patients (this is where your W1 towel skills pay rent). Jugular block: you hold for the CVT's jugular draws all week — the holder role IS jugular training: nose-up-not-hyperextended, airway watch, low occlusion feel.</p>\n<p><strong>Knowledge check:</strong> 1) Why is medial saphenous often the feline vessel of choice? (<em>Large, flat, accessible under low-stress towel restraint; spares neck/forelimbs.</em>) 2) Absolute assistant no-go for jugular? (<em>Suspected coagulopathy; severe dyspnea positioning; escalate instead.</em>) 3) The lateral saphenous rolls — the fix lives where? (<em>In your distal traction, not in more needle force.</em>)</p>\n<p><strong>Practical assignment:</strong> ≥3 coached saphenous draws (≥2 feline medial); ≥4 jugular holds. <strong>Competency connection:</strong> <span class=\"id\">TS-VEN-SAPH-001</span> → 5–6; <span class=\"id\">TS-VEN-JUG-001</span> → 3–4; <span class=\"id\">TS-RES-003</span> → 7–8. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Cephalic-only phlebotomists stall the moment a forelimb is catheter-reserved or a cat says no. Site flexibility is what makes you dependable. Objectives: perform lateral saphenous (canine) and medial saphenous (feline) draws coached; explain jugular indications/contraindications and demonstrate the holder role; know why jugular sticks wait for your S1 sign-off later. Core instruction: Read CSC-VEN-02 and CSC-VEN-03 (the teaching courses; specs TS-VEN-SAPH /JUG-001 govern) (jugular is theory + holder-role only this week; live jugular sticks are a supervised later milestone — VA3-track). Floor blocks: saphenous model work half-day, then coached feline medial saphenous with towel-wrapped patients (this is where your W1 towel skills pay rent). Jugular block: you hold for the CVT's jugular draws all week — the holder role IS jugular training: nose-up-not-hyperextended, airway watch, low occlusion feel. Knowledge check: 1) Why is medial saphenous often the feline vessel of choice? ( Large, flat, accessible under low-stress towel restraint; spares neck/forelimbs. ) 2) Absolute assistant no-go for jugular? ( Suspected coagulopathy; severe dyspnea positioning; escalate instead. ) 3) The lateral saphenous rolls — the fix lives where? ( In your distal traction, not in more needle force. ) Practical assignment: ≥3 coached saphenous draws (≥2 feline medial); ≥4 jugular holds. Competency connection: TS-VEN-SAPH-001 → 5–6; TS-VEN-JUG-001 → 3–4; TS-RES-003 → 7–8. Version: 1.0 2026-08-17."}, {"id": "lsn-w3-04", "title": "W3-04 · Tubes Sample Integrity", "group": "Lessons", "meta": "Week 3", "html": "<p><strong>Why this matters:</strong> A perfect stick into the wrong tube, shaken, is a redraw — meaning another needle in the patient because of the last 20 seconds of workflow.</p>\n<p><strong>Objectives:</strong> match tube to test class; execute fill order; mix correctly; label at patient-side; name the preanalytic error from its artifact; prep samples for the reference lab.</p>\n<p><strong>Core instruction:</strong> The content is <strong><span class=\"id\">TS-SAM-001</span></strong> — this lesson wraps it in drills. <span class=\"id\">INT-05</span> interactive: drag test-orders onto tubes (CBC→lavender, chem→red/SST per house, coag→blue-to-the-line, glucose-special→gray) with instant explanations; the fill-order sequencing game; the artifact gallery (photos: hemolyzed vs lipemic vs icteric serum; clotted EDTA feathering) with \"name the cause\" items. Reference-lab block: requisition matching, spin-and-separate timing, cold-pack vs ambient per directory, courier cutoffs <code>[CVAH-SPECIFIC INPUT REQUIRED: house courier schedule]</code>.</p>\n<p><strong>Clinical case:</strong> CBC flagged \"platelet clumps — count unreliable.\" Draw was smooth. What probably happened and what will you change? (<em>Slow transfer or weak mixing — EDTA tubes get blood FIRST and 8–10 gentle inversions IMMEDIATELY; in cats, faster is everything.</em>)</p>\n<p><strong>Knowledge check:</strong> 1) Why is a short-filled blue tube garbage? (<em>Citrate:blood ratio fixed at 1:9 — underfill = relative citrate excess = falsely prolonged times.</em>) 2) Serum vs plasma — which tube gives which? (<em>Red/SST clot → serum; heparin/EDTA anticoagulated → plasma.</em>) 3) The three commonest hemolysis causes in-house? (<em>Aspirating too hard, stopper-punch transfer, shaking.</em>)</p>\n<p><strong>Practical assignment:</strong> process every one of your Week-3 draws end-to-end; 2 reference-lab submissions supervised. <strong>Competency connection:</strong> <span class=\"id\">TS-SAM-001</span> → 7–8; <span class=\"id\">TS-LAB-001</span>/002 begin (smear + PCV/TS lab block Friday). <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: A perfect stick into the wrong tube, shaken, is a redraw — meaning another needle in the patient because of the last 20 seconds of workflow. Objectives: match tube to test class; execute fill order; mix correctly; label at patient-side; name the preanalytic error from its artifact; prep samples for the reference lab. Core instruction: The content is TS-SAM-001 — this lesson wraps it in drills. INT-05 interactive: drag test-orders onto tubes (CBC→lavender, chem→red/SST per house, coag→blue-to-the-line, glucose-special→gray) with instant explanations; the fill-order sequencing game; the artifact gallery (photos: hemolyzed vs lipemic vs icteric serum; clotted EDTA feathering) with \"name the cause\" items. Reference-lab block: requisition matching, spin-and-separate timing, cold-pack vs ambient per directory, courier cutoffs [CVAH-SPECIFIC INPUT REQUIRED: house courier schedule] . Clinical case: CBC flagged \"platelet clumps — count unreliable.\" Draw was smooth. What probably happened and what will you change? ( Slow transfer or weak mixing — EDTA tubes get blood FIRST and 8–10 gentle inversions IMMEDIATELY; in cats, faster is everything. ) Knowledge check: 1) Why is a short-filled blue tube garbage? ( Citrate:blood ratio fixed at 1:9 — underfill = relative citrate excess = falsely prolonged times. ) 2) Serum vs plasma — which tube gives which? ( Red/SST clot → serum; heparin/EDTA anticoagulated → plasma. ) 3) The three commonest hemolysis causes in-house? ( Aspirating too hard, stopper-punch transfer, shaking. ) Practical assignment: process every one of your Week-3 draws end-to-end; 2 reference-lab submissions supervised. Competency connection: TS-SAM-001 → 7–8; TS-LAB-001 /002 begin (smear + PCV/TS lab block Friday). Version: 1.0 2026-08-17."}, {"id": "lsn-w3-05", "title": "W3-05 · SQ Injections", "group": "Lessons", "meta": "Week 3", "html": "<p><strong>Why this matters:</strong> Vaccines and SQ meds are constant, daily, high-volume tasks — a signed-off assistant absorbs dozens per week.</p>\n<p><strong>Objectives:</strong> perform verified SQ injections to spec; integrate five-rights choreography with a verifier; recognize and respond to injection reactions.</p>\n<p><strong>Core instruction:</strong> The content is <strong><span class=\"id\">TS-INJ-SQ-001</span></strong> + the <span class=\"id\">TS-MED-001</span> verification choreography, now performed live: you prepare, the CVT verifies, you administer, you watch, you chart. Reaction module: normal transient sting vs the report-now set (facial swelling, hives, vomiting within minutes-to-hours, collapse = anaphylaxis pathway — locate the DVM FIRST, then help stage); vaccine-site conventions per house map; the through-and-through miss and its honest handling (wet fur → report → DVM decides, never silent re-dose).</p>\n<p><strong>Knowledge check:</strong> 1) Aspirate before SQ injection — why? (<em>Blood return means you're intravascular — wrong compartment; withdraw and restart.</em>) 2) Ten minutes post-vaccine, puppy's muzzle is swelling. (<em>DVM immediately — anaphylaxis pathway; do not \"watch it\" solo.</em>) 3) You suspect half the dose went through the tent. (<em>Report. The re-dose decision is not yours — double-dosing is the other cliff.</em>)</p>\n<p><strong>Practical assignment:</strong> ≥5 coached SQ (mix vaccine/med/fluids-under-skin where ordered). <strong>Competency connection:</strong> <span class=\"id\">TS-INJ-SQ-001</span> → 6–7; PA scheduled Week 4–5. IM injections open in Week 4 after this is solid. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Vaccines and SQ meds are constant, daily, high-volume tasks — a signed-off assistant absorbs dozens per week. Objectives: perform verified SQ injections to spec; integrate five-rights choreography with a verifier; recognize and respond to injection reactions. Core instruction: The content is TS-INJ-SQ-001 + the TS-MED-001 verification choreography, now performed live: you prepare, the CVT verifies, you administer, you watch, you chart. Reaction module: normal transient sting vs the report-now set (facial swelling, hives, vomiting within minutes-to-hours, collapse = anaphylaxis pathway — locate the DVM FIRST, then help stage); vaccine-site conventions per house map; the through-and-through miss and its honest handling (wet fur → report → DVM decides, never silent re-dose). Knowledge check: 1) Aspirate before SQ injection — why? ( Blood return means you're intravascular — wrong compartment; withdraw and restart. ) 2) Ten minutes post-vaccine, puppy's muzzle is swelling. ( DVM immediately — anaphylaxis pathway; do not \"watch it\" solo. ) 3) You suspect half the dose went through the tent. ( Report. The re-dose decision is not yours — double-dosing is the other cliff. ) Practical assignment: ≥5 coached SQ (mix vaccine/med/fluids-under-skin where ordered). Competency connection: TS-INJ-SQ-001 → 6–7; PA scheduled Week 4–5. IM injections open in Week 4 after this is solid. Version: 1.0 2026-08-17."}, {"id": "lsn-w4-01", "title": "W4-01 · IVC Foundations", "group": "Lessons", "meta": "Week 4", "html": "<p><strong>Why this matters:</strong> Venous access is the front door to fluids, anesthesia, and emergency drugs. Where CVAH policy permits assistants to place catheters, this is the Core's most advanced transfer; where it doesn't, this knowledge still makes you the best catheter assistant and monitor in the building.</p>\n<p><strong>Objectives:</strong> name catheter components and gauge logic; explain why the flash lies (stylet vs catheter tip); explain site strategy (distal-first); state the shear rule; assist a placement end-to-end.</p>\n<p><strong>Core instruction:</strong> Read <strong><span class=\"id\">CSC-IVC-01</span></strong> §§1–5 (the teaching course; <span class=\"id\">TS-IVC-CEPH-001</span> governs). Component tray-teach: catheter/stylet unit anatomy, T-port, cap, flush; gauge color logic and flow physics (radius⁴ — why one gauge matters so much); the geometry lesson: catheter tip trails the stylet tip, so flash ≠ catheter-in-lumen — the advance-then-thread beat is the whole skill. The shear rule taught as absolute: <strong>never re-advance a pulled-back catheter over its stylet</strong> (fragment embolism); withdraw as a unit, always. Site strategy: start distal, fail upward. Policy checkpoint: your floor role this week depends on scope row <span class=\"id\">SCOPE-004</span> — placement track or assist-and-maintain track; BOTH tracks complete this module.</p>\n<p><strong>Knowledge check:</strong> 1) Flash appears — why not thread instantly? (<em>Catheter tip may still be outside the lumen; advance unit 1–2 mm flat first.</em>) 2) Catheter won't thread; you've pulled it halfway back. Legal next moves? (<em>Remove catheter AND stylet together as a unit; never re-advance over the stylet.</em>) 3) Why distal-first? (<em>A blown distal site leaves the proximal vein usable; the reverse doesn't.</em>)</p>\n<p><strong>Practical assignment:</strong> model-limb lab: 5 placements to \"smooth thread\" standard. <strong>Competency connection:</strong> <span class=\"id\">TS-IVC-CEPH-001</span> → 3–4. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Venous access is the front door to fluids, anesthesia, and emergency drugs. Where CVAH policy permits assistants to place catheters, this is the Core's most advanced transfer; where it doesn't, this knowledge still makes you the best catheter assistant and monitor in the building. Objectives: name catheter components and gauge logic; explain why the flash lies (stylet vs catheter tip); explain site strategy (distal-first); state the shear rule; assist a placement end-to-end. Core instruction: Read CSC-IVC-01 §§1–5 (the teaching course; TS-IVC-CEPH-001 governs). Component tray-teach: catheter/stylet unit anatomy, T-port, cap, flush; gauge color logic and flow physics (radius⁴ — why one gauge matters so much); the geometry lesson: catheter tip trails the stylet tip, so flash ≠ catheter-in-lumen — the advance-then-thread beat is the whole skill. The shear rule taught as absolute: never re-advance a pulled-back catheter over its stylet (fragment embolism); withdraw as a unit, always. Site strategy: start distal, fail upward. Policy checkpoint: your floor role this week depends on scope row SCOPE-004 — placement track or assist-and-maintain track; BOTH tracks complete this module. Knowledge check: 1) Flash appears — why not thread instantly? ( Catheter tip may still be outside the lumen; advance unit 1–2 mm flat first. ) 2) Catheter won't thread; you've pulled it halfway back. Legal next moves? ( Remove catheter AND stylet together as a unit; never re-advance over the stylet. ) 3) Why distal-first? ( A blown distal site leaves the proximal vein usable; the reverse doesn't. ) Practical assignment: model-limb lab: 5 placements to \"smooth thread\" standard. Competency connection: TS-IVC-CEPH-001 → 3–4. Version: 1.0 2026-08-17."}, {"id": "lsn-w4-02", "title": "W4-02 · IVC Placement Securing", "group": "Lessons", "meta": "Week 4", "html": "<p><strong>Why this matters:</strong> Placement gets the glory; securing and the first flush decide whether the catheter survives the night and the fluids actually go intravascular.</p>\n<p><strong>Objectives:</strong> (placement track) perform coached placements; (all) execute tape architecture correctly; perform and interpret the first flush; label and chart.</p>\n<p><strong>Core instruction:</strong> <strong><span class=\"id\">CSC-IVC-01</span></strong> §§6–8 live (spec <span class=\"id\">TS-IVC-CEPH-001</span> governs). The tape architecture drilled on models until neat under 90 seconds: strip-1 sticky-up under hub, cross; strip-2 flat over wings; strip-3 T-port stress loop; one-finger-slides-under tension test; vetwrap light; label (date/time/gauge/initials). The first flush as a diagnostic: smooth + no bleb + no wince = working; ANY resistance/bleb/pain = it's not in, no matter how pretty the flash was — remove/report per track. Post-wrap recheck (taping kinks happen). Charting fields per spec.</p>\n<p><strong>What doesn't look right?</strong> \"Fat paw\" below yesterday's wrap (<em>too tight — report, rewrap per direction</em>); flush that needs a strong thumb (<em>never force — investigate</em>); an unlabeled catheter of unknown age (<em>report — dwell time drives phlebitis protocols</em>).</p>\n<p><strong>Knowledge check:</strong> 1) Three findings that damn a flush? (<em>Resistance, subcutaneous bleb, pain response.</em>) 2) Tape tension standard? (<em>Snug with one finger sliding under — never circumferential-tight.</em>) 3) Placement is charted with which minimum fields? (<em>Date/time, limb/site, gauge, attempts, flush quality, tolerance, initials.</em>)</p>\n<p><strong>Practical assignment:</strong> placement track — ≥3 coached live placements; assist track — ≥5 full assists incl. taping + first-flush calls. <strong>Competency connection:</strong> <span class=\"id\">TS-IVC-CEPH-001</span> → 5–6 (track-dependent); <span class=\"id\">TS-IVC-002</span> → 5. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Placement gets the glory; securing and the first flush decide whether the catheter survives the night and the fluids actually go intravascular. Objectives: (placement track) perform coached placements; (all) execute tape architecture correctly; perform and interpret the first flush; label and chart. Core instruction: CSC-IVC-01 §§6–8 live (spec TS-IVC-CEPH-001 governs). The tape architecture drilled on models until neat under 90 seconds: strip-1 sticky-up under hub, cross; strip-2 flat over wings; strip-3 T-port stress loop; one-finger-slides-under tension test; vetwrap light; label (date/time/gauge/initials). The first flush as a diagnostic: smooth + no bleb + no wince = working; ANY resistance/bleb/pain = it's not in, no matter how pretty the flash was — remove/report per track. Post-wrap recheck (taping kinks happen). Charting fields per spec. What doesn't look right? \"Fat paw\" below yesterday's wrap ( too tight — report, rewrap per direction ); flush that needs a strong thumb ( never force — investigate ); an unlabeled catheter of unknown age ( report — dwell time drives phlebitis protocols ). Knowledge check: 1) Three findings that damn a flush? ( Resistance, subcutaneous bleb, pain response. ) 2) Tape tension standard? ( Snug with one finger sliding under — never circumferential-tight. ) 3) Placement is charted with which minimum fields? ( Date/time, limb/site, gauge, attempts, flush quality, tolerance, initials. ) Practical assignment: placement track — ≥3 coached live placements; assist track — ≥5 full assists incl. taping + first-flush calls. Competency connection: TS-IVC-CEPH-001 → 5–6 (track-dependent); TS-IVC-002 → 5. Version: 1.0 2026-08-17."}, {"id": "lsn-w4-03", "title": "W4-03 · IVC Troubleshooting", "group": "Lessons", "meta": "Week 4", "html": "<p><strong>Why this matters:</strong> Every hospitalized catheter WILL misbehave eventually on your shift. Question 3 of competence — recognizing wrong — is this whole lesson.</p>\n<p><strong>Objectives:</strong> run the no-flash / flash-then-fail / won't-thread decision trees; recognize infiltration, phlebitis, occlusion, and displacement from ward-round evidence; respond to each within scope.</p>\n<p><strong>Core instruction:</strong> <strong><span class=\"id\">TS-IVC-CEPH-001</span></strong> §§11–16 expanded into drills. The branching interactive <span class=\"id\">INT-06</span>: eight scenarios (e.g., \"pump occlusion alarm, line traced clear, flush meets resistance, site soft\" → aspirate check? positional test? report?) each with consequence-following (\"you flushed hard against resistance — here's what that can do\"). Ward-evidence gallery: photos/描述 of infiltration (cool doughy swelling, slowed drip, dry flash), phlebitis (warm, red-tracked, corded vessel, pain on flush — dwell-time context), displacement (wet wrap, blood backing up), chewed-line catastrophe (why e-collars and line-checks exist). Scope discipline: your verbs are STOP-the-pump, TRACE, ASSESS gently, REPORT with specifics — removal/replacement decisions belong to CVT/DVM (removal itself is delegated per <span class=\"id\">TS-IVC-002</span> when granted).</p>\n<p><strong>Clinical case:</strong> 03:00, fluids \"running,\" morning limb is twice the size, pump never alarmed. Reconstruct. (<em>Infiltrated hours ago; pump pressure happily pushed sub-q; hourly line-trace + site-palpation checks were the missing control — pumps don't know where the fluid GOES.</em>)</p>\n<p><strong>Knowledge check:</strong> 1) The pump is silent — is the line fine? (<em>Unknown. Pumps count volume, not destination; trace and palpate.</em>) 2) Flush meets resistance: next? (<em>Stop. Never force. Positional check, gentle aspirate, report.</em>) 3) Warm red cord along the vessel = ? and whose call is next? (<em>Phlebitis pattern — report to CVT/DVM; expect removal order.</em>)</p>\n<p><strong>Practical assignment:</strong> run 8/8 <span class=\"id\">INT-06</span> scenarios ≥85%; perform 10 real catheter-site checks on ward rounds with trainer countersign. <strong>Competency connection:</strong> <span class=\"id\">TS-IVC-002</span> → 6–7; recognition battery items. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Every hospitalized catheter WILL misbehave eventually on your shift. Question 3 of competence — recognizing wrong — is this whole lesson. Objectives: run the no-flash / flash-then-fail / won't-thread decision trees; recognize infiltration, phlebitis, occlusion, and displacement from ward-round evidence; respond to each within scope. Core instruction: TS-IVC-CEPH-001 §§11–16 expanded into drills. The branching interactive INT-06 : eight scenarios (e.g., \"pump occlusion alarm, line traced clear, flush meets resistance, site soft\" → aspirate check? positional test? report?) each with consequence-following (\"you flushed hard against resistance — here's what that can do\"). Ward-evidence gallery: photos/描述 of infiltration (cool doughy swelling, slowed drip, dry flash), phlebitis (warm, red-tracked, corded vessel, pain on flush — dwell-time context), displacement (wet wrap, blood backing up), chewed-line catastrophe (why e-collars and line-checks exist). Scope discipline: your verbs are STOP-the-pump, TRACE, ASSESS gently, REPORT with specifics — removal/replacement decisions belong to CVT/DVM (removal itself is delegated per TS-IVC-002 when granted). Clinical case: 03:00, fluids \"running,\" morning limb is twice the size, pump never alarmed. Reconstruct. ( Infiltrated hours ago; pump pressure happily pushed sub-q; hourly line-trace + site-palpation checks were the missing control — pumps don't know where the fluid GOES. ) Knowledge check: 1) The pump is silent — is the line fine? ( Unknown. Pumps count volume, not destination; trace and palpate. ) 2) Flush meets resistance: next? ( Stop. Never force. Positional check, gentle aspirate, report. ) 3) Warm red cord along the vessel = ? and whose call is next? ( Phlebitis pattern — report to CVT/DVM; expect removal order. ) Practical assignment: run 8/8 INT-06 scenarios ≥85%; perform 10 real catheter-site checks on ward rounds with trainer countersign. Competency connection: TS-IVC-002 → 6–7; recognition battery items. Version: 1.0 2026-08-17."}, {"id": "lsn-w4-04", "title": "W4-04 · Fluid Therapy Equipment", "group": "Lessons", "meta": "Week 4", "html": "<p><strong>Why this matters:</strong> Fluid running rooms run on assistants. Setup speed WITH zero air and zero mis-rates is the deliverable.</p>\n<p><strong>Objectives:</strong> select correct components per order; prime air-free; compute drip rates (gravity fallback) and understand pump-rate verification; label everything; perform bag changes.</p>\n<p><strong>Core instruction:</strong> The teaching content is <strong><span class=\"id\">CSC-FLU-01</span></strong> (<span class=\"id\">TS-FLU-001</span> governs); this lesson adds the <em>why</em> layer: crystalloid basics educationally (what LRS/0.9% NaCl/Plasma-Lyte-class fluids are FOR conceptually — replacement vs maintenance ideas; assistants never choose, but understanding makes your monitoring intelligent); macro vs micro set math with the worked table (e.g., 60 mL/h on a 15 gtt set = 15 gtt/min = 1 drop/4 s); why air discipline scales with patient size; additive-bag rules (CVT/DVM verified, agitate per label, BIG label). Lab block: prime perfect lines ×5 (trainer inspects the full length against light), stage a bag change mid-\"infusion,\" pediatric micro-set setup.</p>\n<p><strong>Knowledge check:</strong> 1) 120 mL/h, 10 gtt/mL set → gtt/min? (<em>20.</em>) 2) Drip chamber flooded full — problem because? (<em>Can't count drops; also risks bolus if inverted — squeeze-refix to 1/3–1/2.</em>) 3) A bag labeled \"+KCl 20 mEq\" arrives pre-mixed from the CVT. Your checks? (<em>Verify against order with the CVT, confirm mixing/label completeness, hang with pump per policy — potassium-added fluids are never free-flowed.</em>)</p>\n<p><strong>Practical assignment:</strong> 5 primes, 1 change, 1 micro-set, all inspected. <strong>Competency connection:</strong> <span class=\"id\">TS-FLU-001</span> → 6–7. <strong>References:</strong> AAHA fluid therapy guidelines (educational); set IFUs. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Fluid running rooms run on assistants. Setup speed WITH zero air and zero mis-rates is the deliverable. Objectives: select correct components per order; prime air-free; compute drip rates (gravity fallback) and understand pump-rate verification; label everything; perform bag changes. Core instruction: The teaching content is CSC-FLU-01 ( TS-FLU-001 governs); this lesson adds the why layer: crystalloid basics educationally (what LRS/0.9% NaCl/Plasma-Lyte-class fluids are FOR conceptually — replacement vs maintenance ideas; assistants never choose, but understanding makes your monitoring intelligent); macro vs micro set math with the worked table (e.g., 60 mL/h on a 15 gtt set = 15 gtt/min = 1 drop/4 s); why air discipline scales with patient size; additive-bag rules (CVT/DVM verified, agitate per label, BIG label). Lab block: prime perfect lines ×5 (trainer inspects the full length against light), stage a bag change mid-\"infusion,\" pediatric micro-set setup. Knowledge check: 1) 120 mL/h, 10 gtt/mL set → gtt/min? ( 20. ) 2) Drip chamber flooded full — problem because? ( Can't count drops; also risks bolus if inverted — squeeze-refix to 1/3–1/2. ) 3) A bag labeled \"+KCl 20 mEq\" arrives pre-mixed from the CVT. Your checks? ( Verify against order with the CVT, confirm mixing/label completeness, hang with pump per policy — potassium-added fluids are never free-flowed. ) Practical assignment: 5 primes, 1 change, 1 micro-set, all inspected. Competency connection: TS-FLU-001 → 6–7. References: AAHA fluid therapy guidelines (educational); set IFUs. Version: 1.0 2026-08-17."}, {"id": "lsn-w4-05", "title": "W4-05 · Pumps IM Injections", "group": "Lessons", "meta": "Week 4", "html": "<p><strong>Why this matters:</strong> Two closers for the technical block: the machines that meter fluids, and the injection route that demands the most respect.</p>\n<p><strong>Objectives:</strong> operate house pumps to spec incl. the alarm tree; prevent free-flow always; perform coached IM injections at approved sites.</p>\n<p><strong>Core instruction — pumps:</strong> the content is <strong><span class=\"id\">TS-FLU-002</span></strong>; lab block on house models with staged faults (trainer rigs occlusion, air, wrong-set). The free-flow catechism: clamp BEFORE door, every time, both directions. Alarm tree run live ×3. Syringe-pump block: brand/size menu match, seating, why syringe pumps carry the potent drugs (precision) and therefore why their alarms outrank your other tasks. <strong>IM injections:</strong> content is <strong><span class=\"id\">TS-INJ-IM-001</span></strong>; site map session on cadaver-model/diagram (epaxial default, quadriceps alternative, caudal thigh BANNED at CVAH — sciatic risk), aspiration as non-negotiable, S1 supervision for your first five.</p>\n<p><strong>Knowledge check:</strong> 1) Free-flow prevention rule? (<em>Roller clamp closed before the pump door opens — always.</em>) 2) Air-in-line alarm: the forbidden move? (<em>Opening the door and flicking bubbles toward the patient; clamp, disconnect per protocol, re-prime/replace.</em>) 3) Why is the caudal thigh banned? (<em>Sciatic nerve proximity — permanent deficit risk; epaxials preferred.</em>) 4) IM aspiration shows blood. (<em>Withdraw fully; new needle, new site; report if any drug was delivered.</em>)</p>\n<p><strong>Practical assignment:</strong> pump lab with 3 staged faults caught; ≥3 coached IM (S1). <strong>Competency connection:</strong> <span class=\"id\">TS-FLU-002</span> → 6–7; <span class=\"id\">TS-INJ-IM-001</span> → 5. VA2 candidacy check runs end of this week. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Two closers for the technical block: the machines that meter fluids, and the injection route that demands the most respect. Objectives: operate house pumps to spec incl. the alarm tree; prevent free-flow always; perform coached IM injections at approved sites. Core instruction — pumps: the content is TS-FLU-002 ; lab block on house models with staged faults (trainer rigs occlusion, air, wrong-set). The free-flow catechism: clamp BEFORE door, every time, both directions. Alarm tree run live ×3. Syringe-pump block: brand/size menu match, seating, why syringe pumps carry the potent drugs (precision) and therefore why their alarms outrank your other tasks. IM injections: content is TS-INJ-IM-001 ; site map session on cadaver-model/diagram (epaxial default, quadriceps alternative, caudal thigh BANNED at CVAH — sciatic risk), aspiration as non-negotiable, S1 supervision for your first five. Knowledge check: 1) Free-flow prevention rule? ( Roller clamp closed before the pump door opens — always. ) 2) Air-in-line alarm: the forbidden move? ( Opening the door and flicking bubbles toward the patient; clamp, disconnect per protocol, re-prime/replace. ) 3) Why is the caudal thigh banned? ( Sciatic nerve proximity — permanent deficit risk; epaxials preferred. ) 4) IM aspiration shows blood. ( Withdraw fully; new needle, new site; report if any drug was delivered. ) Practical assignment: pump lab with 3 staged faults caught; ≥3 coached IM (S1). Competency connection: TS-FLU-002 → 6–7; TS-INJ-IM-001 → 5. VA2 candidacy check runs end of this week. Version: 1.0 2026-08-17."}, {"id": "lsn-w5-01", "title": "W5-01 · Radiology Radiation Safety", "group": "Lessons", "meta": "Week 5", "html": "<p><strong>Why this matters:</strong> Imaging is daily bread — and the one place your invisible occupational dose accumulates for a career. Safety module is a 100% gate BEFORE any exposure-room work.</p>\n<p><strong>Objectives:</strong> pass radiation safety at 100%; explain ALARA in behaviors; wear/handle PPE and dosimetry correctly; begin positioning fundamentals (lateral/VD thorax &amp; abdomen).</p>\n<p><strong>Core instruction:</strong> <strong>Physics at working depth:</strong> X-rays are ionizing — energy that breaks molecular bonds; dose is cumulative and invisible; scatter (the patient becomes a low-grade source during exposure — distance from the table edge matters, not just the primary beam). <strong>ALARA behaviors:</strong> minimize TIME in exposures (be elsewhere when not needed); maximize DISTANCE (step back at the console; use positioning aids so no one holds); SHIELD always (apron+thyroid every time, gloves only for edge-work, NOTHING in the primary beam ever — a leaded glove in-beam still takes serious dose and ruins the image); collimation as dose control; sedation/aids-first doctrine; pregnancy-declaration pathway <code>[CVAH-SPECIFIC INPUT REQUIRED: policy]</code>; dosimeter etiquette (collar, outside apron, never left on the apron hook, readings reviewed). Then <strong><span class=\"id\">TS-IMG-001</span></strong> positioning content begins: the four core views, landmarks, breathing timing, rotation self-check.</p>\n<p><strong>Knowledge check (100% gate; sample):</strong> 1) The three ALARA levers? (<em>Time, distance, shielding.</em>) 2) May a gloved hand steady a paw at the collimated edge? (<em>Edge-work with lead only per policy and never in primary beam — aids first; the goal is hands-free.</em>) 3) Where does your dosimeter live? (<em>On YOU at collar level outside the apron during work; stored off-apron otherwise.</em>) 4) Peak inspiration matters for which views? (<em>Thorax.</em>)</p>\n<p><strong>Practical assignment:</strong> PPE fit + dosimetry issue; positioning-aid tour; 2 assisted (non-exposure-room or aided) positioning setups. <strong>Competency connection:</strong> <span class=\"id\">TS-IMG-001</span> → 3–5; Imaging Academy shares this unit. <strong>References:</strong> state radiation rules <code>[verify]</code>; positioning atlases. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Imaging is daily bread — and the one place your invisible occupational dose accumulates for a career. Safety module is a 100% gate BEFORE any exposure-room work. Objectives: pass radiation safety at 100%; explain ALARA in behaviors; wear/handle PPE and dosimetry correctly; begin positioning fundamentals (lateral/VD thorax &amp; abdomen). Core instruction: Physics at working depth: X-rays are ionizing — energy that breaks molecular bonds; dose is cumulative and invisible; scatter (the patient becomes a low-grade source during exposure — distance from the table edge matters, not just the primary beam). ALARA behaviors: minimize TIME in exposures (be elsewhere when not needed); maximize DISTANCE (step back at the console; use positioning aids so no one holds); SHIELD always (apron+thyroid every time, gloves only for edge-work, NOTHING in the primary beam ever — a leaded glove in-beam still takes serious dose and ruins the image); collimation as dose control; sedation/aids-first doctrine; pregnancy-declaration pathway [CVAH-SPECIFIC INPUT REQUIRED: policy] ; dosimeter etiquette (collar, outside apron, never left on the apron hook, readings reviewed). Then TS-IMG-001 positioning content begins: the four core views, landmarks, breathing timing, rotation self-check. Knowledge check (100% gate; sample): 1) The three ALARA levers? ( Time, distance, shielding. ) 2) May a gloved hand steady a paw at the collimated edge? ( Edge-work with lead only per policy and never in primary beam — aids first; the goal is hands-free. ) 3) Where does your dosimeter live? ( On YOU at collar level outside the apron during work; stored off-apron otherwise. ) 4) Peak inspiration matters for which views? ( Thorax. ) Practical assignment: PPE fit + dosimetry issue; positioning-aid tour; 2 assisted (non-exposure-room or aided) positioning setups. Competency connection: TS-IMG-001 → 3–5; Imaging Academy shares this unit. References: state radiation rules [verify] ; positioning atlases. Version: 1.0 2026-08-17."}, {"id": "lsn-w5-02", "title": "W5-02 · Surgical Workflow Asepsis", "group": "Lessons", "meta": "Week 5", "html": "<p><strong>Why this matters:</strong> Surgery days are choreography. An assistant who knows the steps — and treats sterility as physics rather than superstition — makes the whole OR faster and safer.</p>\n<p><strong>Objectives:</strong> narrate the surgery-day patient journey; explain contamination mechanics; apply sterile-conscience rules; identify who does what during a routine procedure.</p>\n<p><strong>Core instruction:</strong> The day's arc: admit/consent check → pre-op exam &amp; bloodwork review (DVM) → premed (CVT/DVM) → induction → prep (YOU, <span class=\"id\">TS-SUR-PREP-001</span>) → transport → OR roles (surgeon sterile; anesthetist at the head; circulator — often YOU — the unsterile hands of the room) → recovery staging (YOU prep warm, quiet, monitored bay BEFORE the patient needs it) → turnover. <strong>Contamination mechanics:</strong> bacteria travel by touch, droplet, particulate rain (hover = rain), and moisture wicking (strike-through); the 2.5 cm wrapper border rule; below-waist/below-table = gone; doubt = contaminated (declaring it is a PASS behavior, concealing is the fail — this is drilled culture, W5-04 tests it). <strong>Sterile field awareness for circulators:</strong> traffic patterns (never between two sterile fields/backs), door discipline (each opening = particulate turbulence), speaking-distance behavior over open trays.</p>\n<p><strong>Knowledge check:</strong> 1) You <em>think</em> the glove tip brushed the drape edge. Nobody saw. (<em>Declare it. Zero-penalty culture exists precisely for this moment.</em>) 2) Circulator's cardinal movement rule? (<em>Face sterile fields, pass unsterile-to-unsterile side, never cross over.</em>) 3) Why does recovery get set up before induction? (<em>Recovery is the highest-risk anesthesia phase; scrambling for warming and monitoring after extubation is too late.</em>)</p>\n<p><strong>Practical assignment:</strong> shadow one full surgery day with role-map worksheet. <strong>Competency connection:</strong> unlocks <span class=\"id\">TS-SUR-PREP</span>/STER floor work. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Surgery days are choreography. An assistant who knows the steps — and treats sterility as physics rather than superstition — makes the whole OR faster and safer. Objectives: narrate the surgery-day patient journey; explain contamination mechanics; apply sterile-conscience rules; identify who does what during a routine procedure. Core instruction: The day's arc: admit/consent check → pre-op exam &amp; bloodwork review (DVM) → premed (CVT/DVM) → induction → prep (YOU, TS-SUR-PREP-001 ) → transport → OR roles (surgeon sterile; anesthetist at the head; circulator — often YOU — the unsterile hands of the room) → recovery staging (YOU prep warm, quiet, monitored bay BEFORE the patient needs it) → turnover. Contamination mechanics: bacteria travel by touch, droplet, particulate rain (hover = rain), and moisture wicking (strike-through); the 2.5 cm wrapper border rule; below-waist/below-table = gone; doubt = contaminated (declaring it is a PASS behavior, concealing is the fail — this is drilled culture, W5-04 tests it). Sterile field awareness for circulators: traffic patterns (never between two sterile fields/backs), door discipline (each opening = particulate turbulence), speaking-distance behavior over open trays. Knowledge check: 1) You think the glove tip brushed the drape edge. Nobody saw. ( Declare it. Zero-penalty culture exists precisely for this moment. ) 2) Circulator's cardinal movement rule? ( Face sterile fields, pass unsterile-to-unsterile side, never cross over. ) 3) Why does recovery get set up before induction? ( Recovery is the highest-risk anesthesia phase; scrambling for warming and monitoring after extubation is too late. ) Practical assignment: shadow one full surgery day with role-map worksheet. Competency connection: unlocks TS-SUR-PREP /STER floor work. Version: 1.0 2026-08-17."}, {"id": "lsn-w5-03", "title": "W5-03 · Surgical Prep", "group": "Lessons", "meta": "Week 5", "html": "<p><strong>Why this matters:</strong> Prep quality is infection control at the incision line — and prep SPEED (without quality loss) is anesthesia-time control.</p>\n<p><strong>Objectives:</strong> perform clip + initial scrub to spec on coached cases; verbalize site/side confirmation; protect patient temperature throughout.</p>\n<p><strong>Core instruction:</strong> Content is <strong><span class=\"id\">CSC-SUR-01</span></strong> (the teaching course; <span class=\"id\">TS-SUR-PREP-001</span> governs) — read fully first. Lab then floor: Day 1 clipper handling on shelter-donation/grooming-case practice <code>[CVAH-SPECIFIC INPUT REQUIRED: practice-material policy]</code> — blade angle, tension, the burn-avoidance feel, blade-temp checks against your own wrist; Days 2–5 coached real preps on routine sx (spay/neuter/mass removal tier). The site/side liturgy performed OUT LOUD every time (\"Bella Chen, left stifle — confirm?\") to the anesthetist; margins per posted procedure cards; the center-out spiral discipline; pooling and hypothermia guarding (small patient = towel dams, warmed scrub per protocol).</p>\n<p><strong>Knowledge check:</strong> 1) Board says R, record says L. (<em>Nothing gets clipped until resolved with DVM. Nothing.</em>) 2) Clipper blade feels hot. (<em>Swap/cool — thermal burn; check patient skin, report any lesion found or made.</em>) 3) Gauze on pass 4 still comes away dirty at cycle minimum. (<em>Keep scrubbing — cycle counts are minimums; clean-gauze endpoint plus minimum, whichever is longer.</em>)</p>\n<p><strong>Practical assignment:</strong> ≥5 coached preps (≥2 procedure types) per spec §24. <strong>Competency connection:</strong> <span class=\"id\">TS-SUR-PREP-001</span> → 5–7; <span class=\"id\">PA-SUR-PREP-001</span> target Week 6–7. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Prep quality is infection control at the incision line — and prep SPEED (without quality loss) is anesthesia-time control. Objectives: perform clip + initial scrub to spec on coached cases; verbalize site/side confirmation; protect patient temperature throughout. Core instruction: Content is CSC-SUR-01 (the teaching course; TS-SUR-PREP-001 governs) — read fully first. Lab then floor: Day 1 clipper handling on shelter-donation/grooming-case practice [CVAH-SPECIFIC INPUT REQUIRED: practice-material policy] — blade angle, tension, the burn-avoidance feel, blade-temp checks against your own wrist; Days 2–5 coached real preps on routine sx (spay/neuter/mass removal tier). The site/side liturgy performed OUT LOUD every time (\"Bella Chen, left stifle — confirm?\") to the anesthetist; margins per posted procedure cards; the center-out spiral discipline; pooling and hypothermia guarding (small patient = towel dams, warmed scrub per protocol). Knowledge check: 1) Board says R, record says L. ( Nothing gets clipped until resolved with DVM. Nothing. ) 2) Clipper blade feels hot. ( Swap/cool — thermal burn; check patient skin, report any lesion found or made. ) 3) Gauze on pass 4 still comes away dirty at cycle minimum. ( Keep scrubbing — cycle counts are minimums; clean-gauze endpoint plus minimum, whichever is longer. ) Practical assignment: ≥5 coached preps (≥2 procedure types) per spec §24. Competency connection: TS-SUR-PREP-001 → 5–7; PA-SUR-PREP-001 target Week 6–7. Version: 1.0 2026-08-17."}, {"id": "lsn-w5-04", "title": "W5-04 · Instruments Packs Autoclave", "group": "Lessons", "meta": "Week 5", "html": "<p><strong>Why this matters:</strong> The instrument lifecycle — dirty → cleaned → wrapped → sterilized → opened sterile — runs through assistant hands at every arrow.</p>\n<p><strong>Objectives:</strong> identify the core instrument set; clean/inspect instruments properly; wrap packs; run the autoclave with indicators; open sterile items flawlessly (<span class=\"id\">TS-SUR-STER-001</span>).</p>\n<p><strong>Core instruction:</strong> <strong>Instrument ID set (<span class=\"id\">INT-08</span> flashcards + tray drills):</strong> scalpel handles #3/#4 + blade sizes/loading (safety loading with needle holders, never fingers), Metzenbaum vs Mayo scissors (delicate vs heavy — mixing them up dulls the Metz and annoys everyone), operating scissors, thumb forceps (rat-tooth vs DeBakey vs Adson), hemostats (mosquito/Kelly/Crile), needle holders (Mayo-Hegar/Olsen-Hegar and the scissor-blade surprise), towel clamps, Allis, spay hook, retractors (Gelpi/Weitlaner/Senn). Suture familiarity: absorbable vs non concept, sizes (3-0 smaller than 0), needle types (taper vs cutting) — recognition level. <strong>Reprocessing:</strong> rinse-soon doctrine (dried blood pits instruments), enzymatic soak per label, brush hinges OPEN, inspect (box-lock cracks, tip alignment, sharpness), lubricate per protocol, wrap double-layer with internal indicator, tape-date-initial, load autoclave loosely (steam must circulate), run per cycle card, verify external+internal indicators, log the load, storage rotation (oldest forward), shelf-life per policy. <strong>Sterile opening:</strong> content is <strong><span class=\"id\">TS-SUR-STER-001</span></strong> — dry-lab drills ×10 with trainer-sabotaged packs (wet corner, unturned tape, pinhole) you must catch.</p>\n<p><strong>Knowledge check:</strong> 1) Metz vs Mayo — which cuts heavy fascia? (<em>Mayo. Metz is for delicate tissue only.</em>) 2) Indicator tape turned but internal strip didn't. (<em>Pack is NOT trusted — report, re-process; tape only proves exposure of the outside.</em>) 3) Why loose autoclave loading? (<em>Steam penetration requires circulation; a crammed chamber sterilizes its outer layer and lies about the middle.</em>)</p>\n<p><strong>Practical assignment:</strong> full reprocess of one pack start-to-finish; 10 sterile openings incl. sabotage catches; instrument ID ≥90%. <strong>Competency connection:</strong> <span class=\"id\">TS-SUR-STER-001</span> → 7; <span class=\"id\">TS-SUR-002</span> → 5–6. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: The instrument lifecycle — dirty → cleaned → wrapped → sterilized → opened sterile — runs through assistant hands at every arrow. Objectives: identify the core instrument set; clean/inspect instruments properly; wrap packs; run the autoclave with indicators; open sterile items flawlessly ( TS-SUR-STER-001 ). Core instruction: Instrument ID set ( INT-08 flashcards + tray drills): scalpel handles #3/#4 + blade sizes/loading (safety loading with needle holders, never fingers), Metzenbaum vs Mayo scissors (delicate vs heavy — mixing them up dulls the Metz and annoys everyone), operating scissors, thumb forceps (rat-tooth vs DeBakey vs Adson), hemostats (mosquito/Kelly/Crile), needle holders (Mayo-Hegar/Olsen-Hegar and the scissor-blade surprise), towel trong>Core instruction:</strong> <strong>The phases:</strong> premedication (calms, pre-empts pain, smooths everything downstream — why fasting rules matter: regurgitation/aspiration); induction (the most dynamic 5 minutes — airway secured by CVT/DVM; your job: suction reachable, tubes staged, quiet room); maintenance (vaporizer + oxygen + monitoring — the anesthetist's domain; your verbs: fetch, chart-support if asked, warmth management, position guarding on moves); recovery (<strong>the phase that kills quietly after everyone relaxes</strong> — extubation timing is the anesthetist's call; your watch: breathing pattern/effort, MM color, temperature, thrashing-vs-smooth, brachycephalic special vigilance — these patients obstruct AFTER the tube leaves). <strong>Machine at recognition level:</strong> O2 source→flowmeter→vaporizer→circuit→patient→absorber/scavenger loop traced on the real machine; you don't set anything — you recognize when something looks disconnected, kinked, empty, or smells of agent, and you SAY SO immediately. <strong>Anesthesia Academy</strong> is the deep path later; this module is the safety floor.</p>\n<p><strong>Knowledge check:</strong> 1) Highest-risk phase after the surgeon breaks scrub? (<em>Recovery — monitoring effort collapses exactly when brachycephalics obstruct and everyone's cleaning up.</em>) 2) You smell anesthetic gas near the machine mid-case. (<em>Report to the anesthetist immediately — possible disconnection/leak; not your job to fix, absolutely your job to say.</em>) 3) Your verbs during maintenance? (<em>Support: warmth, supplies, messages, position-guarding on moves, extra eyes — never dials.</em>)</p>\n<p><strong>Practical assignment:</strong> trace the machine loop physically with the CVT; sit two coached recoveries with checklist. <strong>Competency connection:</strong> <span class=\"id\">TS-SUR-003</span> → 5–6; gateway module for Anesthesia Academy. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Every surgical and dental patient passes through anesthesia. Core-level assistants don't run it — but you'll prep for it, sit with recovering patients, and be the extra eyes that catch trouble. You need the map. Objectives: name the phases (premed→induction→maintenance→recovery) and each phase's risk profile; identify machine components at recognition level; state the assistant's monitoring-support verbs; know the recovery red flags cold. Core instruction: The phases: premedication (calms, pre-empts pain, smooths everything downstream — why fasting rules matter: regurgitation/aspiration); induction (the most dynamic 5 minutes — airway secured by CVT/DVM; your job: suction reachable, tubes staged, quiet room); maintenance (vaporizer + oxygen + monitoring — the anesthetist's domain; your verbs: fetch, chart-support if asked, warmth management, position guarding on moves); recovery ( the phase that kills quietly after everyone relaxes — extubation timing is the anesthetist's call; your watch: breathing pattern/effort, MM color, temperature, thrashing-vs-smooth, brachycephalic special vigilance — these patients obstruct AFTER the tube leaves). Machine at recognition level: O2 source→flowmeter→vaporizer→circuit→patient→absorber/scavenger loop traced on the real machine; you don't set anything — you recognize when something looks disconnected, kinked, empty, or smells of agent, and you SAY SO immediately. Anesthesia Academy is the deep path later; this module is the safety floor. Knowledge check: 1) Highest-risk phase after the surgeon breaks scrub? ( Recovery — monitoring effort collapses exactly when brachycephalics obstruct and everyone's cleaning up. ) 2) You smell anesthetic gas near the machine mid-case. ( Report to the anesthetist immediately — possible disconnection/leak; not your job to fix, absolutely your job to say. ) 3) Your verbs during maintenance? ( Support: warmth, supplies, messages, position-guarding on moves, extra eyes — never dials. ) Practical assignment: trace the machine loop physically with the CVT; sit two coached recoveries with checklist. Competency connection: TS-SUR-003 → 5–6; gateway module for Anesthesia Academy. Version: 1.0 2026-08-17."}, {"id": "lsn-w6-01", "title": "W6-01 · Dentistry Foundations", "group": "Lessons", "meta": "Week 6", "html": "<p><strong>Why this matters:</strong> Dental days are equipment-heavy, anesthesia-long, and workflow-sensitive — an oriented assistant keeps them humane and on schedule.</p>\n<p><strong>Objectives:</strong> describe the dental-day workflow; name basic oral anatomy and the Triadan shorthand at recognition level; set up/break down the dental station; state the anesthetized-dental-patient risks you help guard (hypothermia, airway water, positioning).</p>\n<p><strong>Core instruction:</strong> Workflow: anesthetized procedure (cleaning/probing/charting/rads → DVM assessment → extractions if needed by DVM) — nothing dental at CVAH happens on awake patients beyond exam-room looks. Oral anatomy for support work: incisors/canines/premolars/molars; Triadan hundreds (100s right upper → 400s right lower, quadrant logic only — charting depth lives in the Dentistry Academy); periodontal disease concept (plaque→calculus→gingivitis→attachment loss) so the procedure makes sense. Station setup: delivery unit (water lines charged, handpieces seated), scaler/polisher checks, prophy paste/cups, mouth props POLICY note (spring-loaded gags in cats = restricted per current safety consensus — house policy card), rad sensor sleeved, warming layers staged, suction ready. Your guard duties: thermal (long wet procedures chill patients — active warming per protocol, temp on the record), airway water awareness (throat packs/suction are CVT/DVM managed — you watch pooling and SAY SO), eye protection (lube per protocol, instruments never passed over the face).</p>\n<p><strong>Knowledge check:</strong> 1) Tooth 104 is which quadrant? (<em>Right upper — canine, as it happens.</em>) 2) Why are dental patients hypothermia-prone? (<em>Long anesthesia + continuous water + open mouth heat loss.</em>) 3) Awake \"dental cleaning\" requested by a client? (<em>Not performed — anesthesia-free scaling is cosmetic and harmful below the gumline; route the conversation to the DVM.</em>)</p>\n<p><strong>Practical assignment:</strong> set up and break down the station twice supervised; observe one full dental with checklist. <strong>Competency connection:</strong> <span class=\"id\">TS-DEN-102</span> → 4–5; gateway to Dentistry Academy. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Dental days are equipment-heavy, anesthesia-long, and workflow-sensitive — an oriented assistant keeps them humane and on schedule. Objectives: describe the dental-day workflow; name basic oral anatomy and the Triadan shorthand at recognition level; set up/break down the dental station; state the anesthetized-dental-patient risks you help guard (hypothermia, airway water, positioning). Core instruction: Workflow: anesthetized procedure (cleaning/probing/charting/rads → DVM assessment → extractions if needed by DVM) — nothing dental at CVAH happens on awake patients beyond exam-room looks. Oral anatomy for support work: incisors/canines/premolars/molars; Triadan hundreds (100s right upper → 400s right lower, quadrant logic only — charting depth lives in the Dentistry Academy); periodontal disease concept (plaque→calculus→gingivitis→attachment loss) so the procedure makes sense. Station setup: delivery unit (water lines charged, handpieces seated), scaler/polisher checks, prophy paste/cups, mouth props POLICY note (spring-loaded gags in cats = restricted per current safety consensus — house policy card), rad sensor sleeved, warming layers staged, suction ready. Your guard duties: thermal (long wet procedures chill patients — active warming per protocol, temp on the record), airway water awareness (throat packs/suction are CVT/DVM managed — you watch pooling and SAY SO), eye protection (lube per protocol, instruments never passed over the face). Knowledge check: 1) Tooth 104 is which quadrant? ( Right upper — canine, as it happens. ) 2) Why are dental patients hypothermia-prone? ( Long anesthesia + continuous water + open mouth heat loss. ) 3) Awake \"dental cleaning\" requested by a client? ( Not performed — anesthesia-free scaling is cosmetic and harmful below the gumline; route the conversation to the DVM. ) Practical assignment: set up and break down the station twice supervised; observe one full dental with checklist. Competency connection: TS-DEN-102 → 4–5; gateway to Dentistry Academy. Version: 1.0 2026-08-17."}, {"id": "lsn-w6-02", "title": "W6-02 · Recovery Postop Care", "group": "Lessons", "meta": "Week 6", "html": "<p><strong>Why this matters:</strong> More anesthetic deaths cluster in recovery than under the drape. Recovery vigilance is an assistant superpower the data actually supports.</p>\n<p><strong>Objectives:</strong> run a recovery bay to spec; execute the recovery observation loop; recognize the red-flag set instantly; support smooth (not chaotic) emergence; chart recovery properly.</p>\n<p><strong>Core instruction:</strong> Bay standards: pre-warmed, dry bedding, quiet/dim where possible, suction+O2 reachable, the patient NEVER unobserved while extubation-adjacent. The loop (interval per orders, typically q5–15min early): breathing rate/effort/noise (stridor post-extubation = airway problem NOW), MM/CRT, temperature until threshold per orders, mentation trajectory (should climb steadily — plateau or dip = report), incision/bandage first-look, pain observation (house scale) vs dysphoria discussion (distinguishing them is the CVT/DVM's call — your job is to describe: \"vocalizing, thrashing, not responsive to voice\" vs \"quiet, guarding incision, responds to name\"). Positioning: sternal-supported when possible, brachycephalic heads-up-tongue-out doctrine, never flat-neck-flexed. The brachycephalic hour: these patients obstruct late — extended watch per orders. Feeding/water reintroduction per orders only.</p>\n<p><strong>Clinical case:</strong> Bulldog extubated 20 min ago, \"recovered,\" left alone for cleanup. Found cyanotic. Rewind the tape. (<em>Never alone that early; head/neck positioning maintained; stridor precursors likely missed; recovery staffing is a scheduled duty, not spare-time.</em>)</p>\n<p><strong>Knowledge check:</strong> 1) Post-extubation stridor means? (<em>Airway narrowing/obstruction — CVT/DVM immediately; re-intubation supplies live in reach because of exactly this.</em>) 2) Mentation was climbing, now flat for 30 min. (<em>Report — recovery should trend one direction.</em>) 3) Cat post-op, T 96.5°F. (<em>Active warming per protocol + report; hypothermia deepens sedation and delays everything.</em>)</p>\n<p><strong>Practical assignment:</strong> 4 coached recoveries incl. 1 brachycephalic or high-watch case; charting audited. <strong>Competency connection:</strong> <span class=\"id\">TS-SUR-003</span> → 7–8; feeds Inpatient + Anesthesia academies. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: More anesthetic deaths cluster in recovery than under the drape. Recovery vigilance is an assistant superpower the data actually supports. Objectives: run a recovery bay to spec; execute the recovery observation loop; recognize the red-flag set instantly; support smooth (not chaotic) emergence; chart recovery properly. Core instruction: Bay standards: pre-warmed, dry bedding, quiet/dim where possible, suction+O2 reachable, the patient NEVER unobserved while extubation-adjacent. The loop (interval per orders, typically q5–15min early): breathing rate/effort/noise (stridor post-extubation = airway problem NOW), MM/CRT, temperature until threshold per orders, mentation trajectory (should climb steadily — plateau or dip = report), incision/bandage first-look, pain observation (house scale) vs dysphoria discussion (distinguishing them is the CVT/DVM's call — your job is to describe: \"vocalizing, thrashing, not responsive to voice\" vs \"quiet, guarding incision, responds to name\"). Positioning: sternal-supported when possible, brachycephalic heads-up-tongue-out doctrine, never flat-neck-flexed. The brachycephalic hour: these patients obstruct late — extended watch per orders. Feeding/water reintroduction per orders only. Clinical case: Bulldog extubated 20 min ago, \"recovered,\" left alone for cleanup. Found cyanotic. Rewind the tape. ( Never alone that early; head/neck positioning maintained; stridor precursors likely missed; recovery staffing is a scheduled duty, not spare-time. ) Knowledge check: 1) Post-extubation stridor means? ( Airway narrowing/obstruction — CVT/DVM immediately; re-intubation supplies live in reach because of exactly this. ) 2) Mentation was climbing, now flat for 30 min. ( Report — recovery should trend one direction. ) 3) Cat post-op, T 96.5°F. ( Active warming per protocol + report; hypothermia deepens sedation and delays everything. ) Practical assignment: 4 coached recoveries incl. 1 brachycephalic or high-watch case; charting audited. Competency connection: TS-SUR-003 → 7–8; feeds Inpatient + Anesthesia academies. Version: 1.0 2026-08-17."}, {"id": "lsn-w6-03", "title": "W6-03 · Inpatient Care Handoffs", "group": "Lessons", "meta": "Week 6", "html": "<p><strong>Why this matters:</strong> Week 2 made you safe in the ward; Week 6 makes you someone the ward can be LEFT with (routine tier), and someone whose handoffs don't drop patients.</p>\n<p><strong>Objectives:</strong> run a multi-patient observation round efficiently; manage I/O tracking; execute the full handoff protocol; escalate on trend, not just threshold.</p>\n<p><strong>Core instruction:</strong> Content anchors <strong><span class=\"id\">TS-INP-001</span></strong> at full depth now. Multi-patient round-craft: sheet-first planning (who's due what, batch the route), the per-kennel rhythm (ID→look-before-touch→bundle→chart-now), isolation LAST always. I/O: measure don't vibe (graduated bowls, litter weights where ordered, walk-pee estimates flagged as estimates). Trend escalation: the sheet's thresholds are floors, not the whole game — HR 120→132→144 over three checks is a REPORT even if the threshold is 150 (trajectory beats snapshot; this is the recognition question again). Handoff protocol (<span class=\"id\">TS-INP-103</span> pattern): walk the ward WITH the sheet, per patient: status trend, due-next, watch-fors, lines/tubes inventory; incoming repeats back the watch-fors (closed loop); written handoff note per house format.</p>\n<p><strong>Knowledge check:</strong> 1) Threshold 150, readings 120→132→144. (<em>Report the trend now — don't wait to lose the race at 150.</em>) 2) Why isolation last? (<em>Traffic direction: clean→dirty, never back.</em>) 3) Handoff isn't complete until? (<em>Incoming has walked the ward with the sheet and repeated back the watch-fors.</em>)</p>\n<p><strong>Practical assignment:</strong> lead 2 rounds under observation; give + receive 2 protocol handoffs. <strong>Competency connection:</strong> <span class=\"id\">TS-INP-001</span> → 7–8; VA2 candidacy closes this week for most learners. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Week 2 made you safe in the ward; Week 6 makes you someone the ward can be LEFT with (routine tier), and someone whose handoffs don't drop patients. Objectives: run a multi-patient observation round efficiently; manage I/O tracking; execute the full handoff protocol; escalate on trend, not just threshold. Core instruction: Content anchors TS-INP-001 at full depth now. Multi-patient round-craft: sheet-first planning (who's due what, batch the route), the per-kennel rhythm (ID→look-before-touch→bundle→chart-now), isolation LAST always. I/O: measure don't vibe (graduated bowls, litter weights where ordered, walk-pee estimates flagged as estimates). Trend escalation: the sheet's thresholds are floors, not the whole game — HR 120→132→144 over three checks is a REPORT even if the threshold is 150 (trajectory beats snapshot; this is the recognition question again). Handoff protocol ( TS-INP-103 pattern): walk the ward WITH the sheet, per patient: status trend, due-next, watch-fors, lines/tubes inventory; incoming repeats back the watch-fors (closed loop); written handoff note per house format. Knowledge check: 1) Threshold 150, readings 120→132→144. ( Report the trend now — don't wait to lose the race at 150. ) 2) Why isolation last? ( Traffic direction: clean→dirty, never back. ) 3) Handoff isn't complete until? ( Incoming has walked the ward with the sheet and repeated back the watch-fors. ) Practical assignment: lead 2 rounds under observation; give + receive 2 protocol handoffs. Competency connection: TS-INP-001 → 7–8; VA2 candidacy closes this week for most learners. Version: 1.0 2026-08-17."}, {"id": "lsn-w6-04", "title": "W6-04 · Emergency Foundations", "group": "Lessons", "meta": "Week 6", "html": "<p><strong>Why this matters:</strong> Emergencies are rare per-day and certain per-career. The difference between a good and bad outcome is often the first 60 seconds — recognition and activation, which is exactly the assistant layer.</p>\n<p><strong>Objectives:</strong> recognize the emergency presentation set; execute the activation sequence; perform your CPR support roles (<span class=\"id\">TS-EMR-001</span>); stage equipment fast; know when normal workflow STOPS.</p>\n<p><strong>Core instruction:</strong> <strong>The recognition set (drilled with images/video <span class=\"id\">INT-10</span>):</strong> respiratory distress (effort, posture — orthopnea/elbow-abduction, open-mouth cat = emergency until proven otherwise, cyanosis); shock pattern (pale/grey gums, CRT &gt;2s, weak fast pulses, cold extremities, dull mentation); hemorrhage (external obvious; internal pattern = shock + distending abdomen); seizure (active vs post-ictal, protect-don't-restrain doctrine, time it); collapse; heat emergency (panting hard + T high + collapse context); GDV silhouette (big-dog unproductive retch + distending drum belly = minutes matter); urinary obstruction (male cat straining/crying/no urine); toxin arrivals (bring-the-package doctrine). <strong>Activation:</strong> loud, specific, located: \"DR. NOW — TREATMENT — HIT-BY-CAR\" beats \"um, can someone…\"; one activation beats three whispers; false alarms are cheap, delays are not. <strong>Your roles:</strong> clear the table, oxygen rigged (flow-by immediately — mask/cage per direction), crash cart pulled, IV setup staged, sample tubes out, recorder/runner/compressor per <span class=\"id\">TS-EMR-001</span> and the CPR lesson block (RECOVER-aligned; numbers live on <span class=\"id\">CRC-002</span>). <strong>Workflow-stop rule:</strong> an activated emergency outranks every routine task you own; your routine patients get flagged to a teammate, not abandoned silently.</p>\n<p><strong>Knowledge check:</strong> 1) Open-mouth breathing cat in lobby. (<em>Emergency activation + minimal-stress O2 — do not \"get a weight first.\"</em>) 2) Big dog retching nothing, belly tight. (<em>GDV pattern — activate NOW; this is a minutes-count surgical emergency.</em>) 3) During CPR you're compressor; you're tiring at 90 seconds. (<em>Say it early, swap at the 2-min cycle — quality beats ego, per RECOVER.</em>)</p>\n<p><strong>Practical assignment:</strong> timed equipment-staging drill (O2 + cart + IV setup &lt;3 min); mock activation; recognition image set ≥90%. <strong>Competency connection:</strong> <span class=\"id\">TS-EMR-001</span> → 6–7; gateway to ECC Academy. <strong>References:</strong> RECOVER 2024. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Emergencies are rare per-day and certain per-career. The difference between a good and bad outcome is often the first 60 seconds — recognition and activation, which is exactly the assistant layer. Objectives: recognize the emergency presentation set; execute the activation sequence; perform your CPR support roles ( TS-EMR-001 ); stage equipment fast; know when normal workflow STOPS. Core instruction: The recognition set (drilled with images/video INT-10 ): respiratory distress (effort, posture — orthopnea/elbow-abduction, open-mouth cat = emergency until proven otherwise, cyanosis); shock pattern (pale/grey gums, CRT &gt;2s, weak fast pulses, cold extremities, dull mentation); hemorrhage (external obvious; internal pattern = shock + distending abdomen); seizure (active vs post-ictal, protect-don't-restrain doctrine, time it); collapse; heat emergency (panting hard + T high + collapse context); GDV silhouette (big-dog unproductive retch + distending drum belly = minutes matter); urinary obstruction (male cat straining/crying/no urine); toxin arrivals (bring-the-package doctrine). Activation: loud, specific, located: \"DR. NOW — TREATMENT — HIT-BY-CAR\" beats \"um, can someone…\"; one activation beats three whispers; false alarms are cheap, delays are not. Your roles: clear the table, oxygen rigged (flow-by immediately — mask/cage per direction), crash cart pulled, IV setup staged, sample tubes out, recorder/runner/compressor per TS-EMR-001 and the CPR lesson block (RECOVER-aligned; numbers live on CRC-002 ). Workflow-stop rule: an activated emergency outranks every routine task you own; your routine patients get flagged to a teammate, not abandoned silently. Knowledge check: 1) Open-mouth breathing cat in lobby. ( Emergency activation + minimal-stress O2 — do not \"get a weight first.\" ) 2) Big dog retching nothing, belly tight. ( GDV pattern — activate NOW; this is a minutes-count surgical emergency. ) 3) During CPR you're compressor; you're tiring at 90 seconds. ( Say it early, swap at the 2-min cycle — quality beats ego, per RECOVER. ) Practical assignment: timed equipment-staging drill (O2 + cart + IV setup &lt;3 min); mock activation; recognition image set ≥90%. Competency connection: TS-EMR-001 → 6–7; gateway to ECC Academy. References: RECOVER 2024. Version: 1.0 2026-08-17."}, {"id": "lsn-w7-01", "title": "W7-01 · Integrated Cases", "group": "Lessons", "meta": "Week 7", "html": "<p><strong>Why this matters:</strong> Weeks 1–6 taught skills in lanes. Real shifts braid them. Week 7 is deliberately about the braid.</p>\n<p><strong>Objectives:</strong> execute multi-skill sequences on real cases end-to-end; self-prioritize a task stack; maintain quality under mild time pressure; narrate your reasoning on request.</p>\n<p><strong>Core instruction + structure:</strong> Each day this week you carry a <em>case thread</em> under supervision: e.g., Day 1 — admit a sx patient: intake TPR → pre-op checklist → catheter place/assist per track → prep → recovery sit → discharge-support charting. Day 2 — the lab thread: 3 draws with full processing to lab-ready + QC awareness. Day 3 — the ward thread: lead rounds, meds, I/O, one handoff. Day 4 — the imaging/dental support thread. Day 5 — trainer-selected weak-area thread (your passport tells us where). Trainers score with the Integration Rubric (prioritization, transitions, asking-at-the-right-moment, patient-ID discipline under load, charting-in-the-moment).</p>\n<p><strong>The prioritization frame (taught Monday, quizzed daily):</strong> Patient-safety-now &gt; time-critical diagnostics &gt; comfort/pain-adjacent &gt; routine schedule &gt; housekeeping; interruptions re-sort the stack out loud (\"finishing this flush, then I'm on it — or is it a now-thing?\").</p>\n<p><strong>Simulation tie-in:</strong> <span class=\"id\">SIM-CORE-001</span> (deteriorating ward patient embedded mid-shift — do you notice while busy?) runs unannounced once this week. That's the point.</p>\n<p><strong>Knowledge check:</strong> three prioritization scenarios (keyed in LMS bank <span class=\"id\">QB-CORE-INT</span>). <strong>Competency connection:</strong> evidence accumulation for gates 5–8. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Weeks 1–6 taught skills in lanes. Real shifts braid them. Week 7 is deliberately about the braid. Objectives: execute multi-skill sequences on real cases end-to-end; self-prioritize a task stack; maintain quality under mild time pressure; narrate your reasoning on request. Core instruction + structure: Each day this week you carry a case thread under supervision: e.g., Day 1 — admit a sx patient: intake TPR → pre-op checklist → catheter place/assist per track → prep → recovery sit → discharge-support charting. Day 2 — the lab thread: 3 draws with full processing to lab-ready + QC awareness. Day 3 — the ward thread: lead rounds, meds, I/O, one handoff. Day 4 — the imaging/dental support thread. Day 5 — trainer-selected weak-area thread (your passport tells us where). Trainers score with the Integration Rubric (prioritization, transitions, asking-at-the-right-moment, patient-ID discipline under load, charting-in-the-moment). The prioritization frame (taught Monday, quizzed daily): Patient-safety-now &gt; time-critical diagnostics &gt; comfort/pain-adjacent &gt; routine schedule &gt; housekeeping; interruptions re-sort the stack out loud (\"finishing this flush, then I'm on it — or is it a now-thing?\"). Simulation tie-in: SIM-CORE-001 (deteriorating ward patient embedded mid-shift — do you notice while busy?) runs unannounced once this week. That's the point. Knowledge check: three prioritization scenarios (keyed in LMS bank QB-CORE-INT ). Competency connection: evidence accumulation for gates 5–8. Version: 1.0 2026-08-17."}, {"id": "lsn-w7-02", "title": "W7-02 · Abnormality Recognition", "group": "Lessons", "meta": "Week 7", "html": "<p><strong>Why this matters:</strong> Question 3 — <em>can you recognize when it is not going correctly?</em> — is the graduation question. This block is its final training push.</p>\n<p><strong>Objectives:</strong> score ≥85% on the recognition battery (with all critical items correct); demonstrate live \"notice-and-report\" behavior; calibrate your urgency judgments.</p>\n<p><strong>Structure:</strong> Day A — the battery primer: 40 practice items across domains (vitals trends, catheter sites, sample artifacts, restraint escalation, recovery patterns, pump/fluid faults, sterile-field violations, emergency presentations), each with explanation and urgency-tier reasoning (report-now / report-soon / note-and-monitor). Day B — media round: photo/video/audio set (<span class=\"id\">INT-10</span> + <span class=\"id\">INT-09</span> extended) under time pressure. Day C — the live gauntlet: trainers stage 6 findings across the training areas during your normal duties (a \"wet wrap,\" a mis-labeled tube on the bench, an \"expired\" pack in rotation, a pump set clamped oddly, a treatment-sheet cell pre-initialed for a future time, a \"patient\" [sim] with new tachypnea); you're scored on noticing, urgency-tiering, and SBAR-V quality. Missed items are walked back with the trainer the same day — this is training, and then Day D re-tests near-misses. The formal battery (13_Assessments) follows.</p>\n<p><strong>Calibration doctrine:</strong> over-reporting beats under-reporting at your stage — but the goal is calibration: each battery item's explanation states WHY its tier is what it is, and your personal miss-pattern report (from the LMS) tells you whether you skew toward missing or over-flagging quiet findings.</p>\n<p><strong>Competency connection:</strong> graduation gate 5. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: Question 3 — can you recognize when it is not going correctly? — is the graduation question. This block is its final training push. Objectives: score ≥85% on the recognition battery (with all critical items correct); demonstrate live \"notice-and-report\" behavior; calibrate your urgency judgments. Structure: Day A — the battery primer: 40 practice items across domains (vitals trends, catheter sites, sample artifacts, restraint escalation, recovery patterns, pump/fluid faults, sterile-field violations, emergency presentations), each with explanation and urgency-tier reasoning (report-now / report-soon / note-and-monitor). Day B — media round: photo/video/audio set ( INT-10 + INT-09 extended) under time pressure. Day C — the live gauntlet: trainers stage 6 findings across the training areas during your normal duties (a \"wet wrap,\" a mis-labeled tube on the bench, an \"expired\" pack in rotation, a pump set clamped oddly, a treatment-sheet cell pre-initialed for a future time, a \"patient\" [sim] with new tachypnea); you're scored on noticing, urgency-tiering, and SBAR-V quality. Missed items are walked back with the trainer the same day — this is training, and then Day D re-tests near-misses. The formal battery (13_Assessments) follows. Calibration doctrine: over-reporting beats under-reporting at your stage — but the goal is calibration: each battery item's explanation states WHY its tier is what it is, and your personal miss-pattern report (from the LMS) tells you whether you skew toward missing or over-flagging quiet findings. Competency connection: graduation gate 5. Version: 1.0 2026-08-17."}, {"id": "lsn-w7-03", "title": "W7-03 · Workflow Simulations", "group": "Lessons", "meta": "Week 7", "html": "<p><strong>Why this matters:</strong> The graduation practical shouldn't be the first time you feel the full-station format.</p>\n<p><strong>Objectives:</strong> complete a rehearsal circuit of all 13 graduation stations at practice intensity; identify and close remaining gaps with your trainer; rehearse the emergency simulation as a team.</p>\n<p><strong>Structure:</strong> Mock-station morning: all 13 stations (<code>15_Practical_Competencies/Core_Graduation_Practical_Stations.md</code>) run at practice weight — trainers coach DURING (unlike the real exam) and every station ends with the rubric shown and self-scored first (\"how do YOU think that went?\" calibrates self-assessment, which is itself scored). Team sim afternoon: <span class=\"id\">SIM-CORE-004</span> emergency scenario with full role rotation. Gap-closure conference: you + trainer + passport → a written Week-8 plan: which stations are exam-ready, which get targeted reps, whether your graduation practical books for Week 7's end (accelerated), Week 8, or extends.</p>\n<p><strong>Knowledge check:</strong> none — this lesson IS assessment rehearsal. <strong>Competency connection:</strong> direct feed to gates 3, 4, 8. <strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: The graduation practical shouldn't be the first time you feel the full-station format. Objectives: complete a rehearsal circuit of all 13 graduation stations at practice intensity; identify and close remaining gaps with your trainer; rehearse the emergency simulation as a team. Structure: Mock-station morning: all 13 stations ( 15_Practical_Competencies/Core_Graduation_Practical_Stations.md ) run at practice weight — trainers coach DURING (unlike the real exam) and every station ends with the rubric shown and self-scored first (\"how do YOU think that went?\" calibrates self-assessment, which is itself scored). Team sim afternoon: SIM-CORE-004 emergency scenario with full role rotation. Gap-closure conference: you + trainer + passport → a written Week-8 plan: which stations are exam-ready, which get targeted reps, whether your graduation practical books for Week 7's end (accelerated), Week 8, or extends. Knowledge check: none — this lesson IS assessment rehearsal. Competency connection: direct feed to gates 3, 4, 8. Version: 1.0 2026-08-17."}, {"id": "lsn-w8-01", "title": "W8-01 · Graduation Week", "group": "Lessons", "meta": "Week 8", "html": "<p><strong>Why this matters:</strong> This is the week you prove the three questions across the whole Core scope — and the hospital formally starts counting on you.</p>\n<p><strong>Structure:</strong> 1) <strong>Final knowledge examination</strong> (Form assembled from <span class=\"id\">QB-CORE</span> per <code>13_Assessments/Core_Final_Exam_Blueprint.md</code>): 75 items, blueprint-weighted, ≥80% overall + 100% on embedded safety-critical items; one retake path per <code>23_Remediation/</code> with targeted review first. 2) <strong>Core Graduation Practical:</strong> 13 stations, real equipment, standardized patients/models per station spec; pass ≥11/13 including ALL five safety-critical stations; zero critical fails (a critical fail anywhere = that station failed + targeted remediation before re-attempt regardless of total). 3) <strong>Documentation &amp; communication gates</strong> audited from your accumulated logs (gates 6–7). 4) <strong>Readiness review:</strong> Manager + Supervising Veterinarian + lead Assessor, with your passport and case logs on the table; outcome is one of: GRADUATE (credential granted, workload matrix rows activate per passport states) / TARGETED COMPLETION (specific gates scheduled, W8-02 plan) / EXTENDED PLAN (structured, per outer-window policy).</p>\n<p><strong>For the learner, plainly:</strong> you cannot fail your way out of a career here in one bad morning — every gate has a remediation path and a re-attempt design; what has no path is pretending. The passport shows what's true; graduation makes it official.</p>\n<p><strong>Version:</strong> 1.0 2026-08-17.</p>", "text": "Why this matters: This is the week you prove the three questions across the whole Core scope — and the hospital formally starts counting on you. Structure: 1) Final knowledge examination (Form assembled from QB-CORE per 13_Assessments/Core_Final_Exam_Blueprint.md ): 75 items, blueprint-weighted, ≥80% overall + 100% on embedded safety-critical items; one retake path per 23_Remediation/ with targeted review first. 2) Core Graduation Practical: 13 stations, real equipment, standardized patients/models per station spec; pass ≥11/13 including ALL five safety-critical stations;
